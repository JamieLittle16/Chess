[workspace]
members = [
    "crates/chess-core",
    "crates/chess-eval",
    "crates/chess-search",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
authors = ["Jamie Little"]
repository = "https://github.com/JamieLittle16/Chess"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
