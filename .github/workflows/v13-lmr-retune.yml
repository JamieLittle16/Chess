name: V13 LMR retune

on:
  push:
    branches: [analysis/v13-lmr-retune-20260907]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arena:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: a-a, variant: a, start: 80, seed: 120101}
          - {name: a-b, variant: a, start: 0, seed: 120102}
          - {name: b-a, variant: b, start: 80, seed: 120201}
          - {name: b-b, variant: b, start: 0, seed: 120202}
          - {name: c-a, variant: c, start: 80, seed: 120301}
          - {name: c-b, variant: c, start: 0, seed: 120302}
          - {name: d-a, variant: d, start: 80, seed: 120401}
          - {name: d-b, variant: d, start: 0, seed: 120402}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: analysis/v13-linear-residual
          path: arena-src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numba==0.67.0 numpy==2.5.2 chess==1.11.2
      - name: Reconstruct provisional strongest control
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          cat .analysis/v13_chunks_*.b64 | base64 -d > /tmp/v13.zip
          echo '658fd954180c2d0d39c02ba6601af36d06cdbd573bfb72c6879169861a7ad092  /tmp/v13.zip' | sha256sum -c -
          rm -rf /tmp/base /tmp/cand; mkdir /tmp/base /tmp/cand
          unzip -q /tmp/v13.zip -d /tmp/base; unzip -q /tmp/v13.zip -d /tmp/cand
          patch /tmp/base/experiments/numba_search.py < .analysis/v13_jit_refactor.patch
          patch /tmp/cand/experiments/numba_search.py < .analysis/v13_jit_refactor.patch
          python scripts/patch_v13_legality_context.py /tmp/base/experiments/numba_core.py
          python scripts/patch_v13_legality_context.py /tmp/cand/experiments/numba_core.py
          python - <<'PY'
          import os
          from pathlib import Path
          def common(root):
              p=Path(root)/'experiments/numba_search.py'; s=p.read_text()
              old='    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
              new='    correction = correction // 6\n    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
              assert s.count(old)==1; s=s.replace(old,new,1)
              assert s.count('pruning_static_eval - 120 * depth >= beta')==1; s=s.replace('pruning_static_eval - 120 * depth >= beta','pruning_static_eval - 140 * depth >= beta',1)
              assert s.count('pruning_static_eval + 180 * depth <= alpha')==1; s=s.replace('pruning_static_eval + 180 * depth <= alpha','pruning_static_eval + 200 * depth <= alpha',1)
              p.write_text(s)
          common('/tmp/base'); common('/tmp/cand')
          p=Path('/tmp/cand/experiments/numba_search.py'); s=p.read_text(); v=os.environ['VARIANT']
          old='''    if depth >= 9 and move_index >= 12:\n        return 3\n    if depth >= 6 and move_index >= 8:\n        return 2\n    if depth >= 3 and move_index >= 4:\n        return 1\n'''
          variants={
            'a':'''    if depth >= 8 and move_index >= 12:\n        return 3\n    if depth >= 5 and move_index >= 8:\n        return 2\n    if depth >= 3 and move_index >= 4:\n        return 1\n''',
            'b':'''    if depth >= 9 and move_index >= 10:\n        return 3\n    if depth >= 6 and move_index >= 7:\n        return 2\n    if depth >= 3 and move_index >= 3:\n        return 1\n''',
            'c':'''    if depth >= 10 and move_index >= 13:\n        return 3\n    if depth >= 7 and move_index >= 9:\n        return 2\n    if depth >= 4 and move_index >= 5:\n        return 1\n''',
            'd':'''    if depth >= 8 and move_index >= 11:\n        return 3\n    if depth >= 5 and move_index >= 7:\n        return 2\n    if depth >= 3 and move_index >= 4:\n        return 1\n'''}
          assert s.count(old)==1; p.write_text(s.replace(old,variants[v],1))
          PY
          python -m py_compile /tmp/base/agent.py /tmp/base/experiments/*.py /tmp/cand/agent.py /tmp/cand/experiments/*.py
      - name: Fixed-node paired arena
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v13-results
          python -u arena-src/.v13/v13_arena.py /tmp/cand /tmp/base 20000 20 '${{ matrix.seed }}' 220 \
            match/openings/m3-uho-lichess-100-v1.epd '${{ matrix.start }}' | tee 'v13-results/${{ matrix.name }}.log'
          grep '^FINAL ' 'v13-results/${{ matrix.name }}.log'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v13-lmr-${{ matrix.name }}-${{ github.sha }}
          path: v13-results/
          retention-days: 7
