name: V18 SEE repair80 deep certification

on:
  push:
    branches: [analysis/v18-see-repair80-deepcert-20260911]

permissions:
  contents: read
  actions: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q 'chess==1.11.2'
      - uses: actions/download-artifact@v4
        with:
          pattern: repair80-*
          path: /tmp/repairs
          merge-multiple: true
          repository: JamieLittle16/Chess
          run-id: 34578886557
          github-token: ${{ github.token }}
      - name: Fetch Stockfish 19
        run: |
          curl -L --fail --retry 3 -o /tmp/sf19.tgz https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz
          echo '9defc0d4e55d49c65a6d042f3e571a39fcea499ade6dbe741b53b8c65e03611f  /tmp/sf19.tgz' | sha256sum -c -
          mkdir /tmp/sf19; tar -xzf /tmp/sf19.tgz -C /tmp/sf19
          SF=$(find /tmp/sf19 -type f -name 'stockfish*' | head -n1); chmod +x "$SF"; echo "STOCKFISH=$SF" >> "$GITHUB_ENV"
      - name: Deep certify all severe repairs
        run: |
          python - <<'PY'
          import glob,json,os
          import chess,chess.engine
          severe={}
          records=[]
          for p in sorted(glob.glob('/tmp/repairs/repair-*.json')):
              d=json.load(open(p)); severe.update(d['direct80']); records.extend(d['records'])
          assert len(severe)==6,len(severe)
          bykey={r['key']:r for r in records if isinstance(r,dict) and 'delta' in r}
          sf=chess.engine.SimpleEngine.popen_uci(os.environ['STOCKFISH']); sf.configure({'Threads':1,'Hash':128})
          failures=[]
          try:
              for key,uci in sorted(severe.items()):
                  r=bykey[key]; ply=int(r['ply']); fen=f"{key} 0 {ply//2+1}"; b=chess.Board(fen); expected=chess.Move.from_uci(uci)
                  assert expected in b.legal_moves,(key,uci)
                  sf.configure({'Clear Hash':None})
                  info=sf.analyse(b,chess.engine.Limit(nodes=3_000_000))
                  got=info['pv'][0]; cp=info['score'].pov(b.turn).score(mate_score=100000)
                  ok=got==expected
                  print('DEEPCERT ply',ply,'expected',expected.uci(),'got',got.uci(),'score',cp,'old_delta',r['delta'],'OK',ok,flush=True)
                  if not ok: failures.append((key,expected.uci(),got.uci(),cp))
          finally: sf.quit()
          print('DEEPCERT_FINAL severe',len(severe),'failures',len(failures),failures)
          assert not failures,failures
          PY
