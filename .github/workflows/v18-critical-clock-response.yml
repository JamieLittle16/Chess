name: V18 PUNCH133 critical-position clock response

on:
  push:
    branches: [analysis/v18-critical-clock-response-20260910]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/v18-stockfish-calibration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numba==0.67.0' 'numpy==2.5.2' 'chess==1.11.2'
      - name: Reconstruct exact PUNCH133
        run: |
          set -euo pipefail
          rm -rf /tmp/engine && mkdir /tmp/engine
          cat ci/v18_postbook_payload/chunk_*.b64 | base64 -d > /tmp/p150.zip
          unzip -q /tmp/p150.zip -d /tmp/engine
          sed -i 's/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.50/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.33/' /tmp/engine/agent.py
          curl --fail --location --retry 5 \
            'https://raw.githubusercontent.com/michaeldv/donna_opening_books/master/gm2001.bin' \
            -o /tmp/engine/v18_gm2001.bin
          echo '0ab496524b077f3c8f3778634f46b2bd79ed1c44ad4d89cf96857890396d1424  /tmp/engine/agent.py' | sha256sum -c --strict
          echo 'f74f46499cc0fdef8fba53c2ba77652414463b0a68e7a3fac1e3764f70f94032  /tmp/engine/experiments/numba_search.py' | sha256sum -c --strict
      - name: Download SF2000 match artifact
        uses: actions/download-artifact@v4
        with:
          name: punch133-elo2000-tc-30+0.5
          path: /tmp/match
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34522337486
      - name: Probe decisive positions at 30s 60s 120s
        run: |
          PYTHONPATH=/tmp/engine python - <<'PY'
          import glob, chess, chess.pgn, importlib, time
          import agent

          pgn=glob.glob('/tmp/match/**/games.pgn',recursive=True)[0]
          # Targets are the first large, deeply-confirmed mistakes from the SF2000 loss audit.
          targets={(1,14,'W'),(2,11,'B'),(2,23,'B'),(2,32,'B'),(7,8,'W'),(7,9,'W'),(7,13,'W'),(7,20,'W')}
          positions=[]
          with open(pgn,encoding='utf-8') as f:
            gi=0
            while True:
              g=chess.pgn.read_game(f)
              if g is None: break
              gi+=1; b=g.board()
              for m in g.mainline_moves():
                col='W' if b.turn else 'B'; key=(gi,b.fullmove_number,col)
                if key in targets:
                  positions.append((key,b.fen(),m.uci()))
                b.push(m)

          def reset():
            agent._GAME_KEYS=[]
            agent._PENDING_AFTER_OUR_MOVE=None
            agent._LAST_CALL_TIME_LEFT_MS=None
            agent._LAST_GET_MOVE_ELAPSED_MS=None
            agent._CLOCK_OVERHEAD_EMA_MS=40.0
            agent._CLOCK_FEEDBACK_SAMPLES=0
            agent._BOOK_POST_SEARCH_BOOSTS=0
            agent._HASH_KEYS.fill(0); agent._HASH_MOVES.fill(-1)
            agent._TT_TABLE.fill(0); agent._QUIET_HISTORY.fill(0)

          print('targets',len(positions))
          for key,fen,actual in positions:
            print('\nTARGET',key,'actual_game_move',actual,'fen',fen)
            for ms in (30000,60000,120000):
              reset(); t=time.perf_counter(); move=agent.get_move(fen,ms); dt=time.perf_counter()-t
              print(f'  clock={ms:6d} move={move:5s} elapsed={dt:.3f}s')
          PY
