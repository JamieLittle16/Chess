name: Round 62 V13 BEST critical lines

on:
  push:
    branches:
      - analysis/round62-v13best-postmortem-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-chess and Stockfish
        run: |
          python -m pip install chess==1.11.2
          sudo apt-get update -qq
          sudo apt-get install -y stockfish
      - name: Analyse critical positions
        run: |
          mkdir -p analysis-results/round62-critical
          python - <<'PY' | tee analysis-results/round62-critical/lines.txt
          import chess, chess.engine
          e=chess.engine.SimpleEngine.popen_uci('/usr/games/stockfish')
          tests=[
            ('before 21...Qd7','1r1r2k1/4qpnp/1p1pb1pQ/p7/2P1P1P1/1PN4P/P4RB1/3R2K1 b - - 2 21','d8d7'),
            ('before 22...f5','1r1r2k1/3q1pnp/1p1pb1pQ/p7/2P1P1P1/1PN4P/P4RB1/2R3K1 b - - 4 22','f7f5'),
          ]
          for name,fen,played_uci in tests:
              b=chess.Board(fen)
              print('\n===',name,'===')
              infos=e.analyse(b,chess.engine.Limit(nodes=1000000),multipv=3)
              for i,info in enumerate(infos,1):
                  pv=info['pv'][:10]
                  sans=[]; bb=b.copy()
                  for m in pv:
                      sans.append(bb.san(m)); bb.push(m)
                  sc=info['score'].pov(chess.BLACK).score(mate_score=100000)
                  print('TOP',i,'score_black',sc,'PV',' '.join(sans))
              pm=chess.Move.from_uci(played_uci)
              info=e.analyse(b,chess.engine.Limit(nodes=1000000),root_moves=[pm])
              pv=info['pv'][:10]; sans=[]; bb=b.copy()
              for m in pv:
                  sans.append(bb.san(m)); bb.push(m)
              sc=info['score'].pov(chess.BLACK).score(mate_score=100000)
              print('PLAYED',b.san(pm),'score_black',sc,'PV',' '.join(sans))
          e.quit()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: round62-v13best-critical-lines
          path: analysis-results/round62-critical
          retention-days: 7
