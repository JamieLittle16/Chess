name: V18 Stockfish calibration

on:
  push:
    branches:
      - ci/v18-stockfish-calibration
    paths:
      - .github/workflows/v18-stockfish-calibration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ladder:
    name: Stockfish ${{ matrix.elo }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        elo: [1800, 2000, 2200, 2400, 2600, 2800]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install judge-compatible Python stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numba==0.67.0' 'numpy<2.4' 'python-chess==1.999'
          python - <<'PY'
          import numba, numpy, chess, sys
          print(sys.version)
          print('numba', numba.__version__)
          print('numpy', numpy.__version__)
          print('python-chess', chess.__version__)
          PY

      - name: Verify and extract exact V18 contents
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ci/v18-engine
          mkdir -p ci/v18-engine
          unzip -q ci/v18.zip -d ci/v18-engine
          cd ci/v18-engine
          cat > /tmp/v18-files.sha256 <<'EOF'
          0306e8145a453d91b9b5ac92e9980931510d9e18f8ba598a7548d08b85165c35  experiments/numba_core.py
          e38876e2a37193639f9b8b559b02bc064d820c4cdeda44579c9f88e5bd4468b1  experiments/v14_student_h64.npz
          7d0fc5f7a186e79317cf12a2ff285d7716c651fbd045c53d65a3cc6eb1b15319  experiments/v13_residual.i16
          f74f46499cc0fdef8fba53c2ba77652414463b0a68e7a3fac1e3764f70f94032  experiments/numba_search.py
          cb9540d5ea2a7074ae0c3b5894babecc2fb01de94b102420d8a65e159325ada6  experiments/v14_student_single_runtime.py
          6422eb8eb8713e02e6d62d33ef230f37cf707188e864b575226802aead128b2f  experiments/__init__.py
          c2cc0534a984124c5a75e250bab65f2756ade47341bbca84d6b6871fdb2977f2  v14_kpk.u8
          eefc286900dbdcbdde360c5d4d867e078d29e790fadb1028b73da7fe82fe7215  agent.py
          fb6e9f3f27bb19a5b2fdefcc441c88ddeae48db61d5f00ad83973abb9f939c87  v18_gm2001.bin
          EOF
          sha256sum -c /tmp/v18-files.sha256
          test "$(find . -type f | wc -l)" -eq 9

      - name: Fetch and verify Stockfish 19
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sf19
          curl -L --fail --retry 3 --retry-delay 2 \
            -o /tmp/stockfish-19.tar.gz \
            https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz
          echo '9defc0d4e55d49c65a6d042f3e571a39fcea499ade6dbe741b53b8c65e03611f  /tmp/stockfish-19.tar.gz' | sha256sum -c -
          tar -xzf /tmp/stockfish-19.tar.gz -C /tmp/sf19
          SF=$(find /tmp/sf19 -type f -name 'stockfish*' | head -n 1)
          test -n "$SF"
          chmod +x "$SF"
          printf 'uci\nquit\n' | "$SF" | tee /tmp/stockfish-uci.txt
          grep -q 'Stockfish 19' /tmp/stockfish-uci.txt
          echo "STOCKFISH=$SF" >> "$GITHUB_ENV"

      - name: Run V18 calibration rung
        shell: bash
        run: |
          set -euo pipefail
          ELO='${{ matrix.elo }}'
          SEED=$((20260910 + ELO))
          python scripts/v18_stockfish_calibration.py \
            --engine-dir ci/v18-engine \
            --stockfish "$STOCKFISH" \
            --openings match/openings/m3-uho-lichess-100-v1.epd \
            --elo "$ELO" \
            --games 100 \
            --tc '1+0.01' \
            --seed "$SEED" \
            --max-plies 600 \
            --output-dir "artifacts/sf-$ELO"

      - name: Upload rung evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v18-sf-${{ matrix.elo }}
          path: artifacts/sf-${{ matrix.elo }}
          if-no-files-found: warn
          retention-days: 14

  fit:
    name: Fit V18 Stockfish rating
    needs: ladder
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download rung evidence
        uses: actions/download-artifact@v4
        with:
          pattern: v18-sf-*
          path: artifacts/rungs

      - name: Fit ladder rating
        run: |
          python scripts/v18_fit_stockfish_ladder.py \
            --root artifacts/rungs \
            --output artifacts/v18-stockfish-fitted-rating.json \
            --seed 20260910 \
            --bootstrap 10000

      - name: Show fitted rating
        if: always()
        run: |
          if test -f artifacts/v18-stockfish-fitted-rating.json; then
            cat artifacts/v18-stockfish-fitted-rating.json
          else
            echo 'No fitted rating produced.'
          fi

      - name: Upload fitted rating
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v18-stockfish-fitted-rating
          path: artifacts/v18-stockfish-fitted-rating.json
          if-no-files-found: warn
          retention-days: 14
