name: V14 final no-lazy qualification

on:
  push:
    branches: [analysis/v14-final-nolazy-20260908]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact competition runtime
        run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0

      - name: Download exact H64 model
        uses: actions/download-artifact@v4
        with:
          pattern: v14-single-student-h64-bb7d2a4ed05ff78d344cc4374d54e35189584993
          path: model-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34202820525

      - name: Materialize V13, lean-no-lazy and lean-lazy
        shell: bash
        run: |
          set -euo pipefail
          MODEL=$(find model-artifact -type f -name 'student-h64.npz' -print -quit); test -n "$MODEL"
          echo '3422cecc3b1226767412e08746ffd6eef9f7e38602ac15b9256b475e6762b598  '"$MODEL" | sha256sum --check --strict
          cat .analysis/v13_chunks_*.b64 | base64 -d > /tmp/v13.zip
          echo '658fd954180c2d0d39c02ba6601af36d06cdbd573bfb72c6879169861a7ad092  /tmp/v13.zip' | sha256sum --check --strict
          rm -rf /tmp/base /tmp/nolazy /tmp/lazy
          for DIR in /tmp/base /tmp/nolazy /tmp/lazy; do
            mkdir -p "$DIR"; unzip -q /tmp/v13.zip -d "$DIR"
            patch "$DIR/experiments/numba_search.py" < .analysis/v13_jit_refactor.patch
            DIR="$DIR" python - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['DIR'])/'experiments/numba_search.py';s=p.read_text()
          old='    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          new='    correction = correction // 6\n    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          assert s.count(old)==1;p.write_text(s.replace(old,new,1))
          PY
            python scripts/patch_v13_legality_context.py "$DIR/experiments/numba_core.py"
            python scripts/patch_v13_qsearch_tactical.py "$DIR/experiments/numba_core.py" "$DIR/experiments/numba_search.py"
          done
          echo '401f6580028a72361286bd99bee1f0022c74e6c8a65da8acd47448835a1ff360  /tmp/base/experiments/numba_search.py' | sha256sum --check --strict
          for DIR in /tmp/nolazy /tmp/lazy; do
            cp experiments/v14_student_single_runtime.py "$DIR/experiments/v14_student_single_runtime.py"
            cp "$MODEL" "$DIR/experiments/v14_student_h64.npz"
            python scripts/patch_v14_single_student_search.py "$DIR/experiments/numba_search.py" --numerator 1 --denominator 12
            python scripts/patch_v14_student_lean_qsearch.py "$DIR/experiments/numba_search.py"
          done
          python scripts/patch_v14_lazy_stable_ordering.py /tmp/lazy/experiments/numba_search.py
          python -m py_compile tools/v14_agent_runner.py tools/v14_timed_agent_arena.py /tmp/base/agent.py /tmp/base/experiments/*.py /tmp/nolazy/agent.py /tmp/nolazy/experiments/*.py /tmp/lazy/agent.py /tmp/lazy/experiments/*.py
          mkdir -p results

      - name: Exact fixed-node semantic equivalence lazy versus no-lazy
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/sig.py <<'PY'
          import json,sys,chess,numpy as np
          from experiments.numba_core import encode_position
          from experiments.numba_search import iterative_search_stateful
          for line in sys.stdin:
              q=json.loads(line);b=chess.Board(q['fen']);e=encode_position(b);h=np.empty(0,dtype=np.uint64)
              o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,int(q['nodes']))
              print(json.dumps([int(o[0]),int(o[1]),int(o[2]),int(o[3])]),flush=True)
          PY
          python - <<'PY'
          import json,os,subprocess,sys
          roots=[x.strip() for x in open('match/openings/m3-uho-lichess-100-v1.epd') if x.strip() and not x.startswith('#')][:40]
          def st(path):
              e=os.environ.copy();e['PYTHONPATH']=path
              return subprocess.Popen([sys.executable,'/tmp/sig.py'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env=e)
          def ask(p,fen,n):p.stdin.write(json.dumps({'fen':fen,'nodes':n})+'\n');p.stdin.flush();return json.loads(p.stdout.readline())
          a=st('/tmp/nolazy');b=st('/tmp/lazy');checked=0
          try:
              for fen in roots:
                  for n in (4000,16000,40000):
                      x=ask(a,fen,n);y=ask(b,fen,n);assert x==y,(fen,n,x,y);checked+=1
          finally:a.terminate();b.terminate();a.wait();b.wait()
          print('identical',checked)
          PY

      - name: Five-repetition throughput isolation
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/nps.py <<'PY'
          import json,sys,chess,numpy as np
          from experiments.numba_core import encode_position
          from experiments.numba_search import iterative_search_stateful
          for line in sys.stdin:
              q=json.loads(line);b=chess.Board(q['fen']);e=encode_position(b);h=np.empty(0,dtype=np.uint64)
              o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,int(q['nodes']))
              print(json.dumps({'nodes':int(o[3])}),flush=True)
          PY
          python - <<'PY'
          import json,os,statistics,subprocess,sys,time
          from pathlib import Path
          roots=[x.strip() for x in open('match/openings/m3-uho-lichess-100-v1.epd') if x.strip() and not x.startswith('#')][:40]
          def st(path):e=os.environ.copy();e['PYTHONPATH']=path;return subprocess.Popen([sys.executable,'/tmp/nps.py'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env=e)
          def run(p,order):
              n=0;t=time.perf_counter()
              for f in order:p.stdin.write(json.dumps({'fen':f,'nodes':30000})+'\n');p.stdin.flush();n+=json.loads(p.stdout.readline())['nodes']
              return time.perf_counter()-t,n
          ps={k:st(v) for k,v in {'base':'/tmp/base','nolazy':'/tmp/nolazy','lazy':'/tmp/lazy'}.items()};rows=[]
          try:
              for p in ps.values():p.stdin.write(json.dumps({'fen':roots[0],'nodes':300})+'\n');p.stdin.flush();json.loads(p.stdout.readline())
              for rep in range(5):
                  order=roots if rep%2==0 else list(reversed(roots));seq=['base','nolazy','lazy'] if rep%2==0 else ['lazy','nolazy','base'];rec={}
                  for k in seq:rec[k]=run(ps[k],order)
                  nps={k:v[1]/v[0] for k,v in rec.items()}
                  row={'rep':rep,'nolazy_vs_v13':nps['nolazy']/nps['base'],'lazy_vs_v13':nps['lazy']/nps['base'],'nolazy_vs_lazy':nps['nolazy']/nps['lazy']};rows.append(row);print(row)
          finally:
              for p in ps.values():p.terminate();p.wait()
          out={'median_nolazy_vs_v13':statistics.median(x['nolazy_vs_v13'] for x in rows),'median_lazy_vs_v13':statistics.median(x['lazy_vs_v13'] for x in rows),'median_nolazy_vs_lazy':statistics.median(x['nolazy_vs_lazy'] for x in rows),'records':rows};Path('results/throughput.json').write_text(json.dumps(out,indent=2)+'\n');print(out)
          PY

      - name: Build same final-assembly official-UHO books
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/master/UHO_Lichess_4852_v1.epd.zip
          rm -rf /tmp/uho && mkdir /tmp/uho && unzip -q /tmp/uho.zip -d /tmp/uho
          UHO=$(find /tmp/uho -type f -name '*.epd' -print -quit);test -n "$UHO"
          UHO="$UHO" python - <<'PY'
          import os,chess
          from pathlib import Path
          rows=Path(os.environ['UHO']).read_text(errors='ignore').splitlines()
          def build(lo,hi,n,path):
              out=[]
              for raw in rows[lo:hi]:
                  f=raw.strip().split()
                  if len(f)<4:continue
                  fen=' '.join(f[:4])+' 0 1'
                  try:b=chess.Board(fen)
                  except ValueError:continue
                  if b.is_game_over(claim_draw=False):continue
                  out.append(fen)
                  if len(out)==n:break
              assert len(out)==n;Path(path).write_text('\n'.join(out)+'\n')
          build(3000,3700,48,'/tmp/equal.epd');build(3900,4500,32,'/tmp/timed.epd')
          PY

      - name: Same-slice 96-game equal-node no-lazy versus V13
        shell: bash
        run: |
          set -euo pipefail
          python -u tools/v14_fixed_node_arena.py /tmp/nolazy /tmp/base --nodes 16000 --pairs 48 --opening-offset 0 --max-plies 220 --opening-file /tmp/equal.epd --json-out results/equal-node-96.json | tee results/equal-node-96.log
          grep '^FINAL ' results/equal-node-96.log

      - name: Same-slice production-timed 64-game no-lazy versus V13
        shell: bash
        run: |
          set -euo pipefail
          python -u tools/v14_timed_agent_arena.py /tmp/nolazy /tmp/base --opening-file /tmp/timed.epd --pairs 32 --base-ms 2500 --increment-ms 50 --max-plies 180 --json-out results/timed-64.json | tee results/timed-64.log
          grep '^FINAL ' results/timed-64.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v14-final-nolazy-${{ github.sha }}
          path: results/
          retention-days: 30
