name: V15 Python persistent Rust policy

on:
  push:
    branches: [analysis/v15-python-rust-policy-persistent-20260908]
    paths:
      - scripts/patch_v15_python_root_policy_persistent.py
      - .github/workflows/v15-python-rust-policy-persistent.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        top_k: [1, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install runtime and exporter
        run: |
          python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - uses: actions/download-artifact@v4
        with:
          name: rust-v15-policy-h64-bae844a67f0ffa899ab893cf5b41f5f7e4896d32
          path: policy-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34265888488
      - name: Materialize control and candidate
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name Little-Gambit-V14.zip -print -quit)
          PT=$(find policy-artifact -type f -name root-policy-h64.pt -print -quit)
          test -n "$ZIP"; test -n "$PT"
          rm -rf /tmp/control /tmp/candidate /tmp/m6 results; mkdir -p /tmp/control /tmp/candidate /tmp/m6 results
          unzip -q "$ZIP" -d /tmp/control; cp -a /tmp/control/. /tmp/candidate/
          sed -i 's/^MAX_QPLY = 10$/MAX_QPLY = 6/' /tmp/control/experiments/numba_search.py
          sed -i 's/^MAX_QPLY = 10$/MAX_QPLY = 6/' /tmp/candidate/experiments/numba_search.py
          python scripts/export_v15_root_policy_npz.py "$PT" /tmp/candidate/experiments/v15_root_policy.npz
          python scripts/patch_v15_python_presort_once.py /tmp/candidate/experiments/numba_search.py
          python scripts/patch_v15_python_root_policy_runtime.py /tmp/candidate/experiments/numba_search.py ${{ matrix.top_k }}
          python scripts/patch_v15_python_root_policy_persistent.py /tmp/candidate/experiments/numba_search.py
          python -m py_compile /tmp/control/agent.py /tmp/control/experiments/*.py /tmp/candidate/agent.py /tmp/candidate/experiments/*.py
          PYTHONPATH=/tmp/candidate python - <<'PY'
          import chess,numpy as np
          from experiments.numba_core import encode_position,move_to_uci
          from experiments.numba_search import iterative_search_stateful
          b=chess.Board();e=encode_position(b);h=np.empty(0,dtype=np.uint64)
          o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,5000)
          assert chess.Move.from_uci(move_to_uci(int(o[0]))) in b.legal_moves
          print('smoke',tuple(int(x) for x in o[:4]))
          PY
      - name: Build teacher-disjoint roots
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old];chosen=fresh[700:748]
          assert len(chosen)==48 and len(set(chosen))==48
          Path('/tmp/persistent-48.epd').write_text('\n'.join(chosen)+'\n')
          Path('/tmp/persistent-32.epd').write_text('\n'.join(chosen[:32])+'\n')
          PY
      - name: Throughput screen
        shell: bash
        run: |
          cat >/tmp/worker.py <<'PY'
          import json,sys,chess,numpy as np
          from experiments.numba_core import encode_position
          from experiments.numba_search import iterative_search_stateful
          for line in sys.stdin:
              q=json.loads(line);b=chess.Board(q['fen']);e=encode_position(b);h=np.empty(0,dtype=np.uint64)
              o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,int(q['nodes']))
              print(json.dumps({'nodes':int(o[3]),'depth':int(o[2])}),flush=True)
          PY
          python - <<'PY'
          import json,os,statistics,subprocess,sys,time
          from pathlib import Path
          roots=[x.strip() for x in Path('/tmp/persistent-48.epd').read_text().splitlines() if x.strip()][:12]
          def start(d):
              e=os.environ.copy();e['PYTHONPATH']=d;return subprocess.Popen([sys.executable,'/tmp/worker.py'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env=e)
          def one(p,fen,n):p.stdin.write(json.dumps({'fen':fen,'nodes':n})+'\n');p.stdin.flush();return json.loads(p.stdout.readline())
          def timed(p,order):
              nodes=0;t=time.perf_counter()
              for fen in order:n=one(p,fen,25000);nodes+=n['nodes']
              return nodes/(time.perf_counter()-t)
          b=start('/tmp/control');c=start('/tmp/candidate');rat=[]
          try:
              one(b,roots[0],500);one(c,roots[0],500)
              for r in range(3):
                  order=roots if r%2==0 else list(reversed(roots))
                  if r%2==0:bn=timed(b,order);cn=timed(c,order)
                  else:cn=timed(c,order);bn=timed(b,order)
                  rat.append(cn/bn)
          finally:b.terminate();c.terminate();b.wait();c.wait()
          out={'top_k':${{ matrix.top_k }},'median_nps_ratio':statistics.median(rat),'ratios':rat};Path('results/throughput.json').write_text(json.dumps(out,indent=2)+'\n');print('FINAL',out)
          PY
      - name: Equal-node 96-game gate
        run: python -u tools/v14_fixed_node_arena.py /tmp/candidate /tmp/control --nodes 18000 --pairs 48 --opening-file /tmp/persistent-48.epd --opening-offset 0 --max-plies 220 --json-out results/equal-node.json | tee results/equal-node.log
      - name: Competition-clock 64-game gate
        run: python -u scripts/v15_competition_gate.py --control /tmp/control --candidate /tmp/candidate --openings /tmp/persistent-32.epd --output results/timed.json --label 'persistent Rust-policy top${{ matrix.top_k }} vs qcap6' --base-ms 2500 --inc-ms 50 --max-plies 180 | tee results/timed.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-python-rust-policy-persistent-k${{ matrix.top_k }}-${{ github.sha }}
          path: results/
          retention-days: 30
