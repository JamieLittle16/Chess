name: V16 Hyperstition v98 network

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qualify-v98:
    if: github.head_ref == 'v16/hyperstition-v98-net'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTFLAGS: -C target-cpu=x86-64-v3
      V92_URL: https://github.com/cosmobobak/viridithas-networks/releases/download/v92/hyperstition-b400.nnue.zst
      V92_RAW_SHA256: 36bcc6b3354ecbdb88fb95a341e494558b052223143f38ff6e6387aed99ab193
      V98_URL: https://github.com/cosmobobak/viridithas-networks/releases/download/v98/falke-b200.nnue.zst
      RAW_BYTES: '50616896'
      FASTCHESS_COMMIT: f618e34540f94f4719ad3817950618dabe441318
      OPENING_SHA256: 5445819229270140036023a507c41edffc9307ac2cca1ca2efd20e1ddb8d670e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Strict evaluator gate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features --release

      - name: Fetch v92 and v98 networks and prove raw-layout compatibility
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qualification/v98
          curl --fail --location --retry 5 "$V92_URL" -o .qualification/v98/v92.nnue.zst
          curl --fail --location --retry 5 "$V98_URL" -o .qualification/v98/v98.nnue.zst
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y zstd
          fi
          zstd -d -f .qualification/v98/v92.nnue.zst -o .qualification/v98/v92.nnue
          zstd -d -f .qualification/v98/v98.nnue.zst -o .qualification/v98/v98.nnue
          test "$(stat -c%s .qualification/v98/v92.nnue)" = "$RAW_BYTES"
          test "$(stat -c%s .qualification/v98/v98.nnue)" = "$RAW_BYTES"
          echo "$V92_RAW_SHA256  .qualification/v98/v92.nnue" | sha256sum --check --strict
          sha256sum .qualification/v98/v92.nnue.zst .qualification/v98/v92.nnue \
            .qualification/v98/v98.nnue.zst .qualification/v98/v98.nnue \
            | tee .qualification/v98/networks.sha256

      - name: Loader and edge-position compatibility
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p chess-eval --example hyperstition_eval
          python - <<'PY'
          import subprocess
          from pathlib import Path
          root=Path('.qualification/v98')
          exe=Path('target/release/examples/hyperstition_eval')
          fens=[
            'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1',
            'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR b KQkq - 0 1',
            'r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 0 1',
            '4k3/8/8/8/8/8/4Q3/4K3 w - - 0 1',
            '8/5pk1/6p1/3R4/8/6P1/5PK1/8 w - - 0 1',
            '7k/P7/8/8/8/8/7p/K7 w - - 0 1',
          ]
          rows=[]
          for fen in fens:
              vals=[]
              for name in ('v92','v98'):
                  cp=subprocess.run([str(exe),str(root/f'{name}.nnue'),fen],text=True,capture_output=True,check=True)
                  vals.append(int(cp.stdout.strip()))
              rows.append((vals[0],vals[1],fen))
          (root/'loader-smoke.tsv').write_text('\n'.join(f'{a}\t{b}\t{fen}' for a,b,fen in rows)+'\n')
          print((root/'loader-smoke.tsv').read_text())
          PY

      - name: Build one identical Hyperstition search binary
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_hyperstition_search_probe.py
          cargo fmt --all
          git diff --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features --release
          cargo build --release -p chess-uci
          cp target/release/chess-uci .qualification/v98/engine
          chmod +x .qualification/v98/engine
          sha256sum .qualification/v98/engine > .qualification/v98/engine.sha256

      - name: Reproduce certified 5000-root opening suite
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 \
            'https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip' \
            --output /tmp/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/UHO_Lichess_4852_v1.epd.zip' \
            | sha256sum --check --strict
          mkdir -p .qualification/m6-openings
          python scripts/build_m6_opening_suite.py \
            --archive /tmp/UHO_Lichess_4852_v1.epd.zip \
            --output-dir .qualification/m6-openings \
            | tee .qualification/m6-openings/derivation.log
          test "$(wc -l < .qualification/m6-openings/m6-uho-lichess-5000-v1.epd)" = '5000'
          echo "$OPENING_SHA256  .qualification/m6-openings/m6-uho-lichess-5000-v1.epd" \
            | sha256sum --check --strict

      - name: Build pinned Fastchess
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/Disservin/fastchess.git .qualification/fastchess-src
          git -C .qualification/fastchess-src checkout --quiet "$FASTCHESS_COMMIT"
          make -C .qualification/fastchess-src -j2

      - name: Create same-binary launchers
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD"
          mkdir -p .qualification/v98/launchers
          cat > .qualification/v98/launchers/v92.sh <<EOF
          #!/usr/bin/env bash
          unset CHESS_GESTALT_NETWORK
          export CHESS_HYPERSTITION_NETWORK='$ROOT/.qualification/v98/v92.nnue'
          exec '$ROOT/.qualification/v98/engine'
          EOF
          cat > .qualification/v98/launchers/v98.sh <<EOF
          #!/usr/bin/env bash
          unset CHESS_GESTALT_NETWORK
          export CHESS_HYPERSTITION_NETWORK='$ROOT/.qualification/v98/v98.nnue'
          exec '$ROOT/.qualification/v98/engine'
          EOF
          chmod +x .qualification/v98/launchers/*.sh

      - name: UCI smoke both networks
        shell: bash
        run: |
          set -euo pipefail
          for NAME in v92 v98; do
            {
              printf 'uci\n'
              printf 'isready\n'
              printf 'position startpos\n'
              printf 'go nodes 1000\n'
              printf 'quit\n'
            } | ".qualification/v98/launchers/$NAME.sh" | tee ".qualification/v98/$NAME-smoke.txt"
            grep -q '^bestmove ' ".qualification/v98/$NAME-smoke.txt"
          done

      - name: Run paired 100-game 25k-node v98-v92 screen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qualification/v98/equal-nodes
          .qualification/fastchess-src/fastchess \
            -engine cmd="$PWD/.qualification/v98/launchers/v98.sh" name=falke-v98 nodes=25000 option.Hash=32 \
            -engine cmd="$PWD/.qualification/v98/launchers/v92.sh" name=hyperstition-v92 nodes=25000 option.Hash=32 \
            -openings file="$PWD/.qualification/m6-openings/m6-uho-lichess-5000-v1.epd" format=epd order=random \
            -srand 20260909 \
            -rounds 50 -repeat -concurrency 1 -maxmoves 300 -ratinginterval 20 \
            -pgnout file=.qualification/v98/equal-nodes/games.pgn notation=uci append=false nodes=true nps=true \
            -log file=.qualification/v98/equal-nodes/uci.log level=info engine=true append=false \
            | tee .qualification/v98/equal-nodes/fastchess.stdout.log

      - name: Run paired 100-game 1+0.01 v98-v92 screen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qualification/v98/equal-time
          .qualification/fastchess-src/fastchess \
            -engine cmd="$PWD/.qualification/v98/launchers/v98.sh" name=falke-v98 tc=1+0.01 option.Hash=32 \
            -engine cmd="$PWD/.qualification/v98/launchers/v92.sh" name=hyperstition-v92 tc=1+0.01 option.Hash=32 \
            -openings file="$PWD/.qualification/m6-openings/m6-uho-lichess-5000-v1.epd" format=epd order=random \
            -srand 20260910 \
            -rounds 50 -repeat -concurrency 1 -maxmoves 300 -ratinginterval 20 \
            -pgnout file=.qualification/v98/equal-time/games.pgn notation=uci append=false nodes=true nps=true \
            -log file=.qualification/v98/equal-time/uci.log level=info engine=true append=false \
            | tee .qualification/v98/equal-time/fastchess.stdout.log

      - name: Record immutable identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "head=$(git rev-parse HEAD)"
            echo "compile_target=x86-64-v3"
            echo "architecture=Little Gambit materialized Hyperstition runtime"
            echo "v92=$V92_URL"
            echo "v98=$V98_URL"
            echo "raw_bytes_expected=$RAW_BYTES"
            echo "search_semantics=identical binary; network bytes only"
            echo "nodes_seed=20260909"
            echo "time_seed=20260910"
            echo "fastchess_commit=$FASTCHESS_COMMIT"
          } > .qualification/v98/evidence.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v16-hyperstition-v98-${{ github.sha }}
          path: |
            .qualification/v98/networks.sha256
            .qualification/v98/loader-smoke.tsv
            .qualification/v98/engine.sha256
            .qualification/v98/*-smoke.txt
            .qualification/v98/evidence.txt
            .qualification/v98/equal-nodes/
            .qualification/v98/equal-time/
            .qualification/m6-openings/derivation.log
          if-no-files-found: warn
          retention-days: 30
