name: V18 Gestalt V13 residual screen
on:
  push:
    branches: [analysis/v18-v13-gestalt-screen-20260910]
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'numba==0.67.0' 'numpy==2.5.2' 'chess==1.11.2'
      - name: Reconstruct exact PUNCH133 and candidate
        run: |
          set -euo pipefail
          cat ci/v18_postbook_payload/chunk_*.b64 | base64 -d > /tmp/p150.zip
          for d in /tmp/base /tmp/cand; do
            rm -rf "$d"; mkdir "$d"; unzip -q /tmp/p150.zip -d "$d"
            sed -i 's/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.50/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.33/' "$d/agent.py"
            curl --fail --location --retry 5 -sS 'https://raw.githubusercontent.com/michaeldv/donna_opening_books/master/gm2001.bin' -o "$d/v18_gm2001.bin"
          done
          python - <<'PY'
          import json,numpy as np,hashlib
          p='/tmp/cand/experiments/v13_residual.i16'
          w=np.fromfile(p,dtype=np.int16).astype(np.int32)
          for i,d in json.load(open('ci/v13-gestalt-delta400.json')): w[i]+=d
          assert w.min()>=-32768 and w.max()<=32767
          w.astype(np.int16).tofile(p)
          print('BASE',hashlib.sha256(open('/tmp/base/experiments/v13_residual.i16','rb').read()).hexdigest())
          print('CAND',hashlib.sha256(open(p,'rb').read()).hexdigest())
          print('CHANGED',sum(1 for i,d in json.load(open('ci/v13-gestalt-delta400.json')) if d))
          PY
      - name: Build qualification positions
        run: |
          python - <<'PY'
          from pathlib import Path
          src=[x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')][:50]
          crit=[
          'r2q1rk1/1b1n1pbp/pp1ppnp1/8/PPPNPP2/2NBB2P/2Q3P1/R3K2R w KQ - 1 14',
          'r1bqk1nr/3n1pbp/3pp1p1/1B1p4/4P3/2N1B3/PP1QNPPP/R3K2R b KQkq - 0 11',
          'rnb1kb1r/2q2ppp/p1pp1n2/1p2p3/2PPP3/2NBB3/PP2NPPP/R2QK2R w KQkq - 0 8',
          'rnb1k2r/2q1bppp/p1pp1n2/1p2p3/2PPP3/1QNBB3/PP2NPPP/R3K2R w KQkq - 2 9',
          'r5k1/2q1bppp/p1p5/3p1P2/P1P3n1/QB1n4/1P1BNPPP/R4K1R w - - 0 20']
          Path('/tmp/uho.txt').write_text('\n'.join(src)+'\n')
          Path('/tmp/crit.txt').write_text('\n'.join(crit)+'\n')
          PY
      - name: Critical fixed-node sweep
        run: |
          cat >/tmp/crit.py <<'PY'
          import sys,time,chess,numpy as np
          sys.path.insert(0,sys.argv[1]); import agent
          from experiments.numba_core import encode_position,move_to_uci
          from experiments.numba_search import iterative_search_stateful
          h=np.empty(0,dtype=np.uint64)
          for i,fen in enumerate(open('/tmp/crit.txt')):
            b=chess.Board(fen.strip()); e=encode_position(b); print('POS',i,b.fen())
            for n in (200000,1000000,4000000):
              agent._HASH_KEYS.fill(0);agent._HASH_MOVES.fill(-1);agent._TT_TABLE.fill(0);agent._QUIET_HISTORY.fill(0)
              t=time.perf_counter();m,s,d,nn=iterative_search_stateful(e.board.copy(),e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,n)
              print(n,move_to_uci(m),int(s),int(d),int(nn),round(time.perf_counter()-t,4),flush=True)
          PY
          echo '=== BASE ==='; python /tmp/crit.py /tmp/base
          echo '=== CAND ==='; python /tmp/crit.py /tmp/cand
      - name: 50 UHO fixed-node A/B
        run: |
          cat >/tmp/roots.py <<'PY'
          import sys,json,time,chess,numpy as np
          sys.path.insert(0,sys.argv[1]); import agent
          from experiments.numba_core import encode_position,move_to_uci
          from experiments.numba_search import iterative_search_stateful
          h=np.empty(0,dtype=np.uint64);out=[]
          for i,fen in enumerate(open('/tmp/uho.txt')):
            b=chess.Board(fen.strip());e=encode_position(b)
            agent._HASH_KEYS.fill(0);agent._HASH_MOVES.fill(-1);agent._TT_TABLE.fill(0);agent._QUIET_HISTORY.fill(0)
            t=time.perf_counter();m,s,d,n=iterative_search_stateful(e.board.copy(),e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,500000)
            out.append({'i':i,'fen':b.fen(),'move':move_to_uci(m),'score':int(s),'depth':int(d),'nodes':int(n),'sec':time.perf_counter()-t})
          open(sys.argv[2],'w').write('\n'.join(json.dumps(x) for x in out)+'\n')
          PY
          python /tmp/roots.py /tmp/base /tmp/base.jsonl
          python /tmp/roots.py /tmp/cand /tmp/cand.jsonl
          python - <<'PY'
          import json
          A=[json.loads(x) for x in open('/tmp/base.jsonl')];B=[json.loads(x) for x in open('/tmp/cand.jsonl')]
          D=[(a['i'],a['move'],b['move'],a['score'],b['score']) for a,b in zip(A,B) if a['move']!=b['move']]
          print('ROOT_DIFFS',len(D));[print('DIFF',x) for x in D]
          print('BASE_SEC',sum(x['sec'] for x in A),'CAND_SEC',sum(x['sec'] for x in B))
          print('BASE_NODES',sum(x['nodes'] for x in A),'CAND_NODES',sum(x['nodes'] for x in B))
          PY
      - name: SF19 judge changed roots
        run: |
          curl --fail --location --retry 5 -sS 'https://github.com/official-stockfish/Stockfish/releases/latest/download/stockfish-linux-x86-64-universal.tar.gz' -o /tmp/sf.tar.gz
          mkdir -p /tmp/sf; tar -xzf /tmp/sf.tar.gz -C /tmp/sf
          SF="$(find /tmp/sf -type f -name 'stockfish*' -perm /111 | head -n1)"; cp "$SF" /tmp/sf19; chmod +x /tmp/sf19
          python - <<'PY'
          import json,chess,chess.engine
          A=[json.loads(x) for x in open('/tmp/base.jsonl')];B=[json.loads(x) for x in open('/tmp/cand.jsonl')]
          sf=chess.engine.SimpleEngine.popen_uci('/tmp/sf19');sf.configure({'Threads':1,'Hash':64})
          def cp(s,p):
            v=s.pov(p).score(mate_score=100000);return int(v if v is not None else 0)
          imp=bad=tie=net=0
          for a,b in zip(A,B):
            if a['move']==b['move']:continue
            bd=chess.Board(a['fen']);pov=bd.turn
            if 'Clear Hash' in sf.options:sf.configure({'Clear Hash':None})
            best=sf.analyse(bd,chess.engine.Limit(nodes=100000));bc=cp(best['score'],pov);vals=[]
            for r in (a,b):
              if 'Clear Hash' in sf.options:sf.configure({'Clear Hash':None})
              q=sf.analyse(bd,chess.engine.Limit(nodes=100000),root_moves=[chess.Move.from_uci(r['move'])]);vals.append(cp(q['score'],pov))
            la=max(0,bc-vals[0]);lb=max(0,bc-vals[1]);d=la-lb;net+=d
            if d>5:imp+=1
            elif d<-5:bad+=1
            else:tie+=1
            print('SF_DIFF',a['i'],a['move'],b['move'],'best',best['pv'][0].uci(),'loss',la,lb,'delta',d)
          sf.quit();print('SF_SUMMARY improved',imp,'worse',bad,'tie',tie,'NET_CP',net)
          PY
