name: V16 TT static-eval cache

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qualify:
    if: github.head_ref == 'v16/strength-programme'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTFLAGS: -C target-cpu=x86-64-v3
      GESTALT_URL: https://github.com/cosmobobak/viridithas-networks/releases/download/v85/gestalt-b840.nnue
      GESTALT_SHA256: 956a6afcce5de1cdbc953ae3817ff760f3e6036441f34dcd524d6e2e7d0e71f6
      FASTCHESS_COMMIT: f618e34540f94f4719ad3817950618dabe441318
      OPENING_SHA256: 5445819229270140036023a507c41edffc9307ac2cca1ca2efd20e1ddb8d670e
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Strict V15 control gate and deterministic identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qualification/bin .qualification/tt-static-eval
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --release
          cargo build --release -p chess-uci -p chess-bench
          cp target/release/chess-uci .qualification/bin/reference
          chmod +x .qualification/bin/reference
          target/release/chess-bench | tee .qualification/tt-static-eval/reference-bench.txt
          grep -F 'signature 0xeba410d31bee522d' .qualification/tt-static-eval/reference-bench.txt
          sha256sum .qualification/bin/reference > .qualification/tt-static-eval/reference.sha256

      - name: Apply auditable TT static-eval cache candidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_tt_static_eval_cache.py
          cargo fmt --all
          git diff --check
          git diff -- crates/chess-search/src/lib.rs > .qualification/tt-static-eval/candidate.patch
          test -s .qualification/tt-static-eval/candidate.patch
          sha256sum scripts/apply_tt_static_eval_cache.py > .qualification/tt-static-eval/patcher.sha256
          sha256sum .qualification/tt-static-eval/candidate.patch > .qualification/tt-static-eval/candidate-patch.sha256

      - name: Strict candidate gate and zero-semantic-drift check
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --release
          cargo build --release -p chess-uci -p chess-bench
          cp target/release/chess-uci .qualification/bin/candidate
          chmod +x .qualification/bin/candidate
          target/release/chess-bench | tee .qualification/tt-static-eval/candidate-bench.txt
          diff -u .qualification/tt-static-eval/reference-bench.txt .qualification/tt-static-eval/candidate-bench.txt
          grep -F 'signature 0xeba410d31bee522d' .qualification/tt-static-eval/candidate-bench.txt
          sha256sum .qualification/bin/candidate > .qualification/tt-static-eval/candidate.sha256

      - name: Download exact production Gestalt network
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 "$GESTALT_URL" \
            --output .qualification/tt-static-eval/gestalt-b840.nnue
          test "$(stat -c%s .qualification/tt-static-eval/gestalt-b840.nnue)" = '21242944'
          echo "$GESTALT_SHA256  .qualification/tt-static-eval/gestalt-b840.nnue" | sha256sum --check --strict

      - name: Reproduce certified 5000-root opening suite
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 \
            'https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip' \
            --output /tmp/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/UHO_Lichess_4852_v1.epd.zip' | sha256sum --check --strict
          mkdir -p .qualification/m6-openings
          python scripts/build_m6_opening_suite.py \
            --archive /tmp/UHO_Lichess_4852_v1.epd.zip \
            --output-dir .qualification/m6-openings \
            | tee .qualification/m6-openings/derivation.log
          test "$(wc -l < .qualification/m6-openings/m6-uho-lichess-5000-v1.epd)" = '5000'
          echo "$OPENING_SHA256  .qualification/m6-openings/m6-uho-lichess-5000-v1.epd" | sha256sum --check --strict

      - name: Build pinned Fastchess
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/Disservin/fastchess.git .qualification/fastchess-src
          git -C .qualification/fastchess-src checkout --quiet "$FASTCHESS_COMMIT"
          test "$(git -C .qualification/fastchess-src rev-parse HEAD)" = "$FASTCHESS_COMMIT"
          make -C .qualification/fastchess-src -j2
          test -x .qualification/fastchess-src/fastchess

      - name: Create identical-network launchers
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD"
          mkdir -p .qualification/launchers
          cat > .qualification/launchers/reference.sh <<EOF
          #!/usr/bin/env bash
          export CHESS_GESTALT_NETWORK='$ROOT/.qualification/tt-static-eval/gestalt-b840.nnue'
          exec '$ROOT/.qualification/bin/reference'
          EOF
          cat > .qualification/launchers/candidate.sh <<EOF
          #!/usr/bin/env bash
          export CHESS_GESTALT_NETWORK='$ROOT/.qualification/tt-static-eval/gestalt-b840.nnue'
          exec '$ROOT/.qualification/bin/candidate'
          EOF
          chmod +x .qualification/launchers/reference.sh .qualification/launchers/candidate.sh

      - name: Measure fixed-node search time
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qualification/tt-static-eval/fixed-nodes
          .qualification/fastchess-src/fastchess \
            -engine cmd="$PWD/.qualification/launchers/candidate.sh" name=tt-cache nodes=25000 option.Hash=32 \
            -engine cmd="$PWD/.qualification/launchers/reference.sh" name=v15-control nodes=25000 option.Hash=32 \
            -openings file="$PWD/.qualification/m6-openings/m6-uho-lichess-5000-v1.epd" format=epd order=random \
            -srand 20260910 -rounds 10 -repeat -concurrency 1 -maxmoves 300 \
            -ratinginterval 20 \
            -pgnout file=.qualification/tt-static-eval/fixed-nodes/games.pgn notation=uci append=false nodes=true nps=true \
            | tee .qualification/tt-static-eval/fixed-nodes/fastchess.stdout.log
          python scripts/analyze_fastchess_node_times.py \
            .qualification/tt-static-eval/fixed-nodes/games.pgn \
            --output .qualification/tt-static-eval/fixed-nodes/times.json
          python - <<'PY' | tee .qualification/tt-static-eval/performance-summary.txt
          import json
          from pathlib import Path
          data = json.loads(Path('.qualification/tt-static-eval/fixed-nodes/times.json').read_text())['engines']
          candidate = data['tt-cache']['mean_seconds']
          control = data['v15-control']['mean_seconds']
          print(f'candidate_mean_seconds={candidate:.9f}')
          print(f'control_mean_seconds={control:.9f}')
          print(f'time_ratio={candidate / control:.4f}x')
          print(f'speedup={control / candidate:.4f}x')
          PY

      - name: Run paired 100-game equal-time speed-strength screen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qualification/tt-static-eval/equal-time
          .qualification/fastchess-src/fastchess \
            -engine cmd="$PWD/.qualification/launchers/candidate.sh" name=tt-cache tc=1+0.01 option.Hash=32 \
            -engine cmd="$PWD/.qualification/launchers/reference.sh" name=v15-control tc=1+0.01 option.Hash=32 \
            -openings file="$PWD/.qualification/m6-openings/m6-uho-lichess-5000-v1.epd" format=epd order=random \
            -srand 20260911 -rounds 50 -repeat -concurrency 1 -maxmoves 300 \
            -ratinginterval 20 \
            -pgnout file=.qualification/tt-static-eval/equal-time/games.pgn notation=uci append=false nodes=true nps=true \
            | tee .qualification/tt-static-eval/equal-time/fastchess.stdout.log

      - name: Record experiment identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat > .qualification/tt-static-eval/evidence.txt <<EOF
          purpose=semantics-preserving TT static evaluator cache qualification
          base=V15 exact search semantics
          cache_key=full zobrist key, matching resident TT entry only
          cache_payload=Option<i16>, out-of-range evals not cached
          tt_entry_size_gate=24 bytes unchanged
          deterministic_signature=0xeba410d31bee522d unchanged
          network_sha256=$GESTALT_SHA256
          compile_target=x86-64-v3 both engines
          fixed_node_games=20
          nodes_per_move=25000
          equal_time_games=100
          time_control=1+0.01
          opening_sha256=$OPENING_SHA256
          fastchess_commit=$FASTCHESS_COMMIT
          EOF

      - name: Upload complete evidence without network bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v16-tt-static-eval-${{ github.sha }}
          path: |
            .qualification/tt-static-eval/reference-bench.txt
            .qualification/tt-static-eval/candidate-bench.txt
            .qualification/tt-static-eval/reference.sha256
            .qualification/tt-static-eval/candidate.sha256
            .qualification/tt-static-eval/patcher.sha256
            .qualification/tt-static-eval/candidate.patch
            .qualification/tt-static-eval/candidate-patch.sha256
            .qualification/tt-static-eval/performance-summary.txt
            .qualification/tt-static-eval/evidence.txt
            .qualification/tt-static-eval/fixed-nodes/
            .qualification/tt-static-eval/equal-time/
            .qualification/m6-openings/derivation.log
          retention-days: 30
