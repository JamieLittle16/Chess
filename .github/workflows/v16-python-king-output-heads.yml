name: V16 Python king-conditioned H64 output heads

on:
  workflow_dispatch:
  push:
    branches: [v16/python-king-output-heads]
    paths:
      - 'scripts/train_v16_king_output_heads.py'
      - 'scripts/patch_v16_king_output_heads.py'
      - '.github/workflows/v16-python-king-output-heads.yml'

permissions:
  actions: read
  contents: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        alpha: ['0.10', '0.20', '0.35']
    name: king-output-alpha-${{ matrix.alpha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact competition runtime
        run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0

      - name: Download exact final V15
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V15-FINAL-725be3e8595d1e54b1f12e11f2b9d92f1e415ebc
          path: v15-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34298586524

      - name: Download certified Gestalt teacher corpus
        uses: actions/download-artifact@v4
        with:
          name: v15-python-gestalt-h64-corpus-13b867857b5847e8423b16ac811c76ea098c668e
          path: teacher-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34265193221

      - name: Train and materialize candidate
        shell: bash
        run: |
          set -euo pipefail
          V15=$(find v15-artifact -type f -name Little-Gambit-V15.zip -print -quit)
          TEACHER=$(find teacher-artifact -type f -name teacher.jsonl -print -quit)
          test -n "$V15"; test -n "$TEACHER"
          echo '81e22344bf9a6b41f16e32f29f93c0b6074afe63e4fd51002a537e6a091f2852  '"$V15" | sha256sum --check --strict
          rm -rf /tmp/control /tmp/candidate model results
          mkdir -p /tmp/control /tmp/candidate model results
          unzip -q "$V15" -d /tmp/control
          cp -a /tmp/control/. /tmp/candidate/
          python -u scripts/train_v16_king_output_heads.py \
            --teacher "$TEACHER" --engine-dir /tmp/control --output-dir model \
            --alpha '${{ matrix.alpha }}' --epochs 90 --batch-size 384 \
            --learning-rate 0.003 --ridge 0.0015 \
            | tee results/training.log
          cp model/student-h64-king-output-heads.npz /tmp/candidate/experiments/v14_student_h64.npz
          python scripts/patch_v16_king_output_heads.py /tmp/candidate
          python -m py_compile /tmp/control/agent.py /tmp/control/experiments/*.py /tmp/candidate/agent.py /tmp/candidate/experiments/*.py
          python - <<'PY'
          import numpy as np
          z=np.load('/tmp/candidate/experiments/v14_student_h64.npz')
          assert z['feature_weights'].shape == (768,64)
          assert z['feature_bias'].shape == (64,)
          assert z['output_weights'].shape == (64,64)
          assert z['output_bias'].shape == (64,)
          print('king-output model shape verified')
          PY
          cp model/training-metadata.json results/
          (cd /tmp/candidate && zip -qr "/tmp/Little-Gambit-V16-king-output-${{ matrix.alpha }}.zip" .)
          sha256sum "$V15" "/tmp/Little-Gambit-V16-king-output-${{ matrix.alpha }}.zip" | tee results/package-hashes.txt

      - name: Fetch pinned qualification harnesses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v16-tools
          curl --fail --location --retry 3 -o /tmp/v16-tools/v14_fixed_node_arena.py https://raw.githubusercontent.com/JamieLittle16/Chess/36bc026930cbf68b4a6a9be0c8f301ce5de0e34e/tools/v14_fixed_node_arena.py
          curl --fail --location --retry 3 -o /tmp/v16-tools/v14_agent_runner.py https://raw.githubusercontent.com/JamieLittle16/Chess/36bc026930cbf68b4a6a9be0c8f301ce5de0e34e/tools/v14_agent_runner.py
          curl --fail --location --retry 3 -o /tmp/v16-tools/v15_competition_gate.py https://raw.githubusercontent.com/JamieLittle16/Chess/36bc026930cbf68b4a6a9be0c8f301ce5de0e34e/scripts/v15_competition_gate.py
          python -m py_compile /tmp/v16-tools/*.py

      - name: Record cold readiness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,queue,subprocess,sys,threading,time
          p=subprocess.Popen([sys.executable,'/tmp/v16-tools/v14_agent_runner.py','/tmp/candidate'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,bufsize=1)
          q=queue.Queue()
          def read():
              for line in p.stdout:q.put(line)
          threading.Thread(target=read,daemon=True).start()
          t=time.monotonic()
          try: line=q.get(timeout=95)
          except queue.Empty:
              p.kill(); raise SystemExit('candidate failed 95-second exploratory cold-start gate')
          elapsed=time.monotonic()-t; payload=json.loads(line)
          if payload.get('ready') is not True: raise SystemExit(payload)
          p.kill(); p.wait(timeout=5)
          open('results/startup.json','w').write(json.dumps({'cold_ready_seconds':elapsed},indent=2)+'\n')
          print('cold_ready_seconds',elapsed)
          PY

      - name: Build fresh disjoint UHO roots
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          rm -rf /tmp/m6; mkdir /tmp/m6
          python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]
          roots=fresh[4624:4688]
          assert len(roots)==64 and len(set(roots))==64
          Path('/tmp/ko-node.epd').write_text('\n'.join(roots[:32])+'\n')
          Path('/tmp/ko-clock.epd').write_text('\n'.join(roots[32:])+'\n')
          PY

      - name: Search throughput probe
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/throughput.py <<'PY'
          import json,statistics,subprocess,sys,time
          from pathlib import Path
          roots=[x.strip() for x in Path('/tmp/ko-node.epd').read_text().splitlines() if x.strip()][:12]
          worker='/tmp/v16-tools/v14_fixed_node_arena.py'
          def start(root): return subprocess.Popen([sys.executable,worker,'--worker',root],stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1)
          def one(p,fen,n): p.stdin.write(json.dumps({'fen':fen,'prior':[],'nodes':n})+'\n'); p.stdin.flush(); return json.loads(p.stdout.readline())
          def run(p,order):
              t=time.perf_counter(); nodes=0
              for fen in order: nodes+=int(one(p,fen,18000)['nodes'])
              return nodes/(time.perf_counter()-t)
          base=start('/tmp/control'); cand=start('/tmp/candidate'); ratios=[]
          try:
              one(base,roots[0],300); one(cand,roots[0],300)
              for k in range(3):
                  order=roots if k%2==0 else list(reversed(roots))
                  if k%2==0: b=run(base,order); c=run(cand,order)
                  else: c=run(cand,order); b=run(base,order)
                  ratios.append(c/b)
          finally:
              base.terminate(); cand.terminate(); base.wait(); cand.wait()
          out={'ratios':ratios,'median_nps_ratio':statistics.median(ratios)}
          Path('results/throughput.json').write_text(json.dumps(out,indent=2)+'\n'); print('FINAL',out)
          PY
          python /tmp/throughput.py

      - name: 64-game equal-node screen versus exact V15
        run: python -u /tmp/v16-tools/v14_fixed_node_arena.py /tmp/candidate /tmp/control --nodes 20000 --pairs 32 --opening-file /tmp/ko-node.epd --max-plies 220 --json-out results/equal-node.json | tee results/equal-node.log

      - name: 64-game short-clock screen versus exact V15
        run: python -u /tmp/v16-tools/v15_competition_gate.py --control /tmp/control --candidate /tmp/candidate --openings /tmp/ko-clock.epd --runner /tmp/v16-tools/v14_agent_runner.py --output results/timed.json --label 'V16 king-output H64 alpha=${{ matrix.alpha }} vs exact V15' --base-ms 2500 --inc-ms 50 --max-plies 180 --grace-ms 1500 | tee results/timed.log

      - name: Preserve candidate package
        if: always()
        run: cp "/tmp/Little-Gambit-V16-king-output-${{ matrix.alpha }}.zip" results/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v16-python-king-output-${{ matrix.alpha }}-${{ github.sha }}
          path: results/
          retention-days: 30
