name: V15 Python balanced LMR + presort timed

on:
  push:
    branches: [analysis/v15-python-lmr-balanced-presort-timed-20260908]
    paths:
      - scripts/patch_v15_python_presort_once.py
      - tools/v14_agent_runner.py
      - .github/workflows/v15-python-lmr-balanced-presort-timed.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  timed:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Download exact packaged V14
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - name: Materialize presort control and balanced-LMR candidate
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name Little-Gambit-V14.zip -print -quit); test -n "$ZIP"
          rm -rf /tmp/base /tmp/cand /tmp/m6 results; mkdir -p /tmp/base /tmp/cand /tmp/m6 results
          unzip -q "$ZIP" -d /tmp/base
          python scripts/patch_v15_python_presort_once.py /tmp/base/experiments/numba_search.py
          cp -a /tmp/base/. /tmp/cand/
          python scripts/patch_v15_python_lmr_schedule.py /tmp/cand/experiments/numba_search.py 3 3 5 7 8 10
          python -m py_compile tools/v14_agent_runner.py /tmp/base/agent.py /tmp/cand/agent.py /tmp/base/experiments/*.py /tmp/cand/experiments/*.py
      - name: Build 96 fresh roots
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]
          chosen=fresh[3600:3696]
          assert len(chosen)==96 and len(set(chosen))==96
          Path('/tmp/lmr-confirm-96.epd').write_text('\n'.join(chosen)+'\n')
          PY
      - name: 192-game competition-clock confirmation
        shell: bash
        run: |
          python - <<'PY'
          import json,math,queue,subprocess,sys,threading,time
          from collections import Counter
          from pathlib import Path
          import chess
          BASE_MS=2500;INC_MS=50;MAX_PLIES=180;GRACE=1500
          roots=[x.strip() for x in Path('/tmp/lmr-confirm-96.epd').read_text().splitlines() if x.strip()]
          class A:
              def __init__(self,d):
                  self.p=subprocess.Popen([sys.executable,'tools/v14_agent_runner.py',d],stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,bufsize=1);self.q=queue.Queue()
                  threading.Thread(target=lambda:[self.q.put(x.rstrip()) for x in self.p.stdout] or self.q.put(None),daemon=True).start();assert json.loads(self.q.get(timeout=120)).get('ready')
              def reset(self):self.p.stdin.write(json.dumps({'reset':True})+'\n');self.p.stdin.flush();assert json.loads(self.q.get(timeout=5)).get('reset')
              def move(self,b,ms):
                  t=time.monotonic();self.p.stdin.write(json.dumps({'fen':b.fen(),'time_left_ms':max(0,int(ms))})+'\n');self.p.stdin.flush();z=json.loads(self.q.get(timeout=(max(0,ms)+GRACE)/1000));return chess.Move.from_uci(z['move']),(time.monotonic()-t)*1000
              def stop(self):self.p.kill();self.p.wait()
          b=A('/tmp/base');c=A('/tmp/cand');rows=[]
          try:
              for i,fen in enumerate(roots):
                  for cw in (True,False):
                      x=chess.Board(fen);cl={True:float(BASE_MS),False:float(BASE_MS)};b.reset();c.reset();cm=[];bm=[]
                      for _ in range(MAX_PLIES):
                          o=x.outcome(claim_draw=True)
                          if o is not None:s=.5 if o.winner is None else float(o.winner==cw);term=x.result(claim_draw=True);break
                          side=x.turn;e=c if side==cw else b
                          try:m,dt=e.move(x,cl[side]);assert m in x.legal_moves
                          except Exception:s=0.0 if side==cw else 1.0;term='engine-failure';break
                          cl[side]-=dt
                          if cl[side]<0:s=0.0 if side==cw else 1.0;term='flag';break
                          (cm if side==cw else bm).append(dt);x.push(m);cl[side]+=INC_MS
                      else:s=.5;term='max-ply-draw'
                      rows.append({'opening':i,'candidate_white':cw,'score':s,'termination':term,'candidate_ms':cm,'control_ms':bm});print(i,cw,s,term,flush=True)
          finally:b.stop();c.stop()
          score=sum(r['score'] for r in rows);n=len(rows);f=score/n;elo=400*math.log10(f/(1-f)) if 0<f<1 else None
          cm=[z for r in rows for z in r['candidate_ms']];bm=[z for r in rows for z in r['control_ms']]
          out={'games':n,'score':score,'score_fraction':f,'naive_elo_from_score':elo,'candidate_mean_move_ms':sum(cm)/len(cm),'control_mean_move_ms':sum(bm)/len(bm),'terminations':dict(Counter(r['termination'] for r in rows)),'details':rows}
          Path('results/timed.json').write_text(json.dumps(out,indent=2)+'\n');print('FINAL',json.dumps({k:v for k,v in out.items() if k!='details'}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-python-lmr-balanced-presort-timed-${{ github.sha }}
          path: results/
          retention-days: 30
