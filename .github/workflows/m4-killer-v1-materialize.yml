name: M4 killer v1 materialize

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'm4/killer-v1-final'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m4/killer-v1-final
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Materialize once
        run: |
          set -euo pipefail
          if grep -q 'Stage::Killer' crates/chess-search/src/move_picker.rs; then
            echo 'killer implementation already materialized'
            exit 0
          fi
          python3 tools/apply_killer_v1.py
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test -p chess-search --all-features
          cargo test -p chess-core --all-features
          cargo test -p chess-engine --all-features
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/chess-search/src/lib.rs crates/chess-search/src/move_picker.rs crates/chess-search/src/quiescence.rs
          git commit -m 'm4: add two-slot killer move ordering'
          git push origin HEAD:m4/killer-v1-final
