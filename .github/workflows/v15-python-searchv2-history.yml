name: V15 Python Search-v2 history qualification

on:
  push:
    branches: [analysis/v15-python-searchv2-history-20260908]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact competition runtime
        run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0

      - name: Download exact packaged V14
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775

      - name: Materialize exact A/B and compile the Numba search
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name 'Little-Gambit-V14.zip' -print -quit); test -n "$ZIP"
          rm -rf /tmp/base /tmp/cand; mkdir -p /tmp/base /tmp/cand results
          unzip -q "$ZIP" -d /tmp/base; cp -a /tmp/base/. /tmp/cand/
          python scripts/patch_v15_python_searchv2_history.py /tmp/cand/experiments/numba_search.py
          python -m py_compile /tmp/base/agent.py /tmp/base/experiments/*.py /tmp/cand/agent.py /tmp/cand/experiments/*.py
          cmp /tmp/base/agent.py /tmp/cand/agent.py
          cmp /tmp/base/experiments/numba_core.py /tmp/cand/experiments/numba_core.py
          cmp /tmp/base/experiments/v14_student_h64.npz /tmp/cand/experiments/v14_student_h64.npz
          diff -u /tmp/base/experiments/numba_search.py /tmp/cand/experiments/numba_search.py > results/integration.patch || true
          test -s results/integration.patch
          PYTHONPATH=/tmp/cand python - <<'PY'
          import chess, numpy as np
          from experiments.numba_core import encode_position, move_to_uci
          from experiments.numba_search import iterative_search_stateful
          for fen in (chess.STARTING_FEN, 'r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 0 1'):
              b=chess.Board(fen); e=encode_position(b); h=np.empty(0,dtype=np.uint64)
              out=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,4000)
              m=chess.Move.from_uci(move_to_uci(int(out[0])))
              assert m in b.legal_moves,(fen,out,m)
              print(fen, out, m)
          PY

      - name: Build fresh pinned 48-root suite
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          mkdir -p /tmp/m6
          python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          echo '5445819229270140036023a507c41edffc9307ac2cca1ca2efd20e1ddb8d670e  /tmp/m6/m6-uho-lichess-5000-v1.epd' | sha256sum --check --strict
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]
          chosen=fresh[400:448]
          assert len(chosen)==48 and len(set(chosen))==48
          Path('/tmp/searchv2-48.epd').write_text('\n'.join(chosen)+'\n')
          PY
          sha256sum /tmp/searchv2-48.epd | tee results/openings.sha256

      - name: Measure fixed-node throughput
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/worker.py <<'PY'
          import json,sys,chess,numpy as np
          from experiments.numba_core import encode_position
          from experiments.numba_search import iterative_search_stateful
          for line in sys.stdin:
              q=json.loads(line); b=chess.Board(q['fen']); e=encode_position(b); h=np.empty(0,dtype=np.uint64)
              out=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,int(q['nodes']))
              print(json.dumps({'move':int(out[0]),'score':int(out[1]),'depth':int(out[2]),'nodes':int(out[3])}),flush=True)
          PY
          python - <<'PY'
          import json,os,statistics,subprocess,sys,time
          from pathlib import Path
          roots=[x.strip() for x in Path('/tmp/searchv2-48.epd').read_text().splitlines() if x.strip()][:16]
          def start(d):
              e=os.environ.copy();e['PYTHONPATH']=d
              return subprocess.Popen([sys.executable,'/tmp/worker.py'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env=e)
          def run(p,order):
              total=0;t=time.perf_counter()
              for fen in order:
                  p.stdin.write(json.dumps({'fen':fen,'nodes':25000})+'\n');p.stdin.flush();total+=json.loads(p.stdout.readline())['nodes']
              return time.perf_counter()-t,total
          base=start('/tmp/base');cand=start('/tmp/cand');ratios=[];rows=[]
          try:
              for p in (base,cand):
                  p.stdin.write(json.dumps({'fen':roots[0],'nodes':500})+'\n');p.stdin.flush();json.loads(p.stdout.readline())
              for rep in range(3):
                  order=roots if rep%2==0 else list(reversed(roots))
                  if rep%2==0: bt,bn=run(base,order);ct,cn=run(cand,order)
                  else: ct,cn=run(cand,order);bt,bn=run(base,order)
                  ratio=(cn/ct)/(bn/bt);ratios.append(ratio);rows.append({'rep':rep,'base_nps':bn/bt,'candidate_nps':cn/ct,'ratio':ratio})
          finally:
              for p in (base,cand):p.terminate();p.wait()
          out={'median_nps_ratio':statistics.median(ratios),'rows':rows}
          Path('results/throughput.json').write_text(json.dumps(out,indent=2)+'\n');print('FINAL',out)
          PY

      - name: Run 96 fresh colour-swapped equal-node games
        shell: bash
        run: |
          set -euo pipefail
          python -u tools/v14_fixed_node_arena.py /tmp/cand /tmp/base \
            --nodes 16000 --pairs 48 --opening-offset 0 --max-plies 220 \
            --opening-file /tmp/searchv2-48.epd --json-out results/arena.json \
            | tee results/arena.log
          grep '^FINAL ' results/arena.log

      - name: Record candidate identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sha256sum /tmp/cand/experiments/numba_search.py > results/candidate-search.sha256 || true
          cat > results/evidence.txt <<'EOF'
          candidate=Python V15 coherent Search-v2 main+continuation history + history-conditioned LMR
          control=exact packaged V14 artifact from run 34214504775
          main_history=2x384 int16
          continuation_history=384x384 int16
          lmr_thresholds=+4096,-4096
          history_limit=16384
          history_max_update=2048
          training=quiet scout-node evidence only
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-python-searchv2-history-${{ github.sha }}
          path: results/
          retention-days: 30
