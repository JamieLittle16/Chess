name: V16 qTT depth frontier

on:
  workflow_dispatch:
  push:
    branches: [v16/python-qtt-depth-frontier]
    paths:
      - scripts/patch_v16_qtt_depth_cap.py
      - .github/workflows/v16-python-qtt-depth-frontier.yml

permissions:
  actions: read
  contents: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        cap: [4, 6, 8]
    name: qtt-qply-${{ matrix.cap }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Download accepted qTT head
        uses: actions/download-artifact@v4
        with:
          name: v16-python-v15-qsearch-tt-startup-f32d0bd437ca555b1bd369646f41df2bd1f64aa8
          path: qtt-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34352476810
      - name: Materialize candidate
        shell: bash
        env: {CAP: '${{ matrix.cap }}'}
        run: |
          set -euo pipefail
          ZIP=$(find qtt-artifact -type f -name 'Little-Gambit-V16B-qTT-startup.zip' -print -quit); test -n "$ZIP"
          rm -rf /tmp/control /tmp/candidate results && mkdir -p /tmp/control /tmp/candidate results
          unzip -q "$ZIP" -d /tmp/control; cp -a /tmp/control/. /tmp/candidate/
          python scripts/patch_v16_qtt_depth_cap.py /tmp/candidate/experiments/numba_search.py "$CAP" | tee results/patch.txt
          python -m py_compile /tmp/candidate/agent.py /tmp/candidate/experiments/*.py
          find /tmp/candidate -type d -name __pycache__ -prune -exec rm -rf {} +
          (cd /tmp/candidate && zip -q -9 -r "$GITHUB_WORKSPACE/results/Little-Gambit-V16-qTT-qply-${CAP}.zip" .)
      - name: Cold startup
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cold /tmp/cap-home /tmp/cap-cache /tmp/cap-numba; mkdir /tmp/cold
          unzip -q "results/Little-Gambit-V16-qTT-qply-${{ matrix.cap }}.zip" -d /tmp/cold
          /usr/bin/time -f 'PROCESS_WALL_SECONDS %e\nPROCESS_CPU_SECONDS %U' -o results/cold-process.txt timeout 70s env PYTHONPATH=/tmp/cold HOME=/tmp/cap-home XDG_CACHE_HOME=/tmp/cap-cache NUMBA_CACHE_DIR=/tmp/cap-numba OMP_NUM_THREADS=1 python - <<'PY' >results/cold.txt 2>&1
          import sys,time
          t=time.perf_counter();sys.path.insert(0,'/tmp/cold');import agent
          print('READY_SECONDS',time.perf_counter()-t)
          PY
          cat results/cold-process.txt results/cold.txt
      - name: Build roots
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          rm -rf /tmp/m6;mkdir /tmp/m6;python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]; roots=fresh[4480:4544]
          assert len(roots)==64 and len(set(roots))==64
          Path('/tmp/cap-node.epd').write_text('\n'.join(roots[:32])+'\n');Path('/tmp/cap-clock.epd').write_text('\n'.join(roots[32:])+'\n')
          PY
      - name: Throughput
        shell: bash
        run: |
          cat >/tmp/b.py <<'PY'
          import statistics,time,chess,numpy as np,agent
          from experiments.numba_core import encode_position
          from experiments.numba_search import iterative_search_stateful_timed_cached
          fs=[chess.STARTING_FEN,'r2q1rk1/pp2bppp/2n1pn2/2pp4/8/1PN1PN2/PBPP1PPP/R2QKB1R w KQ - 2 9','2r3k1/4qp2/4b3/p5p1/4P1P1/2Pr2P1/P4PB1/R1Q2RK1 w - - 1 23'];v=[]
          for fen in fs:
           b=chess.Board(fen);e=encode_position(b);h=np.empty(0,dtype=np.uint64);agent._HASH_KEYS.fill(0);agent._HASH_MOVES.fill(-1);agent._TT_TABLE.fill(0);t=time.perf_counter();r=iterative_search_stateful_timed_cached(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,60000,60000,200000,agent._HASH_KEYS,agent._HASH_MOVES,agent._TT_TABLE);v.append(int(r[3])/(time.perf_counter()-t))
          print('MEDIAN_NPS',statistics.median(v))
          PY
          (cd /tmp/control && PYTHONPATH=/tmp/control python /tmp/b.py)|tee results/control-nps.txt
          (cd /tmp/candidate && PYTHONPATH=/tmp/candidate python /tmp/b.py)|tee results/candidate-nps.txt
          python - <<'PY'|tee results/throughput.txt
          import re,pathlib
          f=lambda p:float(re.search(r'MEDIAN_NPS ([0-9.eE+-]+)',pathlib.Path(p).read_text()).group(1));a=f('results/control-nps.txt');b=f('results/candidate-nps.txt');print('NPS_RATIO',b/a)
          PY
      - name: 64-game equal-node
        run: python -u tools/v14_fixed_node_arena.py /tmp/candidate /tmp/control --nodes 20000 --pairs 32 --opening-file /tmp/cap-node.epd --max-plies 220 --json-out results/equal-node.json | tee results/equal-node.log
      - name: 64-game timed
        run: python -u scripts/v15_competition_gate.py --control /tmp/control --candidate /tmp/candidate --openings /tmp/cap-clock.epd --output results/timed.json --label 'V16 qTT qply cap ${{ matrix.cap }} vs full qTT' --base-ms 2500 --inc-ms 50 --max-plies 180 --grace-ms 1500 | tee results/timed.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v16-qtt-qply-${{ matrix.cap }}-${{ github.sha }}
          path: results/
          retention-days: 30
