name: V14 lazy stable move ordering

on:
  push:
    branches: [analysis/v14-lazy-stable-ordering-20260908]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact competition runtime
        run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Reconstruct exact V13 control and lazy candidate
        shell: bash
        run: |
          set -euo pipefail
          cat .analysis/v13_chunks_*.b64 | base64 -d > /tmp/v13.zip
          echo '658fd954180c2d0d39c02ba6601af36d06cdbd573bfb72c6879169861a7ad092  /tmp/v13.zip' | sha256sum -c -
          rm -rf /tmp/v13-control /tmp/v14-lazy
          mkdir -p /tmp/v13-control /tmp/v14-lazy
          unzip -q /tmp/v13.zip -d /tmp/v13-control
          unzip -q /tmp/v13.zip -d /tmp/v14-lazy
          for DIR in /tmp/v13-control /tmp/v14-lazy; do
            patch "$DIR/experiments/numba_search.py" < .analysis/v13_jit_refactor.patch
            DIR="$DIR" python - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['DIR']) / 'experiments/numba_search.py'
          s = p.read_text()
          old = '    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          new = '    correction = correction // 6\n    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1))
          PY
            python scripts/patch_v13_legality_context.py "$DIR/experiments/numba_core.py"
            python scripts/patch_v13_qsearch_tactical.py "$DIR/experiments/numba_core.py" "$DIR/experiments/numba_search.py"
          done
          echo '0306e8145a453d91b9b5ac92e9980931510d9e18f8ba598a7548d08b85165c35  /tmp/v13-control/experiments/numba_core.py' | sha256sum -c -
          echo '401f6580028a72361286bd99bee1f0022c74e6c8a65da8acd47448835a1ff360  /tmp/v13-control/experiments/numba_search.py' | sha256sum -c -
          python scripts/patch_v14_lazy_stable_ordering.py /tmp/v14-lazy/experiments/numba_search.py
          python -m py_compile /tmp/v14-lazy/experiments/numba_search.py
          cmp /tmp/v13-control/experiments/numba_core.py /tmp/v14-lazy/experiments/numba_core.py
          cmp /tmp/v13-control/experiments/v13_residual.i16 /tmp/v14-lazy/experiments/v13_residual.i16
          grep -Fq 'def _pick_next_scored_move(' /tmp/v14-lazy/experiments/numba_search.py
      - name: Exhaust stable prefix-order equivalence on synthetic scored buffers
        shell: bash
        run: |
          python - <<'PY'
          import random
          rng = random.Random(14008)
          for n in range(1, 65):
              for _ in range(500):
                  original = [(rng.randrange(12), i) for i in range(n)]
                  expected = sorted(original, key=lambda item: -item[0])
                  lazy = original[:]
                  for index in range(n):
                      best = index
                      for candidate in range(index + 1, n):
                          if lazy[candidate][0] > lazy[best][0]:
                              best = candidate
                      if best != index:
                          item = lazy[best]
                          lazy[index + 1 : best + 1] = lazy[index:best]
                          lazy[index] = item
                  assert lazy == expected, (n, original, lazy, expected)
          print('stable lazy ordering equivalence: green')
          PY
      - name: Exact fixed-node signatures and throughput
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v14-lazy-results
          cat >/tmp/lazy_worker.py <<'PY'
          import json, sys, time
          import chess
          import numpy as np
          from experiments.numba_core import encode_position
          from experiments.numba_search import iterative_search_stateful
          for line in sys.stdin:
              q=json.loads(line); b=chess.Board(q['fen']); e=encode_position(b)
              h=np.empty(0,dtype=np.uint64); t0=time.perf_counter_ns()
              out=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,int(q['nodes']))
              t1=time.perf_counter_ns()
              print(json.dumps({'move':int(out[0]),'score':int(out[1]),'depth':int(out[2]),'nodes':int(out[3]),'ns':t1-t0}),flush=True)
          PY
          python - <<'PY'
          import json, os, statistics, subprocess, sys
          from pathlib import Path
          roots=[x.strip() for x in open('match/openings/m3-uho-lichess-100-v1.epd') if x.strip()][:40]
          NODES=50000; REPS=3
          def start(path):
              env=os.environ.copy(); env['PYTHONPATH']=path
              return subprocess.Popen([sys.executable,'/tmp/lazy_worker.py'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env=env)
          def ask(p,fen):
              p.stdin.write(json.dumps({'fen':fen,'nodes':NODES})+'\n'); p.stdin.flush(); return json.loads(p.stdout.readline())
          base=start('/tmp/v13-control'); cand=start('/tmp/v14-lazy'); ratios=[]; rows=[]
          try:
              # JIT warmup is excluded.
              ask(base,roots[0]); ask(cand,roots[0])
              for rep in range(REPS):
                  bn=bt=cn=ct=0
                  for fen in roots:
                      if rep & 1: c=ask(cand,fen); b=ask(base,fen)
                      else: b=ask(base,fen); c=ask(cand,fen)
                      bs=(b['move'],b['score'],b['depth'],b['nodes']); cs=(c['move'],c['score'],c['depth'],c['nodes'])
                      assert bs == cs, (rep,fen,bs,cs)
                      bn+=b['nodes']; bt+=b['ns']; cn+=c['nodes']; ct+=c['ns']
                  bps=bn/(bt/1e9); cps=cn/(ct/1e9); ratio=cps/bps; ratios.append(ratio)
                  row={'rep':rep,'base_nps':bps,'candidate_nps':cps,'ratio':ratio}; rows.append(row); print(row)
          finally:
              for p in (base,cand): p.terminate(); p.wait()
          summary={'candidate':'lazy stable prefix ordering','control':'exact-final-V13','positions':len(roots),'nodes_per_position':NODES,'repetitions':REPS,'exact_signatures':True,'ratios':ratios,'median_nps_ratio':statistics.median(ratios),'rep_data':rows}
          print(json.dumps(summary,indent=2)); Path('v14-lazy-results/throughput.json').write_text(json.dumps(summary,indent=2))
          # Reject catastrophic slowdowns immediately; promotion still requires separate strength evidence.
          assert summary['median_nps_ratio'] >= 0.90, summary
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v14-lazy-stable-ordering-${{ github.sha }}
          path: v14-lazy-results/
          retention-days: 30
