name: V15 Python Gestalt H32 runtime

on:
  push:
    branches: [analysis/v15-python-gestalt-h32-runtime-20260908]
    paths:
      - .github/workflows/v15-python-gestalt-h32-runtime.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Download exact packaged V14
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - name: Download Gestalt H32 student
        uses: actions/download-artifact@v4
        with:
          name: v15-gestalt-student-h32-c3331960a207e4bb10e13252d62be27788d6af5d
          path: model-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34266694827
      - name: Materialize qcap6 control and Gestalt-H32 candidate
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name 'Little-Gambit-V14.zip' -print -quit)
          MODEL=$(find model-artifact -type f -name 'bucket-h32.npz' -print -quit)
          test -n "$ZIP"; test -n "$MODEL"
          rm -rf /tmp/control /tmp/candidate /tmp/m6 results
          mkdir -p /tmp/control /tmp/candidate /tmp/m6 results
          unzip -q "$ZIP" -d /tmp/control; cp -a /tmp/control/. /tmp/candidate/
          sed -i 's/^MAX_QPLY = 10$/MAX_QPLY = 6/' /tmp/control/experiments/numba_search.py
          sed -i 's/^MAX_QPLY = 10$/MAX_QPLY = 6/' /tmp/candidate/experiments/numba_search.py
          cp "$MODEL" /tmp/candidate/experiments/v15_bucket_student.npz
          python scripts/patch_v15_python_bucket_student_runtime.py /tmp/candidate/experiments/numba_search.py 32
          python -m py_compile /tmp/control/agent.py /tmp/control/experiments/*.py /tmp/candidate/agent.py /tmp/candidate/experiments/*.py
          PYTHONPATH=/tmp/candidate python - <<'PY'
          import chess,numpy as np
          from experiments.numba_core import encode_position,move_to_uci
          from experiments.numba_search import iterative_search_stateful,EVAL_WIDTH
          b=chess.Board();e=encode_position(b);h=np.empty(0,dtype=np.uint64)
          o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,4000)
          assert chess.Move.from_uci(move_to_uci(int(o[0]))) in b.legal_moves
          print('smoke',tuple(int(x) for x in o[:4]),'eval_width',EVAL_WIDTH)
          PY
      - name: Build disjoint qualification roots
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old];chosen=fresh[4248:4296]
          assert len(chosen)==48 and len(set(chosen))==48
          Path('/tmp/gestalt-h32-48.epd').write_text('\n'.join(chosen)+'\n')
          Path('/tmp/gestalt-h32-timed-32.epd').write_text('\n'.join(chosen[:32])+'\n')
          PY
      - name: Throughput screen
        shell: bash
        run: |
          cat >/tmp/worker.py <<'PY'
          import json,sys,chess,numpy as np
          from experiments.numba_core import encode_position
          from experiments.numba_search import iterative_search_stateful
          for line in sys.stdin:
              q=json.loads(line);b=chess.Board(q['fen']);e=encode_position(b);h=np.empty(0,dtype=np.uint64)
              o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,int(q['nodes']))
              print(json.dumps({'nodes':int(o[3]),'depth':int(o[2])}),flush=True)
          PY
          python - <<'PY'
          import json,os,statistics,subprocess,sys,time
          from pathlib import Path
          roots=[x.strip() for x in Path('/tmp/gestalt-h32-48.epd').read_text().splitlines() if x.strip()][:16]
          def start(d):
              e=os.environ.copy();e['PYTHONPATH']=d;return subprocess.Popen([sys.executable,'/tmp/worker.py'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env=e)
          def one(p,fen,n):p.stdin.write(json.dumps({'fen':fen,'nodes':n})+'\n');p.stdin.flush();return json.loads(p.stdout.readline())
          def timed(p,order):
              nodes=0;ds=[];t=time.perf_counter()
              for fen in order:
                  z=one(p,fen,25000);nodes+=z['nodes'];ds.append(z['depth'])
              return nodes/(time.perf_counter()-t),sum(ds)/len(ds)
          b=start('/tmp/control');c=start('/tmp/candidate');rat=[];rows=[]
          try:
              one(b,roots[0],500);one(c,roots[0],500)
              for r in range(3):
                  order=roots if r%2==0 else list(reversed(roots))
                  if r%2==0:bn,bd=timed(b,order);cn,cd=timed(c,order)
                  else:cn,cd=timed(c,order);bn,bd=timed(b,order)
                  rat.append(cn/bn);rows.append({'rep':r,'ratio':cn/bn,'control_depth':bd,'candidate_depth':cd})
          finally:b.terminate();c.terminate();b.wait();c.wait()
          out={'median_nps_ratio':statistics.median(rat),'rows':rows};Path('results/throughput.json').write_text(json.dumps(out,indent=2)+'\n');print('FINAL',out)
          PY
      - name: Equal-node 96-game gate
        run: python -u tools/v14_fixed_node_arena.py /tmp/candidate /tmp/control --nodes 18000 --pairs 48 --opening-file /tmp/gestalt-h32-48.epd --opening-offset 0 --max-plies 220 --json-out results/equal-node.json | tee results/equal-node.log
      - name: Competition-clock 64-game gate
        run: python -u scripts/v15_competition_gate.py --control /tmp/control --candidate /tmp/candidate --openings /tmp/gestalt-h32-timed-32.epd --output results/timed.json --label 'qcap6+Gestalt-H32 vs qcap6' --base-ms 2500 --inc-ms 50 --max-plies 180 | tee results/timed.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-python-gestalt-h32-runtime-${{ github.sha }}
          path: results/
          retention-days: 30
