name: V15 Python verified LMR sweep

on:
  push:
    branches: [analysis/v15-python-lmr-sweep-20260908]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  screen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: mild, d1: 3, m1: 4, d2: 5, m2: 8, d3: 8, m3: 12}
          - {id: balanced, d1: 3, m1: 3, d2: 5, m2: 7, d3: 8, m3: 10}
          - {id: deeper, d1: 3, m1: 4, d2: 5, m2: 7, d3: 7, m3: 10}
          - {id: tail, d1: 3, m1: 5, d2: 5, m2: 8, d3: 7, m3: 11}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - name: Materialize exact A/B and smoke
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name 'Little-Gambit-V14.zip' -print -quit);test -n "$ZIP"
          rm -rf /tmp/base /tmp/cand;mkdir -p /tmp/base /tmp/cand results
          unzip -q "$ZIP" -d /tmp/base;cp -a /tmp/base/. /tmp/cand/
          python scripts/patch_v15_python_lmr_schedule.py /tmp/cand/experiments/numba_search.py ${{ matrix.d1 }} ${{ matrix.m1 }} ${{ matrix.d2 }} ${{ matrix.m2 }} ${{ matrix.d3 }} ${{ matrix.m3 }}
          python -m py_compile /tmp/cand/experiments/numba_search.py
          PYTHONPATH=/tmp/cand python - <<'PY'
          import chess,numpy as np
          from experiments.numba_core import encode_position,move_to_uci
          from experiments.numba_search import iterative_search_stateful
          b=chess.Board();e=encode_position(b);h=np.empty(0,dtype=np.uint64);o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,5000);assert chess.Move.from_uci(move_to_uci(int(o[0]))) in b.legal_moves;print(o)
          PY
      - name: Build fresh roots
        shell: bash
        run: |
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip'|sha256sum --check --strict
          rm -rf /tmp/m6;mkdir /tmp/m6;python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')};large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()];fresh=[x for x in large if x not in old];chosen=fresh[992:1024];assert len(chosen)==32;Path('/tmp/lmr-32.epd').write_text('\n'.join(chosen)+'\n')
          PY
      - name: 64-game equal-node screen
        run: python -u tools/v14_fixed_node_arena.py /tmp/cand /tmp/base --nodes 16000 --pairs 32 --opening-file /tmp/lmr-32.epd --max-plies 220 --json-out results/arena.json | tee results/arena.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-python-lmr-${{ matrix.id }}-${{ github.sha }}
          path: results/
          retention-days: 30
