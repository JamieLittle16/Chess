name: M6 v14 no-shallow-futility screen

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  no-shallow-futility:
    if: github.head_ref == 'm6/v14-history-lmr-no-shallow-futility'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      RUSTFLAGS: -C target-cpu=native
      PRODUCTION_BASE: f6ac75d644b844fabf35195d6054703e68bcc60f
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Build reference and materialize candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qualification/bin .qualification/v14-no-futility
          git worktree add --detach /tmp/chess-reference "$PRODUCTION_BASE"
          CARGO_TARGET_DIR=/tmp/chess-reference-target cargo build --release -p chess-uci --manifest-path /tmp/chess-reference/Cargo.toml
          cp /tmp/chess-reference-target/release/chess-uci .qualification/bin/reference
          python scripts/apply_history_v2_probe.py --variant history-lmr
          python scripts/apply_v14_no_shallow_futility_probe.py
          cargo fmt --all
          git diff --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --release --exclude chess-bench
          cargo test -p chess-bench --release tests::suite_is_deterministic_within_the_same_build
          cargo build --release -p chess-uci
          cp target/release/chess-uci .qualification/bin/candidate
          chmod +x .qualification/bin/*

      - name: Pin network openings and Fastchess
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 'https://github.com/cosmobobak/viridithas-networks/releases/download/v85/gestalt-b840.nnue' --output .qualification/v14-no-futility/gestalt-b840.nnue
          echo '956a6afcce5de1cdbc953ae3817ff760f3e6036441f34dcd524d6e2e7d0e71f6  .qualification/v14-no-futility/gestalt-b840.nnue' | sha256sum --check --strict
          curl --fail --location --retry 5 'https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip' --output /tmp/uho.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          mkdir -p .qualification/m6-openings
          python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir .qualification/m6-openings
          echo '5445819229270140036023a507c41edffc9307ac2cca1ca2efd20e1ddb8d670e  .qualification/m6-openings/m6-uho-lichess-5000-v1.epd' | sha256sum --check --strict
          git clone --quiet https://github.com/Disservin/fastchess.git .qualification/fastchess-src
          git -C .qualification/fastchess-src checkout --quiet f618e34540f94f4719ad3817950618dabe441318
          make -C .qualification/fastchess-src -j2
          ROOT="$PWD"; mkdir -p .qualification/launchers
          printf '#!/usr/bin/env bash\nexport CHESS_GESTALT_NETWORK=%q\nexec %q\n' "$ROOT/.qualification/v14-no-futility/gestalt-b840.nnue" "$ROOT/.qualification/bin/candidate" > .qualification/launchers/candidate.sh
          printf '#!/usr/bin/env bash\nexport CHESS_GESTALT_NETWORK=%q\nexec %q\n' "$ROOT/.qualification/v14-no-futility/gestalt-b840.nnue" "$ROOT/.qualification/bin/reference" > .qualification/launchers/reference.sh
          chmod +x .qualification/launchers/*.sh

      - name: Run fixed-node screen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qualification/v14-no-futility/fixed
          .qualification/fastchess-src/fastchess \
            -engine cmd="$PWD/.qualification/launchers/candidate.sh" name=no-futility nodes=25000 option.Hash=32 \
            -engine cmd="$PWD/.qualification/launchers/reference.sh" name=production nodes=25000 option.Hash=32 \
            -openings file="$PWD/.qualification/m6-openings/m6-uho-lichess-5000-v1.epd" format=epd order=random \
            -srand 20261215 -rounds 50 -repeat -concurrency 1 -maxmoves 300 -ratinginterval 20 \
            -pgnout file=.qualification/v14-no-futility/fixed/games.pgn notation=uci append=false nodes=true nps=true \
            | tee .qualification/v14-no-futility/fixed/stdout.log
          python scripts/analyze_fastchess_node_times.py .qualification/v14-no-futility/fixed/games.pgn --output .qualification/v14-no-futility/fixed/times.json

      - name: Run equal-time screen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qualification/v14-no-futility/time
          .qualification/fastchess-src/fastchess \
            -engine cmd="$PWD/.qualification/launchers/candidate.sh" name=no-futility option.Hash=32 \
            -engine cmd="$PWD/.qualification/launchers/reference.sh" name=production option.Hash=32 \
            -each proto=uci tc=1+0.01 \
            -openings file="$PWD/.qualification/m6-openings/m6-uho-lichess-5000-v1.epd" format=epd order=random \
            -srand 20261216 -rounds 50 -repeat -concurrency 1 -maxmoves 300 -ratinginterval 20 \
            -pgnout file=.qualification/v14-no-futility/time/games.pgn notation=uci append=false nodes=true nps=true \
            | tee .qualification/v14-no-futility/time/stdout.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6-v14-no-shallow-futility-${{ github.sha }}
          path: .qualification/v14-no-futility/
          retention-days: 30
