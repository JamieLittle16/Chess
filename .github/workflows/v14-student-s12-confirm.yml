name: V14 H64 student 1/12 fresh confirmation

on:
  push:
    branches: [analysis/v14-student-s12-confirm-20260908]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact competition runtime
        run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0

      - name: Download exact trained H64 artifact
        uses: actions/download-artifact@v4
        with:
          name: v14-single-student-h64-bb7d2a4ed05ff78d344cc4374d54e35189584993
          path: model-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34202820525

      - name: Reconstruct exact V13 and materialize fixed 1/12 candidate
        shell: bash
        run: |
          set -euo pipefail
          MODEL=$(find model-artifact -type f -name 'student-h64.npz' -print -quit)
          test -n "$MODEL"
          echo '3422cecc3b1226767412e08746ffd6eef9f7e38602ac15b9256b475e6762b598  '"$MODEL" | sha256sum --check --strict
          cat .analysis/v13_chunks_*.b64 | base64 -d > /tmp/v13.zip
          echo '658fd954180c2d0d39c02ba6601af36d06cdbd573bfb72c6879169861a7ad092  /tmp/v13.zip' | sha256sum --check --strict
          rm -rf /tmp/base /tmp/cand && mkdir -p /tmp/base /tmp/cand
          unzip -q /tmp/v13.zip -d /tmp/base
          unzip -q /tmp/v13.zip -d /tmp/cand
          patch /tmp/base/experiments/numba_search.py < .analysis/v13_jit_refactor.patch
          patch /tmp/cand/experiments/numba_search.py < .analysis/v13_jit_refactor.patch
          for DIR in /tmp/base /tmp/cand; do
            DIR="$DIR" python - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['DIR'])/'experiments/numba_search.py'; s=p.read_text()
          old='    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          new='    correction = correction // 6\n    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          assert s.count(old)==1,s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
            python scripts/patch_v13_legality_context.py "$DIR/experiments/numba_core.py"
            python scripts/patch_v13_qsearch_tactical.py "$DIR/experiments/numba_core.py" "$DIR/experiments/numba_search.py"
          done
          echo 'df346b21be42832a0ae97e7faa15953ab460f0387fb0358961651466557ebde8  /tmp/base/agent.py' | sha256sum --check --strict
          echo '0306e8145a453d91b9b5ac92e9980931510d9e18f8ba598a7548d08b85165c35  /tmp/base/experiments/numba_core.py' | sha256sum --check --strict
          echo '401f6580028a72361286bd99bee1f0022c74e6c8a65da8acd47448835a1ff360  /tmp/base/experiments/numba_search.py' | sha256sum --check --strict
          cp experiments/v14_student_single_runtime.py /tmp/cand/experiments/v14_student_single_runtime.py
          cp "$MODEL" /tmp/cand/experiments/v14_student_h64.npz
          python scripts/patch_v14_single_student_search.py /tmp/cand/experiments/numba_search.py --numerator 1 --denominator 12
          python -m py_compile /tmp/base/agent.py /tmp/base/experiments/*.py /tmp/cand/agent.py /tmp/cand/experiments/*.py
          mkdir -p results

      - name: Re-run accumulator oracle
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp/cand python - <<'PY'
          import random
          import chess
          import numpy as np
          from experiments.numba_core import encode_position, generate_legal_moves, move_to_uci
          from experiments.numba_search import EVAL_WIDTH, STUDENT_OFFSET, _advance_eval_state_into, _build_eval_state_into
          rng=random.Random(2026090812); board=chess.Board(); checked=0
          for _ in range(3000):
              if board.is_game_over(claim_draw=False) or board.ply()>160 or rng.random()<0.03:
                  board=chess.Board()
                  for _ in range(rng.randrange(0,30)):
                      legal=list(board.legal_moves)
                      if not legal: break
                      board.push(rng.choice(legal))
              legal=list(board.legal_moves)
              if not legal: continue
              py_move=rng.choice(legal); e=encode_position(board); moves,count=generate_legal_moves(e.board,e.side,e.castling,e.ep_square)
              internal=-1
              for i in range(int(count)):
                  m=int(moves[i])
                  if move_to_uci(m)==py_move.uci(): internal=m; break
              assert internal>=0
              parent=np.empty(EVAL_WIDTH,dtype=np.int32); child=np.empty(EVAL_WIDTH,dtype=np.int32)
              _build_eval_state_into(e.board,parent); _advance_eval_state_into(e.board,e.side,internal,parent,child)
              after=board.copy(stack=False); after.push(py_move); ae=encode_position(after); rebuilt=np.empty(EVAL_WIDTH,dtype=np.int32); _build_eval_state_into(ae.board,rebuilt)
              assert np.array_equal(child[STUDENT_OFFSET:],rebuilt[STUDENT_OFFSET:])
              board.push(py_move); checked+=1
          assert checked>=2800,checked
          print('confirm_accumulator_oracle',checked)
          PY

      - name: Build disjoint official-Stockfish UHO confirmation book
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip \
            https://raw.githubusercontent.com/official-stockfish/books/master/UHO_Lichess_4852_v1.epd.zip
          rm -rf /tmp/uho && mkdir /tmp/uho
          unzip -q /tmp/uho.zip -d /tmp/uho
          UHO=$(find /tmp/uho -type f -name '*.epd' -print -quit)
          test -n "$UHO"
          UHO="$UHO" python - <<'PY'
          import os
          from pathlib import Path
          import chess
          src=Path(os.environ['UHO']).read_text(errors='ignore').splitlines()
          out=[]
          # Stay far away from the first 100 roots used by the repo's pilot book.
          for raw in src[1200:1400]:
              fields=raw.strip().split()
              if len(fields)<4: continue
              fen=' '.join(fields[:4])+' 0 1'
              try: b=chess.Board(fen)
              except ValueError: continue
              if b.is_game_over(claim_draw=False): continue
              out.append(fen)
              if len(out)==48: break
          assert len(out)==48,len(out)
          Path('/tmp/fresh-uho.epd').write_text('\n'.join(out)+'\n')
          print('fresh_uho_positions',len(out),out[0])
          PY

      - name: Fresh 96-game equal-node confirmation
        shell: bash
        run: |
          set -euo pipefail
          python -u tools/v14_fixed_node_arena.py /tmp/cand /tmp/base \
            --nodes 16000 --pairs 48 --opening-offset 0 --max-plies 220 \
            --opening-file /tmp/fresh-uho.epd \
            --json-out results/fresh-arena.json | tee results/fresh-arena.log
          grep '^FINAL ' results/fresh-arena.log

      - name: Rated-game prophylaxis curve candidate versus V13
        shell: bash
        run: |
          set -euo pipefail
          python tools/v14_regression_probe.py \
            --engine /tmp/cand --control /tmp/base \
            --manifest match/regressions/v14-rated-game-1.json \
            --budgets 10000,30000,100000,300000,1000000 \
            --json-out results/rated-game-1-probe.json | tee results/rated-game-1-probe.log

      - name: Broad fresh-category probe
        shell: bash
        run: |
          set -euo pipefail
          python tools/v14_build_probe_corpus.py --openings /tmp/fresh-uho.epd --positions 48 --seed 2026090813 --json-out results/fresh-broad-manifest.json >/dev/null
          python tools/v14_regression_probe.py --engine /tmp/cand --control /tmp/base --manifest results/fresh-broad-manifest.json --budgets 16000 --json-out results/fresh-broad-probe.json | tee results/fresh-broad-probe.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v14-student-s12-confirm-${{ github.sha }}
          path: results/
          retention-days: 30
