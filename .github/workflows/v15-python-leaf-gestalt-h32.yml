name: V15 Python leaf-only Gestalt H32

on:
  push:
    branches:
      - analysis/v15-python-leaf-gestalt-h32-20260909
    paths:
      - .github/workflows/v15-python-leaf-gestalt-h32.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Download exact packaged V14
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - name: Download exact Rust-search-leaf H32 student
        uses: actions/download-artifact@v4
        with:
          name: v15-leaf-gestalt-topology-h32-70736f6f056d42aa8ceee37e0b282e4f02d34556
          path: h32-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34277063353
      - name: Materialize control and leaf-H32 candidate
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name Little-Gambit-V14.zip -print -quit); test -n "$ZIP"
          MODEL=$(find h32-artifact -type f -name gestalt-topology-h32.npz -print -quit); test -n "$MODEL"
          rm -rf /tmp/base /tmp/cand results; mkdir -p /tmp/base /tmp/cand results
          unzip -q "$ZIP" -d /tmp/base; cp -a /tmp/base/. /tmp/cand/
          python scripts/patch_v15_python_presort_once.py /tmp/base/experiments/numba_search.py
          python scripts/patch_v15_python_presort_once.py /tmp/cand/experiments/numba_search.py
          cp "$MODEL" /tmp/cand/experiments/v15_leaf_gestalt_h32.npz
          python - <<'PY'
          from pathlib import Path
          s=Path('scripts/patch_v15_python_leaf_gestalt_h16.py').read_text()
          s=s.replace('v15_leaf_gestalt_h16.npz','v15_leaf_gestalt_h32.npz')
          s=s.replace('LEAF_GESTALT_HIDDEN = 16','LEAF_GESTALT_HIDDEN = 32')
          s=s.replace('H16','H32').replace('h16','h32')
          Path('/tmp/patch_h32.py').write_text(s)
          PY
          python /tmp/patch_h32.py /tmp/cand/experiments/numba_search.py
          python -m py_compile tools/v14_agent_runner.py /tmp/base/agent.py /tmp/cand/agent.py /tmp/base/experiments/*.py /tmp/cand/experiments/*.py
      - name: Build fresh disjoint roots
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          rm -rf /tmp/m6; mkdir /tmp/m6
          python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]
          equal=fresh[3900:3948]; timed=fresh[3950:3982]
          assert len(equal)==48 and len(timed)==32 and not set(equal)&set(timed)
          Path('/tmp/h32-equal.epd').write_text('\n'.join(equal)+'\n')
          Path('/tmp/h32-timed.epd').write_text('\n'.join(timed)+'\n')
          PY
      - name: Hard-regression search probe
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/probe.py <<'PY'
          import chess,json,numpy as np
          from experiments.numba_core import encode_position,move_to_uci
          from experiments.numba_search import iterative_search_stateful
          rows=[]
          for label,fen in [('round61','2r3k1/4qp2/4b3/p5p1/4P1P1/2Pr2P1/P4PB1/R1Q2RK1 w - - 1 23'),('round65a','8/8/3k4/4N1RP/8/3b4/8/6K1 b - - 0 59'),('round65b','8/7b/3k2N1/6RP/8/8/8/6K1 b - - 2 60')]:
              b=chess.Board(fen);e=encode_position(b);h=np.empty(0,dtype=np.uint64)
              for nodes in (300000,1000000):
                  o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,nodes)
                  rows.append({'label':label,'nodes':nodes,'move':move_to_uci(int(o[0])),'score':int(o[1]),'depth':int(o[2]),'searched':int(o[3])})
          print(json.dumps(rows,indent=2))
          PY
          PYTHONPATH=/tmp/base python /tmp/probe.py > results/hard-control.json
          PYTHONPATH=/tmp/cand python /tmp/probe.py > results/hard-candidate.json
          echo CONTROL; cat results/hard-control.json
          echo CANDIDATE; cat results/hard-candidate.json
      - name: 96-game equal-node screen
        run: python -u tools/v14_fixed_node_arena.py /tmp/cand /tmp/base --nodes 26000 --pairs 48 --opening-file /tmp/h32-equal.epd --opening-offset 0 --max-plies 220 --json-out results/equal-node.json | tee results/equal-node.log
      - name: Five-repetition throughput
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/w.py <<'PY'
          import json,sys,chess,numpy as np
          from experiments.numba_core import encode_position
          from experiments.numba_search import iterative_search_stateful
          for line in sys.stdin:
              q=json.loads(line);b=chess.Board(q['fen']);e=encode_position(b);h=np.empty(0,dtype=np.uint64)
              o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,int(q['nodes']))
              print(json.dumps({'nodes':int(o[3]),'depth':int(o[2])}),flush=True)
          PY
          python - <<'PY'
          import json,os,statistics,subprocess,sys,time
          from pathlib import Path
          roots=Path('/tmp/h32-equal.epd').read_text().splitlines()[:20]
          def start(d):
              e=os.environ.copy();e['PYTHONPATH']=d
              return subprocess.Popen([sys.executable,'/tmp/w.py'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env=e)
          def one(p,f,n):p.stdin.write(json.dumps({'fen':f,'nodes':n})+'\n');p.stdin.flush();return json.loads(p.stdout.readline())
          b=start('/tmp/base');c=start('/tmp/cand');rat=[];rows=[]
          try:
              one(b,roots[0],500);one(c,roots[0],500)
              for r in range(5):
                  order=roots if r%2==0 else list(reversed(roots))
                  def timed(p):
                      nodes=0;ds=[];t=time.perf_counter()
                      for f in order:o=one(p,f,35000);nodes+=o['nodes'];ds.append(o['depth'])
                      return nodes/(time.perf_counter()-t),sum(ds)/len(ds)
                  if r%2==0:bn,bd=timed(b);cn,cd=timed(c)
                  else:cn,cd=timed(c);bn,bd=timed(b)
                  rat.append(cn/bn);rows.append({'rep':r,'base_nps':bn,'candidate_nps':cn,'ratio':cn/bn,'base_depth':bd,'candidate_depth':cd})
          finally:b.terminate();c.terminate();b.wait();c.wait()
          out={'median_nps_ratio':statistics.median(rat),'rows':rows};Path('results/throughput.json').write_text(json.dumps(out,indent=2)+'\n');print('FINAL',out)
          PY
      - name: 64-game competition-clock screen
        run: python -u scripts/v15_competition_gate.py --candidate /tmp/cand --control /tmp/base --openings /tmp/h32-timed.epd --output results/timed-64.json --label leaf-gestalt-h32-q0 --base-ms 2500 --inc-ms 50 --max-plies 180 | tee results/timed-64.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-python-leaf-gestalt-h32-${{ github.sha }}
          path: results/
          retention-days: 30
