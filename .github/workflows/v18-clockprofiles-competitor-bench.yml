name: V18 clock-profile competitor benchmark

on:
  push:
    branches: [analysis/v18-clockprofiles-competitor-bench-20260911]
    paths: [.github/workflows/v18-clockprofiles-competitor-bench.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  BENCH_POSITIONS: '48'
  BENCH_NODES: '200000'

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'Ryan Vincent'
            slug: ryan
            profile: DYN7064
            first: '0.70'
            quiet: '0.64'
          - target: 'Emile Andrieu'
            slug: emile
            profile: DYN7064
            first: '0.70'
            quiet: '0.64'
          - target: 'Ryan Vincent'
            slug: ryan
            profile: SOFT6470
            first: '0.64'
            quiet: '0.70'
          - target: 'Emile Andrieu'
            slug: emile
            profile: SOFT6470
            first: '0.64'
            quiet: '0.70'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numba==0.67.0' 'numpy==2.5.2' 'chess==1.11.2'
      - name: Reconstruct frozen corpus
        run: |
          set -euo pipefail
          cat match/benchmarks/top-engine-recent-20260911/chunk_*.b64 | base64 -d | gzip -dc > /tmp/top-engine-recent.pgn
          echo 'dbac26e0f2b451eb7bf80994ca48fdd6b1abbc9f133e528d3e968f007f7aa264  /tmp/top-engine-recent.pgn' | sha256sum -c -
      - name: Reconstruct exact PUNCH133 and patch profile safely
        env:
          FIRST: ${{ matrix.first }}
          QUIET: ${{ matrix.quiet }}
        run: |
          set -euo pipefail
          cat ci/v18_postbook_payload/chunk_*.b64 | base64 -d > /tmp/postbook150.zip
          rm -rf /tmp/engine /tmp/out && mkdir -p /tmp/engine /tmp/out
          unzip -q /tmp/postbook150.zip -d /tmp/engine
          sed -i 's/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.50/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.33/' /tmp/engine/agent.py
          curl --fail --location --retry 5 -sS 'https://raw.githubusercontent.com/michaeldv/donna_opening_books/master/gm2001.bin' -o /tmp/engine/v18_gm2001.bin
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path('/tmp/engine/agent.py');s=p.read_text()
          old='''    soft_fraction = 0.58\n    if board.halfmove_clock >= 12:\n        soft_fraction = 0.64\n'''
          new=f'''    soft_fraction = {os.environ["FIRST"]}\n    if board.halfmove_clock >= 12:\n        soft_fraction = {os.environ["QUIET"]}\n'''
          assert s.count(old)==1
          s=s.replace(old,new,1);p.write_text(s)
          lines=[ln.strip() for ln in s.splitlines() if 'soft_fraction =' in ln]
          print('PROFILE_LINES',lines[:2]);assert lines[:2]==[f'soft_fraction = {os.environ["FIRST"]}',f'soft_fraction = {os.environ["QUIET"]}']
          PY
          test "$(sha256sum /tmp/engine/experiments/numba_search.py | cut -d' ' -f1)" = f74f46499cc0fdef8fba53c2ba77652414463b0a68e7a3fac1e3764f70f94032
      - name: Fetch Stockfish 19
        run: |
          set -euo pipefail
          mkdir -p /tmp/sf
          curl -L --fail --retry 3 -o /tmp/sf.tar.gz https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz
          echo '9defc0d4e55d49c65a6d042f3e571a39fcea499ade6dbe741b53b8c65e03611f  /tmp/sf.tar.gz' | sha256sum -c -
          tar -xzf /tmp/sf.tar.gz -C /tmp/sf
          SF=$(find /tmp/sf -type f -name 'stockfish*' -perm /111 | head -n1); cp "$SF" /tmp/stockfish19; chmod +x /tmp/stockfish19
      - name: Score ${{ matrix.profile }} against ${{ matrix.target }}
        run: |
          python scripts/v18_competitor_move_benchmark.py \
            --pgn /tmp/top-engine-recent.pgn \
            --engine-dir /tmp/engine \
            --stockfish /tmp/stockfish19 \
            --target '${{ matrix.target }}' \
            --positions "$BENCH_POSITIONS" --nodes "$BENCH_NODES" \
            --threads 1 --hash-mb 64 --pairwise-margin-cp 8 --seed 20260911 \
            --output-dir /tmp/out
          echo RESULT_BEGIN
          cat /tmp/out/summary.json
          echo RESULT_END
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.profile }}-${{ matrix.slug }}-benchmark
          path: /tmp/out
          retention-days: 7
