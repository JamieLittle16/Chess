name: V18 BIAS90 agreed-direct qualification
on:
  push:
    branches: [analysis/v18-bias90-agree-direct-20260910]
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q 'numba==0.67.0' 'numpy==2.5.2' 'chess==1.11.2'
      - uses: actions/download-artifact@v4
        with:
          name: v18-two-corpus-agree-d5d93c875cf55bba2e5ede93bedad1c3b2462b60
          path: /tmp/agreed
          repository: JamieLittle16/Chess
          run-id: 34522551188
          github-token: ${{ github.token }}
      - name: Build exact BIAS90 A/B and agreed-direct candidate
        run: |
          set -euo pipefail
          cat ci/v18_postbook_payload/chunk_*.b64 | base64 -d > /tmp/p150.zip
          for d in /tmp/base /tmp/cand; do
            rm -rf "$d"; mkdir "$d"; unzip -q /tmp/p150.zip -d "$d"
            sed -i 's/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.50/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.33/' "$d/agent.py"
            sed -i 's/RESIDUAL_BIAS = 61/RESIDUAL_BIAS = 90/' "$d/experiments/numba_search.py"
            curl --fail --location --retry 5 -sS 'https://raw.githubusercontent.com/michaeldv/donna_opening_books/master/gm2001.bin' -o "$d/v18_gm2001.bin"
          done
          cp /tmp/agreed/two-corpus-agree-direct.bin /tmp/cand/v18_two_corpus_agree.bin
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/cand/agent.py');s=p.read_text()
          anchor='_BOOK_READER = chess.polyglot.open_reader(_BOOK_PATH)\n'
          insert='''_BOOK_READER = chess.polyglot.open_reader(_BOOK_PATH)\n_AGREE_BOOK_PATH = Path(__file__).with_name("v18_two_corpus_agree.bin")\nif not _AGREE_BOOK_PATH.is_file():\n    raise ValueError("missing V18 two-corpus agreement book")\n_AGREE_BOOK_READER = chess.polyglot.open_reader(_AGREE_BOOK_PATH)\n'''
          assert s.count(anchor)==1
          s=s.replace(anchor,insert,1)
          anchor2='def _internal_move_from_chess(board: chess.Board, move: chess.Move) -> int:\n'
          helper='''def _two_corpus_agree_move(board: chess.Board) -> chess.Move | None:\n    """Direct-play only a move independently agreed by the GM and 2026 master corpora."""\n    if board.ply() > _BOOK_DIRECT_MAX_PLY:\n        return None\n    best_entry = None\n    try:\n        for entry in _AGREE_BOOK_READER.find_all(board):\n            move = entry.move\n            if move not in board.legal_moves or int(entry.weight) <= 0:\n                continue\n            if best_entry is None or int(entry.weight) > int(best_entry.weight):\n                best_entry = entry\n    except (IndexError, ValueError):\n        return None\n    return None if best_entry is None else best_entry.move\n\n\n'''+anchor2
          assert s.count(anchor2)==1
          s=s.replace(anchor2,helper,1)
          anchor3='    direct_book_move = _high_confidence_book_move(board)\n    if direct_book_move is not None:\n'
          repl3='    direct_book_move = _high_confidence_book_move(board)\n    if direct_book_move is None:\n        direct_book_move = _two_corpus_agree_move(board)\n    if direct_book_move is not None:\n'
          assert s.count(anchor3)==1
          s=s.replace(anchor3,repl3,1)
          p.write_text(s)
          PY
          python -m py_compile /tmp/base/agent.py /tmp/cand/agent.py /tmp/base/experiments/*.py /tmp/cand/experiments/*.py
          sha256sum /tmp/agreed/two-corpus-agree-direct.bin /tmp/cand/v18_two_corpus_agree.bin
      - name: Root coverage audit
        run: |
          cat >/tmp/bookcov.py <<'PY'
          import sys,chess
          from pathlib import Path
          sys.path.insert(0,sys.argv[1]);import agent
          lines=[x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')]
          strict=extra=0; rows=[]
          for i,line in enumerate(lines):
            b=chess.Board(line); m=agent._high_confidence_book_move(b)
            x=None if m is not None or not hasattr(agent,'_two_corpus_agree_move') else agent._two_corpus_agree_move(b)
            strict += m is not None; extra += x is not None
            if x is not None: rows.append((i,b.ply(),x.uci()))
          print('STRICT_ROOTS',strict,'EXTRA_ROOTS',extra,'TOTAL',len(lines));print('EXTRA_ROWS',rows)
          PY
          python /tmp/bookcov.py /tmp/base
          python /tmp/bookcov.py /tmp/cand
      - name: 32-game paired timed A/B
        run: |
          cat >/tmp/worker.py <<'PY'
          import sys,json,contextlib,numpy as np
          with contextlib.redirect_stdout(sys.stderr): import agent
          def reset():
            agent._GAME_KEYS.clear();agent._PENDING_AFTER_OUR_MOVE=None;agent._LAST_CALL_TIME_LEFT_MS=None;agent._LAST_GET_MOVE_ELAPSED_MS=None
            agent._CLOCK_OVERHEAD_EMA_MS=40.0;agent._CLOCK_FEEDBACK_SAMPLES=0
            if hasattr(agent,'_BOOK_POST_SEARCH_BOOSTS'):agent._BOOK_POST_SEARCH_BOOSTS=0
            agent._HASH_KEYS.fill(np.uint64(0));agent._HASH_MOVES.fill(np.int32(-1));agent._TT_TABLE.fill(np.uint64(0));agent._QUIET_HISTORY.fill(np.int16(0))
          for line in sys.stdin:
            try:
              q=json.loads(line)
              if q['op']=='reset': reset(); ans={'ok':True}
              else: ans={'move':agent.get_move(q['fen'],int(q['ms']))}
            except Exception as e: ans={'error':type(e).__name__+': '+str(e)}
            print(json.dumps(ans),flush=True)
          PY
          cat >/tmp/match.py <<'PY'
          import subprocess,sys,json,time,random,math,chess,os
          from pathlib import Path
          class W:
            def __init__(self,d):self.p=subprocess.Popen([sys.executable,'/tmp/worker.py'],cwd=d,stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env={**os.environ,'PYTHONPATH':d})
            def ask(self,q):
              self.p.stdin.write(json.dumps(q)+'\n');self.p.stdin.flush();r=json.loads(self.p.stdout.readline())
              if 'error' in r:raise RuntimeError(r['error'])
              return r
            def reset(self):self.ask({'op':'reset'})
            def close(self):self.p.terminate();self.p.wait(timeout=5)
          B=5.0;I=.05;PAIRS=16
          opens=[x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')]
          random.Random(18092026).shuffle(opens);opens=opens[:PAIRS]
          base=W('/tmp/base');cand=W('/tmp/cand');pts=[];fails=[]
          try:
            for pi,fen in enumerate(opens):
              for leg in range(2):
                base.reset();cand.reset();bd=chess.Board(fen);clock={'base':B,'cand':B};cw=(leg==0);failure=None
                for _ in range(300):
                  if bd.outcome(claim_draw=True):break
                  side='cand' if bd.turn==cw else 'base';w=cand if side=='cand' else base
                  t=time.perf_counter();r=w.ask({'op':'move','fen':bd.fen(),'ms':max(1,round(clock[side]*1000))});clock[side]-=time.perf_counter()-t
                  if clock[side]<0:failure=side+' flag';break
                  m=chess.Move.from_uci(r['move'])
                  if m not in bd.legal_moves:failure=side+' illegal '+r['move'];break
                  bd.push(m);clock[side]+=I
                out=bd.outcome(claim_draw=True)
                cp=(0. if failure and failure.startswith('cand') else 1.) if failure else (.5 if out is None or out.winner is None else (1. if out.winner==cw else 0.))
                pts.append(cp)
                if failure:fails.append((pi,leg,failure))
                print('GAME',len(pts),'POINT',cp,'TOTAL',sum(pts),flush=True)
          finally:base.close();cand.close()
          p=sum(pts)/len(pts);q=max(1e-6,min(1-1e-6,p));elo=400*math.log10(q/(1-q))
          print('FINAL games',len(pts),'points',sum(pts),'score',p,'REL_ELO',elo,'PAIR_SCORES',[pts[2*i]+pts[2*i+1] for i in range(PAIRS)],'FAILURES',fails)
          PY
          python /tmp/match.py
