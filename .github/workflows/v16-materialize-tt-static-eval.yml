name: V16 materialize TT static-eval cache

on:
  push:
    branches: [v16/tt-static-eval-cache]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v16/tt-static-eval-cache
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Apply certified source patch and prove it locally
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_tt_static_eval_cache_probe.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --release

      - name: Replace experiment scaffolding with materialized source
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/apply_tt_static_eval_cache_probe.py
          git rm .github/workflows/v16-tt-static-eval-cache.yml
          git rm .github/workflows/v16-materialize-tt-static-eval.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/chess-search/src/lib.rs
          git commit -m 'feat(v16): reuse cached TT static evaluations'
          git push origin HEAD:v16/tt-static-eval-cache
