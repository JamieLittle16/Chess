name: V18 corrected SOFT6470 A/B

on:
  push:
    branches: [analysis/v18-soft6470-corrected-20260911]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  match:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: '30.0'
            pairs: '8'
            seed: '29092026'
          - base: '60.0'
            pairs: '4'
            seed: '30092026'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q 'numba==0.67.0' 'numpy==2.5.2' 'chess==1.11.2'
      - name: Reconstruct exact baseline and correctly patch 0.64/0.70
        run: |
          set -euo pipefail
          cat ci/v18_postbook_payload/chunk_*.b64 | base64 -d > /tmp/p150.zip
          for d in /tmp/base /tmp/cand; do
            rm -rf "$d"; mkdir "$d"; unzip -q /tmp/p150.zip -d "$d"
            sed -i 's/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.50/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.33/' "$d/agent.py"
            curl --fail --location --retry 5 -sS 'https://raw.githubusercontent.com/michaeldv/donna_opening_books/master/gm2001.bin' -o "$d/v18_gm2001.bin"
          done
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/cand/agent.py');s=p.read_text()
          old='''    soft_fraction = 0.58\n    if board.halfmove_clock >= 12:\n        soft_fraction = 0.64\n'''
          new='''    soft_fraction = 0.64\n    if board.halfmove_clock >= 12:\n        soft_fraction = 0.70\n'''
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1);p.write_text(s)
          lines=[ln.strip() for ln in s.splitlines() if 'soft_fraction =' in ln]
          print('SOFT_LINES',lines)
          assert lines[:2]==['soft_fraction = 0.64','soft_fraction = 0.70'],lines
          assert 'soft_fraction = 0.58' not in s
          PY
          cmp /tmp/base/experiments/numba_search.py /tmp/cand/experiments/numba_search.py
      - name: Paired exact +0.5 games
        env:
          BASE: ${{ matrix.base }}
          PAIRS: ${{ matrix.pairs }}
          SEED: ${{ matrix.seed }}
        run: |
          cat >/tmp/worker.py <<'PY'
          import sys,json,contextlib,numpy as np
          with contextlib.redirect_stdout(sys.stderr): import agent
          def reset():
            agent._GAME_KEYS.clear();agent._PENDING_AFTER_OUR_MOVE=None;agent._LAST_CALL_TIME_LEFT_MS=None;agent._LAST_GET_MOVE_ELAPSED_MS=None
            agent._CLOCK_OVERHEAD_EMA_MS=40.0;agent._CLOCK_FEEDBACK_SAMPLES=0
            if hasattr(agent,'_BOOK_POST_SEARCH_BOOSTS'):agent._BOOK_POST_SEARCH_BOOSTS=0
            agent._HASH_KEYS.fill(np.uint64(0));agent._HASH_MOVES.fill(np.int32(-1));agent._TT_TABLE.fill(np.uint64(0));agent._QUIET_HISTORY.fill(np.int16(0))
          for line in sys.stdin:
            try:
              q=json.loads(line);ans={'ok':True} if q['op']=='reset' and not reset() else {'move':agent.get_move(q['fen'],int(q['ms']))}
            except Exception as e:ans={'error':type(e).__name__+': '+str(e)}
            print(json.dumps(ans),flush=True)
          PY
          cat >/tmp/match.py <<'PY'
          import subprocess,sys,json,time,random,math,chess,os
          from pathlib import Path
          class W:
            def __init__(self,d):self.p=subprocess.Popen([sys.executable,'/tmp/worker.py'],cwd=d,stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env={**os.environ,'PYTHONPATH':d})
            def ask(self,q):
              self.p.stdin.write(json.dumps(q)+'\n');self.p.stdin.flush();r=json.loads(self.p.stdout.readline())
              if 'error' in r:raise RuntimeError(r['error'])
              return r
            def reset(self):self.ask({'op':'reset'})
            def close(self):self.p.terminate();self.p.wait(timeout=5)
          BASE=float(os.environ['BASE']);PAIRS=int(os.environ['PAIRS']);SEED=int(os.environ['SEED']);INC=.5
          opens=[x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')];random.Random(SEED).shuffle(opens);opens=opens[:PAIRS]
          base=W('/tmp/base');cand=W('/tmp/cand');pts=[];fails=[]
          try:
            for pi,fen in enumerate(opens):
              for leg in range(2):
                base.reset();cand.reset();b=chess.Board(fen);cl={'base':BASE,'cand':BASE};cw=(leg==0);fail=None
                for _ in range(300):
                  if b.outcome(claim_draw=True):break
                  side='cand' if b.turn==cw else 'base';w=cand if side=='cand' else base;st=time.perf_counter();r=w.ask({'op':'move','fen':b.fen(),'ms':max(1,round(cl[side]*1000))});cl[side]-=time.perf_counter()-st
                  if cl[side]<0:fail=side+' flag';break
                  m=chess.Move.from_uci(r['move'])
                  if m not in b.legal_moves:fail=side+' illegal';break
                  b.push(m);cl[side]+=INC
                out=b.outcome(claim_draw=True);cp=(0. if fail and fail.startswith('cand') else 1.) if fail else (.5 if out is None or out.winner is None else (1. if out.winner==cw else 0.));pts.append(cp)
                if fail:fails.append((pi,leg,fail));print('GAME',len(pts),'/',2*PAIRS,'POINT',cp,'TOTAL',sum(pts),'CLOCK',cl,'FAIL',fail,flush=True)
          finally:base.close();cand.close()
          p=sum(pts)/len(pts);q=max(1e-6,min(1-1e-6,p));print('FINAL profile=0.64/0.70 base',BASE,'points',sum(pts),'games',len(pts),'score',p,'REL_ELO',400*math.log10(q/(1-q)),'FAILS',fails)
          PY
          python /tmp/match.py
