name: V14 uploaded regression audit

on:
  push:
    branches: [analysis/v14-uploaded-regression-audit-20260908]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact runtime
        run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Download exact H64 model
        uses: actions/download-artifact@v4
        with:
          name: v14-single-student-h64-bb7d2a4ed05ff78d344cc4374d54e35189584993
          path: model-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34202820525
      - name: Materialize exact V13 control and uploaded V14 search
        shell: bash
        run: |
          set -euo pipefail
          MODEL=$(find model-artifact -type f -name 'student-h64.npz' -print -quit);test -n "$MODEL"
          cat .analysis/v13_chunks_*.b64 | base64 -d >/tmp/v13.zip
          echo '658fd954180c2d0d39c02ba6601af36d06cdbd573bfb72c6879169861a7ad092  /tmp/v13.zip' | sha256sum -c -
          rm -rf /tmp/v13 /tmp/v14;mkdir /tmp/v13 /tmp/v14;unzip -q /tmp/v13.zip -d /tmp/v13;unzip -q /tmp/v13.zip -d /tmp/v14
          for DIR in /tmp/v13 /tmp/v14; do
            patch "$DIR/experiments/numba_search.py" < .analysis/v13_jit_refactor.patch
            DIR="$DIR" python - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['DIR'])/'experiments/numba_search.py';s=p.read_text();old='    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into(';new='    correction = correction // 6\n    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into(';assert s.count(old)==1;p.write_text(s.replace(old,new,1))
          PY
            python scripts/patch_v13_legality_context.py "$DIR/experiments/numba_core.py"
            python scripts/patch_v13_qsearch_tactical.py "$DIR/experiments/numba_core.py" "$DIR/experiments/numba_search.py"
          done
          cp "$MODEL" /tmp/v14/experiments/v14_student_h64.npz
          cp experiments/v14_student_single_runtime.py /tmp/v14/experiments/v14_student_single_runtime.py
          python scripts/patch_v14_single_student_search.py /tmp/v14/experiments/numba_search.py --numerator 1 --denominator 12
          python scripts/patch_v14_student_lean_qsearch.py /tmp/v14/experiments/numba_search.py
          python scripts/patch_v14_lazy_stable_ordering.py /tmp/v14/experiments/numba_search.py
          echo '334e026abdcfccb334d835fadd8a9396a9dd3532ff089e029a78768f02444007  /tmp/v14/experiments/numba_search.py' | sha256sum -c -
          echo 'a295826488040e2c2f33974dce461186b7de233b14e518f0b88e26a090d585c0  /tmp/v14/experiments/v14_student_single_runtime.py' | sha256sum -c -
          mkdir -p audit-results
      - name: Build regression manifest
        shell: bash
        run: |
          python - <<'PY'
          import io,json,chess,chess.pgn
          fixtures=[
            {'id':'r61-f3','category':'prophylaxis','fen':'2r3k1/4qp2/4b3/p5p1/4P1P1/2Pr2P1/P4PB1/R1Q2RK1 w - - 1 23','expected_uci':['a1b1']},
            {'id':'r65-bc2','category':'endgame','fen':'8/8/3k4/4N1RP/8/3b4/8/6K1 b - - 0 59','expected_uci':['d3c2']},
            {'id':'r65-kc6','category':'endgame','fen':'8/7b/3k2N1/6RP/8/8/8/6K1 b - - 2 60','expected_uci':['d6c6']},
          ]
          pgn='''[SetUp "1"]\n[FEN "r1bq1rk1/pp1pppbp/2n2np1/2p5/2PP4/2N2NP1/PP2PPBP/R1BQ1RK1 b - - 0 7"]\n\n7... cxd4 8. Nxd4 Nxd4 9. Qxd4 d6 10. Qh4 Rb8 11. Bh6 Bxh6 12. Qxh6 e5 13. e4 a5 14. Rad1 Qe7 15. b3 Rd8 16. h3 Be6 17. f4 exf4 18. Rxf4 Nh5 19. Rf3 b6 20. g4 Ng7 21. Rf2 Qd7 22. Rc1 f5 *'''
          g=chess.pgn.read_game(io.StringIO(pgn));b=g.board()
          for m in g.mainline_moves():
              if b.turn==chess.BLACK and b.fullmove_number in (21,22):
                  fixtures.append({'id':f'r62-ne8-{b.fullmove_number}','category':'defensive-mode','fen':b.fen(),'expected_uci':['g7e8']})
              b.push(m)
          json.dump({'fixtures':fixtures},open('/tmp/manifest.json','w'),indent=2)
          print(json.dumps(fixtures,indent=2))
          PY
      - name: Fixed-node V14 versus V13 regression probe
        shell: bash
        run: |
          python tools/v14_regression_probe.py --engine /tmp/v14 --control /tmp/v13 --manifest /tmp/manifest.json --budgets 300000,1000000,3000000 --json-out audit-results/regressions.json | tee audit-results/regressions.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v14-uploaded-regression-audit-${{ github.sha }}
          path: audit-results/
          retention-days: 7
