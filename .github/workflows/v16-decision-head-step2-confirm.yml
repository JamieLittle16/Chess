name: V16 decision H64 step2 confirmation

on:
  workflow_dispatch:
  push:
    branches: [analysis/v16-search-decision-distill]
    paths:
      - '.github/workflows/v16-decision-head-step2-confirm.yml'

permissions:
  actions: read
  contents: read

jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact competition runtime
        run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Download exact packaged V14
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - name: Download frozen step2 model
        uses: actions/download-artifact@v4
        with:
          name: v16-decision-head-models-0caacb2ab7c9d4402037f5d5294fb89ef04d135a
          path: model-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34294050545
      - name: Materialize accepted history control and step2 candidate
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name Little-Gambit-V14.zip -print -quit); test -n "$ZIP"
          MODEL=$(find model-artifact -type f -name decision-head-step2.npz -print -quit); test -n "$MODEL"
          rm -rf /tmp/control /tmp/candidate results
          mkdir -p /tmp/control /tmp/candidate results
          unzip -q "$ZIP" -d /tmp/control
          python scripts/patch_v16_python_presort_once.py /tmp/control/experiments/numba_search.py
          python scripts/patch_v16_python_trusted_continuity.py /tmp/control/agent.py
          python scripts/patch_v16_python_rust_history.py /tmp/control/experiments/numba_search.py
          cp -a /tmp/control/. /tmp/candidate/
          cp "$MODEL" /tmp/candidate/experiments/v14_student_h64.npz
          python -m py_compile tools/v14_agent_runner.py scripts/v15_competition_gate.py /tmp/control/agent.py /tmp/control/experiments/*.py /tmp/candidate/agent.py /tmp/candidate/experiments/*.py
          python - <<'PY'
          import hashlib
          import numpy as np
          c=np.load('/tmp/control/experiments/v14_student_h64.npz',allow_pickle=False)
          n=np.load('/tmp/candidate/experiments/v14_student_h64.npz',allow_pickle=False)
          assert np.array_equal(c['feature_weights'],n['feature_weights'])
          assert np.array_equal(c['feature_bias'],n['feature_bias'])
          assert np.array_equal(c['output_bias'],n['output_bias'])
          d=n['output_weights'].astype(int)-c['output_weights'].astype(int)
          assert np.max(np.abs(d)) <= 2 and np.any(d != 0)
          print({'changed_lanes':int(np.count_nonzero(d)),'max_abs_step':int(np.max(np.abs(d))),'delta':d.tolist()})
          for p in ['/tmp/control/experiments/v14_student_h64.npz','/tmp/candidate/experiments/v14_student_h64.npz']:
              print(p, hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
      - name: Build unseen confirmation roots
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          rm -rf /tmp/m6; mkdir /tmp/m6
          python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]
          # Deliberately disjoint from decision-corpus roots [500:564], first head
          # qualification [900:980], history qualification [3800:3880], and the
          # large history confirmation [4000:4192].
          chosen=fresh[1400:1496]
          assert len(chosen)==96 and len(set(chosen))==96
          Path('/tmp/step2-confirm-96.epd').write_text('\n'.join(chosen)+'\n')
          PY
      - name: 192-game competition-clock confirmation
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/v15_competition_gate.py \
            --control /tmp/control --candidate /tmp/candidate \
            --openings /tmp/step2-confirm-96.epd \
            --output results/timed-confirm.json \
            --label 'Rust-history + decision-aware H64 step2 confirmation' \
            --base-ms 2500 --inc-ms 50 --max-plies 180 --grace-ms 1500 \
            | tee results/timed-confirm.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v16-decision-head-step2-confirm-${{ github.sha }}
          path: results/
          retention-days: 30
