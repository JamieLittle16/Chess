name: V18 PUNCH133 SEE exact Stockfish 120+0.5 calibration

on:
  push:
    branches: [analysis/v18-punch133-see-stockfish120-20260911]
    paths: ['.github/workflows/v18-punch133-see-stockfish120.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ladder:
    name: SF19 UCI_Elo ${{ matrix.elo }} @ 120+0.5
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        elo: [2050, 2150, 2250, 2350, 2450, 2550]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact competition runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numba==0.67.0' 'numpy==2.5.2' 'chess==1.11.2'
          python - <<'PY'
          import sys, numba, numpy, chess
          print(sys.version)
          print('numba', numba.__version__)
          print('numpy', numpy.__version__)
          print('chess', chess.__version__)
          PY

      - name: Reconstruct and verify exact uploaded PUNCH133 SEE leader
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/engine /tmp/run
          mkdir -p /tmp/engine /tmp/run

          # Rebuild every unchanged file from the frozen PUNCH150 payload, calibrate the
          # post-book multiplier to 1.33, then overlay the exact uploaded SEE search source.
          # The all-file SHA gate below is authoritative; no game is played unless all nine
          # extracted files match the user's uploaded ZIP byte-for-byte.
          cat ci/v18_postbook_payload/chunk_*.b64 | base64 -d > /tmp/p150.zip
          unzip -q /tmp/p150.zip -d /tmp/engine
          sed -i 's/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.50/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.33/' /tmp/engine/agent.py
          cat ci/v18_punch133_see_exact/numba_search.py.gz.b64.* \
            | base64 -d \
            | gzip -dc \
            > /tmp/engine/experiments/numba_search.py
          curl --fail --location --retry 5 -sS \
            'https://raw.githubusercontent.com/michaeldv/donna_opening_books/master/gm2001.bin' \
            -o /tmp/engine/v18_gm2001.bin

          # These are SHA-256 hashes of the user's uploaded
          # Little-Gambit-V18-PUNCH133-SEE-LEADER.zip after extraction.
          cat >/tmp/uploaded-files.sha256 <<'EOF'
          0306e8145a453d91b9b5ac92e9980931510d9e18f8ba598a7548d08b85165c35  /tmp/engine/experiments/numba_core.py
          e38876e2a37193639f9b8b559b02bc064d820c4cdeda44579c9f88e5bd4468b1  /tmp/engine/experiments/v14_student_h64.npz
          7d0fc5f7a186e79317cf12a2ff285d7716c651fbd045c53d65a3cc6eb1b15319  /tmp/engine/experiments/v13_residual.i16
          f2656e69525862a294dbf095c6ceb0ced57da5b37393c3822649fed813ae6ff5  /tmp/engine/experiments/numba_search.py
          cb9540d5ea2a7074ae0c3b5894babecc2fb01de94b102420d8a65e159325ada6  /tmp/engine/experiments/v14_student_single_runtime.py
          6422eb8eb8713e02e6d62d33ef230f37cf707188e864b575226802aead128b2f  /tmp/engine/experiments/__init__.py
          c2cc0534a984124c5a75e250bab65f2756ade47341bbca84d6b6871fdb2977f2  /tmp/engine/v14_kpk.u8
          0ab496524b077f3c8f3778634f46b2bd79ed1c44ad4d89cf96857890396d1424  /tmp/engine/agent.py
          fb6e9f3f27bb19a5b2fdefcc441c88ddeae48db61d5f00ad83973abb9f939c87  /tmp/engine/v18_gm2001.bin
          EOF
          sha256sum -c /tmp/uploaded-files.sha256
          test "$(find /tmp/engine -type f | wc -l)" -eq 9
          grep -q '_START_CLOCK_MS: Final = 120_000.0' /tmp/engine/agent.py
          grep -q '_INCREMENT_MS: Final = 500.0' /tmp/engine/agent.py
          grep -q '_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.33' /tmp/engine/agent.py
          python -m py_compile /tmp/engine/agent.py /tmp/engine/experiments/numba_search.py

          {
            echo 'uploaded_zip_sha256=5f32603b8b5b1c86715ec4830ed4b403d51a1690d81941c5507296d630636be8'
            echo 'engine_numba_search_sha256=f2656e69525862a294dbf095c6ceb0ced57da5b37393c3822649fed813ae6ff5'
            echo 'time_control=120+0.5'
            echo 'runtime=python3.12,numba0.67.0,numpy2.5.2,chess1.11.2'
          } > /tmp/run/provenance.txt

      - name: Fetch and verify Stockfish 19
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sf19
          mkdir -p /tmp/sf19
          curl -L --fail --retry 5 --retry-delay 2 \
            -o /tmp/stockfish-19.tar.gz \
            'https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz'
          echo '9defc0d4e55d49c65a6d042f3e571a39fcea499ade6dbe741b53b8c65e03611f  /tmp/stockfish-19.tar.gz' | sha256sum -c -
          tar -xzf /tmp/stockfish-19.tar.gz -C /tmp/sf19
          SF="$(find /tmp/sf19 -type f -name 'stockfish*' -perm /111 | head -n1)"
          test -n "$SF"
          cp "$SF" /tmp/stockfish19
          chmod +x /tmp/stockfish19
          printf 'uci\nquit\n' | /tmp/stockfish19 | tee /tmp/run/stockfish-uci.txt
          grep -q 'Stockfish 19' /tmp/run/stockfish-uci.txt
          sha256sum /tmp/stockfish19 >> /tmp/run/provenance.txt

      - name: Run paired 120+0.5 calibration rung
        shell: bash
        run: |
          set -euo pipefail
          ELO='${{ matrix.elo }}'
          SEED=$((2026091100 + ELO))
          out="/tmp/run/sf-$ELO"
          python scripts/v18_stockfish_calibration.py \
            --engine-dir /tmp/engine \
            --stockfish /tmp/stockfish19 \
            --openings match/openings/m3-uho-lichess-100-v1.epd \
            --elo "$ELO" \
            --games 16 \
            --tc '120+0.5' \
            --seed "$SEED" \
            --max-plies 600 \
            --output-dir "$out"
          cat "$out/summary.json"

      - name: Upload rung evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: punch133-see-120-sf-${{ matrix.elo }}
          path: /tmp/run
          if-no-files-found: warn
          retention-days: 14

  fit:
    name: Fit PUNCH133 SEE rating @ 120+0.5
    needs: ladder
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download all rung evidence
        uses: actions/download-artifact@v4
        with:
          pattern: punch133-see-120-sf-*
          path: artifacts/rungs

      - name: Fit Stockfish UCI_Elo-equivalent rating
        run: |
          set -euo pipefail
          find artifacts/rungs -name summary.json -print
          test "$(find artifacts/rungs -name summary.json | wc -l)" -eq 6
          python scripts/v18_fit_stockfish_ladder.py \
            --root artifacts/rungs \
            --output artifacts/punch133-see-stockfish120-rating.json \
            --seed 20260911 \
            --bootstrap 20000
          cat artifacts/punch133-see-stockfish120-rating.json

      - name: Upload fitted rating
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: punch133-see-stockfish120-fitted-rating
          path: artifacts/punch133-see-stockfish120-rating.json
          if-no-files-found: warn
          retention-days: 14
