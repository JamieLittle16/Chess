name: M4 eval formatter

on:
  push:
    branches:
      - m4/eval-psqt-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m4/eval-psqt-v1
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt
      - run: cargo fmt --all
      - run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/chess-eval/src/lib.rs
          git diff --cached --check
          git commit -m 'style: format tapered evaluator'
          git push origin HEAD:m4/eval-psqt-v1
