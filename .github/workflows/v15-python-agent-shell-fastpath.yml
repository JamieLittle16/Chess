name: V15 Python agent-shell fastpath qualification

on:
  push:
    branches: [analysis/v15-python-agent-shell-fastpath-20260908]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - name: Materialize exact A/B
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name 'Little-Gambit-V14.zip' -print -quit); test -n "$ZIP"
          rm -rf /tmp/base /tmp/cand; mkdir -p /tmp/base /tmp/cand results
          unzip -q "$ZIP" -d /tmp/base; cp -a /tmp/base/. /tmp/cand/
          python scripts/patch_v15_python_agent_shell_fastpath.py /tmp/cand/agent.py
          python -m py_compile /tmp/base/agent.py /tmp/cand/agent.py /tmp/base/experiments/*.py /tmp/cand/experiments/*.py
          cmp /tmp/base/experiments/numba_search.py /tmp/cand/experiments/numba_search.py
          cmp /tmp/base/experiments/numba_core.py /tmp/cand/experiments/numba_core.py
          diff -u /tmp/base/agent.py /tmp/cand/agent.py > results/agent.patch || true
          test -s results/agent.patch
      - name: Build fresh pinned roots
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          mkdir -p /tmp/m6; python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]; chosen=fresh[688:720]; assert len(chosen)==32
          Path('/tmp/shell-32.epd').write_text('\n'.join(chosen)+'\n')
          PY
      - name: Wrapper micro-cost probe
        shell: bash
        run: |
          python - <<'PY'
          import json,queue,subprocess,sys,threading,time,statistics
          from pathlib import Path
          roots=[x.strip() for x in Path('/tmp/shell-32.epd').read_text().splitlines() if x.strip()][:12]
          class W:
              def __init__(self,d):
                  self.p=subprocess.Popen([sys.executable,'tools/v14_agent_runner.py',d],stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,bufsize=1);self.q=queue.Queue();threading.Thread(target=self.o,daemon=True).start();assert json.loads(self.line(95)).get('ready')
              def o(self):
                  for x in self.p.stdout:self.q.put(x.rstrip())
              def line(self,t):return self.q.get(timeout=t)
              def call(self,fen):
                  self.p.stdin.write('{"reset":true}\n');self.p.stdin.flush();json.loads(self.line(5));t=time.perf_counter();self.p.stdin.write(json.dumps({'fen':fen,'time_left_ms':40})+'\n');self.p.stdin.flush();json.loads(self.line(5));return (time.perf_counter()-t)*1000
              def stop(self):self.p.kill();self.p.wait()
          b=W('/tmp/base');c=W('/tmp/cand')
          try:
              b.call(roots[0]);c.call(roots[0]);br=[];cr=[]
              for _ in range(3):
                  for fen in roots:br.append(b.call(fen))
                  for fen in roots:cr.append(c.call(fen))
              out={'base_median_ms':statistics.median(br),'candidate_median_ms':statistics.median(cr),'ratio':statistics.median(cr)/statistics.median(br)}
              Path('results/microcost.json').write_text(json.dumps(out,indent=2)+'\n');print('FINAL',out)
          finally:b.stop();c.stop()
          PY
      - name: 64 colour-swapped competition-clock games
        shell: bash
        run: |
          python - <<'PY'
          import json,math,queue,subprocess,sys,threading,time
          from collections import Counter,deque
          from pathlib import Path
          import chess
          BASE_MS=2500;INC_MS=50;MAX_PLIES=180;GRACE_MS=1200;opens=[x.strip() for x in Path('/tmp/shell-32.epd').read_text().splitlines() if x.strip()]
          class A:
              def __init__(self,d):
                  self.p=subprocess.Popen([sys.executable,'tools/v14_agent_runner.py',d],stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,bufsize=1);self.q=queue.Queue();self.err=deque(maxlen=80);threading.Thread(target=self.o,daemon=True).start();threading.Thread(target=self.e,daemon=True).start();assert json.loads(self.line(95)).get('ready')
              def o(self):
                  for x in self.p.stdout:self.q.put(x.rstrip())
                  self.q.put(None)
              def e(self):
                  for x in self.p.stderr:self.err.append(x.rstrip())
              def line(self,t):
                  try:x=self.q.get(timeout=t)
                  except queue.Empty as ex:raise RuntimeError('timeout') from ex
                  if x is None:raise RuntimeError('closed '+'\n'.join(self.err))
                  return x
              def reset(self):self.p.stdin.write('{"reset":true}\n');self.p.stdin.flush();assert json.loads(self.line(5)).get('reset')
              def move(self,b,ms):self.p.stdin.write(json.dumps({'fen':b.fen(),'time_left_ms':max(0,int(ms))})+'\n');self.p.stdin.flush();z=json.loads(self.line((max(0,ms)+GRACE_MS)/1000));m=chess.Move.from_uci(z['move']);assert m in b.legal_moves;return m
              def stop(self):
                  if self.p.poll() is None:self.p.kill()
                  self.p.wait(timeout=5)
          base=A('/tmp/base');cand=A('/tmp/cand');rows=[];pairs=[]
          def play(fen,cw):
              b=chess.Board(fen);cl={chess.WHITE:float(BASE_MS),chess.BLACK:float(BASE_MS)};base.reset();cand.reset();tim=[]
              for _ in range(MAX_PLIES):
                  o=b.outcome(claim_draw=True)
                  if o is not None:return (0.5 if o.winner is None else float(o.winner==cw)),b.result(claim_draw=True),tim
                  side=b.turn;use=side==cw;e=cand if use else base;t=time.monotonic()
                  try:m=e.move(b,cl[side])
                  except Exception as ex:return (0.0 if use else 1.0),f'engine-failure:{type(ex).__name__}',tim
                  dt=(time.monotonic()-t)*1000;cl[side]-=dt
                  if cl[side]<0:return (0.0 if use else 1.0),'flag',tim
                  tim.append((use,dt));b.push(m);cl[side]+=INC_MS
              return 0.5,'max-ply-draw',tim
          try:
              for i,fen in enumerate(opens):
                  ps=0.0
                  for cw in (True,False):
                      s,r,t=play(fen,cw);ps+=s;rows.append({'opening':i,'candidate_white':cw,'score':s,'result':r,'candidate_ms':[v for x,v in t if x],'control_ms':[v for x,v in t if not x]});print(i,cw,s,r,flush=True)
                  pairs.append(ps)
          finally:base.stop();cand.stop()
          score=sum(x['score'] for x in rows);n=len(rows);f=score/n;elo=400*math.log10(f/(1-f)) if 0<f<1 else None;ct=[v for x in rows for v in x['candidate_ms']];bt=[v for x in rows for v in x['control_ms']];out={'games':n,'score':score,'score_fraction':f,'naive_elo_from_score':elo,'pair_histogram':dict(Counter(str(x) for x in pairs)),'candidate_mean_move_ms':sum(ct)/max(1,len(ct)),'control_mean_move_ms':sum(bt)/max(1,len(bt)),'details':rows};Path('results/timed.json').write_text(json.dumps(out,indent=2)+'\n');print('FINAL',json.dumps({k:v for k,v in out.items() if k!='details'}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-python-agent-shell-fastpath-${{ github.sha }}
          path: results/
          retention-days: 30
