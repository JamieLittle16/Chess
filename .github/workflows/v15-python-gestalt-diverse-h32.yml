name: V15 Python diverse-root Gestalt H32

on:
  push:
    branches:
      - analysis/v15-python-gestalt-diverse-h32-20260909
    paths:
      - .github/workflows/v15-python-gestalt-diverse-h32.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Download frozen diverse-root Gestalt corpus
        uses: actions/download-artifact@v4
        with:
          name: v15-rust-search-leaf-gestalt-diverse-v2-f3e71161061f78454464ae86c8c9466fa6900872
          path: leaf-v2
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34294631740
      - name: Download exact packaged V14
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - name: Train H32 on the same diverse-root distribution
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name Little-Gambit-V14.zip -print -quit); test -n "$ZIP"
          rm -rf /tmp/v14 results; mkdir -p /tmp/v14 results
          unzip -q "$ZIP" -d /tmp/v14
          python -u scripts/train_v15_gestalt_topology_student.py --teacher leaf-v2/teacher.jsonl --engine-dir /tmp/v14 --output-dir results/h32 --hidden 32 --epochs 36 --batch-size 256 --lr 0.0012 | tee results/h32.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-diverse-leaf-h32-${{ github.sha }}
          path: results/
          retention-days: 30
