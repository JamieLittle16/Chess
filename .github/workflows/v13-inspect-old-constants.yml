name: V13 inspect old residual constants

on:
  push:
    branches:
      - analysis/v13-model-screen-flagship

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and inspect
        shell: bash
        run: |
          set -euo pipefail
          cat .analysis/v13_chunks_*.b64 | base64 -d > /tmp/v13.zip
          unzip -q /tmp/v13.zip -d /tmp/v13
          echo '--- residual-related lines ---'
          grep -n -E 'RESIDUAL|Residual|residual|BIAS|CLAMP|clamp|bias' /tmp/v13/experiments/numba_search.py | head -200
