name: Diagnostic Stockfish 19 binary

on:
  push:
    branches: [diagnostic/v18-gmbook-upload-test]
    paths: ['.github/workflows/diagnostic-stockfish19-binary.yml']

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch exact Stockfish 19 universal binary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 -o /tmp/sf.tar.gz \
            https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz
          echo '9defc0d4e55d49c65a6d042f3e571a39fcea499ade6dbe741b53b8c65e03611f  /tmp/sf.tar.gz' | sha256sum --check --strict
          mkdir stockfish
          tar -xzf /tmp/sf.tar.gz -C stockfish
          BIN=$(find stockfish -type f -name 'stockfish*' -perm -111 -print -quit)
          test -n "$BIN"
          cp "$BIN" stockfish19
          chmod +x stockfish19
          ./stockfish19 bench 1 1 4 default depth >/dev/null
          sha256sum stockfish19
      - uses: actions/upload-artifact@v4
        with:
          name: stockfish19-universal
          path: stockfish19
          retention-days: 1
