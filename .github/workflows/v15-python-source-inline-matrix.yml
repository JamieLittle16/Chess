name: V15 Python source-only inline matrix

on:
  push:
    branches:
      - hotfix/v15-python-startup-cache-20260909
    paths:
      - .github/workflows/v15-python-source-inline-matrix.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - name: opt3-default-inline
            opt: '3'
            inline: default
          - name: opt2-default-inline
            opt: '2'
            inline: default
          - name: opt3-never-inline
            opt: '3'
            inline: never
          - name: opt2-never-inline
            opt: '2'
            inline: never
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Download exact final V15
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V15-FINAL-725be3e8595d1e54b1f12e11f2b9d92f1e415ebc
          path: final-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34298586524
      - name: Materialize candidate
        shell: bash
        env:
          OPT: ${{ matrix.candidate.opt }}
          INLINE_MODE: ${{ matrix.candidate.inline }}
        run: |
          set -euo pipefail
          ZIP=$(find final-artifact -type f -name Little-Gambit-V15.zip -print -quit); test -n "$ZIP"
          rm -rf /tmp/candidate results
          mkdir -p /tmp/candidate results
          unzip -q "$ZIP" -d /tmp/candidate
          python - <<'PY'
          import os
          from pathlib import Path
          agent=Path('/tmp/candidate/agent.py')
          s=agent.read_text()
          needle='import time\n'
          repl=f'import os\nimport time\n\n# Source-only startup qualification.\nos.environ.setdefault("NUMBA_OPT", "{os.environ["OPT"]}")\n'
          assert s.count(needle)==1
          agent.write_text(s.replace(needle,repl,1))
          mode=os.environ['INLINE_MODE']
          changed=0
          for name in ('numba_core.py','numba_search.py','v14_student_single_runtime.py'):
              p=Path('/tmp/candidate/experiments')/name
              x=p.read_text()
              n=x.count(', inline="always"')
              if mode=='default':
                  x=x.replace(', inline="always"','')
              elif mode=='never':
                  x=x.replace('inline="always"','inline="never"')
              else:
                  raise SystemExit(mode)
              changed += n
              p.write_text(x)
          print('INLINE_MODE',mode,'CHANGED',changed)
          PY
          find /tmp/candidate -type d -name __pycache__ -prune -exec rm -rf {} +
          find /tmp/candidate -type f \( -name '*.nbc' -o -name '*.nbi' -o -name '*.so' \) -delete

      - name: Cold import and first move
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/candidate
          /usr/bin/time -f 'PROCESS_WALL_SECONDS %e\nPROCESS_CPU_SECONDS %U' -o "$GITHUB_WORKSPACE/results/process-time.txt" \
            timeout 120s env PYTHONPATH=/tmp/candidate python - <<'PY' > "$GITHUB_WORKSPACE/results/runtime.txt" 2>&1
          import time
          t0=time.perf_counter(); import agent; import chess
          imported=time.perf_counter()-t0
          print('IMPORT_SECONDS',imported)
          fen=chess.STARTING_FEN
          t1=time.perf_counter(); move=agent.get_move(fen,120000); first=time.perf_counter()-t1
          b=chess.Board(fen); assert chess.Move.from_uci(move) in b.legal_moves
          print('FIRST_MOVE_SECONDS',first)
          print('TOTAL_SECONDS',time.perf_counter()-t0)
          print('MOVE',move)
          PY
          cat "$GITHUB_WORKSPACE/results/process-time.txt" "$GITHUB_WORKSPACE/results/runtime.txt"

      - name: Warm move-cost proxy
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/candidate
          timeout 120s env PYTHONPATH=/tmp/candidate python - <<'PY' > "$GITHUB_WORKSPACE/results/runtime-proxy.txt" 2>&1
          import time, chess
          import agent
          fens=[
            chess.STARTING_FEN,
            'r2q1rk1/pp2bppp/2n1pn2/2pp4/8/1PN1PN2/PBPP1PPP/R2QKB1R w KQ - 2 9',
            '2r3k1/4qp2/4b3/p5p1/4P1P1/2Pr2P1/P4PB1/R1Q2RK1 w - - 1 23',
          ]
          t=time.perf_counter(); moves=[agent.get_move(f,80000) for f in fens]; elapsed=time.perf_counter()-t
          print('THREE_MOVE_WALL_SECONDS',elapsed)
          print('MOVES',moves)
          PY
          cat "$GITHUB_WORKSPACE/results/runtime-proxy.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-inline-${{ matrix.candidate.name }}-${{ github.sha }}
          path: results/
          retention-days: 7
