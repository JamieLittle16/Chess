name: V15 Python H64-guided pruning parallel screen

on:
  push:
    branches: [analysis/v15-python-h64-pruning-parallel-20260908]

permissions:
  contents: read
  actions: read

jobs:
  h64:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Download exact packaged V14
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - name: Materialize H64-guided pruning candidate
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name 'Little-Gambit-V14.zip' -print -quit); test -n "$ZIP"
          rm -rf /tmp/base /tmp/h64; mkdir -p /tmp/base /tmp/h64 results
          unzip -q "$ZIP" -d /tmp/base; cp -a /tmp/base/. /tmp/h64/
          python scripts/patch_v15_python_learned_pruning.py h64 /tmp/h64/experiments/numba_search.py
          python -m py_compile /tmp/h64/agent.py /tmp/h64/experiments/*.py
          PYTHONPATH=/tmp/h64 python - <<'PY'
          import chess,numpy as np
          from experiments.numba_core import encode_position,move_to_uci
          from experiments.numba_search import iterative_search_stateful
          b=chess.Board();e=encode_position(b);h=np.empty(0,dtype=np.uint64)
          o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,4000)
          assert chess.Move.from_uci(move_to_uci(int(o[0]))) in b.legal_moves
          print(o)
          PY
      - name: Build disjoint fresh roots
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          mkdir -p /tmp/m6; python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]; chosen=fresh[496:544]
          assert len(chosen)==48 and len(set(chosen))==48
          Path('/tmp/h64-48.epd').write_text('\n'.join(chosen)+'\n')
          PY
          sha256sum /tmp/h64-48.epd | tee results/openings.sha256
      - name: 96-game H64-guided pruning screen
        shell: bash
        run: |
          set -euo pipefail
          python -u tools/v14_fixed_node_arena.py /tmp/h64 /tmp/base --nodes 16000 --pairs 48 \
            --opening-file /tmp/h64-48.epd --opening-offset 0 --max-plies 220 \
            --json-out results/h64-arena.json | tee results/h64-arena.log
          grep '^FINAL ' results/h64-arena.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-python-h64-pruning-parallel-${{ github.sha }}
          path: results/
          retention-days: 30
