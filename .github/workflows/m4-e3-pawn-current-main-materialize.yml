name: M4 E3 pawn structure materialize

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'm4/eval-pawn-structure-v1-current-main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m4/eval-pawn-structure-v1-current-main
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Materialize once
        run: |
          set -euo pipefail
          if grep -q 'PASSED_PAWN_MASKS' crates/chess-eval/src/lib.rs; then
            echo 'E3 already materialized'
            exit 0
          fi
          python3 tools/materialize_e3_pawn_structure.py
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test -p chess-eval --all-features
          cargo test -p chess-search --all-features
          cargo test -p chess-core --all-features
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/chess-eval/src/lib.rs
          git commit -m 'm4: add cheap pawn-structure evaluation'
          git push origin HEAD:m4/eval-pawn-structure-v1-current-main
