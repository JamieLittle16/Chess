name: V16 materialize Hyperstition AVX2

on:
  push:
    branches: [v16/hyperstition-eval-lab]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v16/hyperstition-eval-lab
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Apply qualified safe AVX2 source
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_hyperstition_safe_avx2_probe.py
          cargo fmt --all
          cargo generate-lockfile
          git diff --check

      - name: Portable strict gate
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features --release

      - name: AVX2 strict gate
        shell: bash
        run: |
          set -euo pipefail
          RUSTFLAGS='-C target-cpu=x86-64-v3' \
            cargo clippy --workspace --all-targets --all-features -- -D warnings
          RUSTFLAGS='-C target-cpu=x86-64-v3' \
            cargo test --workspace --all-features --release

      - name: Retire one-shot experiment machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply_hyperstition_safe_avx2_probe.py
          rm -f scripts/apply_hyperstition_sparse_l1_probe.py
          rm -f .github/workflows/v16-hyperstition-safe-avx2.yml
          rm -f .github/workflows/v16-hyperstition-sparse-l1.yml
          rm -f .github/workflows/v16-materialize-hyperstition-avx2.yml

      - name: Commit qualified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'nothing to materialize'; exit 1; }
          git commit -m 'perf(v16): vectorise Hyperstition L1 safely with AVX2'
          git push origin HEAD:v16/hyperstition-eval-lab
