name: V14 restrained H64 student search screen

on:
  push:
    branches: [analysis/v14-single-student-search-20260908]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: s6
            numerator: 1
            denominator: 6
          - label: s8
            numerator: 1
            denominator: 8
          - label: s10
            numerator: 1
            denominator: 10
          - label: s12
            numerator: 1
            denominator: 12
    name: screen-${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact competition runtime
        run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0

      - name: Download exact trained H64 artifact
        uses: actions/download-artifact@v4
        with:
          name: v14-single-student-h64-bb7d2a4ed05ff78d344cc4374d54e35189584993
          path: model-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34202820525

      - name: Reconstruct V13 and integrate student
        shell: bash
        run: |
          set -euo pipefail
          MODEL=$(find model-artifact -type f -name 'student-h64.npz' -print -quit)
          test -n "$MODEL"
          echo '3422cecc3b1226767412e08746ffd6eef9f7e38602ac15b9256b475e6762b598  '"$MODEL" | sha256sum --check --strict
          cat .analysis/v13_chunks_*.b64 | base64 -d > /tmp/v13.zip
          echo '658fd954180c2d0d39c02ba6601af36d06cdbd573bfb72c6879169861a7ad092  /tmp/v13.zip' | sha256sum --check --strict
          rm -rf /tmp/base /tmp/cand && mkdir -p /tmp/base /tmp/cand
          unzip -q /tmp/v13.zip -d /tmp/base
          unzip -q /tmp/v13.zip -d /tmp/cand
          patch /tmp/base/experiments/numba_search.py < .analysis/v13_jit_refactor.patch
          patch /tmp/cand/experiments/numba_search.py < .analysis/v13_jit_refactor.patch
          for DIR in /tmp/base /tmp/cand; do
            DIR="$DIR" python - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['DIR'])/'experiments/numba_search.py'; s=p.read_text()
          old='    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          new='    correction = correction // 6\n    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          assert s.count(old)==1,s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
            python scripts/patch_v13_legality_context.py "$DIR/experiments/numba_core.py"
            python scripts/patch_v13_qsearch_tactical.py "$DIR/experiments/numba_core.py" "$DIR/experiments/numba_search.py"
          done
          echo 'df346b21be42832a0ae97e7faa15953ab460f0387fb0358961651466557ebde8  /tmp/base/agent.py' | sha256sum --check --strict
          echo '0306e8145a453d91b9b5ac92e9980931510d9e18f8ba598a7548d08b85165c35  /tmp/base/experiments/numba_core.py' | sha256sum --check --strict
          echo '401f6580028a72361286bd99bee1f0022c74e6c8a65da8acd47448835a1ff360  /tmp/base/experiments/numba_search.py' | sha256sum --check --strict
          cp experiments/v14_student_single_runtime.py /tmp/cand/experiments/v14_student_single_runtime.py
          cp "$MODEL" /tmp/cand/experiments/v14_student_h64.npz
          python scripts/patch_v14_single_student_search.py \
            /tmp/cand/experiments/numba_search.py \
            --numerator '${{ matrix.numerator }}' --denominator '${{ matrix.denominator }}'
          python -m py_compile /tmp/base/agent.py /tmp/base/experiments/*.py /tmp/cand/agent.py /tmp/cand/experiments/*.py
          mkdir -p results

      - name: Incremental accumulator rebuild oracle and API smoke
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp/cand python - <<'PY'
          import random
          import chess
          import numpy as np
          import agent
          from experiments.numba_core import encode_position, generate_legal_moves, move_to_uci
          from experiments.numba_search import (
              EVAL_WIDTH, STUDENT_OFFSET, _advance_eval_state_into, _build_eval_state_into,
          )
          rng=random.Random(0x64142026)
          checked=0
          board=chess.Board()
          for _ in range(2200):
              if board.is_game_over(claim_draw=False) or board.ply()>150 or rng.random()<0.035:
                  board=chess.Board()
                  for _ in range(rng.randrange(0,28)):
                      legal=list(board.legal_moves)
                      if not legal: break
                      board.push(rng.choice(legal))
              legal=list(board.legal_moves)
              if not legal: continue
              py_move=rng.choice(legal)
              encoded=encode_position(board)
              moves,count=generate_legal_moves(encoded.board,encoded.side,encoded.castling,encoded.ep_square)
              wanted=py_move.uci(); internal=-1
              for i in range(int(count)):
                  candidate=int(moves[i])
                  if move_to_uci(candidate)==wanted:
                      internal=candidate; break
              assert internal>=0,(board.fen(),wanted)
              parent=np.empty(EVAL_WIDTH,dtype=np.int32); child=np.empty(EVAL_WIDTH,dtype=np.int32)
              _build_eval_state_into(encoded.board,parent)
              _advance_eval_state_into(encoded.board,encoded.side,internal,parent,child)
              after=board.copy(stack=False); after.push(py_move); encoded_after=encode_position(after)
              rebuilt=np.empty(EVAL_WIDTH,dtype=np.int32); _build_eval_state_into(encoded_after.board,rebuilt)
              assert np.array_equal(child[STUDENT_OFFSET:],rebuilt[STUDENT_OFFSET:]),(board.fen(),wanted)
              board.push(py_move); checked+=1
          assert checked>=2000,checked
          for fen in (chess.STARTING_FEN,'r2qk2r/pp1nbppp/5n2/1Qp1N3/3p4/8/PPPN1PPP/R1B1R1K1 b kq - 4 12'):
              b=chess.Board(fen); move=chess.Move.from_uci(agent.get_move(fen,80000)); assert move in b.legal_moves
          print('student_incremental_oracle',checked)
          PY

      - name: Fixed-node runtime cost
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/worker.py <<'PY'
          import json,sys,chess,numpy as np
          from experiments.numba_core import encode_position
          from experiments.numba_search import iterative_search_stateful
          for line in sys.stdin:
              q=json.loads(line); b=chess.Board(q['fen']); e=encode_position(b); h=np.empty(0,dtype=np.uint64)
              o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,int(q['nodes']))
              print(json.dumps({'move':int(o[0]),'score':int(o[1]),'depth':int(o[2]),'nodes':int(o[3])}),flush=True)
          PY
          python - <<'PY'
          import json,os,statistics,subprocess,sys,time
          from pathlib import Path
          roots=[x.strip() for x in open('match/openings/m3-uho-lichess-100-v1.epd') if x.strip() and not x.startswith('#')][:24]
          def start(path):
              env=os.environ.copy();env['PYTHONPATH']=path
              return subprocess.Popen([sys.executable,'/tmp/worker.py'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env=env)
          def run(p,order):
              total=0;t=time.perf_counter()
              for fen in order:
                  p.stdin.write(json.dumps({'fen':fen,'nodes':25000})+'\n');p.stdin.flush();total+=json.loads(p.stdout.readline())['nodes']
              return time.perf_counter()-t,total
          base=start('/tmp/base');cand=start('/tmp/cand');ratios=[];rows=[]
          try:
              for p in (base,cand):p.stdin.write(json.dumps({'fen':roots[0],'nodes':300})+'\n');p.stdin.flush();json.loads(p.stdout.readline())
              for rep in range(3):
                  order=roots if rep%2==0 else list(reversed(roots))
                  if rep%2==0:bt,bn=run(base,order);ct,cn=run(cand,order)
                  else:ct,cn=run(cand,order);bt,bn=run(base,order)
                  ratio=(cn/ct)/(bn/bt);ratios.append(ratio);rows.append({'rep':rep,'base_nps':bn/bt,'candidate_nps':cn/ct,'ratio':ratio})
          finally:
              for p in (base,cand):p.terminate();p.wait()
          out={'scale':'${{ matrix.label }}','median_nps_ratio':statistics.median(ratios),'rows':rows}
          Path('results/throughput.json').write_text(json.dumps(out,indent=2)+'\n');print(out)
          PY

      - name: Fixed-node regression deltas
        shell: bash
        run: |
          set -euo pipefail
          python tools/v14_build_probe_corpus.py --openings match/openings/m3-uho-lichess-100-v1.epd --positions 48 --seed 2026090802 --json-out results/broad-manifest.json >/dev/null
          python tools/v14_regression_probe.py --engine /tmp/cand --control /tmp/base --manifest results/broad-manifest.json --budgets 12000 --json-out results/broad-probe.json | tee results/broad-probe.log
          python tools/v14_regression_probe.py --engine /tmp/cand --control /tmp/base --manifest match/regressions/v14-v13-seed.json --budgets 30000 --json-out results/seed-probe.json | tee results/seed-probe.log

      - name: Equal-node reality screen on unseen training roots
        shell: bash
        run: |
          set -euo pipefail
          python -u tools/v14_fixed_node_arena.py /tmp/cand /tmp/base \
            --nodes 16000 --pairs 20 --opening-offset 80 --max-plies 220 \
            --opening-file match/openings/m3-uho-lichess-100-v1.epd \
            --json-out results/arena.json | tee results/arena.log
          grep '^FINAL ' results/arena.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v14-student-${{ matrix.label }}-${{ github.sha }}
          path: results/
          retention-days: 30
