              except Exception as e:r={'error':repr(e)}
              print(json.dumps(r),flush=True)
          PY
          cat >/tmp/audit.py <<'PY'
          import chess,chess.engine,json,math,os,subprocess,sys
          fens='''r1bqkb1r/pp3ppp/5n2/3pn3/8/2PB4/PP2NPPP/RNBQK2R w KQkq - 0 8
