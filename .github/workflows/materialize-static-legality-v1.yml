name: Materialize accepted static legality v1

on:
  push:
    branches:
      - m4/static-legality-v1-screening

permissions:
  contents: write

# This one-shot workflow exists only to turn the accepted experiment branch into the exact clean
# production diff. The commit it creates removes this workflow together with all experiment scaffolding.
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Materialize exact accepted source and remove one-shot scaffolding
        run: |
          set -euo pipefail
          python3 tools/apply_static_legality_v1.py
          cargo fmt --all
          echo '6cb728d12e983a1815056e8faba12ca1bd26f79d8fdfbf13feb0fba56c69863d  crates/chess-core/src/movegen.rs' | sha256sum --check --strict
          git add crates/chess-core/src/movegen.rs
          git rm \
            .github/workflows/m4-static-legality-v1-screening.yml \
            .github/workflows/m4-static-legality-v1-acceptance.yml \
            .github/workflows/materialize-static-legality-v1.yml \
            match/protocols/m4-static-legality-v1-screening.json \
            match/protocols/m4-static-legality-v1-acceptance.json \
            tools/apply_static_legality_v1.py
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'm4: promote accepted mutation-free legality filtering v1'
          git push origin HEAD:m4/static-legality-v1-screening
