name: V16 Python history fused H64 transport

on:
  workflow_dispatch:
  push:
    branches: [v16/python-history-search-interactions]
    paths:
      - '.github/workflows/v16-python-history-fused-h64.yml'
      - 'scripts/patch_v16_python_fused_h64_direct.py'
      - 'scripts/patch_v16_python_inline_fused_h64.py'

permissions:
  actions: read
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact competition runtime
        run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Download exact packaged V14
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - name: Materialize history control and exact fused candidate
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name Little-Gambit-V14.zip -print -quit); test -n "$ZIP"
          rm -rf /tmp/control /tmp/candidate results
          mkdir -p /tmp/control /tmp/candidate results
          unzip -q "$ZIP" -d /tmp/control
          python scripts/patch_v16_python_presort_once.py /tmp/control/experiments/numba_search.py
          python scripts/patch_v16_python_trusted_continuity.py /tmp/control/agent.py
          python scripts/patch_v16_python_rust_history.py /tmp/control/experiments/numba_search.py
          cp -a /tmp/control/. /tmp/candidate/
          python scripts/patch_v16_python_fused_h64_direct.py /tmp/candidate/experiments/v14_student_single_runtime.py
          python scripts/patch_v16_python_inline_fused_h64.py /tmp/candidate/experiments/v14_student_single_runtime.py
          python -m py_compile tools/v14_agent_runner.py tools/v14_fixed_node_arena.py scripts/v15_competition_gate.py /tmp/control/agent.py /tmp/control/experiments/*.py /tmp/candidate/agent.py /tmp/candidate/experiments/*.py
          diff -u /tmp/control/experiments/v14_student_single_runtime.py /tmp/candidate/experiments/v14_student_single_runtime.py > results/runtime.patch || true
          test -s results/runtime.patch
      - name: Build fresh disjoint roots
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          rm -rf /tmp/m6; mkdir /tmp/m6
          python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]
          chosen=fresh[2250:2346]
          assert len(chosen)==96 and len(set(chosen))==96
          Path('/tmp/fused-parity.epd').write_text('\n'.join(chosen[:32])+'\n')
          Path('/tmp/fused-throughput.epd').write_text('\n'.join(chosen[32:64])+'\n')
          Path('/tmp/fused-clock.epd').write_text('\n'.join(chosen[64:])+'\n')
          PY
      - name: Exact fixed-node parity
        shell: bash
        run: |
          set -euo pipefail
          python -u tools/v14_fixed_node_arena.py /tmp/candidate /tmp/control \
            --nodes 24000 --pairs 32 --opening-file /tmp/fused-parity.epd \
            --max-plies 220 --json-out results/equal-node.json | tee results/equal-node.log
          python - <<'PY'
          import json
          r=json.load(open('results/equal-node.json'))
          assert r['score'] == 32.0 and r['score_fraction'] == 0.5, r
          PY
      - name: Five-repetition throughput
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/fused_worker.py <<'PY'
          import json,sys,chess,numpy as np
          from experiments.numba_core import encode_position
          from experiments.numba_search import iterative_search_stateful
          for line in sys.stdin:
              q=json.loads(line);b=chess.Board(q['fen']);e=encode_position(b);h=np.empty(0,dtype=np.uint64)
              o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,int(q['nodes']))
              print(json.dumps({'nodes':int(o[3])}),flush=True)
          PY
          python - <<'PY'
          import json,os,statistics,subprocess,sys,time
          from pathlib import Path
          roots=[x.strip() for x in Path('/tmp/fused-throughput.epd').read_text().splitlines() if x.strip()][:20]
          def start(d):
              e=os.environ.copy();e['PYTHONPATH']=d
              return subprocess.Popen([sys.executable,'/tmp/fused_worker.py'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env=e)
          def one(p,f,n):
              p.stdin.write(json.dumps({'fen':f,'nodes':n})+'\n');p.stdin.flush();return json.loads(p.stdout.readline())
          b=start('/tmp/control');c=start('/tmp/candidate');rows=[];rat=[]
          try:
              one(b,roots[0],500);one(c,roots[0],500)
              for r in range(5):
                  order=roots if r%2==0 else list(reversed(roots))
                  def timed(p):
                      nodes=0;t=time.perf_counter()
                      for f in order:nodes+=one(p,f,35000)['nodes']
                      return nodes/(time.perf_counter()-t)
                  if r%2==0:bn=timed(b);cn=timed(c)
                  else:cn=timed(c);bn=timed(b)
                  rows.append({'rep':r,'control_nps':bn,'candidate_nps':cn,'ratio':cn/bn});rat.append(cn/bn)
          finally:
              b.terminate();c.terminate();b.wait();c.wait()
          out={'median_nps_ratio':statistics.median(rat),'rows':rows}
          Path('results/throughput.json').write_text(json.dumps(out,indent=2)+'\n')
          print('FINAL',out)
          PY
      - name: 64-game competition-clock sanity
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/v15_competition_gate.py \
            --control /tmp/control --candidate /tmp/candidate \
            --openings /tmp/fused-clock.epd \
            --output results/timed.json \
            --label 'history + exact fused inline H64 transport' \
            --base-ms 2500 --inc-ms 50 --max-plies 180 --grace-ms 1500 \
            | tee results/timed.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v16-history-fused-h64-${{ github.sha }}
          path: results/
          retention-days: 30
