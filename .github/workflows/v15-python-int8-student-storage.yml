name: V15 Python exact int8 student storage

on:
  push:
    branches: [analysis/v15-python-int8-student-storage-20260908]
    paths:
      - scripts/patch_v15_python_int8_student_storage.py
      - .github/workflows/v15-python-int8-student-storage.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Download exact packaged V14
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - name: Materialize qcap6 presort pair
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name Little-Gambit-V14.zip -print -quit); test -n "$ZIP"
          rm -rf /tmp/base /tmp/cand /tmp/m6 results; mkdir -p /tmp/base /tmp/cand /tmp/m6 results
          unzip -q "$ZIP" -d /tmp/base; cp -a /tmp/base/. /tmp/cand/
          for D in /tmp/base /tmp/cand; do
            python scripts/patch_v15_python_qsearch_cap.py "$D/experiments/numba_search.py" 6
            python scripts/patch_v15_python_presort_once.py "$D/experiments/numba_search.py"
          done
          python scripts/patch_v15_python_int8_student_storage.py /tmp/cand/experiments/numba_search.py
          python -m py_compile tools/v14_agent_runner.py /tmp/base/agent.py /tmp/cand/agent.py /tmp/base/experiments/*.py /tmp/cand/experiments/*.py
          PYTHONPATH=/tmp/cand python - <<'PY'
          from experiments.numba_search import STUDENT_FEATURE_WEIGHTS,STUDENT_FEATURE_BIAS,STUDENT_OUTPUT_WEIGHTS
          print(STUDENT_FEATURE_WEIGHTS.dtype,STUDENT_FEATURE_WEIGHTS.min(),STUDENT_FEATURE_WEIGHTS.max(),STUDENT_FEATURE_WEIGHTS.nbytes)
          print(STUDENT_FEATURE_BIAS.dtype,STUDENT_OUTPUT_WEIGHTS.dtype)
          assert str(STUDENT_FEATURE_WEIGHTS.dtype)=='int8' and STUDENT_FEATURE_WEIGHTS.nbytes==768*64
          PY
      - name: Build fresh roots
        shell: bash
        run: |
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]
          screen=fresh[4746:4794]; timed=fresh[4796:4828]
          assert len(screen)==48 and len(timed)==32
          Path('/tmp/int8-screen.epd').write_text('\n'.join(screen)+'\n');Path('/tmp/int8-timed.epd').write_text('\n'.join(timed)+'\n')
          PY
      - name: Exact fixed-node tuple parity
        shell: bash
        run: |
          cat >/tmp/tuple_worker.py <<'PY'
          import json,sys,chess,numpy as np
          from experiments.numba_core import encode_position,move_to_uci
          from experiments.numba_search import iterative_search_stateful
          for line in sys.stdin:
              q=json.loads(line);b=chess.Board(q['fen']);e=encode_position(b);h=np.empty(0,dtype=np.uint64)
              o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,int(q['nodes']))
              print(json.dumps({'move':move_to_uci(int(o[0])),'score':int(o[1]),'depth':int(o[2]),'nodes':int(o[3])}),flush=True)
          PY
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          roots=Path('/tmp/int8-screen.epd').read_text().splitlines()[:32]
          def start(d):
              e=os.environ.copy();e['PYTHONPATH']=d;return subprocess.Popen([sys.executable,'/tmp/tuple_worker.py'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env=e)
          def one(p,fen):p.stdin.write(json.dumps({'fen':fen,'nodes':18000})+'\n');p.stdin.flush();return json.loads(p.stdout.readline())
          b=start('/tmp/base');c=start('/tmp/cand');bad=[]
          try:
              for i,fen in enumerate(roots):
                  x=one(b,fen);y=one(c,fen)
                  if x!=y:bad.append({'i':i,'base':x,'cand':y})
          finally:b.terminate();c.terminate();b.wait();c.wait()
          print('mismatches',len(bad),bad[:3]);assert not bad
          PY
      - name: Throughput
        shell: bash
        run: |
          cat >/tmp/worker.py <<'PY'
          import json,sys,chess,numpy as np
          from experiments.numba_core import encode_position
          from experiments.numba_search import iterative_search_stateful
          for line in sys.stdin:
              q=json.loads(line);b=chess.Board(q['fen']);e=encode_position(b);h=np.empty(0,dtype=np.uint64)
              o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,int(q['nodes']))
              print(json.dumps({'nodes':int(o[3]),'depth':int(o[2])}),flush=True)
          PY
          python - <<'PY'
          import json,os,statistics,subprocess,sys,time
          from pathlib import Path
          roots=Path('/tmp/int8-screen.epd').read_text().splitlines()[:16]
          def start(d):
              e=os.environ.copy();e['PYTHONPATH']=d;return subprocess.Popen([sys.executable,'/tmp/worker.py'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env=e)
          def one(p,fen,n):p.stdin.write(json.dumps({'fen':fen,'nodes':n})+'\n');p.stdin.flush();return json.loads(p.stdout.readline())
          def timed(p,order):
              nodes=0;ds=[];t=time.perf_counter()
              for fen in order:
                  z=one(p,fen,25000);nodes+=z['nodes'];ds.append(z['depth'])
              return nodes/(time.perf_counter()-t),sum(ds)/len(ds)
          b=start('/tmp/base');c=start('/tmp/cand');rat=[];rows=[]
          try:
              one(b,roots[0],500);one(c,roots[0],500)
              for r in range(5):
                  order=roots if r%2==0 else list(reversed(roots))
                  if r%2==0:bn,bd=timed(b,order);cn,cd=timed(c,order)
                  else:cn,cd=timed(c,order);bn,bd=timed(b,order)
                  rat.append(cn/bn);rows.append({'base_nps':bn,'candidate_nps':cn,'ratio':cn/bn,'base_depth':bd,'candidate_depth':cd})
          finally:b.terminate();c.terminate();b.wait();c.wait()
          out={'median_nps_ratio':statistics.median(rat),'rows':rows};Path('results/throughput.json').write_text(json.dumps(out,indent=2)+'\n');print('FINAL',out)
          PY
      - name: 64-game competition-clock gate
        run: python -u scripts/v15_competition_gate.py --candidate /tmp/cand --control /tmp/base --openings /tmp/int8-timed.epd --output results/timed.json --label int8-storage-qcap6-presort --base-ms 2500 --inc-ms 50 --max-plies 180 | tee results/timed.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-python-int8-storage-${{ github.sha }}
          path: results/
          retention-days: 30
