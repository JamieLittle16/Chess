name: V18 search safety matrix 2

on:
  push:
    branches: [analysis/v18-benchmark-driven-search-audit-20260911]
    paths: [.github/workflows/v18-search-safety-matrix2.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [base, lmr_deep, lmr_mid, lmr_noneg, lmr_soft, no_rfp, no_lqf, qh64_1, qh64_all]
        target: ['Ryan Vincent', 'Emile Andrieu', 'Lightning Tree']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q 'numba==0.67.0' 'numpy==2.5.2' 'chess==1.11.2'

      - name: Reconstruct exact PUNCH133 and apply variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          rm -rf /tmp/engine /tmp/out && mkdir -p /tmp/engine /tmp/out
          cat ci/v18_postbook_payload/chunk_*.b64 | base64 -d > /tmp/p150.zip
          unzip -q /tmp/p150.zip -d /tmp/engine
          sed -i 's/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.50/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.33/' /tmp/engine/agent.py
          curl --fail --location --retry 5 -sS 'https://raw.githubusercontent.com/michaeldv/donna_opening_books/master/gm2001.bin' -o /tmp/engine/v18_gm2001.bin
          test "$(sha256sum /tmp/engine/v18_gm2001.bin | cut -d' ' -f1)" = 'fb6e9f3f27bb19a5b2fdefcc441c88ddeae48db61d5f00ad83973abb9f939c87'
          python - <<'PY'
          import os
          from pathlib import Path
          v=os.environ['VARIANT']; p=Path('/tmp/engine/experiments/numba_search.py'); s=p.read_text()
          if v == 'lmr_deep':
              old='''    if depth >= 9 and move_index >= 12:\n        return 3\n'''
              new='''    if depth >= 9 and move_index >= 12:\n        return 2\n'''
              assert s.count(old)==1; s=s.replace(old,new,1)
          elif v == 'lmr_mid':
              old='''    if depth >= 6 and move_index >= 8:\n        return 2\n'''
              new='''    if depth >= 6 and move_index >= 8:\n        return 1\n'''
              assert s.count(old)==1; s=s.replace(old,new,1)
          elif v == 'lmr_noneg':
              old='''    if history_score <= -QUIET_HISTORY_LMR_THRESHOLD and depth >= 5 and move_index >= 4:\n        return min(3, base + 1)\n'''
              new='''    if history_score <= -QUIET_HISTORY_LMR_THRESHOLD and depth >= 5 and move_index >= 4:\n        return base\n'''
              assert s.count(old)==1; s=s.replace(old,new,1)
          elif v == 'lmr_soft':
              old='''    if depth >= 9 and move_index >= 12:\n        return 3\n    if depth >= 6 and move_index >= 8:\n        return 2\n    if depth >= 3 and move_index >= 4:\n        return 1\n'''
              new='''    if depth >= 9 and move_index >= 12:\n        return 2\n    if depth >= 6 and move_index >= 8:\n        return 1\n    if depth >= 3 and move_index >= 4:\n        return 1\n'''
              assert s.count(old)==1; s=s.replace(old,new,1)
          elif v == 'no_rfp':
              old='''        if pruning_static_eval - 120 * depth >= beta:\n            return pruning_static_eval, False\n'''
              new='''        if False and pruning_static_eval - 120 * depth >= beta:\n            return pruning_static_eval, False\n'''
              assert s.count(old)==1; s=s.replace(old,new,1)
          elif v == 'no_lqf':
              old='''        futility_candidate = (\n            pruning_static_eval != INFINITY\n'''
              new='''        futility_candidate = (\n            False\n            and pruning_static_eval != INFINITY\n'''
              assert s.count(old)==1; s=s.replace(old,new,1)
          elif v in ('qh64_1','qh64_all'):
              stand='''        stand_pat = (\n            _evaluate_state(side, eval_stack[ply])\n            if qply == 0\n            else _evaluate_state_v13_only(side, eval_stack[ply])\n        )\n'''
              if v == 'qh64_1':
                  repl='''        stand_pat = (\n            _evaluate_state(side, eval_stack[ply])\n            if qply <= 1\n            else _evaluate_state_v13_only(side, eval_stack[ply])\n        )\n'''
              else:
                  repl='''        stand_pat = _evaluate_state(side, eval_stack[ply])\n'''
              assert s.count(stand)==1; s=s.replace(stand,repl,1)
              adv='''        _advance_eval_state_into(\n            board,\n            side,\n            move,\n            eval_stack[ply, :EVAL_V13_WIDTH],\n            eval_stack[ply + 1, :EVAL_V13_WIDTH],\n        )\n'''
              if v == 'qh64_1':
                  adv_repl='''        if qply == 0:\n            _advance_eval_state_into(\n                board, side, move, eval_stack[ply], eval_stack[ply + 1]\n            )\n        else:\n            _advance_eval_state_into(\n                board, side, move,\n                eval_stack[ply, :EVAL_V13_WIDTH],\n                eval_stack[ply + 1, :EVAL_V13_WIDTH],\n            )\n'''
              else:
                  adv_repl='''        _advance_eval_state_into(\n            board, side, move, eval_stack[ply], eval_stack[ply + 1]\n        )\n'''
              assert s.count(adv)==1; s=s.replace(adv,adv_repl,1)
          elif v != 'base':
              raise SystemExit(v)
          p.write_text(s)
          print('VARIANT',v)
          PY
          python -m py_compile /tmp/engine/agent.py /tmp/engine/experiments/*.py

      - name: Reconstruct valid frozen 37-game corpus
        run: |
          set -euo pipefail
          (for f in match/benchmarks/top-engine-recent-20260911/chunk_*.b64; do base64 -d "$f"; done) | gzip -dc > /tmp/top.pgn
          echo 'dbac26e0f2b451eb7bf80994ca48fdd6b1abbc9f133e528d3e968f007f7aa264  /tmp/top.pgn' | sha256sum -c -

      - name: Make Stockfish probes independent
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/stockfish_lab.py'); s=p.read_text()
          old='        root_moves = None if root_move is None else [root_move]\n        info = self.engine.analyse(\n'
          new='        root_moves = None if root_move is None else [root_move]\n        if "Clear Hash" in self.engine.options:\n            self.engine.configure({"Clear Hash": None})\n        info = self.engine.analyse(\n'
          assert s.count(old)==1; p.write_text(s.replace(old,new,1))
          PY

      - name: Fetch verified Stockfish 19
        run: |
          set -euo pipefail
          mkdir -p /tmp/sf
          curl -L --fail --retry 3 -o /tmp/sf.tar.gz https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz
          echo '9defc0d4e55d49c65a6d042f3e571a39fcea499ade6dbe741b53b8c65e03611f  /tmp/sf.tar.gz' | sha256sum -c -
          tar -xzf /tmp/sf.tar.gz -C /tmp/sf
          SF=$(find /tmp/sf -type f -name 'stockfish*' -perm /111 | head -n1); cp "$SF" /tmp/sf19; chmod +x /tmp/sf19

      - name: Benchmark candidate
        env:
          TARGET: ${{ matrix.target }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          slug=$(printf '%s-%s' "$VARIANT" "$TARGET" | tr '[:upper:] ' '[:lower:]-')
          mkdir -p "/tmp/out/$slug"
          PYTHONPATH=scripts python scripts/v18_competitor_move_benchmark_v2.py \
            --pgn /tmp/top.pgn --engine-dir /tmp/engine --stockfish /tmp/sf19 \
            --target "$TARGET" --positions 24 --nodes 150000 --threads 1 --hash-mb 64 \
            --pairwise-margin-cp 8 --seed 20260912 --output-dir "/tmp/out/$slug"
          python - <<'PY'
          import json,glob,os
          x=json.load(open(glob.glob('/tmp/out/*/summary.json')[0]))
          print('MATRIX2_RESULT',os.environ['VARIANT'],os.environ['TARGET'],
                'cand_cpl',x['candidate']['mean_cp_loss'],
                'pair',x['pairwise']['score'],
                'sfmatch',x['candidate']['best_move_match_rate'],
                'mist80',x['candidate']['mistakes_cp_ge_80'],
                'blund150',x['candidate']['blunders_cp_ge_150'],
                'secs',x['candidate_runtime']['mean_move_seconds'])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search2-${{ matrix.variant }}-${{ matrix.target }}
          path: /tmp/out/
          retention-days: 3
