name: V18 public-start SF-stable DIRECT A/B

on:
  push:
    branches: [analysis/v18-publicstart-sfstable-direct-20260911]
    paths:
      - .github/workflows/v18-publicstart-sfstable-direct-ab.yml
      - ci/v18_top36_starts.epd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q 'numba==0.67.0' 'numpy==2.5.2' 'chess==1.11.2'

      - name: Reconstruct exact PUNCH133
        run: |
          set -euo pipefail
          cat ci/v18_postbook_payload/chunk_*.b64 | base64 -d > /tmp/p150.zip
          for d in /tmp/base /tmp/cand; do
            rm -rf "$d"; mkdir "$d"; unzip -q /tmp/p150.zip -d "$d"
            sed -i 's/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.50/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.33/' "$d/agent.py"
            curl --fail --location --retry 5 -sS 'https://raw.githubusercontent.com/michaeldv/donna_opening_books/master/gm2001.bin' -o "$d/v18_gm2001.bin"
          done
          sha256sum /tmp/base/v18_gm2001.bin
          diff -u /tmp/base/experiments/numba_search.py /tmp/cand/experiments/numba_search.py

      - name: Fetch and verify Stockfish 19
        run: |
          set -euo pipefail
          mkdir -p /tmp/sf19
          curl -L --fail --retry 3 --retry-delay 2 -o /tmp/stockfish-19.tar.gz https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz
          echo '9defc0d4e55d49c65a6d042f3e571a39fcea499ade6dbe741b53b8c65e03611f  /tmp/stockfish-19.tar.gz' | sha256sum -c -
          tar -xzf /tmp/stockfish-19.tar.gz -C /tmp/sf19
          SF=$(find /tmp/sf19 -type f -name 'stockfish*' | head -n1); chmod +x "$SF"; echo "STOCKFISH=$SF" >> "$GITHUB_ENV"

      - name: Build stable opening-only overlay
        run: |
          python - <<'PY'
          import os,struct,chess,chess.engine,chess.polyglot
          S=struct.Struct('>QHHI')
          fens=[x.strip() for x in open('ci/v18_top36_starts.epd') if x.strip()];assert len(fens)==36
          gm=chess.polyglot.open_reader('/tmp/base/v18_gm2001.bin')
          eng=chess.engine.SimpleEngine.popen_uci(os.environ['STOCKFISH']);eng.configure({'Threads':1,'Hash':128})
          def gm_direct(b):
              es=[e for e in gm.find_all(b) if e.move in b.legal_moves and int(e.weight)>0]
              if not es or b.ply()>18:return None
              es.sort(key=lambda e:-int(e.weight));tw=int(es[0].weight);tot=sum(int(e.weight) for e in es);sh=tw/tot
              return es[0].move if tw>=16 and (sh>=.70 or (tw>=96 and sh>=.60)) else None
          def raw_move(b,m):
              to=m.to_square
              if b.is_castling(m):
                  if m.to_square==chess.G1:to=chess.H1
                  elif m.to_square==chess.C1:to=chess.A1
                  elif m.to_square==chess.G8:to=chess.H8
                  elif m.to_square==chess.C8:to=chess.A8
              promo=0 if m.promotion is None else m.promotion-1
              return int(to | (m.from_square<<6) | (promo<<12))
          rows=[]; unstable=[]; preserved=[]
          try:
              for i,fen in enumerate(fens,1):
                  b=chess.Board(fen); old=gm_direct(b)
                  if old is not None:
                      preserved.append((i,old.uci())); print('PRESERVE',i,old.uci(),fen); continue
                  a=eng.analyse(b,chess.engine.Limit(nodes=500000));d=eng.analyse(b,chess.engine.Limit(nodes=5_000_000));m1=a['pv'][0];m2=d['pv'][0]
                  if m1!=m2:
                      unstable.append((i,m1.uci(),m2.uci()));print('UNSTABLE',i,m1.uci(),m2.uci(),fen);continue
                  rows.append((chess.polyglot.zobrist_hash(b),raw_move(b,m2),65535,0,fen,m2.uci(),i));print('ACCEPT',i,m2.uci(),fen)
          finally:gm.close();eng.quit()
          packed=sorted((k,r,w,l) for k,r,w,l,*_ in rows)
          with open('/tmp/cand/v18_public_sf19_stable.bin','wb') as f:
              for r in packed:f.write(S.pack(*r))
          print('SUMMARY accepted',len(rows),'unstable',len(unstable),'preserved_gm_direct',len(preserved),'bytes',len(packed)*16)
          with chess.polyglot.open_reader('/tmp/cand/v18_public_sf19_stable.bin') as rd:
              for k,r,w,l,fen,uci,i in rows:
                  b=chess.Board(fen); es=list(rd.find_all(b)); assert es and es[0].move.uci()==uci,(i,uci,[e.move.uci() for e in es])
          open('/tmp/accepted_fens.txt','w').write('\n'.join(r[4] for r in rows)+'\n')
          assert rows
          PY

      - name: Patch candidate and structural checks
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/cand/agent.py');s=p.read_text()
          needle='_BOOK_READER = chess.polyglot.open_reader(_BOOK_PATH)\n_BOOK_PRIOR_MAX_PLY: Final = 22\n'
          repl='_BOOK_READER = chess.polyglot.open_reader(_BOOK_PATH)\n_PUBLIC_BOOK_PATH = Path(__file__).with_name("v18_public_sf19_stable.bin")\nif not _PUBLIC_BOOK_PATH.is_file():\n    raise ValueError("missing V18 public-start opening overlay")\n_PUBLIC_BOOK_READER = chess.polyglot.open_reader(_PUBLIC_BOOK_PATH)\n_BOOK_PRIOR_MAX_PLY: Final = 22\n'
          assert needle in s;s=s.replace(needle,repl,1)
          marker='def _internal_move_from_chess(board: chess.Board, move: chess.Move) -> int:\n'
          helper='''def _public_start_book_move(board: chess.Board) -> chess.Move | None:\n    # Opening-only: certified public historical Chessathon starts, never middlegames.\n    if board.ply() > _BOOK_DIRECT_MAX_PLY:\n        return None\n    try:\n        for entry in _PUBLIC_BOOK_READER.find_all(board):\n            move = entry.move\n            if int(entry.weight) > 0 and move in board.legal_moves:\n                return move\n    except (IndexError, ValueError):\n        return None\n    return None\n\n\n'''
          assert marker in s;s=s.replace(marker,helper+marker,1)
          old='    direct_book_move = _high_confidence_book_move(board)\n    if direct_book_move is not None:\n'
          new='    direct_book_move = _high_confidence_book_move(board)\n    if direct_book_move is None:\n        direct_book_move = _public_start_book_move(board)\n    if direct_book_move is not None:\n'
          assert old in s;s=s.replace(old,new,1);p.write_text(s)
          PY
          python -m py_compile /tmp/cand/agent.py /tmp/cand/experiments/*.py
          diff -u /tmp/base/experiments/numba_search.py /tmp/cand/experiments/numba_search.py
          python - <<'PY'
          import sys,contextlib,chess
          sys.path.insert(0,'/tmp/cand')
          with contextlib.redirect_stdout(sys.stderr):import agent
          fens=[x.strip() for x in open('/tmp/accepted_fens.txt') if x.strip()]
          hits=0
          for fen in fens:
              b=chess.Board(fen);m=agent._public_start_book_move(b);assert m is not None and m in b.legal_moves;hits+=1
          print('STRUCTURAL_HITS',hits,'/',len(fens))
          PY

      - name: 32-game paired activation screen at exact +0.5
        run: |
          cat >/tmp/worker.py <<'PY'
          import sys,json,contextlib,numpy as np
          with contextlib.redirect_stdout(sys.stderr): import agent
          def reset():
            agent._GAME_KEYS.clear();agent._PENDING_AFTER_OUR_MOVE=None;agent._LAST_CALL_TIME_LEFT_MS=None;agent._LAST_GET_MOVE_ELAPSED_MS=None;agent._CLOCK_OVERHEAD_EMA_MS=40.0;agent._CLOCK_FEEDBACK_SAMPLES=0
            if hasattr(agent,'_BOOK_POST_SEARCH_BOOSTS'):agent._BOOK_POST_SEARCH_BOOSTS=0
            agent._HASH_KEYS.fill(np.uint64(0));agent._HASH_MOVES.fill(np.int32(-1));agent._TT_TABLE.fill(np.uint64(0));agent._QUIET_HISTORY.fill(np.int16(0))
          for line in sys.stdin:
            try:
              q=json.loads(line);ans={'ok':True} if q['op']=='reset' and not reset() else {'move':agent.get_move(q['fen'],int(q['ms']))}
            except Exception as e:ans={'error':type(e).__name__+': '+str(e)}
            print(json.dumps(ans),flush=True)
          PY
          cat >/tmp/match.py <<'PY'
          import subprocess,sys,json,time,random,math,chess,os
          class W:
            def __init__(self,d):self.p=subprocess.Popen([sys.executable,'/tmp/worker.py'],cwd=d,stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env={**os.environ,'PYTHONPATH':d})
            def ask(self,q):self.p.stdin.write(json.dumps(q)+'\n');self.p.stdin.flush();r=json.loads(self.p.stdout.readline());(_ for _ in ()).throw(RuntimeError(r['error'])) if 'error' in r else None;return r
            def reset(self):self.ask({'op':'reset'})
            def close(self):self.p.terminate();self.p.wait(timeout=5)
          opens=[x.strip() for x in open('/tmp/accepted_fens.txt') if x.strip()];random.Random(11092026).shuffle(opens);opens=opens[:16];BASE=15.;INC=.5
          base=W('/tmp/base');cand=W('/tmp/cand');pts=[];fails=[]
          try:
            for pi,fen in enumerate(opens):
              for leg in range(2):
                base.reset();cand.reset();b=chess.Board(fen);cl={'base':BASE,'cand':BASE};cw=(leg==0);fail=None
                for _ in range(260):
                  if b.outcome(claim_draw=True):break
                  side='cand' if b.turn==cw else 'base';w=cand if side=='cand' else base;st=time.perf_counter();rr=w.ask({'op':'move','fen':b.fen(),'ms':max(1,round(cl[side]*1000))});cl[side]-=time.perf_counter()-st
                  if cl[side]<0:fail=side+' flag';break
                  m=chess.Move.from_uci(rr['move'])
                  if m not in b.legal_moves:fail=side+' illegal';break
                  b.push(m);cl[side]+=INC
                out=b.outcome(claim_draw=True);cp=(0. if fail and fail.startswith('cand') else 1.) if fail else (.5 if out is None or out.winner is None else (1. if out.winner==cw else 0.));pts.append(cp)
                if fail:fails.append((pi,leg,fail));print('GAME',len(pts),'/32','POINT',cp,'TOTAL',sum(pts),'CLOCK',cl,'FAIL',fail,flush=True)
          finally:base.close();cand.close()
          p=sum(pts)/len(pts);q=max(1e-6,min(1-1e-6,p));print('FINAL points',sum(pts),'games',len(pts),'score',p,'REL_ELO',400*math.log10(q/(1-q)),'FAILS',fails)
          PY
          python /tmp/match.py
