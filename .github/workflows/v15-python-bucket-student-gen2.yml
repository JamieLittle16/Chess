name: V15 Python king-bucket generation 2

on:
  push:
    branches: [analysis/v15-python-bucket-student-gen2-20260908]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  teacher:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Download exact packaged V14
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - name: Materialize V14 and broad UHO roots
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name 'Little-Gambit-V14.zip' -print -quit); test -n "$ZIP"
          rm -rf /tmp/v14 /tmp/uho source; mkdir -p /tmp/v14 /tmp/uho source
          unzip -q "$ZIP" -d /tmp/v14
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          unzip -q /tmp/uho.zip -d /tmp/uho
          UHO=$(find /tmp/uho -type f -name '*.epd' -print -quit); test -n "$UHO"
          UHO="$UHO" python - <<'PY'
          import os,chess
          from pathlib import Path
          rows=Path(os.environ['UHO']).read_text(errors='ignore').splitlines();out=[]
          # Deliberately disjoint from the earlier generation-2 500:1800 root window.
          for raw in rows[1800:4600]:
              f=raw.strip().split()
              if len(f)<4: continue
              fen=' '.join(f[:4])+' 0 1'
              try:b=chess.Board(fen)
              except ValueError:continue
              if b.is_game_over(claim_draw=False):continue
              out.append(fen)
              if len(out)==800:break
          assert len(out)==800,len(out)
          Path('/tmp/train-roots.epd').write_text('\n'.join(out)+'\n')
          PY
          sha256sum /tmp/train-roots.epd | tee source/roots.sha256
      - name: Generate broad V14 self-play positions
        shell: bash
        run: |
          set -euo pipefail
          python -u tools/v14_generate_selfplay_positions.py --engine /tmp/v14 --openings /tmp/train-roots.epd --nodes 6000 --games 800 --opening-offset 0 --min-ply 6 --max-ply 180 --stride 2 --max-positions 40000 --output source/selfplay-positions.json | tee source/selfplay.log
          python - <<'PY'
          import json
          p=json.load(open('source/selfplay-positions.json'))
          rows=p if isinstance(p,list) else p.get('positions',[])
          print('generated_positions',len(rows))
          assert len(rows)>=18000,len(rows)
          PY
      - name: Fetch pinned Stockfish 19
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qualification/stockfish
          curl --fail --location --retry 3 -o .qualification/stockfish.tar.gz https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz
          echo '9defc0d4e55d49c65a6d042f3e571a39fcea499ade6dbe741b53b8c65e03611f  .qualification/stockfish.tar.gz' | sha256sum --check --strict
          tar -xzf .qualification/stockfish.tar.gz -C .qualification/stockfish
          STOCKFISH_BIN=$(find "$PWD/.qualification/stockfish" -type f -name 'stockfish*' -perm -111 -print -quit); test -n "$STOCKFISH_BIN"
          echo "STOCKFISH_BIN=$STOCKFISH_BIN" >> "$GITHUB_ENV"
      - name: Label with Stockfish 19
        shell: bash
        run: |
          set -euo pipefail
          python -u tools/v14_label_selfplay_teacher.py --positions source/selfplay-positions.json --stockfish "$STOCKFISH_BIN" --nodes 20000 --threads 1 --hash-mb 128 --split-salt Chess/v15-bucket-gen2-20260908 --validation-permille 100 --holdout-permille 100 --output source/teacher.jsonl | tee source/teacher.log
          wc -l source/teacher.jsonl
          sha256sum source/teacher.jsonl | tee source/teacher.sha256
          test $(wc -l < source/teacher.jsonl) -ge 18000
      - uses: actions/upload-artifact@v4
        with:
          name: v15-python-bucket-gen2-teacher-${{ github.sha }}
          path: source/
          retention-days: 30

  train:
    needs: teacher
    strategy:
      fail-fast: false
      matrix:
        hidden: [16, 32]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Download exact packaged V14
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - uses: actions/download-artifact@v4
        with:
          name: v15-python-bucket-gen2-teacher-${{ github.sha }}
          path: source
      - name: Train and quantise broader student
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name 'Little-Gambit-V14.zip' -print -quit); test -n "$ZIP"
          rm -rf /tmp/v14; mkdir /tmp/v14 results
          unzip -q "$ZIP" -d /tmp/v14
          python -u scripts/train_v15_bucket_student.py --teacher source/teacher.jsonl --engine-dir /tmp/v14 --output-dir results/h${{ matrix.hidden }} --hidden ${{ matrix.hidden }} --epochs 60 --batch-size 512 --lr 0.0015 --weight-decay 0.00002 --seed 20260908 | tee results/h${{ matrix.hidden }}.log
          cat results/h${{ matrix.hidden }}/training-metadata.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-python-bucket-gen2-h${{ matrix.hidden }}-${{ github.sha }}
          path: results/
          retention-days: 30
