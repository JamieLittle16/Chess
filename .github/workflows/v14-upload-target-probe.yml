name: V14 exact-upload target probe

on:
  push:
    branches: [analysis/v14-upload-target-probe-20260908]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact competition runtime
        run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Download exact H64 model
        uses: actions/download-artifact@v4
        with:
          pattern: v14-single-student-h64-bb7d2a4ed05ff78d344cc4374d54e35189584993
          path: model-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34202820525
      - name: Materialize source-exact uploaded V14
        shell: bash
        run: |
          set -euo pipefail
          MODEL=$(find model-artifact -type f -name 'student-h64.npz' -print -quit)
          test -n "$MODEL"
          echo '3422cecc3b1226767412e08746ffd6eef9f7e38602ac15b9256b475e6762b598  '"$MODEL" | sha256sum --check --strict
          cat .analysis/v13_chunks_*.b64 | base64 -d > /tmp/v13.zip
          echo '658fd954180c2d0d39c02ba6601af36d06cdbd573bfb72c6879169861a7ad092  /tmp/v13.zip' | sha256sum --check --strict
          rm -rf /tmp/v14 && mkdir -p /tmp/v14 && unzip -q /tmp/v13.zip -d /tmp/v14
          patch /tmp/v14/experiments/numba_search.py < .analysis/v13_jit_refactor.patch
          DIR=/tmp/v14 python - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['DIR'])/'experiments/numba_search.py';s=p.read_text()
          old='    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          new='    correction = correction // 6\n    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          assert s.count(old)==1;s=s.replace(old,new,1);p.write_text(s)
          PY
          python scripts/patch_v13_legality_context.py /tmp/v14/experiments/numba_core.py
          python scripts/patch_v13_qsearch_tactical.py /tmp/v14/experiments/numba_core.py /tmp/v14/experiments/numba_search.py
          cp experiments/v14_student_single_runtime.py /tmp/v14/experiments/v14_student_single_runtime.py
          cp "$MODEL" /tmp/v14/experiments/v14_student_h64.npz
          python scripts/patch_v14_single_student_search.py /tmp/v14/experiments/numba_search.py --numerator 1 --denominator 12
          python scripts/patch_v14_student_lean_qsearch.py /tmp/v14/experiments/numba_search.py
          python scripts/patch_v14_lazy_stable_ordering.py /tmp/v14/experiments/numba_search.py
          curl --fail --location --retry 3 -o /tmp/build_kpk.py https://raw.githubusercontent.com/JamieLittle16/Chess/22cfec2269f87ddf14a9f929f1eda2d6e4ec21d8/scripts/build_v14_kpk_bitbase.py
          curl --fail --location --retry 3 -o /tmp/patch_kpk.py https://raw.githubusercontent.com/JamieLittle16/Chess/22cfec2269f87ddf14a9f929f1eda2d6e4ec21d8/scripts/patch_v14_kpk_exact.py
          python /tmp/build_kpk.py /tmp/v14/v14_kpk.u8 >/tmp/kpk.log
          python /tmp/patch_kpk.py /tmp/v14/agent.py
          echo '136c4e8064e32568e16b722695a6531064ca315cbd223f3553afffecdfe826c0  /tmp/v14/agent.py' | sha256sum --check --strict
          echo '6422eb8eb8713e02e6d62d33ef230f37cf707188e864b575226802aead128b2f  /tmp/v14/experiments/__init__.py' | sha256sum --check --strict
          echo '0306e8145a453d91b9b5ac92e9980931510d9e18f8ba598a7548d08b85165c35  /tmp/v14/experiments/numba_core.py' | sha256sum --check --strict
          echo '334e026abdcfccb334d835fadd8a9396a9dd3532ff089e029a78768f02444007  /tmp/v14/experiments/numba_search.py' | sha256sum --check --strict
          echo '7d0fc5f7a186e79317cf12a2ff285d7716c651fbd045c53d65a3cc6eb1b15319  /tmp/v14/experiments/v13_residual.i16' | sha256sum --check --strict
          echo '3422cecc3b1226767412e08746ffd6eef9f7e38602ac15b9256b475e6762b598  /tmp/v14/experiments/v14_student_h64.npz' | sha256sum --check --strict
          echo 'a295826488040e2c2f33974dce461186b7de233b14e518f0b88e26a090d585c0  /tmp/v14/experiments/v14_student_single_runtime.py' | sha256sum --check --strict
          echo 'c2cc0534a984124c5a75e250bab65f2756ade47341bbca84d6b6871fdb2977f2  /tmp/v14/v14_kpk.u8' | sha256sum --check --strict
          python -m py_compile /tmp/v14/agent.py /tmp/v14/experiments/*.py
      - name: Probe rated-loss positions with production get_move
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe-results
          PYTHONPATH=/tmp/v14 python - <<'PY' | tee probe-results/probe.txt
          import chess, chess.pgn, json, io, agent
          cases=[]
          cases.append(('R61_before_f3','2r3k1/4qp2/4b3/p5p1/4P1P1/2Pr2P1/P4PB1/R1Q2RK1 w - - 1 23',84000))
          pgn='''[FEN "r1bq1rk1/pp1pppbp/2n2np1/2p5/2PP4/2N2NP1/PP2PPBP/R1BQ1RK1 b - - 0 7"]\n[SetUp "1"]\n\n7... cxd4 8. Nxd4 Nxd4 9. Qxd4 d6 10. Qh4 Rb8 11. Bh6 Bxh6 12. Qxh6 e5 13. e4 a5 14. Rad1 Qe7 15. b3 Rd8 16. h3 Be6 17. f4 exf4 18. Rxf4 Nh5 19. Rf3 b6 20. g4 Ng7 21. Rf2 Qd7 22. Rc1 f5 23. exf5 gxf5 *'''
          g=chess.pgn.read_game(io.StringIO(pgn)); b=g.board()
          for m in g.mainline_moves():
              if b.turn==chess.BLACK and b.fullmove_number==21: cases.append(('R62_before_Qd7',b.fen(),93000))
              if b.turn==chess.BLACK and b.fullmove_number==22: cases.append(('R62_before_f5',b.fen(),89000))
              b.push(m)
          cases.append(('R65_endgame_59','8/8/3k4/4N1RP/8/3b4/8/6K1 b - - 0 59',18000))
          cases.append(('R65_endgame_60','8/7b/3k2N1/6RP/8/8/8/6K1 b - - 2 60',18000))
          out=[]
          for name,fen,ms in cases:
              for budget in (ms,120000):
                  agent._GAME_KEYS=[];agent._PENDING_AFTER_OUR_MOVE=None;agent._LAST_CALL_TIME_LEFT_MS=None;agent._LAST_GET_MOVE_ELAPSED_MS=None
                  agent._HASH_KEYS.fill(0);agent._HASH_MOVES.fill(-1);agent._TT_TABLE.fill(0)
                  mv=agent.get_move(fen,budget)
                  row={'case':name,'time_left_ms':budget,'move':mv,'fen':fen};out.append(row);print(json.dumps(row),flush=True)
          open('probe-results/probe.json','w').write(json.dumps(out,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v14-exact-upload-target-probe
          path: probe-results
          retention-days: 7
