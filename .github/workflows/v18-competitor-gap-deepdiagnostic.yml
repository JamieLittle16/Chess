name: V18 competitor-gap deep diagnostic

on:
  push:
    branches: [analysis/v18-competitor-gap-deepdiagnostic-20260911]
    paths: [.github/workflows/v18-competitor-gap-deepdiagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q 'chess==1.11.2'
      - name: Fetch verified Stockfish 19
        run: |
          set -euo pipefail
          mkdir -p /tmp/sf
          curl -L --fail --retry 3 -o /tmp/sf.tar.gz https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz
          echo '9defc0d4e55d49c65a6d042f3e571a39fcea499ade6dbe741b53b8c65e03611f  /tmp/sf.tar.gz' | sha256sum -c -
          tar -xzf /tmp/sf.tar.gz -C /tmp/sf
          SF=$(find /tmp/sf -type f -name 'stockfish*' -perm /111 | head -n1); cp "$SF" /tmp/stockfish19; chmod +x /tmp/stockfish19
      - name: Deep SF19 diagnosis
        run: |
          cat >/tmp/cases.tsv <<'EOF'
          Emile13	26	b8d7	h7h6	rn1r2k1/ppq2ppp/2b1pn2/6B1/1b1P4/1BNQ1N1P/PP3PP1/R4RK1 b - - 8 13
          Ryan11	43	b4b5	e2e3	3nr1k1/1ppq1pp1/r4b1n/p2p2NQ/1P1N3P/P2P2P1/1B2PPK1/R1R5 w - - 3 22
          Ryan31	71	b1e1	b2b4	3r4/5pk1/2r1p3/ppNn2p1/3P4/P5P1/1P1R1PK1/1R6 w - - 4 36
          Ryan7	41	f3g5	c1c5	3nr1k1/1ppq1pp1/r4b2/p2p3Q/1P1N2nP/P2P1NP1/1B2PPK1/R1R5 w - - 1 21
          Ryan4	19	b1c3	c4c5	r1bq1rk1/pp1n1ppp/2pb4/3p4/2PPn3/5N2/PP2BPPP/RNBQR1K1 w - - 4 10
          Ryan6	15	b2b3	b1c3	r1bq1rk1/ppp1bppp/2n2n2/3p4/8/3P1NP1/PP2PPBP/RNBQ1RK1 w - - 0 8
          Emile12	34	a7a5	g7g5	r2r2k1/ppqn1pp1/2b1pn1p/8/3P1b1B/1BN2N1P/PP2QPP1/4RRK1 b - - 5 17
          Ryan13	25	b1d2	f3g5	r2q1rk1/1bp3pp/pn1bpn2/1p3p2/3P1B2/4PNP1/PP2QPBP/RNR3K1 w - - 6 13
          Emile14	14	e8g8	b8c6	rnbqk2r/pp2ppbp/3p1np1/8/3NP3/2N1B2P/PPP2PP1/R2QKB1R b KQkq - 2 7
          Emile4	18	b8d7	b7b6	rnbq1rk1/pp3ppp/2pb4/3p4/2PPn3/5N2/PP2BPPP/RNBQR1K1 b - - 3 9
          EOF
          sed -i 's/^          //' /tmp/cases.tsv
          python - <<'PY'
          import chess,chess.engine
          eng=chess.engine.SimpleEngine.popen_uci('/tmp/stockfish19');eng.configure({'Threads':1,'Hash':256})
          try:
              for raw in open('/tmp/cases.tsv'):
                  name,ply,hist,cand,fen=raw.rstrip().split('\t',4);b=chess.Board(fen);hm=chess.Move.from_uci(hist);cm=chess.Move.from_uci(cand)
                  assert hm in b.legal_moves and cm in b.legal_moves
                  infos=eng.analyse(b,chess.engine.Limit(nodes=5_000_000),multipv=5)
                  pov=b.turn
                  top=[]
                  for info in infos:
                      score=info['score'].pov(pov).score(mate_score=100000); pv=' '.join(m.uci() for m in info.get('pv',[])[:8]);top.append((info['pv'][0].uci(),score,pv))
                  hi=eng.analyse(b,chess.engine.Limit(nodes=5_000_000),root_moves=[hm]);ci=eng.analyse(b,chess.engine.Limit(nodes=5_000_000),root_moves=[cm])
                  hs=hi['score'].pov(pov).score(mate_score=100000);cs=ci['score'].pov(pov).score(mate_score=100000)
                  hpv=' '.join(m.uci() for m in hi.get('pv',[])[:10]);cpv=' '.join(m.uci() for m in ci.get('pv',[])[:10])
                  print('CASE',name,'ply',ply,'HIST',hist,'CAND',cand,'HIST_CP',hs,'CAND_CP',cs,'DELTA',cs-hs,'TOP5',top,'HIST_PV',hpv,'CAND_PV',cpv,'FEN',fen,flush=True)
          finally:eng.quit()
          PY
