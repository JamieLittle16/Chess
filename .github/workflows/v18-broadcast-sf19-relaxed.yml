name: V18 relaxed broadcast Stockfish certification

on:
  push:
    branches: [analysis/v18-broadcast-sf19-relaxed-20260910]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install chess==1.11.2 zstandard
      - name: Widen candidate inspection gate, not the SF acceptance gate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/certify_broadcast_book_sf19.py')
          s=p.read_text()
          old='''        if top_count >= args.min_top_count and share >= args.min_share:\n            candidates.append((key, stat, top_uci, top_count, total, share))\n'''
          new='''        # Inspect either a high-consensus continuation or a substantially observed one.\n        # Stockfish remains the final admission filter, so this widens recall without widening\n        # the permitted evaluation loss.\n        high_consensus = top_count >= 2 and share >= 0.55\n        substantial_sample = top_count >= 12 and share >= 0.25\n        if high_consensus or substantial_sample:\n            candidates.append((key, stat, top_uci, top_count, total, share))\n'''
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
      - name: Download Jan-Jul 2026 official broadcasts
        run: |
          set -euo pipefail
          mkdir -p /tmp/broadcast
          for month in 01 02 03 04 05 06 07; do
            curl --fail --location --retry 5 "https://database.lichess.org/broadcast/lichess_db_broadcast_2026-${month}.pgn.zst" -o "/tmp/broadcast/2026-${month}.pgn.zst"
          done
      - name: Download Stockfish 19
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 'https://github.com/official-stockfish/Stockfish/releases/latest/download/stockfish-linux-x86-64-universal.tar.gz' -o /tmp/sf.tar.gz
          mkdir -p /tmp/sf && tar -xzf /tmp/sf.tar.gz -C /tmp/sf
          SF="$(find /tmp/sf -type f -name 'stockfish*' -perm /111 | head -n1)"
          cp "$SF" /tmp/stockfish19 && chmod +x /tmp/stockfish19
      - name: Certify observed opening moves
        run: |
          set -euo pipefail
          mkdir -p analysis-results/v18-broadcast-relaxed
          python scripts/certify_broadcast_book_sf19.py \
            --input /tmp/broadcast/*.pgn.zst \
            --engine /tmp/stockfish19 \
            --output-dir analysis-results/v18-broadcast-relaxed \
            --max-ply 18 --min-top-count 2 --min-share 0.55 \
            --max-candidates 5000 --shallow-nodes 5000 --deep-nodes 50000 --max-loss-cp 8 \
            | tee analysis-results/v18-broadcast-relaxed/certify.log
          sha256sum analysis-results/v18-broadcast-relaxed/*.bin > analysis-results/v18-broadcast-relaxed/sha256.txt
      - name: Historical-start coverage
        run: |
          python - <<'PY' | tee analysis-results/v18-broadcast-relaxed/coverage.log
          import chess, chess.polyglot, os
          starts=[
            ('R46','Taimanov','r1bqkbnr/pp1p1ppp/2n1p3/8/3NP3/P7/1PP2PPP/RNBQKB1R b KQkq - 0 5'),
            ('R48','Semi-Slav','r1b1k2r/pp1nqppp/2pbpn2/3p4/P1PP4/2N1PN2/1P2BPPP/R1BQ1RK1 b kq - 4 8'),
            ('R49','Italian','r1bqk2r/1pp2ppp/1bnp1n2/pP2p3/P1B1P3/2PP1N2/5PPP/RNBQK2R b KQkq - 0 8'),
            ('R50','London','r1bqk2r/pp3ppp/2nbpn2/2pp4/3P1B2/P1P1P3/1P1N1PPP/R2QKBNR w KQkq - 1 7'),
            ('R51','French Classical','r1bqk2r/pp1n1ppp/2n1p3/2bpP3/5P2/2NB1N2/PPP3PP/R1BQK2R b KQkq - 1 8'),
            ('R53','Najdorf','rnbqk2r/1p2bppp/p2ppn2/8/4PPP1/1NN5/PPP4P/R1BQKB1R b KQkq - 0 8'),
            ('R57','Queens Indian','rn1q1rk1/pbppbppp/1p2pn2/8/2PP4/5NP1/PP2PPBP/RNBQR1K1 b - - 6 7'),
            ('R61','English Symm','r1bq1rk1/pp1pppbp/2n2np1/2p5/2PP4/2N2NP1/PP2PPBP/R1BQ1RK1 b - - 0 7'),
            ('R65','Sveshnikov','r1bqkb1r/1p3ppp/p1np1n2/4p3/P3P3/N1N5/1PP2PPP/R1BQKB1R b KQkq - 1 8'),
            ('R85','French Tarrasch','rnbqkbnr/pp3ppp/8/2pp4/3P4/7P/PPPN1PP1/R1BQKBNR b KQkq - 0 5'),
          ]
          p='analysis-results/v18-broadcast-relaxed/broadcast-sf19-certified.bin'
          hits=0
          with chess.polyglot.open_reader(p) as r:
              for rid,name,fen in starts:
                  b=chess.Board(fen); legal=set(b.legal_moves)
                  es=[e for e in r.find_all(b) if e.move in legal and int(e.weight)>0]
                  es.sort(key=lambda e:(-int(e.weight),e.move.uci()))
                  hits += bool(es)
                  print(rid,f'{name:18}',bool(es),es[0].move.uci() if es else '-')
          print('SUMMARY',hits,'/10','bytes',os.path.getsize(p))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v18-broadcast-relaxed-${{ github.sha }}
          path: analysis-results/v18-broadcast-relaxed
          retention-days: 7
