name: V15 Python qcap6 Gestalt-student screen

on:
  push:
    branches: [analysis/v15-python-qcap6-gestalt-h16-20260911]
    paths:
      - .github/workflows/v15-python-qcap6-gestalt-student-screen.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  screen:
    strategy:
      fail-fast: false
      matrix:
        hidden: [16, 32]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Download exact packaged V14
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - name: Download Gestalt student
        uses: actions/download-artifact@v4
        with:
          name: v15-gestalt-student-h${{ matrix.hidden }}-c3331960a207e4bb10e13252d62be27788d6af5d
          path: model-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34266694827
      - name: Materialize qcap6+presort control and Gestalt candidate
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name Little-Gambit-V14.zip -print -quit)
          MODEL=$(find model-artifact -type f -name 'bucket-h${{ matrix.hidden }}.npz' -print -quit)
          test -n "$ZIP"; test -n "$MODEL"
          rm -rf /tmp/control /tmp/cand results; mkdir -p /tmp/control /tmp/cand results
          unzip -q "$ZIP" -d /tmp/control; cp -a /tmp/control/. /tmp/cand/
          cp "$MODEL" /tmp/cand/experiments/v15_bucket_student.npz
          python scripts/patch_v15_python_bucket_student_runtime.py /tmp/cand/experiments/numba_search.py ${{ matrix.hidden }}
          for d in /tmp/control /tmp/cand; do
            python scripts/patch_v15_python_qsearch_cap.py "$d/experiments/numba_search.py" 6
            python scripts/patch_v15_python_presort_once.py "$d/experiments/numba_search.py"
          done
          python -m py_compile tools/v14_agent_runner.py tools/v14_fixed_node_arena.py /tmp/control/agent.py /tmp/cand/agent.py /tmp/control/experiments/*.py /tmp/cand/experiments/*.py
          PYTHONPATH=/tmp/cand python - <<'PY'
          import chess,numpy as np
          from experiments.numba_core import encode_position,move_to_uci
          from experiments.numba_search import iterative_search_stateful,EVAL_WIDTH
          b=chess.Board();e=encode_position(b);h=np.empty(0,dtype=np.uint64)
          o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,6000)
          m=chess.Move.from_uci(move_to_uci(int(o[0])));assert m in b.legal_moves
          print('smoke',tuple(int(x) for x in o[:4]),'eval_width',EVAL_WIDTH)
          PY
      - name: Build disjoint holdout books
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          rm -rf /tmp/m6; mkdir /tmp/m6; python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]
          fixed=fresh[4300:4332]; timed=fresh[4332:4348]
          assert len(fixed)==32 and len(timed)==16 and set(fixed).isdisjoint(timed)
          Path('/tmp/gestalt-fixed.epd').write_text('\n'.join(fixed)+'\n')
          Path('/tmp/gestalt-timed.epd').write_text('\n'.join(timed)+'\n')
          print({'fresh':len(fresh),'fixed_range':[4300,4332],'timed_range':[4332,4348]})
          PY
      - name: Throughput probe
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/worker.py <<'PY'
          import json,sys,chess,numpy as np
          from experiments.numba_core import encode_position
          from experiments.numba_search import iterative_search_stateful
          for line in sys.stdin:
              q=json.loads(line);b=chess.Board(q['fen']);e=encode_position(b);h=np.empty(0,dtype=np.uint64)
              o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,int(q['nodes']))
              print(json.dumps({'nodes':int(o[3]),'depth':int(o[2])}),flush=True)
          PY
          python - <<'PY'
          import json,os,statistics,subprocess,sys,time
          from pathlib import Path
          roots=[x.strip() for x in Path('/tmp/gestalt-fixed.epd').read_text().splitlines() if x.strip()][:16]
          def start(d):
              e=os.environ.copy();e['PYTHONPATH']=d
              return subprocess.Popen([sys.executable,'/tmp/worker.py'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env=e)
          def one(p,fen,n):
              p.stdin.write(json.dumps({'fen':fen,'nodes':n})+'\n');p.stdin.flush();return json.loads(p.stdout.readline())
          def timed(p,order):
              nodes=0;ds=[];t=time.perf_counter()
              for fen in order:
                  z=one(p,fen,25000);nodes+=z['nodes'];ds.append(z['depth'])
              return nodes/(time.perf_counter()-t),sum(ds)/len(ds)
          b=start('/tmp/control');c=start('/tmp/cand');rat=[];rows=[]
          try:
              one(b,roots[0],500);one(c,roots[0],500)
              for r in range(3):
                  order=roots if r%2==0 else list(reversed(roots))
                  if r%2==0: bn,bd=timed(b,order);cn,cd=timed(c,order)
                  else: cn,cd=timed(c,order);bn,bd=timed(b,order)
                  rat.append(cn/bn);rows.append({'base_nps':bn,'candidate_nps':cn,'ratio':cn/bn,'base_depth':bd,'candidate_depth':cd})
          finally:
              b.terminate();c.terminate();b.wait();c.wait()
          out={'hidden':${{ matrix.hidden }},'median_nps_ratio':statistics.median(rat),'rows':rows}
          Path('results/throughput.json').write_text(json.dumps(out,indent=2)+'\n');print('FINAL',out)
          PY
      - name: Fixed-node screen — 64 colour-swapped games
        shell: bash
        run: |
          python -u tools/v14_fixed_node_arena.py /tmp/cand /tmp/control --nodes 18000 --pairs 32 --opening-file /tmp/gestalt-fixed.epd --opening-offset 0 --max-plies 220 --json-out results/fixed.json | tee results/fixed.log
      - name: Competition API timed screen — 32 colour-swapped games
        shell: bash
        run: |
          python - <<'PY'
          import json,math,queue,subprocess,sys,threading,time
          from collections import Counter,deque
          from pathlib import Path
          import chess
          BASE_MS=2500;INC_MS=50;MAX_PLIES=180;GRACE_MS=1200
          openings=[x.strip() for x in Path('/tmp/gestalt-timed.epd').read_text().splitlines() if x.strip()]
          class Agent:
              def __init__(self,d):
                  self.p=subprocess.Popen([sys.executable,'tools/v14_agent_runner.py',d],stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,bufsize=1)
                  self.q=queue.Queue();self.err=deque(maxlen=100)
                  threading.Thread(target=self._out,daemon=True).start();threading.Thread(target=self._err,daemon=True).start();assert json.loads(self._line(95)).get('ready') is True
              def _out(self):
                  for x in self.p.stdout:self.q.put(x.rstrip('\n'))
                  self.q.put(None)
              def _err(self):
                  for x in self.p.stderr:self.err.append(x.rstrip('\n'))
              def _line(self,t):
                  try:x=self.q.get(timeout=t)
                  except queue.Empty as e:raise RuntimeError('timeout') from e
                  if x is None:raise RuntimeError('closed '+'\n'.join(self.err))
                  return x
              def reset(self):
                  self.p.stdin.write(json.dumps({'reset':True})+'\n');self.p.stdin.flush();assert json.loads(self._line(5)).get('reset') is True
              def move(self,b,ms):
                  self.p.stdin.write(json.dumps({'fen':b.fen(),'time_left_ms':max(0,int(ms))})+'\n');self.p.stdin.flush();z=json.loads(self._line((max(0,ms)+GRACE_MS)/1000));m=chess.Move.from_uci(z['move']);assert m in b.legal_moves;return m
              def stop(self):
                  if self.p.poll() is None:self.p.kill()
                  self.p.wait(timeout=5)
          base=Agent('/tmp/control');cand=Agent('/tmp/cand');rows=[];pairs=[]
          def play(fen,cw):
              b=chess.Board(fen);cl={chess.WHITE:float(BASE_MS),chess.BLACK:float(BASE_MS)};base.reset();cand.reset();tim=[]
              for _ in range(MAX_PLIES):
                  o=b.outcome(claim_draw=True)
                  if o is not None:return (0.5 if o.winner is None else float(o.winner==cw)),b.result(claim_draw=True),tim
                  side=b.turn;use=side==cw;e=cand if use else base;t=time.monotonic()
                  try:m=e.move(b,cl[side])
                  except Exception as ex:return (0.0 if use else 1.0),f'engine-failure:{type(ex).__name__}',tim
                  dt=(time.monotonic()-t)*1000;cl[side]-=dt
                  if cl[side]<0:return (0.0 if use else 1.0),'flag',tim
                  tim.append((use,dt));b.push(m);cl[side]+=INC_MS
              return 0.5,'max-ply-draw',tim
          try:
              for i,fen in enumerate(openings):
                  ps=0.0
                  for cw in (True,False):
                      s,r,t=play(fen,cw);ps+=s;rows.append({'opening':i,'candidate_white':cw,'score':s,'result':r,'candidate_ms':[x for c,x in t if c],'control_ms':[x for c,x in t if not c]});print(i,cw,s,r,flush=True)
                  pairs.append(ps)
          finally:base.stop();cand.stop()
          score=sum(r['score'] for r in rows);n=len(rows);f=score/n;elo=400*math.log10(f/(1-f)) if 0<f<1 else None
          ct=[x for r in rows for x in r['candidate_ms']];bt=[x for r in rows for x in r['control_ms']]
          out={'hidden':${{ matrix.hidden }},'candidate':'qcap6+presort+Gestalt student','control':'qcap6+presort','games':n,'score':score,'score_fraction':f,'naive_elo_from_score':elo,'candidate_mean_move_ms':sum(ct)/max(1,len(ct)),'control_mean_move_ms':sum(bt)/max(1,len(bt)),'pair_histogram':dict(Counter(str(x) for x in pairs)),'terminations':dict(Counter(r['result'] for r in rows)),'details':rows}
          Path('results/timed.json').write_text(json.dumps(out,indent=2)+'\n');print('FINAL',json.dumps({k:v for k,v in out.items() if k!='details'}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-python-qcap6-gestalt-h${{ matrix.hidden }}-${{ github.sha }}
          path: results/
          retention-days: 30
