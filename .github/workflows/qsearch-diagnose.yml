name: Qsearch diagnostics

on:
  push:
    branches:
      - m4/quiescence-v1

permissions:
  contents: read

jobs:
  hotspot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        test:
          - poisoned_capture_is_rejected_at_the_horizon
          - mutable_search_restores_the_position_exactly
          - iterative_deepening_reuses_table_and_matches_exact_score
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Run isolated search test
        run: cargo test -p chess-search "${{ matrix.test }}" -- --nocapture

  search-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - run: cargo test -p chess-search

  screening:
    name: Qsearch v1 vs frozen M3
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Build candidate
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_TARGET="$PWD/.qualification/candidate-target"
          CARGO_TARGET_DIR="$CANDIDATE_TARGET" cargo build --release -p chess-uci
          echo "CANDIDATE_BIN=$CANDIDATE_TARGET/release/chess-uci" >> "$GITHUB_ENV"

      - name: Build frozen M3 reference
        shell: bash
        run: |
          set -euo pipefail
          M3_SHA=5185f2c8de64b78ff84df12067d88d9f43ed3cb0
          git fetch --depth=1 origin "$M3_SHA"
          git worktree add --detach .qualification/m3-reference "$M3_SHA"
          REFERENCE_TARGET="$PWD/.qualification/reference-target"
          (
            cd .qualification/m3-reference
            CARGO_TARGET_DIR="$REFERENCE_TARGET" cargo build --release -p chess-uci
          )
          echo "REFERENCE_BIN=$REFERENCE_TARGET/release/chess-uci" >> "$GITHUB_ENV"

      - name: Fetch pinned Fastchess
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qualification/fastchess
          curl --fail --location --retry 3 \
            --output .qualification/fastchess.tar \
            https://github.com/Disservin/fastchess/releases/download/v1.8.2-alpha/fastchess-linux-x86-64.tar
          echo '1003f920bebe841acdab5e6d7871e93171a4586857b3ec91c21ef5777f26ff96  .qualification/fastchess.tar' | sha256sum --check --strict
          tar -xf .qualification/fastchess.tar -C .qualification/fastchess
          FASTCHESS_BIN=$(find "$PWD/.qualification/fastchess" -type f -name fastchess -perm -111 -print -quit)
          test -n "$FASTCHESS_BIN"
          echo "FASTCHESS_BIN=$FASTCHESS_BIN" >> "$GITHUB_ENV"

      - name: Record runner identity
        shell: bash
        run: |
          set -euo pipefail
          "$FASTCHESS_BIN" -version
          sha256sum "$CANDIDATE_BIN" "$REFERENCE_BIN" "$FASTCHESS_BIN" match/openings/m3-uho-lichess-100-v1.epd

      - name: Run paired equal-time screening
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA=${GITHUB_SHA:0:12}
          python3 scripts/match_harness.py \
            --protocol match/protocols/m4-qsearch-v1-screening.json \
            --candidate "$CANDIDATE_BIN" \
            --candidate-name "Chess-M4-qsearch@$SHORT_SHA" \
            --reference "$REFERENCE_BIN" \
            --reference-name 'Chess-M3@5185f2c8de64' \
            --fastchess "$FASTCHESS_BIN" \
            --openings match/openings/m3-uho-lichess-100-v1.epd \
            --output-dir screening-results

      - name: Upload retained screening evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-qsearch-vs-m3-${{ github.sha }}
          path: screening-results/
          if-no-files-found: warn
          retention-days: 30
