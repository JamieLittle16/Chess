name: V15 Python root-qcheck timed qualification

on:
  push:
    branches: [analysis/v15-python-root-qcheck-timed-20260908]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  timed:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact competition runtime
        run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Download exact packaged V14 and materialize candidate
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - name: Build exact A/B
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name 'Little-Gambit-V14.zip' -print -quit); test -n "$ZIP"
          rm -rf /tmp/base /tmp/cand; mkdir -p /tmp/base /tmp/cand results
          unzip -q "$ZIP" -d /tmp/base; cp -a /tmp/base/. /tmp/cand/
          python scripts/patch_v15_python_root_qcheck.py /tmp/cand/experiments/numba_search.py
          python -m py_compile tools/v14_agent_runner.py /tmp/base/agent.py /tmp/base/experiments/*.py /tmp/cand/agent.py /tmp/cand/experiments/*.py
      - name: Build fresh pinned timed book
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          rm -rf /tmp/uho; mkdir /tmp/uho; unzip -q /tmp/uho.zip -d /tmp/uho
          UHO=$(find /tmp/uho -type f -name '*.epd' -print -quit); test -n "$UHO"
          UHO="$UHO" python - <<'PY'
          import os,chess
          from pathlib import Path
          rows=Path(os.environ['UHO']).read_text(errors='ignore').splitlines(); out=[]
          for raw in rows[2400:2800]:
              f=raw.strip().split()
              if len(f)<4: continue
              fen=' '.join(f[:4])+' 0 1'
              try: b=chess.Board(fen)
              except ValueError: continue
              if b.is_game_over(claim_draw=False): continue
              out.append(fen)
              if len(out)==16: break
          assert len(out)==16,len(out)
          Path('/tmp/timed.epd').write_text('\n'.join(out)+'\n')
          PY
          sha256sum /tmp/timed.epd | tee results/timed-openings.sha256
      - name: Timed competition-API A/B
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,math,queue,subprocess,sys,threading,time
          from collections import Counter,deque
          from pathlib import Path
          import chess
          BASE_MS=2500; INC_MS=50; MAX_PLIES=180; GRACE_MS=1200
          openings=[x.strip() for x in open('/tmp/timed.epd') if x.strip()]
          class P:
              def __init__(self,d):
                  self.p=subprocess.Popen([sys.executable,'tools/v14_agent_runner.py',d],stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,bufsize=1)
                  self.q=queue.Queue();self.err=deque(maxlen=80)
                  threading.Thread(target=self.ro,daemon=True).start();threading.Thread(target=self.re,daemon=True).start()
                  assert json.loads(self.line(95)).get('ready') is True
              def ro(self):
                  for x in self.p.stdout:self.q.put(x.rstrip('\n'))
                  self.q.put(None)
              def re(self):
                  for x in self.p.stderr:self.err.append(x.rstrip('\n'))
              def line(self,t):
                  try:x=self.q.get(timeout=t)
                  except queue.Empty as e:raise RuntimeError('timeout') from e
                  if x is None:raise RuntimeError('closed '+'\n'.join(self.err))
                  return x
              def reset(self):
                  self.p.stdin.write(json.dumps({'reset':True})+'\n');self.p.stdin.flush();assert json.loads(self.line(5)).get('reset') is True
              def move(self,b,ms):
                  self.p.stdin.write(json.dumps({'fen':b.fen(),'time_left_ms':max(0,int(ms))})+'\n');self.p.stdin.flush()
                  z=json.loads(self.line((max(0,ms)+GRACE_MS)/1000));m=chess.Move.from_uci(z['move']);assert m in b.legal_moves;return m
              def stop(self):
                  if self.p.poll() is None:self.p.kill()
                  self.p.wait(timeout=5)
          base=P('/tmp/base');cand=P('/tmp/cand');rows=[];pairs=[]
          def play(fen,cw):
              b=chess.Board(fen);cl={chess.WHITE:float(BASE_MS),chess.BLACK:float(BASE_MS)};base.reset();cand.reset();tim=[]
              for _ in range(MAX_PLIES):
                  o=b.outcome(claim_draw=True)
                  if o is not None:return (0.5 if o.winner is None else float(o.winner==cw)),b.result(claim_draw=True),tim
                  side=b.turn;use=side==cw;e=cand if use else base;t=time.monotonic()
                  try:m=e.move(b,cl[side])
                  except Exception as ex:return (0.0 if use else 1.0),f'engine-failure:{type(ex).__name__}',tim
                  dt=(time.monotonic()-t)*1000;cl[side]-=dt
                  if cl[side]<0:return (0.0 if use else 1.0),'flag',tim
                  tim.append((use,dt));b.push(m);cl[side]+=INC_MS
              return 0.5,'max-ply-draw',tim
          try:
              for i,fen in enumerate(openings):
                  ps=0
                  for cw in (True,False):
                      s,r,t=play(fen,cw);ps+=s;rows.append({'opening':i,'candidate_white':cw,'score':s,'result':r,'candidate_ms':[x for c,x in t if c],'control_ms':[x for c,x in t if not c]});print(i,cw,s,r,flush=True)
                  pairs.append(ps)
          finally:base.stop();cand.stop()
          score=sum(r['score'] for r in rows);n=len(rows);f=score/n;elo=400*math.log10(f/(1-f)) if 0<f<1 else None
          ct=[x for r in rows for x in r['candidate_ms']];bt=[x for r in rows for x in r['control_ms']]
          out={'games':n,'score':score,'score_fraction':f,'naive_elo_from_score':elo,'pair_histogram':dict(Counter(str(x) for x in pairs)),'terminations':dict(Counter(r['result'] for r in rows)),'candidate_mean_move_ms':sum(ct)/max(1,len(ct)),'control_mean_move_ms':sum(bt)/max(1,len(bt)),'details':rows}
          Path('results/timed.json').write_text(json.dumps(out,indent=2)+'\n');print(json.dumps({k:v for k,v in out.items() if k!='details'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-python-root-qcheck-timed-${{ github.sha }}
          path: results/
          retention-days: 30
