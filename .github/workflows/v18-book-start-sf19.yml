name: V18 book moves on real starts vs Stockfish 19

on:
  push:
    branches: [analysis/v18-book-start-sf19-20260910]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install chess==1.11.2
      - name: Download books
        run: |
          set -euo pipefail
          for asset in gm2001 codekiddy book; do
            curl --fail --location --retry 5 \
              "https://github.com/ChrisWhittington/polyglot-books/releases/download/v1.0/${asset}.zip" \
              -o "/tmp/${asset}.zip"
            mkdir -p "/tmp/${asset}"
            unzip -q "/tmp/${asset}.zip" -d "/tmp/${asset}"
            BIN="$(find "/tmp/${asset}" -type f -name '*.bin' | head -n1)"
            cp "$BIN" "/tmp/${asset}.bin"
            echo "$asset $(sha256sum /tmp/${asset}.bin | cut -d' ' -f1) $(stat -c%s /tmp/${asset}.bin)"
          done
      - name: Download Stockfish 19
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 \
            'https://github.com/official-stockfish/Stockfish/releases/latest/download/stockfish-linux-x86-64-universal.tar.gz' \
            -o /tmp/sf.tar.gz
          mkdir /tmp/sf && tar -xzf /tmp/sf.tar.gz -C /tmp/sf
          SF="$(find /tmp/sf -type f -name 'stockfish*' -perm /111 | head -n1)"
          cp "$SF" /tmp/stockfish19 && chmod +x /tmp/stockfish19
      - name: Deep-audit top book continuations
        run: |
          mkdir -p analysis-results/v18-book-start-sf19
          python - <<'PY' | tee analysis-results/v18-book-start-sf19/audit.txt
          import chess, chess.engine, chess.polyglot, statistics

          starts = [
            ('R46','Taimanov','r1bqkbnr/pp1p1ppp/2n1p3/8/3NP3/P7/1PP2PPP/RNBQKB1R b KQkq - 0 5'),
            ('R48','Semi-Slav','r1b1k2r/pp1nqppp/2pbpn2/3p4/P1PP4/2N1PN2/1P2BPPP/R1BQ1RK1 b kq - 4 8'),
            ('R49','Italian','r1bqk2r/1pp2ppp/1bnp1n2/pP2p3/P1B1P3/2PP1N2/5PPP/RNBQK2R b KQkq - 0 8'),
            ('R50','London','r1bqk2r/pp3ppp/2nbpn2/2pp4/3P1B2/P1P1P3/1P1N1PPP/R2QKBNR w KQkq - 1 7'),
            ('R51','French Classical','r1bqk2r/pp1n1ppp/2n1p3/2bpP3/5P2/2NB1N2/PPP3PP/R1BQK2R b KQkq - 1 8'),
            ('R53','Najdorf','rnbqk2r/1p2bppp/p2ppn2/8/4PPP1/1NN5/PPP4P/R1BQKB1R b KQkq - 0 8'),
            ('R57','Queens Indian','rn1q1rk1/pbppbppp/1p2pn2/8/2PP4/5NP1/PP2PPBP/RNBQR1K1 b - - 6 7'),
            ('R61','English Symm','r1bq1rk1/pp1pppbp/2n2np1/2p5/2PP4/2N2NP1/PP2PPBP/R1BQ1RK1 b - - 0 7'),
            ('R65','Sveshnikov','r1bqkb1r/1p3ppp/p1np1n2/4p3/P3P3/N1N5/1PP2PPP/R1BQKB1R b KQkq - 1 8'),
            ('R85','French Tarrasch','rnbqkbnr/pp3ppp/8/2pp4/3P4/7P/PPPN1PP1/R1BQKBNR b KQkq - 0 5'),
          ]
          books = {name: chess.polyglot.open_reader(f'/tmp/{name}.bin') for name in ('gm2001','codekiddy','book')}
          eng = chess.engine.SimpleEngine.popen_uci('/tmp/stockfish19')
          if 'Threads' in eng.options: eng.configure({'Threads': 1})
          if 'Hash' in eng.options: eng.configure({'Hash': 128})
          nodes = 500_000

          def top(reader, board):
              legal=set(board.legal_moves)
              es=[e for e in reader.find_all(board) if e.move in legal and int(e.weight)>0]
              es.sort(key=lambda e:(-int(e.weight),e.move.uci()))
              return es[0].move if es else None
          def cp(score, turn):
              x=score.pov(turn).score(mate_score=100000)
              return int(x if x is not None else 0)
          def clear():
              if 'Clear Hash' in eng.options: eng.configure({'Clear Hash': None})

          all_losses={name:[] for name in books}
          for rid,label,fen in starts:
              b=chess.Board(fen)
              clear(); best=eng.analyse(b,chess.engine.Limit(nodes=nodes))
              bestmove=best['pv'][0]; bestcp=cp(best['score'],b.turn)
              print(f'\n{rid} {label} ply={b.ply()} SFbest={bestmove.uci()} eval={bestcp:+d}')
              for name,reader in books.items():
                  m=top(reader,b)
                  if m is None:
                      print(f'  {name:10} MISS')
                      continue
                  vals=[]
                  for _ in range(2):
                      clear(); info=eng.analyse(b,chess.engine.Limit(nodes=nodes),root_moves=[m])
                      vals.append(cp(info['score'],b.turn))
                  forced=min(vals)  # conservative of the repeated measurements
                  loss=max(0,bestcp-forced)
                  all_losses[name].append(loss)
                  print(f'  {name:10} move={m.uci()} evals={vals} conservative={forced:+d} loss={loss:3d}cp')
          print('\nSUMMARY')
          for name,losses in all_losses.items():
              if losses:
                  print(f'{name:10} hits={len(losses)}/10 mean_loss={statistics.mean(losses):.2f} median={statistics.median(losses):.1f} max={max(losses)} within10={sum(x<=10 for x in losses)}/{len(losses)} within20={sum(x<=20 for x in losses)}/{len(losses)}')
              else: print(name,'no hits')
          eng.quit()
          for r in books.values(): r.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v18-book-start-sf19-${{ github.sha }}
          path: analysis-results/v18-book-start-sf19
          retention-days: 7
