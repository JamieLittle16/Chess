name: V15 Python Gestalt H16 over qcap6 gate

on:
  push:
    branches: [analysis/v15-python-gestalt-h16-qcap6-gate-20260908]
    paths:
      - .github/workflows/v15-python-gestalt-h16-qcap6-gate.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0

      - name: Download exact packaged V14
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775

      - name: Download exact Gestalt-distilled H16
        uses: actions/download-artifact@v4
        with:
          name: v15-gestalt-student-h16-c3331960a207e4bb10e13252d62be27788d6af5d
          path: model-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34266694827

      - name: Materialize qcap6 control and Gestalt-H16 candidate
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name Little-Gambit-V14.zip -print -quit)
          MODEL=$(find model-artifact -type f -name bucket-h16.npz -print -quit)
          test -n "$ZIP"; test -n "$MODEL"
          rm -rf /tmp/base /tmp/cand /tmp/m6 results
          mkdir -p /tmp/base /tmp/cand /tmp/m6 results
          unzip -q "$ZIP" -d /tmp/base
          python scripts/patch_v15_python_qsearch_cap.py /tmp/base/experiments/numba_search.py 6
          cp -a /tmp/base/. /tmp/cand/
          cp "$MODEL" /tmp/cand/experiments/v15_bucket_student.npz
          python scripts/patch_v15_python_bucket_student_runtime.py /tmp/cand/experiments/numba_search.py 16
          python -m py_compile tools/v14_agent_runner.py /tmp/base/agent.py /tmp/cand/agent.py /tmp/base/experiments/*.py /tmp/cand/experiments/*.py
          grep -n '^MAX_QPLY' /tmp/base/experiments/numba_search.py /tmp/cand/experiments/numba_search.py

      - name: Verify incremental evaluator parity
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp/cand python - <<'PY'
          import chess,numpy as np
          from experiments.numba_core import MAX_MOVES,KING,encode_position,generate_legal_moves_into_with_king,make_move_inplace,undo_move_inplace
          from experiments.numba_search import EVAL_WIDTH,_build_eval_state_into,_advance_eval_state_into
          fens=[
            chess.STARTING_FEN,
            'r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 0 1',
            '4k3/P7/8/8/8/8/7p/4K3 w - - 0 1',
            '4k3/8/8/3pP3/8/8/8/4K3 w - d6 0 1',
            'r3k2r/8/8/8/8/8/8/R3K2R w KQkq - 0 1',
          ]
          checked=0
          for fen in fens:
              b=chess.Board(fen);e=encode_position(b);board=e.board.copy();pseudo=np.empty(MAX_MOVES,dtype=np.int32);legal=np.empty(MAX_MOVES,dtype=np.int32)
              own=int(np.flatnonzero(board==e.side*KING)[0]);n=generate_legal_moves_into_with_king(board,e.side,e.castling,e.ep_square,pseudo,legal,own)
              parent=np.empty(EVAL_WIDTH,dtype=np.int32);_build_eval_state_into(board,parent)
              for i in range(n):
                  move=int(legal[i]);child=np.empty(EVAL_WIDTH,dtype=np.int32);_advance_eval_state_into(board,e.side,move,parent,child)
                  cc,ce,cap,capsq=make_move_inplace(board,e.side,e.castling,e.ep_square,move)
                  expected=np.empty(EVAL_WIDTH,dtype=np.int32);_build_eval_state_into(board,expected)
                  if not np.array_equal(child,expected):
                      bad=np.flatnonzero(child!=expected);raise SystemExit(f'incremental drift fen={fen} move={move} bad={bad[:12]}')
                  undo_move_inplace(board,e.side,move,cap,capsq);checked+=1
          print('incremental_parity_moves',checked,'eval_width',EVAL_WIDTH)
          PY

      - name: Build untouched holdout opening books
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]
          # Gestalt distillation trained from fresh[0:4000]. Stay completely outside those roots.
          fixed=fresh[4200:4248]; timed=fresh[4248:4280]
          assert len(fixed)==48 and len(timed)==32 and not set(fixed)&set(timed)
          Path('/tmp/gestalt-h16-fixed-48.epd').write_text('\n'.join(fixed)+'\n')
          Path('/tmp/gestalt-h16-timed-32.epd').write_text('\n'.join(timed)+'\n')
          print({'fresh_roots':len(fresh),'fixed_range':[4200,4248],'timed_range':[4248,4280]})
          PY

      - name: Throughput gate
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/worker.py <<'PY'
          import json,sys,chess,numpy as np
          from experiments.numba_core import encode_position
          from experiments.numba_search import iterative_search_stateful
          for line in sys.stdin:
              q=json.loads(line);b=chess.Board(q['fen']);e=encode_position(b);h=np.empty(0,dtype=np.uint64)
              o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,int(q['nodes']))
              print(json.dumps({'nodes':int(o[3]),'depth':int(o[2])}),flush=True)
          PY
          python - <<'PY'
          import json,os,statistics,subprocess,sys,time
          from pathlib import Path
          roots=[x.strip() for x in Path('/tmp/gestalt-h16-fixed-48.epd').read_text().splitlines() if x.strip()][:16]
          def start(d):
              e=os.environ.copy();e['PYTHONPATH']=d;return subprocess.Popen([sys.executable,'/tmp/worker.py'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env=e)
          def one(p,fen,n):p.stdin.write(json.dumps({'fen':fen,'nodes':n})+'\n');p.stdin.flush();return json.loads(p.stdout.readline())
          def timed(p,order):
              nodes=0;ds=[];t=time.perf_counter()
              for fen in order:
                  z=one(p,fen,25000);nodes+=z['nodes'];ds.append(z['depth'])
              return nodes/(time.perf_counter()-t),sum(ds)/len(ds)
          b=start('/tmp/base');c=start('/tmp/cand');rat=[];rows=[]
          try:
              one(b,roots[0],500);one(c,roots[0],500)
              for r in range(3):
                  order=roots if r%2==0 else list(reversed(roots))
                  if r%2==0:bn,bd=timed(b,order);cn,cd=timed(c,order)
                  else:cn,cd=timed(c,order);bn,bd=timed(b,order)
                  rat.append(cn/bn);rows.append({'rep':r,'base_nps':bn,'candidate_nps':cn,'ratio':cn/bn,'base_depth':bd,'candidate_depth':cd})
          finally:b.terminate();c.terminate();b.wait();c.wait()
          out={'candidate':'qcap6+Gestalt-H16','control':'qcap6+V14-H64','median_nps_ratio':statistics.median(rat),'rows':rows}
          Path('results/throughput.json').write_text(json.dumps(out,indent=2)+'\n');print('FINAL',out)
          PY

      - name: Equal-node A/B — 96 colour-swapped games
        shell: bash
        run: |
          set -euo pipefail
          python -u tools/v14_fixed_node_arena.py /tmp/cand /tmp/base --nodes 18000 --pairs 48 --opening-file /tmp/gestalt-h16-fixed-48.epd --opening-offset 0 --max-plies 220 --json-out results/fixed-node.json | tee results/fixed-node.log

      - name: Competition-clock A/B — 64 colour-swapped games
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/v15_competition_gate.py \
            --control /tmp/base --candidate /tmp/cand \
            --openings /tmp/gestalt-h16-timed-32.epd \
            --output results/timed.json \
            --label 'qcap6+Gestalt-H16 vs qcap6+V14-H64' \
            --base-ms 2500 --inc-ms 50 --max-plies 180 | tee results/timed.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-python-gestalt-h16-qcap6-gate-${{ github.sha }}
          path: results/
          retention-days: 30
