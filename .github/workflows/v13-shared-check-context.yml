name: V13 shared check context

on:
  push:
    branches:
      - analysis/v13-shared-check-context-20260907
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.98.1

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 169fb5d424d90ebc45577ecaabe2a8fa0b4c1c10
          path: rust-ref
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact runtime and Stockfish
        run: |
          python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
          sudo apt-get update -qq
          sudo apt-get install -y stockfish
      - name: Reconstruct quarter-legality control and candidate
        shell: bash
        run: |
          set -euo pipefail
          cat .analysis/v13_chunks_*.b64 | base64 -d > /tmp/v13.zip
          echo '658fd954180c2d0d39c02ba6601af36d06cdbd573bfb72c6879169861a7ad092  /tmp/v13.zip' | sha256sum -c -
          rm -rf /tmp/base /tmp/cand
          mkdir /tmp/base /tmp/cand
          unzip -q /tmp/v13.zip -d /tmp/base
          unzip -q /tmp/v13.zip -d /tmp/cand
          patch /tmp/base/experiments/numba_search.py < .analysis/v13_jit_refactor.patch
          patch /tmp/cand/experiments/numba_search.py < .analysis/v13_jit_refactor.patch
          for DIR in /tmp/base /tmp/cand; do
            DIR="$DIR" python - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['DIR'])/'experiments/numba_search.py'; s=p.read_text()
          old='    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          new='    correction = correction // 4\n    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          assert s.count(old)==1,s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
            python scripts/patch_v13_legality_context.py "$DIR/experiments/numba_core.py"
          done
          python scripts/patch_v13_shared_check_context.py /tmp/cand/experiments/numba_core.py /tmp/cand/experiments/numba_search.py
          python -m py_compile /tmp/base/agent.py /tmp/base/experiments/*.py /tmp/cand/agent.py /tmp/cand/experiments/*.py
      - name: Check-state parity over random positions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,random,sys,chess,numpy as np
          def load(name,path):
              spec=importlib.util.spec_from_file_location(name,path); m=importlib.util.module_from_spec(spec); sys.modules[name]=m; spec.loader.exec_module(m); return m
          m=load('candcore','/tmp/cand/experiments/numba_core.py')
          rng=random.Random(20260907); checked=0
          for game in range(100):
              b=chess.Board()
              for ply in range(120):
                  e=m.encode_position(b); p=np.empty(256,dtype=np.int32); l=np.empty(256,dtype=np.int32); k=b.king(b.turn); k=-1 if k is None else int(k)
                  n,c=m.generate_legal_moves_into_with_king_and_check(e.board,e.side,e.castling,e.ep_square,p,l,k)
                  assert bool(c)==b.is_check(),(b.fen(),c,b.is_check())
                  assert n==b.legal_moves.count(),(b.fen(),n,b.legal_moves.count())
                  checked+=1
                  moves=list(b.legal_moves)
                  if not moves: break
                  b.push(moves[rng.randrange(len(moves))])
          print('check/legal parity positions',checked)
          assert checked>=10000
          PY
      - name: Exact fixed-node search parity and throughput
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/worker.py <<'PY'
          import json,sys,chess,numpy as np
          from experiments.numba_core import encode_position
          from experiments.numba_search import iterative_search_stateful
          for line in sys.stdin:
              try:
                  q=json.loads(line); b=chess.Board(q['fen']); e=encode_position(b); h=np.empty(0,dtype=np.uint64)
                  o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,int(q['nodes']))
                  print(json.dumps({'move':int(o[0]),'score':int(o[1]),'depth':int(o[2]),'nodes':int(o[3])}),flush=True)
              except Exception as exc: print(json.dumps({'error':repr(exc)}),flush=True)
          PY
          python - <<'PY'
          import json,os,subprocess,sys,time,statistics
          roots=[x.strip() for x in open('match/openings/m3-uho-lichess-100-v1.epd') if x.strip() and not x.startswith('#')][:40]
          def start(path):
              env=os.environ.copy(); env['PYTHONPATH']=path
              return subprocess.Popen([sys.executable,'/tmp/worker.py'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,bufsize=1,env=env)
          def ask(p,fen,n):
              p.stdin.write(json.dumps({'fen':fen,'nodes':n})+'\n');p.stdin.flush();line=p.stdout.readline()
              if not line: raise RuntimeError(p.stderr.read()[-4000:])
              o=json.loads(line)
              if 'error' in o: raise RuntimeError(o)
              return o
          a=start('/tmp/base');b=start('/tmp/cand'); ratios=[]
          try:
              ask(a,roots[0],300);ask(b,roots[0],300)
              for rep in range(3):
                  order=roots if rep%2==0 else list(reversed(roots))
                  t=time.perf_counter(); ar=[ask(a,f,30000) for f in order]; at=time.perf_counter()-t
                  t=time.perf_counter(); br=[ask(b,f,30000) for f in order]; bt=time.perf_counter()-t
                  for i,(x,y) in enumerate(zip(ar,br)): assert x==y,(rep,i,x,y)
                  ratios.append(at/bt); print('rep',rep,'base_s',at,'cand_s',bt,'speedup',at/bt)
          finally:
              a.terminate();b.terminate();a.wait();b.wait()
          med=statistics.median(ratios); print('identical signatures',120,'median speedup',med)
          assert med>1.01,ratios
          PY
      - name: Build pinned Rust opponent
        shell: bash
        run: |
          cd rust-ref
          test "$(git rev-parse HEAD)" = '169fb5d424d90ebc45577ecaabe2a8fa0b4c1c10'
          RUSTUP_TOOLCHAIN=1.98.1 cargo build --release -p chess-uci
      - name: Paired Rust reality screen
        shell: bash
        run: |
          set -euo pipefail
          STOCKFISH="$(command -v stockfish || true)"; [ -n "$STOCKFISH" ] || STOCKFISH=/usr/games/stockfish
          OUT=analysis-results/shared-check; mkdir -p "$OUT"
          python tools/v9_rust_diagnostic.py --agent /tmp/cand --runner tools/v9_agent_runner.py \
            --engine rust-ref/target/release/chess-uci --stockfish "$STOCKFISH" \
            --openings match/openings/m3-uho-lichess-100-v1.epd --opening-start 30 --opening-count 6 \
            --base-ms 2500 --increment-ms 50 --analysis-nodes 10000 --out-dir "$OUT" | tee "$OUT/run.log"
      - name: Package candidate
        shell: bash
        run: |
          OUT=analysis-results/shared-check
          (cd /tmp/cand && zip -qr "$GITHUB_WORKSPACE/$OUT/Little-Gambit-V13-quarter-legality-sharedcheck.zip" .)
          sha256sum "$OUT/Little-Gambit-V13-quarter-legality-sharedcheck.zip" > "$OUT/CANDIDATE_SHA256.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v13-shared-check-${{ github.sha }}
          path: analysis-results/shared-check
          retention-days: 14
