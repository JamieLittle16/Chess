name: V14 root-only prophylaxis verifier A

on:
  push:
    branches: [analysis/v14-root-prophylaxis-a-20260908]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact competition runtime
        run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0

      - name: Reconstruct exact V13 and prophylaxis candidate
        shell: bash
        run: |
          set -euo pipefail
          cat .analysis/v13_chunks_*.b64 | base64 -d > /tmp/v13.zip
          echo '658fd954180c2d0d39c02ba6601af36d06cdbd573bfb72c6879169861a7ad092  /tmp/v13.zip' | sha256sum --check --strict
          rm -rf /tmp/base /tmp/cand && mkdir -p /tmp/base /tmp/cand
          unzip -q /tmp/v13.zip -d /tmp/base
          unzip -q /tmp/v13.zip -d /tmp/cand
          patch /tmp/base/experiments/numba_search.py < .analysis/v13_jit_refactor.patch
          patch /tmp/cand/experiments/numba_search.py < .analysis/v13_jit_refactor.patch
          for DIR in /tmp/base /tmp/cand; do
            DIR="$DIR" python - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['DIR'])/'experiments/numba_search.py'; s=p.read_text()
          old='    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          new='    correction = correction // 6\n    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          assert s.count(old)==1,s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
            python scripts/patch_v13_legality_context.py "$DIR/experiments/numba_core.py"
            python scripts/patch_v13_qsearch_tactical.py "$DIR/experiments/numba_core.py" "$DIR/experiments/numba_search.py"
          done
          echo 'df346b21be42832a0ae97e7faa15953ab460f0387fb0358961651466557ebde8  /tmp/base/agent.py' | sha256sum --check --strict
          echo '0306e8145a453d91b9b5ac92e9980931510d9e18f8ba598a7548d08b85165c35  /tmp/base/experiments/numba_core.py' | sha256sum --check --strict
          echo '401f6580028a72361286bd99bee1f0022c74e6c8a65da8acd47448835a1ff360  /tmp/base/experiments/numba_search.py' | sha256sum --check --strict
          python scripts/patch_v14_root_prophylaxis.py /tmp/cand/experiments/numba_search.py
          python -m py_compile /tmp/base/agent.py /tmp/base/experiments/*.py /tmp/cand/agent.py /tmp/cand/experiments/*.py
          cmp /tmp/base/agent.py /tmp/cand/agent.py
          cmp /tmp/base/experiments/numba_core.py /tmp/cand/experiments/numba_core.py
          cmp /tmp/base/experiments/v13_residual.i16 /tmp/cand/experiments/v13_residual.i16
          mkdir -p results

      - name: API smoke and sentinel sanity
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp/cand python - <<'PY'
          import chess, agent
          for fen in (
              chess.STARTING_FEN,
              '2r3k1/4qp2/4b3/p5p1/4P1P1/2Pr2P1/P4PB1/R1Q2RK1 w - - 1 23',
              '4k3/8/8/5K2/8/6P1/8/8 w - - 0 54',
          ):
              b=chess.Board(fen); m=chess.Move.from_uci(agent.get_move(fen,100000)); assert m in b.legal_moves,(fen,m); print('legal',m)
          PY

      - name: Fixed-node throughput
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/root_worker.py <<'PY'
          import json,sys,chess,numpy as np
          from experiments.numba_core import encode_position
          from experiments.numba_search import iterative_search_stateful
          for line in sys.stdin:
              q=json.loads(line); b=chess.Board(q['fen']); e=encode_position(b); h=np.empty(0,dtype=np.uint64)
              o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,int(q['nodes']))
              print(json.dumps({'move':int(o[0]),'score':int(o[1]),'depth':int(o[2]),'nodes':int(o[3])}),flush=True)
          PY
          python - <<'PY'
          import json,os,statistics,subprocess,sys,time
          from pathlib import Path
          roots=[x.strip() for x in open('match/openings/m3-uho-lichess-100-v1.epd') if x.strip() and not x.startswith('#')][:24]
          def start(path):
              env=os.environ.copy();env['PYTHONPATH']=path
              return subprocess.Popen([sys.executable,'/tmp/root_worker.py'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env=env)
          def run(p,order):
              n=0;t=time.perf_counter()
              for fen in order:
                  p.stdin.write(json.dumps({'fen':fen,'nodes':30000})+'\n');p.stdin.flush();n+=json.loads(p.stdout.readline())['nodes']
              return time.perf_counter()-t,n
          base=start('/tmp/base');cand=start('/tmp/cand');ratios=[];rows=[]
          try:
              for p in (base,cand):p.stdin.write(json.dumps({'fen':roots[0],'nodes':300})+'\n');p.stdin.flush();json.loads(p.stdout.readline())
              for rep in range(3):
                  order=roots if rep%2==0 else list(reversed(roots))
                  if rep%2==0:bt,bn=run(base,order);ct,cn=run(cand,order)
                  else:ct,cn=run(cand,order);bt,bn=run(base,order)
                  ratio=(cn/ct)/(bn/bt);ratios.append(ratio);rows.append({'rep':rep,'ratio':ratio,'base_nps':bn/bt,'candidate_nps':cn/ct})
          finally:
              for p in (base,cand):p.terminate();p.wait()
          out={'median_nps_ratio':statistics.median(ratios),'rows':rows};Path('results/throughput.json').write_text(json.dumps(out,indent=2)+'\n');print(out)
          PY

      - name: Rated-game node curve
        shell: bash
        run: |
          set -euo pipefail
          python tools/v14_regression_probe.py \
            --engine /tmp/cand --control /tmp/base \
            --manifest match/regressions/v14-rated-game-1.json \
            --budgets 10000,30000,100000,300000,1000000 \
            --json-out results/rated-game-1-probe.json | tee results/rated-game-1-probe.log

      - name: Broad fixed-node regression probe
        shell: bash
        run: |
          set -euo pipefail
          python tools/v14_build_probe_corpus.py --openings match/openings/m3-uho-lichess-100-v1.epd --positions 64 --seed 2026090815 --json-out results/broad-manifest.json >/dev/null
          python tools/v14_regression_probe.py --engine /tmp/cand --control /tmp/base --manifest results/broad-manifest.json --budgets 16000 --json-out results/broad-probe.json | tee results/broad-probe.log

      - name: Fresh official-UHO equal-node screen
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/master/UHO_Lichess_4852_v1.epd.zip
          rm -rf /tmp/uho && mkdir /tmp/uho && unzip -q /tmp/uho.zip -d /tmp/uho
          UHO=$(find /tmp/uho -type f -name '*.epd' -print -quit); test -n "$UHO"
          UHO="$UHO" python - <<'PY'
          import os
          from pathlib import Path
          import chess
          rows=Path(os.environ['UHO']).read_text(errors='ignore').splitlines();out=[]
          for raw in rows[2200:2500]:
              f=raw.strip().split()
              if len(f)<4:continue
              fen=' '.join(f[:4])+' 0 1'
              try:b=chess.Board(fen)
              except ValueError:continue
              if b.is_game_over(claim_draw=False):continue
              out.append(fen)
              if len(out)==32:break
          assert len(out)==32,len(out);Path('/tmp/prophylaxis-uho.epd').write_text('\n'.join(out)+'\n')
          PY
          python -u tools/v14_fixed_node_arena.py /tmp/cand /tmp/base --nodes 16000 --pairs 32 --opening-offset 0 --max-plies 220 --opening-file /tmp/prophylaxis-uho.epd --json-out results/arena.json | tee results/arena.log
          grep '^FINAL ' results/arena.log

      - name: Pinned Stockfish teacher delta on rated sentinel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qualification/stockfish
          curl --fail --location --retry 3 --output .qualification/stockfish.tar.gz https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz
          echo '9defc0d4e55d49c65a6d042f3e571a39fcea499ade6dbe741b53b8c65e03611f  .qualification/stockfish.tar.gz' | sha256sum --check --strict
          tar -xzf .qualification/stockfish.tar.gz -C .qualification/stockfish
          STOCKFISH_BIN=$(find "$PWD/.qualification/stockfish" -type f -name 'stockfish*' -perm -111 -print -quit); test -n "$STOCKFISH_BIN"
          python tools/v14_teacher_grade.py --probe results/rated-game-1-probe.json --manifest match/regressions/v14-rated-game-1.json --stockfish "$STOCKFISH_BIN" --search-budget 300000 --teacher-nodes 300000 --hash-mb 64 --json-out results/rated-game-1-teacher.json | tee results/rated-game-1-teacher.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v14-root-prophylaxis-a-${{ github.sha }}
          path: results/
          retention-days: 30
