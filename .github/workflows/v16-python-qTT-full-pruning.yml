name: V16 SAFE qTT direct V15 sharded

on:
  workflow_dispatch:
  push:
    branches: [v16/python-final-safe-qTT-sharded]
    paths: ['.github/workflows/v16-python-qTT-full-pruning.yml']

permissions:
  actions: read
  contents: read

jobs:
  shard:
    strategy:
      fail-fast: false
      matrix: {shard: [0,1,2,3]}
    name: safe-qTT-shard-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Download exact V15 and SAFE qTT
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          rm -rf /tmp/v15-art /tmp/q-art /tmp/control /tmp/candidate results
          mkdir -p /tmp/control /tmp/candidate results
          gh run download 34298586524 -n Little-Gambit-V15-FINAL-725be3e8595d1e54b1f12e11f2b9d92f1e415ebc -D /tmp/v15-art
          V15=$(find /tmp/v15-art -type f -name Little-Gambit-V15.zip -print -quit); test -n "$V15"
          echo '81e22344bf9a6b41f16e32f29f93c0b6074afe63e4fd51002a537e6a091f2852  '"$V15" | sha256sum --check --strict
          unzip -q "$V15" -d /tmp/control
          gh run download 34352476810 -n v16-python-v15-qsearch-tt-startup-f32d0bd437ca555b1bd369646f41df2bd1f64aa8 -D /tmp/q-art
          QTT=$(find /tmp/q-art -type f -name Little-Gambit-V16B-qTT-startup.zip -print -quit); test -n "$QTT"
          echo '31c89b7bc3c70515666cf6786f6d23225dcd1a052e36447c0f583fffefafa789  '"$QTT" | sha256sum --check --strict
          unzip -q "$QTT" -d /tmp/candidate
      - name: Build same release shard roots
        shell: bash
        env: {SHARD: '${{ matrix.shard }}'}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          rm -rf /tmp/m6; mkdir /tmp/m6; python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          import os
          from pathlib import Path
          shard=int(os.environ['SHARD'])
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]
          all_roots=fresh[4696:4760]; assert len(all_roots)==64 and len(set(all_roots))==64
          roots=all_roots[shard*16:(shard+1)*16]; assert len(roots)==16
          Path('/tmp/clock.epd').write_text('\n'.join(roots)+'\n')
          PY
      - name: 32-game SAFE qTT direct clock shard
        run: python -u scripts/v15_competition_gate.py --control /tmp/control --candidate /tmp/candidate --openings /tmp/clock.epd --output results/timed-safe-${{ matrix.shard }}.json --label 'Little Gambit V16 SAFE qTT direct vs V15 shard ${{ matrix.shard }}' --base-ms 2500 --inc-ms 50 --max-plies 180 --grace-ms 1500 | tee results/timed-safe-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v16-final-safe-qTT-shard-${{ matrix.shard }}-${{ github.sha }}
          path: results/
          retention-days: 30
