name: V16 final direct timed V15 parallel

on:
  workflow_dispatch:
  push:
    branches: [v16/python-final-timed-parallel]
    paths: ['.github/workflows/v16-python-qTT-full-pruning.yml']

permissions:
  actions: read
  contents: read

jobs:
  timed:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Download exact V15 and exact qualified V16 candidate
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          rm -rf /tmp/v15-art /tmp/v16-art /tmp/control /tmp/candidate results
          mkdir -p /tmp/control /tmp/candidate results
          gh run download 34298586524 -n Little-Gambit-V15-FINAL-725be3e8595d1e54b1f12e11f2b9d92f1e415ebc -D /tmp/v15-art
          V15=$(find /tmp/v15-art -type f -name Little-Gambit-V15.zip -print -quit); test -n "$V15"
          echo '81e22344bf9a6b41f16e32f29f93c0b6074afe63e4fd51002a537e6a091f2852  '"$V15" | sha256sum --check --strict
          unzip -q "$V15" -d /tmp/control
          gh run download 34359639522 -n v16-python-qTT-full-pruning-8ca7e7ccaba29acff86409b218364411d7e037ef -D /tmp/v16-art
          V16=$(find /tmp/v16-art -type f -name Little-Gambit-V16-qTT-pruning.zip -print -quit); test -n "$V16"
          echo 'e6841b309fa142f2b89465c43ec319e6e050c7ec405ee4415ab74ebcd4e93204  '"$V16" | sha256sum --check --strict
          unzip -q "$V16" -d /tmp/candidate
          python -m py_compile /tmp/control/agent.py /tmp/control/experiments/*.py /tmp/candidate/agent.py /tmp/candidate/experiments/*.py
          sha256sum "$V15" "$V16" | tee results/package-hashes.txt
      - name: Build exact release clock roots
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          rm -rf /tmp/m6; mkdir /tmp/m6; python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]
          roots=fresh[4696:4760]
          assert len(roots)==64 and len(set(roots))==64
          Path('/tmp/clock.epd').write_text('\n'.join(roots)+'\n')
          PY
      - name: 128-game direct competition-clock V16 versus V15
        run: python -u scripts/v15_competition_gate.py --control /tmp/control --candidate /tmp/candidate --openings /tmp/clock.epd --output results/timed-direct-128.json --label 'Little Gambit V16 final qTT learned-pruning direct vs V15' --base-ms 2500 --inc-ms 50 --max-plies 180 --grace-ms 1500 | tee results/timed-direct-128.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v16-final-timed-parallel-${{ github.sha }}
          path: results/
          retention-days: 30
