name: V18 cancel obsolete qualification

on:
  push:
    branches: [analysis/v18-root-quality-fastfilter-20260911]
    paths: ['.github/workflows/v18-cancel-obsolete.yml']

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel obsolete ROOT4 qualification run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -L -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/runs/34584078939/cancel
          echo CANCEL_SENT
