name: V15 Python diverse-root Gestalt H16 v2

on:
  push:
    branches:
      - analysis/v15-python-gestalt-diverse-leaf-v2-20260909
    paths:
      - .github/workflows/v15-python-gestalt-diverse-leaf-v2.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check chess==1.11.2
      - name: Instrument actual Rust Gestalt leaf boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          ep=Path('crates/chess-eval/src/lib.rs');e=ep.read_text()
          anchor='''#[cfg(feature = "search-trace")]\nmod search_trace;\n\nuse chess_core::{Color, PieceKind, Position};'''
          repl='''#[cfg(feature = "search-trace")]\nmod search_trace;\n\nuse chess_core::{Color, PieceKind, Position};\n\n#[cfg(feature = "search-trace")]\npub fn observe_search_position(position: &Position) { search_trace::observe(position); }'''
          assert e.count(anchor)==1; ep.write_text(e.replace(anchor,repl,1))
          sp=Path('crates/chess-search/src/lib.rs');s=sp.read_text()
          anchor='''    fn leaf_evaluate(&self, position: &Position) -> i32 {\n        if let Some(gestalt) = &self.gestalt'''
          repl='''    fn leaf_evaluate(&self, position: &Position) -> i32 {\n        #[cfg(feature = "search-trace")]\n        chess_eval::observe_search_position(position);\n        if let Some(gestalt) = &self.gestalt'''
          assert s.count(anchor)==1; sp.write_text(s.replace(anchor,repl,1))
          PY
      - name: Build traced Rust V15 and exact Gestalt teacher
        run: |
          CARGO_TARGET_DIR="$PWD/target-trace" cargo build --release -p chess-uci --features search-trace
          cargo build --release -p chess-eval --example gestalt_teacher
      - name: Download exact production Gestalt and UHO suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v2
          curl --fail --location --retry 5 'https://github.com/cosmobobak/viridithas-networks/releases/download/v85/gestalt-b840.nnue' -o /tmp/v2/gestalt-b840.nnue
          echo '956a6afcce5de1cdbc953ae3817ff760f3e6036441f34dcd524d6e2e7d0e71f6  /tmp/v2/gestalt-b840.nnue' | sha256sum --check --strict
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/v2/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/v2/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]
          roots=fresh[600:856]
          assert len(roots)==256
          Path('/tmp/v2/roots.epd').write_text('\n'.join(roots)+'\n')
          PY
      - name: Collect diverse real search leaves
        shell: bash
        env:
          CHESS_GESTALT_NETWORK: /tmp/v2/gestalt-b840.nnue
        run: |
          set -euo pipefail
          python tools/collect_search_leaf_corpus.py --engine target-trace/release/chess-uci --openings /tmp/v2/roots.epd --roots 256 --nodes 9000 --stride 16 --output /tmp/v2/leaves.tsv --manifest /tmp/v2/leaves.json | tee /tmp/v2/collect.log
          test "$(wc -l </tmp/v2/leaves.tsv)" -ge 60000
      - name: Label with exact Rust Gestalt and group-safe splits
        shell: bash
        env:
          CHESS_GESTALT_NETWORK: /tmp/v2/gestalt-b840.nnue
        run: |
          set -euo pipefail
          cut -f2- /tmp/v2/leaves.tsv > /tmp/v2/fens.txt
          target/release/examples/gestalt_teacher < /tmp/v2/fens.txt > /tmp/v2/scores.tsv
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          owner={fen:g for g,fen in (x.split('\t',1) for x in Path('/tmp/v2/leaves.tsv').read_text().splitlines())}
          rows=[]
          for line in Path('/tmp/v2/scores.tsv').read_text().splitlines():
              fen,score=line.rsplit('\t',1);g=owner[fen];h=int.from_bytes(hashlib.sha256(g.encode()).digest()[:8],'big')%10
              split='holdout' if h==0 else ('validation' if h==1 else 'train')
              rows.append(json.dumps({'split':split,'fen':fen,'teacher_cp':int(score),'teacher_mate':None,'group':g},separators=(',',':')))
          Path('/tmp/v2/teacher.jsonl').write_text('\n'.join(rows)+'\n')
          counts={s:sum(json.loads(r)['split']==s for r in rows) for s in ('train','validation','holdout')}
          print({'records':len(rows),'counts':counts,'groups':len(set(owner.values()))})
          assert len(rows)>=60000 and min(counts.values())>=3000
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v15-rust-search-leaf-gestalt-diverse-v2-${{ github.sha }}
          path: |
            /tmp/v2/teacher.jsonl
            /tmp/v2/leaves.json
            /tmp/v2/collect.log
          retention-days: 30

  train:
    needs: corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - uses: actions/download-artifact@v4
        with:
          name: v15-rust-search-leaf-gestalt-diverse-v2-${{ github.sha }}
          path: leaf-v2
      - uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - name: Train same-runtime H16 topology on diverse roots
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name Little-Gambit-V14.zip -print -quit); test -n "$ZIP"
          rm -rf /tmp/v14 results; mkdir -p /tmp/v14 results
          unzip -q "$ZIP" -d /tmp/v14
          python -u scripts/train_v15_gestalt_topology_student.py --teacher leaf-v2/teacher.jsonl --engine-dir /tmp/v14 --output-dir results/h16 --hidden 16 --epochs 36 --batch-size 256 --lr 0.0012 | tee results/h16.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-diverse-leaf-h16-${{ github.sha }}
          path: results/
          retention-days: 30
