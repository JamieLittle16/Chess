name: M4 E4 disjoint holdout

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  holdout:
    if: github.head_ref == 'm4/e4-piece-structure-final'
    name: E4 disjoint 200-game holdout
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m4/e4-piece-structure-final
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Verify exact candidate and selector
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/select_epd_holdout.py
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test -p chess-eval --all-features
          cargo test -p chess-search --all-features
          cargo test -p chess-core --all-features
          cargo test -p chess-engine --all-features
          git diff --exit-code
          git diff --cached --exit-code
      - name: Build candidate
        run: |
          set -euo pipefail
          CANDIDATE_TARGET="$PWD/.qualification/candidate-target"
          CARGO_TARGET_DIR="$CANDIDATE_TARGET" cargo build --release -p chess-uci
          echo "CANDIDATE_BIN=$CANDIDATE_TARGET/release/chess-uci" >> "$GITHUB_ENV"
      - name: Build accepted reference
        run: |
          set -euo pipefail
          REFERENCE_SHA=54a1075912358d206cd924878d1cbdc876a30629
          git fetch --depth=1 origin "$REFERENCE_SHA"
          git worktree add --detach .qualification/reference "$REFERENCE_SHA"
          REFERENCE_TARGET="$PWD/.qualification/reference-target"
          (
            cd .qualification/reference
            CARGO_TARGET_DIR="$REFERENCE_TARGET" cargo build --release -p chess-uci
          )
          echo "REFERENCE_BIN=$REFERENCE_TARGET/release/chess-uci" >> "$GITHUB_ENV"
      - name: Generate pinned disjoint UHO holdout
        run: |
          set -euo pipefail
          mkdir -p holdout-source holdout-evidence
          curl --fail --location --retry 3 \
            --output holdout-source/UHO_Lichess_4852_v1.epd.zip \
            https://github.com/official-stockfish/books/raw/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  holdout-source/UHO_Lichess_4852_v1.epd.zip' | sha256sum --check --strict
          python3 scripts/select_epd_holdout.py \
            --source-zip holdout-source/UHO_Lichess_4852_v1.epd.zip \
            --member UHO_Lichess_4852_v1.epd \
            --seed 'Chess/m4-e4-uho-holdout-100-v1' \
            --count 100 \
            --exclude-manifest match/openings/m3-uho-lichess-100-v1.json \
            --output holdout-evidence/m4-e4-uho-holdout-100-v1.epd \
            --metadata holdout-evidence/m4-e4-uho-holdout-100-v1.json
          HOLDOUT_SHA=$(sha256sum holdout-evidence/m4-e4-uho-holdout-100-v1.epd | cut -d' ' -f1)
          echo "HOLDOUT_SHA=$HOLDOUT_SHA" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json
          from pathlib import Path
          meta = json.loads(Path('holdout-evidence/m4-e4-uho-holdout-100-v1.json').read_text())
          old = json.loads(Path('match/openings/m3-uho-lichess-100-v1.json').read_text())
          assert not (set(meta['selection']['selected_source_lines']) & set(old['selection']['selected_source_lines']))
          assert meta['positions'] == 100
          print('holdout sha256:', meta['sha256'])
          print('selected source lines:', meta['selection']['selected_source_lines'])
          PY
      - name: Create exact holdout protocol
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          protocol = {
              'schema_version': 1,
              'protocol_id': 'm4-e4-disjoint-holdout-v1',
              'runner': 'fastchess',
              'games': 200,
              'time_control': '1+0.01',
              'concurrency': 1,
              'seed': 20260907,
              'max_moves': 300,
              'opening_format': 'epd',
              'openings_required': True,
              'opening_suite_id': 'm4-e4-uho-holdout-100-v1',
              'opening_sha256': os.environ['HOLDOUT_SHA'],
              'paired_colour_reversal': True,
              'ponder': False,
              'tablebases': False,
              'evaluation_adjudication': False,
              'notes': 'Fresh disjoint E4 holdout selected from pinned Stockfish UHO_Lichess_4852_v1 at commit 65815cc; original m3 100 source lines explicitly excluded.'
          }
          Path('holdout-evidence/m4-e4-disjoint-holdout-v1.json').write_text(json.dumps(protocol, indent=2, sort_keys=True) + '\n')
          PY
      - name: Fetch pinned Fastchess
        run: |
          set -euo pipefail
          mkdir -p .qualification/fastchess
          curl --fail --location --retry 3 --output .qualification/fastchess.tar \
            https://github.com/Disservin/fastchess/releases/download/v1.8.2-alpha/fastchess-linux-x86-64.tar
          echo '1003f920bebe841acdab5e6d7871e93171a4586857b3ec91c21ef5777f26ff96  .qualification/fastchess.tar' | sha256sum --check --strict
          tar -xf .qualification/fastchess.tar -C .qualification/fastchess
          FASTCHESS_BIN=$(find "$PWD/.qualification/fastchess" -type f -name fastchess -perm -111 -print -quit)
          test -n "$FASTCHESS_BIN"
          echo "FASTCHESS_BIN=$FASTCHESS_BIN" >> "$GITHUB_ENV"
      - name: Record identities
        run: |
          set -euo pipefail
          "$FASTCHESS_BIN" -version
          sha256sum "$CANDIDATE_BIN" "$REFERENCE_BIN" "$FASTCHESS_BIN" holdout-evidence/m4-e4-uho-holdout-100-v1.epd
          git rev-parse HEAD
      - name: Run fresh 200-game paired holdout
        run: |
          set -euo pipefail
          SHORT_SHA=${GITHUB_SHA:0:12}
          python3 scripts/match_harness.py \
            --protocol holdout-evidence/m4-e4-disjoint-holdout-v1.json \
            --candidate "$CANDIDATE_BIN" \
            --candidate-name "Chess-M4-E4-holdout@$SHORT_SHA" \
            --candidate-option Hash=32 \
            --reference "$REFERENCE_BIN" \
            --reference-name 'Chess-main@54a107591235' \
            --reference-option Hash=32 \
            --fastchess "$FASTCHESS_BIN" \
            --openings holdout-evidence/m4-e4-uho-holdout-100-v1.epd \
            --output-dir holdout-results
      - name: Upload retained evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-e4-disjoint-holdout-${{ github.sha }}
          path: |
            holdout-evidence/
            holdout-results/
          if-no-files-found: warn
          retention-days: 30
