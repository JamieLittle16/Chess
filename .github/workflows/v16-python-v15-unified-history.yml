name: V16 Python V15 unified-history rebase

on:
  workflow_dispatch:
  push:
    branches: [v16/python-v15-unified-history]
    paths:
      - '.github/workflows/v16-python-v15-unified-history.yml'
      - 'scripts/patch_v16_python_v15_unified_history.py'

permissions:
  actions: read
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact competition runtime
        run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0

      - name: Download exact final V15
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V15-FINAL-725be3e8595d1e54b1f12e11f2b9d92f1e415ebc
          path: v15-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34298586524

      - name: Materialize exact V15 control and coherent-history candidate
        shell: bash
        run: |
          set -euo pipefail
          V15=$(find v15-artifact -type f -name Little-Gambit-V15.zip -print -quit); test -n "$V15"
          echo '81e22344bf9a6b41f16e32f29f93c0b6074afe63e4fd51002a537e6a091f2852  '"$V15" | sha256sum --check --strict
          rm -rf /tmp/control /tmp/candidate results
          mkdir -p /tmp/control /tmp/candidate results
          unzip -q "$V15" -d /tmp/control
          cp -a /tmp/control/. /tmp/candidate/
          python scripts/patch_v16_python_v15_unified_history.py /tmp/candidate/experiments/numba_search.py
          python -m py_compile /tmp/control/agent.py /tmp/control/experiments/*.py /tmp/candidate/agent.py /tmp/candidate/experiments/*.py
          grep -q 'QUIET_HISTORY_CONT_ENTRIES = QUIET_HISTORY_CONTEXTS \* QUIET_HISTORY_CONTEXTS' /tmp/candidate/experiments/numba_search.py
          grep -q 'QUIET_HISTORY_LMR_THRESHOLD = 4_096' /tmp/candidate/experiments/numba_search.py
          grep -q 'previous_move_context' /tmp/candidate/experiments/numba_search.py
          ! grep -q 'LEAN_LMR_HISTORY' /tmp/candidate/experiments/numba_search.py
          ! grep -q 'lmr_history' /tmp/candidate/experiments/numba_search.py
          python - <<'PY'
          import ast
          p='/tmp/candidate/experiments/numba_search.py'
          tree=ast.parse(open(p).read())
          defs={n.name:n for n in tree.body if isinstance(n,ast.FunctionDef)}
          for name in ('_negamax','_root','_order_moves_with_killers'):
              argc=len(defs[name].args.args)
              calls=[n for n in ast.walk(tree) if isinstance(n,ast.Call) and isinstance(n.func,ast.Name) and n.func.id==name]
              assert calls, name
              assert all(len(n.args)==argc and not n.keywords for n in calls), (name,argc,[(n.lineno,len(n.args)) for n in calls])
          print('call graph signatures coherent')
          PY
          (cd /tmp/candidate && zip -qr /tmp/Little-Gambit-V16A-unified-history.zip .)
          sha256sum "$V15" /tmp/Little-Gambit-V16A-unified-history.zip | tee results/package-hashes.txt

      - name: Build fresh disjoint UHO roots
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip \
            https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          rm -rf /tmp/m6; mkdir /tmp/m6
          python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]
          roots=fresh[4248:4328]
          assert len(roots)==80 and len(set(roots))==80
          Path('/tmp/v16a-node.epd').write_text('\n'.join(roots[:48])+'\n')
          Path('/tmp/v16a-clock.epd').write_text('\n'.join(roots[48:80])+'\n')
          PY

      - name: 96-game equal-node screen versus exact V15
        shell: bash
        run: |
          set -euo pipefail
          python -u tools/v14_fixed_node_arena.py /tmp/candidate /tmp/control \
            --nodes 20000 --pairs 48 --opening-file /tmp/v16a-node.epd \
            --max-plies 220 --json-out results/equal-node.json | tee results/equal-node.log

      - name: 64-game short-clock screen versus exact V15
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/v15_competition_gate.py \
            --control /tmp/control --candidate /tmp/candidate \
            --openings /tmp/v16a-clock.epd \
            --output results/timed.json \
            --label 'V16A exact-V15 unified main+continuation history' \
            --base-ms 2500 --inc-ms 50 --max-plies 180 --grace-ms 1500 \
            | tee results/timed.log

      - name: Preserve candidate package
        if: always()
        run: cp /tmp/Little-Gambit-V16A-unified-history.zip results/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v16-python-v15-unified-history-${{ github.sha }}
          path: results/
          retention-days: 30
