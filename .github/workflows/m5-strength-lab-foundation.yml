name: M5 strength lab foundation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  strength-lab:
    if: github.head_ref == 'm5/strength-lab-foundation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned offline analysis dependency
        run: python -m pip install --disable-pip-version-check -r tools/requirements-analysis.txt
      - name: Compile and test offline strength tooling
        run: |
          set -euo pipefail
          python -m compileall -q \
            scripts/stockfish_lab.py \
            scripts/stockfish_error_mining.py \
            scripts/generate_nnue_teacher_data.py \
            scripts/test_strength_lab.py
          python scripts/test_strength_lab.py
          python scripts/stockfish_error_mining.py --help >/dev/null
          python scripts/generate_nnue_teacher_data.py --help >/dev/null
