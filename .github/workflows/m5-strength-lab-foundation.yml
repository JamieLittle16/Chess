name: M5 strength lab and NNUE tooling

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  strength-lab:
    if: startsWith(github.head_ref, 'm5/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Install pinned offline analysis dependency
        run: python -m pip install --disable-pip-version-check -r tools/requirements-analysis.txt
      - name: Compile and test offline strength tooling
        run: |
          set -euo pipefail
          python -m compileall -q \
            scripts/stockfish_lab.py \
            scripts/stockfish_error_mining.py \
            scripts/generate_nnue_teacher_data.py \
            scripts/train_nnue_reference.py \
            scripts/test_strength_lab.py
          python scripts/test_strength_lab.py
          python scripts/stockfish_error_mining.py --help >/dev/null
          python scripts/generate_nnue_teacher_data.py --help >/dev/null
          python scripts/train_nnue_reference.py --help >/dev/null
      - name: Prove deterministic Python export loads in Rust
        shell: bash
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          cat > "$TMP/teacher.jsonl" <<'EOF'
          {"fen":"4k3/8/8/8/8/8/P7/4K3 w - - 0 1","split":"train","teacher_cp":35}
          {"fen":"4k3/8/8/8/8/8/7p/4K3 b - - 0 1","split":"train","teacher_cp":-40}
          EOF
          python scripts/train_nnue_reference.py \
            --teacher "$TMP/teacher.jsonl" \
            --output-dir "$TMP/run-a" \
            --hidden 32 \
            --epochs 1 \
            --learning-rate 0.0001 \
            --seed 123
          python scripts/train_nnue_reference.py \
            --teacher "$TMP/teacher.jsonl" \
            --output-dir "$TMP/run-b" \
            --hidden 32 \
            --epochs 1 \
            --learning-rate 0.0001 \
            --seed 123
          cmp "$TMP/run-a/nnue-32-v1.nnue" "$TMP/run-b/nnue-32-v1.nnue"
          cmp "$TMP/run-a/training-metadata.json" "$TMP/run-b/training-metadata.json"

          RUST_OUTPUT=$(cargo run --quiet -p chess-eval --example nnue_smoke -- "$TMP/run-a/nnue-32-v1.nnue")
          printf '%s\n' "$RUST_OUTPUT"
          grep -q '^hidden=32 smoke_score=' <<< "$RUST_OUTPUT"

          PY_FEATURES=$(PYTHONPATH=scripts python - <<'PY'
          import chess
          from train_nnue_reference import active_features

          board = chess.Board("2k5/5p2/8/3N4/6b1/1P6/8/4K3 w - - 0 1")
          for label, color in (("white_features", chess.WHITE), ("black_features", chess.BLACK)):
              features = active_features(board, color)
              print(label + "=" + ",".join(str(feature) for feature in features))
          PY
          )
          RUST_FEATURES=$(grep '_features=' <<< "$RUST_OUTPUT")
          test "$RUST_FEATURES" = "$PY_FEATURES"
