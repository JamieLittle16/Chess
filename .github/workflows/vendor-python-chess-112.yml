name: Vendor python-chess 1.11.2

on:
  push:
    branches: [diagnostic/v18-gmbook-upload-test]
    paths:
      - '.github/workflows/vendor-python-chess-112.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact chess package
        run: |
          python -m pip install --disable-pip-version-check --target vendor chess==1.11.2
          python - <<'PY'
          import sys
          sys.path.insert(0, 'vendor')
          import chess
          assert chess.__version__ == '1.11.2'
          print(chess.__file__)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: python-chess-1.11.2
          path: vendor/chess/
          retention-days: 1
