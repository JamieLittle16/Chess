name: V15 Python leaf-only Gestalt H16

on:
  push:
    branches:
      - analysis/v15-python-leaf-gestalt-h16-20260909
    paths:
      - scripts/patch_v15_python_leaf_gestalt_h16.py
      - scripts/patch_v15_python_leaf_gestalt_h16_qall.py
      - .github/workflows/v15-python-leaf-gestalt-h16.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        mode: [q0, qall]
    name: qualify-${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0

      - name: Download exact packaged V14
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775

      - name: Download exact Rust-search-leaf H16 student
        uses: actions/download-artifact@v4
        with:
          name: v15-leaf-gestalt-topology-h16-70736f6f056d42aa8ceee37e0b282e4f02d34556
          path: h16-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34277063353

      - name: Materialize control and leaf-Gestalt candidate
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name Little-Gambit-V14.zip -print -quit); test -n "$ZIP"
          MODEL=$(find h16-artifact -type f -name gestalt-topology-h16.npz -print -quit); test -n "$MODEL"
          rm -rf /tmp/base /tmp/cand results; mkdir -p /tmp/base /tmp/cand results
          unzip -q "$ZIP" -d /tmp/base
          cp -a /tmp/base/. /tmp/cand/

          # Identical ordering baseline on both sides.
          python scripts/patch_v15_python_presort_once.py /tmp/base/experiments/numba_search.py
          python scripts/patch_v15_python_presort_once.py /tmp/cand/experiments/numba_search.py

          cp "$MODEL" /tmp/cand/experiments/v15_leaf_gestalt_h16.npz
          python scripts/patch_v15_python_leaf_gestalt_h16.py /tmp/cand/experiments/numba_search.py
          if [ "${{ matrix.mode }}" = qall ]; then
            python scripts/patch_v15_python_leaf_gestalt_h16_qall.py /tmp/cand/experiments/numba_search.py
          fi

          python -m py_compile tools/v14_agent_runner.py /tmp/base/agent.py /tmp/cand/agent.py /tmp/base/experiments/*.py /tmp/cand/experiments/*.py
          diff -u /tmp/base/experiments/numba_search.py /tmp/cand/experiments/numba_search.py > results/search.patch || true
          test -s results/search.patch

      - name: Certify H16 quantised inference against independent Python reference
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp/cand python - <<'PY'
          import chess
          import numpy as np
          from experiments.numba_core import encode_position
          from experiments.numba_search import (
              EVAL_WIDTH,
              _build_eval_state_into,
              _leaf_gestalt_correction_cp,
          )

          model=np.load('/tmp/cand/experiments/v15_leaf_gestalt_h16.npz',allow_pickle=False)
          W=np.asarray(model['feature_weights'],dtype=np.int16)
          bias=np.asarray(model['feature_bias'],dtype=np.int16)
          ous=np.asarray(model['output_us'],dtype=np.int16)
          othem=np.asarray(model['output_them'],dtype=np.int16)
          den=int(np.asarray(model['scale_denominator']).reshape(-1)[0])
          bucket_map=np.asarray([
              0,1,2,3,12,11,10,9,4,4,5,5,14,14,13,13,
              6,6,6,6,15,15,15,15,7,7,7,7,16,16,16,16,
              8,8,8,8,17,17,17,17,8,8,8,8,17,17,17,17,
              8,8,8,8,17,17,17,17,8,8,8,8,17,17,17,17],dtype=np.int16)
          def fi(board,perspective,piece,sq):
              k=board.king(perspective); assert k is not None
              mapped=k if perspective else chess.square(chess.square_file(k),7-chess.square_rank(k))
              bucket=int(bucket_map[mapped])%9
              mirror=chess.square_file(k)>=4
              f=chess.square_file(sq); r=chess.square_rank(sq)
              if mirror: f=7-f
              if not perspective: r=7-r
              ownership=0 if piece.color==perspective else 1
              plane=ownership*6+(piece.piece_type-1)
              return bucket*768+plane*64+r*8+f
          def tdiv(x,d): return x//d if x>=0 else -((-x)//d)
          def ref(board):
              aw=bias.astype(np.int64).copy(); ab=bias.astype(np.int64).copy()
              for sq,p in board.piece_map().items():
                  aw += W[fi(board,chess.WHITE,p,sq)].astype(np.int64)
                  ab += W[fi(board,chess.BLACK,p,sq)].astype(np.int64)
              aw=np.clip(aw,0,255); ab=np.clip(ab,0,255)
              us,them=(aw,ab) if board.turn else (ab,aw)
              raw=int(((us*us)*ous.astype(np.int64)+(them*them)*othem.astype(np.int64)).sum())
              return tdiv(tdiv(raw,255)*400,255*64)//den
          fens=[
              chess.STARTING_FEN,
              '2r3k1/4qp2/4b3/p5p1/4P1P1/2Pr2P1/P4PB1/R1Q2RK1 w - - 1 23',
              '8/8/3k4/4N1RP/8/3b4/8/6K1 b - - 0 59',
              'r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 0 1',
          ]
          for fen in fens:
              b=chess.Board(fen); e=encode_position(b); st=np.empty(EVAL_WIDTH,dtype=np.int32); _build_eval_state_into(e.board,st)
              got=int(_leaf_gestalt_correction_cp(e.board,e.side,st)); expected=ref(b)
              print(fen,got,expected); assert got==expected,(fen,got,expected)
          PY

      - name: Build fresh disjoint qualification roots
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          rm -rf /tmp/m6; mkdir /tmp/m6
          python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]
          equal=fresh[3200:3248]; timed=fresh[3260:3292]
          assert len(equal)==48 and len(timed)==32 and not set(equal)&set(timed)
          Path('/tmp/leaf-equal.epd').write_text('\n'.join(equal)+'\n')
          Path('/tmp/leaf-timed.epd').write_text('\n'.join(timed)+'\n')
          PY

      - name: Hard-regression search probe
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/probe.py <<'PY'
          import chess,json,numpy as np,sys
          from experiments.numba_core import encode_position,move_to_uci
          from experiments.numba_search import iterative_search_stateful
          fens=[
              ('round61','2r3k1/4qp2/4b3/p5p1/4P1P1/2Pr2P1/P4PB1/R1Q2RK1 w - - 1 23'),
              ('round65a','8/8/3k4/4N1RP/8/3b4/8/6K1 b - - 0 59'),
              ('round65b','8/7b/3k2N1/6RP/8/8/8/6K1 b - - 2 60'),
          ]
          rows=[]
          for label,fen in fens:
              b=chess.Board(fen);e=encode_position(b);h=np.empty(0,dtype=np.uint64)
              for nodes in (300000,1000000):
                  o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,nodes)
                  rows.append({'label':label,'nodes':nodes,'move':move_to_uci(int(o[0])),'score':int(o[1]),'depth':int(o[2]),'searched':int(o[3])})
          print(json.dumps(rows,indent=2))
          PY
          PYTHONPATH=/tmp/base python /tmp/probe.py > results/hard-control.json
          PYTHONPATH=/tmp/cand python /tmp/probe.py > results/hard-candidate.json
          echo CONTROL; cat results/hard-control.json
          echo CANDIDATE; cat results/hard-candidate.json

      - name: 96-game equal-node strength screen
        run: python -u tools/v14_fixed_node_arena.py /tmp/cand /tmp/base --nodes 26000 --pairs 48 --opening-file /tmp/leaf-equal.epd --opening-offset 0 --max-plies 220 --json-out results/equal-node.json | tee results/equal-node.log

      - name: Five-repetition throughput
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/w.py <<'PY'
          import json,sys,chess,numpy as np
          from experiments.numba_core import encode_position
          from experiments.numba_search import iterative_search_stateful
          for line in sys.stdin:
              q=json.loads(line);b=chess.Board(q['fen']);e=encode_position(b);h=np.empty(0,dtype=np.uint64)
              o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,int(q['nodes']))
              print(json.dumps({'nodes':int(o[3])}),flush=True)
          PY
          python - <<'PY'
          import json,os,statistics,subprocess,sys,time
          from pathlib import Path
          roots=Path('/tmp/leaf-equal.epd').read_text().splitlines()[:20]
          def start(d):
              e=os.environ.copy();e['PYTHONPATH']=d
              return subprocess.Popen([sys.executable,'/tmp/w.py'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env=e)
          def one(p,f,n):
              p.stdin.write(json.dumps({'fen':f,'nodes':n})+'\n');p.stdin.flush();return json.loads(p.stdout.readline())
          b=start('/tmp/base');c=start('/tmp/cand');rat=[];rows=[]
          try:
              one(b,roots[0],500);one(c,roots[0],500)
              for r in range(5):
                  order=roots if r%2==0 else list(reversed(roots))
                  def timed(p):
                      nodes=0;t=time.perf_counter()
                      for f in order:nodes+=one(p,f,35000)['nodes']
                      return nodes/(time.perf_counter()-t)
                  if r%2==0:bn=timed(b);cn=timed(c)
                  else:cn=timed(c);bn=timed(b)
                  rat.append(cn/bn);rows.append({'rep':r,'base_nps':bn,'candidate_nps':cn,'ratio':cn/bn})
          finally:
              b.terminate();c.terminate();b.wait();c.wait()
          out={'median_nps_ratio':statistics.median(rat),'rows':rows}
          Path('results/throughput.json').write_text(json.dumps(out,indent=2)+'\n');print('FINAL',out)
          PY

      - name: 64-game competition-clock screen
        run: python -u scripts/v15_competition_gate.py --candidate /tmp/cand --control /tmp/base --openings /tmp/leaf-timed.epd --output results/timed-64.json --label leaf-gestalt-h16-${{ matrix.mode }} --base-ms 2500 --inc-ms 50 --max-plies 180 | tee results/timed-64.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-python-leaf-gestalt-h16-${{ matrix.mode }}-${{ github.sha }}
          path: results/
          retention-days: 30
