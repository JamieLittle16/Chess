name: V16 pruning qTT depth final sweep

on:
  workflow_dispatch:
  push:
    branches: [v16/python-pruning-qtt-depth-final-sweep]
    paths:
      - '.github/workflows/v16-python-pruning-qtt-depth-final-sweep.yml'
      - 'scripts/patch_v16_qtt_depth_cap_final.py'

permissions:
  actions: read
  contents: read

jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        cap: [4, 6, 8]
    name: qtt-cap-${{ matrix.cap }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact competition runtime
        run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Materialize qualified pruning control and candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CAP: ${{ matrix.cap }}
        run: |
          set -euo pipefail
          rm -rf /tmp/art /tmp/control /tmp/candidate results
          mkdir -p /tmp/control /tmp/candidate results
          gh run download 34359639522 -n v16-python-qTT-full-pruning-8ca7e7ccaba29acff86409b218364411d7e037ef -D /tmp/art
          ZIP=$(find /tmp/art -type f -name 'Little-Gambit-V16-qTT-pruning.zip' -print -quit); test -n "$ZIP"
          unzip -q "$ZIP" -d /tmp/control
          cp -a /tmp/control/. /tmp/candidate/
          python scripts/patch_v16_qtt_depth_cap_final.py /tmp/candidate/experiments/numba_search.py "$CAP" | tee results/patch.txt
          python -m py_compile /tmp/candidate/agent.py /tmp/candidate/experiments/*.py
          (cd /tmp/candidate && zip -q -9 -r "$GITHUB_WORKSPACE/results/Little-Gambit-V16-pruning-qTT-cap-${CAP}.zip" .)
      - name: Cold startup gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cold /tmp/home /tmp/cache /tmp/numba; mkdir /tmp/cold
          unzip -q "results/Little-Gambit-V16-pruning-qTT-cap-${{ matrix.cap }}.zip" -d /tmp/cold
          /usr/bin/time -f 'PROCESS_WALL_SECONDS %e' -o results/cold-process.txt timeout 70s env PYTHONPATH=/tmp/cold HOME=/tmp/home XDG_CACHE_HOME=/tmp/cache NUMBA_CACHE_DIR=/tmp/numba OMP_NUM_THREADS=1 python - <<'PY' > results/cold.txt 2>&1
          import sys,time
          t=time.perf_counter();sys.path.insert(0,'/tmp/cold');import agent
          print('READY_SECONDS',time.perf_counter()-t)
          PY
          cat results/cold-process.txt results/cold.txt
      - name: Fixed-node throughput
        shell: bash
        run: |
          cat >/tmp/bench.py <<'PY'
          import statistics,time,chess,numpy as np,agent
          from experiments.numba_core import encode_position
          from experiments.numba_search import iterative_search_stateful_timed_cached
          fens=[chess.STARTING_FEN,'r2q1rk1/pp2bppp/2n1pn2/2pp4/8/1PN1PN2/PBPP1PPP/R2QKB1R w KQ - 2 9','2r3k1/4qp2/4b3/p5p1/4P1P1/2Pr2P1/P4PB1/R1Q2RK1 w - - 1 23']
          rates=[]
          for fen in fens:
              b=chess.Board(fen);e=encode_position(b);h=np.empty(0,dtype=np.uint64)
              agent._HASH_KEYS.fill(0);agent._HASH_MOVES.fill(-1);agent._TT_TABLE.fill(0)
              t=time.perf_counter();r=iterative_search_stateful_timed_cached(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,60000,60000,150000,agent._HASH_KEYS,agent._HASH_MOVES,agent._TT_TABLE);dt=time.perf_counter()-t
              rates.append(int(r[3])/dt)
          print('MEDIAN_NPS',statistics.median(rates))
          PY
          (cd /tmp/control && PYTHONPATH=/tmp/control python /tmp/bench.py) | tee results/control-nps.txt
          (cd /tmp/candidate && PYTHONPATH=/tmp/candidate python /tmp/bench.py) | tee results/candidate-nps.txt
          python - <<'PY' | tee results/nps-summary.txt
          import pathlib,re
          f=lambda p:float(re.search(r'MEDIAN_NPS ([0-9.eE+-]+)',pathlib.Path(p).read_text()).group(1))
          a=f('results/control-nps.txt');b=f('results/candidate-nps.txt');print('NPS_RATIO',b/a)
          PY
      - name: Build fresh roots
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          rm -rf /tmp/m6; mkdir /tmp/m6; python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]; roots=fresh[4720:4776]; assert len(roots)==56 and len(set(roots))==56
          Path('/tmp/node.epd').write_text('\n'.join(roots[:24])+'\n'); Path('/tmp/clock.epd').write_text('\n'.join(roots[24:])+'\n')
          PY
      - name: 48-game equal-node screen
        run: python -u tools/v14_fixed_node_arena.py /tmp/candidate /tmp/control --nodes 20000 --pairs 24 --opening-file /tmp/node.epd --max-plies 220 --json-out results/equal-node.json | tee results/equal-node.log
      - name: 64-game real-clock screen
        run: python -u scripts/v15_competition_gate.py --control /tmp/control --candidate /tmp/candidate --openings /tmp/clock.epd --output results/timed.json --label 'V16 pruning qTT cap ${{ matrix.cap }}' --base-ms 2500 --inc-ms 50 --max-plies 180 --grace-ms 1500 | tee results/timed.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v16-pruning-qtt-cap-${{ matrix.cap }}-${{ github.sha }}
          path: results/
          retention-days: 30
