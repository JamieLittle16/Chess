name: M4 LMR integration

on:
  push:
    branches:
      - m4/lmr-v1

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m4/lmr-v1
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Apply LMR patch
        run: python3 scripts/_tmp_lmr_patch.py
      - name: Format and clean helper
        run: |
          set -euo pipefail
          cargo fmt --all
          rm scripts/_tmp_lmr_patch.py
      - name: Commit LMR implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/chess-search/src/lib.rs scripts/_tmp_lmr_patch.py
          git diff --cached --check
          git commit -m 'search: add conservative late-move reductions'
          git push origin HEAD:m4/lmr-v1
