name: V13 static teacher residual v3

on:
  push:
    branches:
      - analysis/v13-static-teacher-v3

permissions:
  contents: read

jobs:
  train-static-residual:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy scipy scikit-learn
      - name: Fetch pinned Stockfish 19
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qualification/stockfish .qualification/books
          curl --fail --location --retry 3 --output .qualification/stockfish.tar.gz \
            https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz
          echo '9defc0d4e55d49c65a6d042f3e571a39fcea499ade6dbe741b53b8c65e03611f  .qualification/stockfish.tar.gz' | sha256sum --check --strict
          tar -xzf .qualification/stockfish.tar.gz -C .qualification/stockfish
          STOCKFISH_BIN=$(find "$PWD/.qualification/stockfish" -type f -name 'stockfish*' -perm -111 -print -quit)
          test -n "$STOCKFISH_BIN"
          echo "STOCKFISH_BIN=$STOCKFISH_BIN" >> "$GITHUB_ENV"
      - name: Download CC0 development books
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/official-stockfish/books/raw/master
          curl --fail --location --retry 3 -o .qualification/books/uho.zip "$base/UHO_Lichess_4852_v1.epd.zip"
          curl --fail --location --retry 3 -o .qualification/books/popular.zip "$base/popularpos_lichess_v3.epd.zip"
          curl --fail --location --retry 3 -o .qualification/books/endgames.zip "$base/endgames.epd.zip"
          sha256sum .qualification/books/*.zip | tee .qualification/books/SHA256SUMS
      - name: Deterministically sample 60k independent positions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import random, zipfile
          from pathlib import Path
          jobs=[('uho',30000,202609071),('popular',20000,202609072),('endgames',10000,202609073)]
          root=Path('.qualification/books')
          for name,k,seed in jobs:
              rng=random.Random(seed); sample=[]; seen=0
              with zipfile.ZipFile(root/f'{name}.zip') as z:
                  names=[n for n in z.namelist() if n.lower().endswith(('.epd','.pgn'))]
                  epds=[n for n in names if n.lower().endswith('.epd')]
                  if len(epds)!=1: raise SystemExit(f'{name}: expected one EPD, got {names!r}')
                  with z.open(epds[0]) as f:
                      for raw in f:
                          line=raw.decode('utf-8','strict').strip()
                          if not line or line.startswith('#'): continue
                          seen += 1
                          if len(sample)<k: sample.append(line)
                          else:
                              j=rng.randrange(seen)
                              if j<k: sample[j]=line
              if len(sample)!=k: raise SystemExit(f'{name}: sampled {len(sample)} of {seen}')
              (root/f'{name}-sample.epd').write_text('\n'.join(sample)+'\n',encoding='utf-8')
              print(name,{'source':seen,'sample':len(sample)})
          PY
          sha256sum .qualification/books/*-sample.epd
      - name: Label with Stockfish static evaluation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_static_eval_teacher.py \
            --stockfish "$STOCKFISH_BIN" \
            --epd .qualification/books/uho-sample.epd \
            --epd .qualification/books/popular-sample.epd \
            --epd .qualification/books/endgames-sample.epd \
            --split-salt 'Chess/v13-static-teacher-v3' \
            --validation-permille 100 --holdout-permille 100 \
            --output teacher-static/teacher.jsonl
      - name: Train residual grid
        shell: bash
        run: |
          set -euo pipefail
          python scripts/train_v13_linear_residual.py \
            --teacher teacher-static/teacher.jsonl \
            --output-dir residual-static \
            --alphas 30,100,300,1000,3000,10000 \
            --clamps 100,150,200,250,300,400,600,0
          cp teacher-static/teacher.manifest.json residual-static/teacher-manifest.json
          cp .qualification/books/SHA256SUMS residual-static/book-SHA256SUMS
          sha256sum residual-static/weights.i16 residual-static/model.json residual-static/report.json > residual-static/SHA256SUMS
          cat residual-static/model.json
      - name: Upload static-teacher residual
        uses: actions/upload-artifact@v4
        with:
          name: v13-static-teacher-residual-${{ github.sha }}
          path: residual-static/
          retention-days: 30
