name: V18 multi-year broadcast opening coverage

on:
  push:
    branches: [analysis/v18-multiyear-broadcast-book-20260910]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        year: [2024, 2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install chess==1.11.2 zstandard
      - name: Download broadcast year
        run: |
          set -euo pipefail
          mkdir -p /tmp/broadcast
          for month in 01 02 03 04 05 06 07 08 09 10 11 12; do
            url="https://database.lichess.org/broadcast/lichess_db_broadcast_${{ matrix.year }}-${month}.pgn.zst"
            if curl --fail --location --retry 3 "$url" -o "/tmp/broadcast/${{ matrix.year }}-${month}.pgn.zst"; then
              echo "got $url"
            else
              rm -f "/tmp/broadcast/${{ matrix.year }}-${month}.pgn.zst"
              echo "missing $url"
            fi
          done
          test "$(find /tmp/broadcast -type f | wc -l)" -ge 6
          du -sh /tmp/broadcast
      - name: Build opening books
        run: |
          set -euo pipefail
          out="analysis-results/v18-broadcast-${{ matrix.year }}"
          mkdir -p "$out"
          python scripts/build_broadcast_polyglot.py \
            --input /tmp/broadcast/*.pgn.zst \
            --output-dir "$out" \
            --max-ply 22 --hi-min-elo 2350 \
            | tee "$out/build.log"
          sha256sum "$out"/*.bin > "$out/sha256.txt"
          ls -lh "$out"/*.bin
      - name: Historical start coverage
        run: |
          python - <<'PY' | tee "analysis-results/v18-broadcast-${{ matrix.year }}/coverage.log"
          import glob,os,chess,chess.polyglot
          starts=[
            ('R46','Taimanov','r1bqkbnr/pp1p1ppp/2n1p3/8/3NP3/P7/1PP2PPP/RNBQKB1R b KQkq - 0 5'),
            ('R48','Semi-Slav','r1b1k2r/pp1nqppp/2pbpn2/3p4/P1PP4/2N1PN2/1P2BPPP/R1BQ1RK1 b kq - 4 8'),
            ('R49','Italian','r1bqk2r/1pp2ppp/1bnp1n2/pP2p3/P1B1P3/2PP1N2/5PPP/RNBQK2R b KQkq - 0 8'),
            ('R50','London','r1bqk2r/pp3ppp/2nbpn2/2pp4/3P1B2/P1P1P3/1P1N1PPP/R2QKBNR w KQkq - 1 7'),
            ('R51','French Classical','r1bqk2r/pp1n1ppp/2n1p3/2bpP3/5P2/2NB1N2/PPP3PP/R1BQK2R b KQkq - 1 8'),
            ('R53','Najdorf','rnbqk2r/1p2bppp/p2ppn2/8/4PPP1/1NN5/PPP4P/R1BQKB1R b KQkq - 0 8'),
            ('R57','Queens Indian','rn1q1rk1/pbppbppp/1p2pn2/8/2PP4/5NP1/PP2PPBP/RNBQR1K1 b - - 6 7'),
            ('R61','English Symm','r1bq1rk1/pp1pppbp/2n2np1/2p5/2PP4/2N2NP1/PP2PPBP/R1BQ1RK1 b - - 0 7'),
            ('R65','Sveshnikov','r1bqkb1r/1p3ppp/p1np1n2/4p3/P3P3/N1N5/1PP2PPP/R1BQKB1R b KQkq - 1 8'),
            ('R85','French Tarrasch','rnbqkbnr/pp3ppp/8/2pp4/3P4/7P/PPPN1PP1/R1BQKBNR b KQkq - 0 5'),
          ]
          for path in sorted(glob.glob('analysis-results/v18-broadcast-${{ matrix.year }}/*.bin')):
            if not ('all-min2' in path or 'all-min3' in path or 'hi-min1' in path): continue
            hits=0; print('\nBOOK',os.path.basename(path),os.path.getsize(path))
            with chess.polyglot.open_reader(path) as r:
              for rid,name,fen in starts:
                b=chess.Board(fen); legal=set(b.legal_moves)
                es=[e for e in r.find_all(b) if e.move in legal and int(e.weight)>0]
                es.sort(key=lambda e:(-int(e.weight),e.move.uci()))
                hits += bool(es); total=sum(int(e.weight) for e in es); top=int(es[0].weight) if es else 0
                share=top/total if total else 0.0
                print(f'{rid} {name:18} hit={bool(es)!s:5} top={top:5d} total={total:6d} share={share:.3f} move={(es[0].move.uci() if es else "-")}')
            print('SUMMARY',hits,'/10')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v18-broadcast-${{ matrix.year }}-${{ github.sha }}
          path: analysis-results/v18-broadcast-${{ matrix.year }}
          retention-days: 5
