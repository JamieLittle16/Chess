name: V14 compact NNUE whole-search cost ladder

on:
  push:
    branches: [analysis/v14-nnue-search-cost-ladder-20260908]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cost:
    strategy:
      fail-fast: false
      matrix:
        hidden: [64, 96, 128, 192]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact competition runtime
        run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Reconstruct exact V13 and H${{ matrix.hidden }} cost candidate
        shell: bash
        run: |
          set -euo pipefail
          cat .analysis/v13_chunks_*.b64 | base64 -d > /tmp/v13.zip
          echo '658fd954180c2d0d39c02ba6601af36d06cdbd573bfb72c6879169861a7ad092  /tmp/v13.zip' | sha256sum -c -
          rm -rf /tmp/v13-control /tmp/v14-cost
          mkdir -p /tmp/v13-control /tmp/v14-cost
          unzip -q /tmp/v13.zip -d /tmp/v13-control
          unzip -q /tmp/v13.zip -d /tmp/v14-cost
          for DIR in /tmp/v13-control /tmp/v14-cost; do
            patch "$DIR/experiments/numba_search.py" < .analysis/v13_jit_refactor.patch
            DIR="$DIR" python - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['DIR'])/'experiments/numba_search.py'; s=p.read_text()
          old='    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          new='    correction = correction // 6\n    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          assert s.count(old)==1; p.write_text(s.replace(old,new,1))
          PY
            python scripts/patch_v13_legality_context.py "$DIR/experiments/numba_core.py"
            python scripts/patch_v13_qsearch_tactical.py "$DIR/experiments/numba_core.py" "$DIR/experiments/numba_search.py"
          done
          echo '0306e8145a453d91b9b5ac92e9980931510d9e18f8ba598a7548d08b85165c35  /tmp/v13-control/experiments/numba_core.py' | sha256sum -c -
          echo '401f6580028a72361286bd99bee1f0022c74e6c8a65da8acd47448835a1ff360  /tmp/v13-control/experiments/numba_search.py' | sha256sum -c -
          python scripts/patch_v14_nnue_search_cost_width.py /tmp/v14-cost/experiments/numba_search.py --hidden '${{ matrix.hidden }}'
          python -m py_compile /tmp/v14-cost/experiments/numba_search.py
          cmp /tmp/v13-control/experiments/numba_core.py /tmp/v14-cost/experiments/numba_core.py
          cmp /tmp/v13-control/experiments/v13_residual.i16 /tmp/v14-cost/experiments/v13_residual.i16
      - name: Exact signatures and NPS ratio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p result
          cat >/tmp/worker.py <<'PY'
          import json,sys,time,chess,numpy as np
          from experiments.numba_core import encode_position
          from experiments.numba_search import iterative_search_stateful
          for line in sys.stdin:
              q=json.loads(line); b=chess.Board(q['fen']); e=encode_position(b); h=np.empty(0,dtype=np.uint64)
              t0=time.perf_counter_ns(); out=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,int(q['nodes'])); t1=time.perf_counter_ns()
              print(json.dumps({'s':[int(out[0]),int(out[1]),int(out[2]),int(out[3])],'ns':t1-t0}),flush=True)
          PY
          H='${{ matrix.hidden }}' python - <<'PY'
          import json,os,statistics,subprocess,sys
          from pathlib import Path
          H=int(os.environ['H']); roots=[x.strip() for x in open('match/openings/m3-uho-lichess-100-v1.epd') if x.strip()][:24]
          N=50000; REPS=3
          def start(path):
              env=os.environ.copy(); env['PYTHONPATH']=path
              return subprocess.Popen([sys.executable,'/tmp/worker.py'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env=env)
          def ask(p,fen,n):
              p.stdin.write(json.dumps({'fen':fen,'nodes':n})+'\n'); p.stdin.flush(); return json.loads(p.stdout.readline())
          b=start('/tmp/v13-control'); c=start('/tmp/v14-cost'); ratios=[]; rows=[]
          try:
              ask(b,roots[0],500); ask(c,roots[0],500)
              for rep in range(REPS):
                  bn=bt=cn=ct=0
                  for fen in roots:
                      if rep&1: cr=ask(c,fen,N); br=ask(b,fen,N)
                      else: br=ask(b,fen,N); cr=ask(c,fen,N)
                      assert br['s']==cr['s'],(H,rep,fen,br['s'],cr['s'])
                      bn+=br['s'][3]; bt+=br['ns']; cn+=cr['s'][3]; ct+=cr['ns']
                  bps=bn/(bt/1e9); cps=cn/(ct/1e9); ratio=cps/bps; ratios.append(ratio); rows.append({'rep':rep,'base_nps':bps,'candidate_nps':cps,'ratio':ratio})
          finally:
              for p in (b,c): p.terminate(); p.wait()
          out={'hidden':H,'exact_signatures':True,'positions':len(roots),'nodes':N,'ratios':ratios,'median_nps_ratio':statistics.median(ratios),'rows':rows}
          print(json.dumps(out,indent=2)); Path(f'result/h{H}.json').write_text(json.dumps(out,indent=2)); assert out['median_nps_ratio']>=0.65
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v14-nnue-cost-h${{ matrix.hidden }}-${{ github.sha }}
          path: result/
          retention-days: 30
