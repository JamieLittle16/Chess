name: V15 Python deferred child-state qualification

on:
  push:
    branches: [analysis/v15-python-deferred-child-state-20260908]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install exact runtime
        run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Download exact packaged V14
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - name: Materialize exact A/B and JIT
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name 'Little-Gambit-V14.zip' -print -quit); test -n "$ZIP"
          rm -rf /tmp/base /tmp/cand;mkdir -p /tmp/base /tmp/cand results
          unzip -q "$ZIP" -d /tmp/base;cp -a /tmp/base/. /tmp/cand/
          python scripts/patch_v15_python_deferred_child_state.py /tmp/cand/experiments/numba_search.py
          python -m py_compile /tmp/cand/experiments/numba_search.py
          PYTHONPATH=/tmp/cand python - <<'PY'
          import chess,numpy as np
          from experiments.numba_core import encode_position,move_to_uci
          from experiments.numba_search import iterative_search_stateful
          for fen in (chess.STARTING_FEN,'r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 0 1'):
              b=chess.Board(fen);e=encode_position(b);h=np.empty(0,dtype=np.uint64);o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,6000);m=chess.Move.from_uci(move_to_uci(int(o[0])));assert m in b.legal_moves;print(o,m)
          PY
      - name: Build fresh 64-root suite
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          rm -rf /tmp/m6;mkdir /tmp/m6;python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')};large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()];fresh=[x for x in large if x not in old];chosen=fresh[688:752];assert len(chosen)==64;Path('/tmp/defer-64.epd').write_text('\n'.join(chosen)+'\n')
          PY
      - name: Prove fixed-node bit equivalence and measure NPS
        shell: bash
        run: |
          cat >/tmp/worker.py <<'PY'
          import json,sys,chess,numpy as np
          from experiments.numba_core import encode_position
          from experiments.numba_search import iterative_search_stateful
          for line in sys.stdin:
              q=json.loads(line);b=chess.Board(q['fen']);e=encode_position(b);h=np.empty(0,dtype=np.uint64);o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,int(q['n']));print(json.dumps({'m':int(o[0]),'s':int(o[1]),'d':int(o[2]),'n':int(o[3])}),flush=True)
          PY
          python - <<'PY'
          import json,os,statistics,subprocess,sys,time
          roots=[x.strip() for x in open('/tmp/defer-64.epd') if x.strip()]
          def start(d):e=os.environ.copy();e['PYTHONPATH']=d;return subprocess.Popen([sys.executable,'/tmp/worker.py'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,env=e)
          def one(p,f,n):p.stdin.write(json.dumps({'fen':f,'n':n})+'\n');p.stdin.flush();return json.loads(p.stdout.readline())
          b=start('/tmp/base');c=start('/tmp/cand');rat=[];rows=[]
          try:
              one(b,roots[0],500);one(c,roots[0],500)
              bad=[]
              for i,f in enumerate(roots):
                  x=one(b,f,18000);y=one(c,f,18000)
                  if x!=y:bad.append({'i':i,'base':x,'cand':y})
              if bad:raise SystemExit('semantic drift '+json.dumps(bad[:5]))
              test=roots[:24]
              def timed(p,order):
                  n=0;t=time.perf_counter()
                  for f in order:n+=one(p,f,30000)['n']
                  return n/(time.perf_counter()-t)
              for rep in range(5):
                  order=test if rep%2==0 else list(reversed(test))
                  if rep%2==0:bn=timed(b,order);cn=timed(c,order)
                  else:cn=timed(c,order);bn=timed(b,order)
                  rat.append(cn/bn);rows.append({'rep':rep,'base_nps':bn,'candidate_nps':cn,'ratio':cn/bn})
          finally:b.terminate();c.terminate();b.wait();c.wait()
          out={'equivalent_roots':len(roots),'median_nps_ratio':statistics.median(rat),'rows':rows};open('results/throughput.json','w').write(json.dumps(out,indent=2)+'\n');print('FINAL',out)
          PY
      - name: 64-game competition-clock confirmation
        shell: bash
        run: |
          python - <<'PY'
          import json,math,queue,subprocess,sys,threading,time,chess
          roots=[x.strip() for x in open('/tmp/defer-64.epd') if x.strip()][:32];BASE=2500.;INC=50.;GRACE=1200;MAX=180
          class A:
              def __init__(self,d):self.p=subprocess.Popen([sys.executable,'tools/v14_agent_runner.py',d],stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,bufsize=1);self.q=queue.Queue();threading.Thread(target=self.ro,daemon=True).start();assert json.loads(self.line(95)).get('ready')
              def ro(self):
                  for x in self.p.stdout:self.q.put(x.rstrip())
                  self.q.put(None)
              def line(self,t):x=self.q.get(timeout=t);return x if x is not None else (_ for _ in ()).throw(RuntimeError('closed'))
              def reset(self):self.p.stdin.write('{"reset":true}\n');self.p.stdin.flush();self.line(5)
              def move(self,b,ms):self.p.stdin.write(json.dumps({'fen':b.fen(),'time_left_ms':max(0,int(ms))})+'\n');self.p.stdin.flush();return chess.Move.from_uci(json.loads(self.line((ms+GRACE)/1000))['move'])
              def stop(self):self.p.kill() if self.p.poll() is None else None;self.p.wait()
          ba=A('/tmp/base');ca=A('/tmp/cand');rows=[]
          def game(f,cw):
              b=chess.Board(f);cl={True:BASE,False:BASE};ba.reset();ca.reset();ct=[];bt=[]
              for _ in range(MAX):
                  o=b.outcome(claim_draw=True)
                  if o:return 0.5 if o.winner is None else float(o.winner==cw),ct,bt
                  use=b.turn==cw;e=ca if use else ba;t=time.monotonic();m=e.move(b,cl[b.turn]);dt=(time.monotonic()-t)*1000;cl[b.turn]-=dt
                  if cl[b.turn]<0:return (0. if use else 1.),ct,bt
                  (ct if use else bt).append(dt);b.push(m);cl[not b.turn]+=INC
              return .5,ct,bt
          try:
              for i,f in enumerate(roots):
                  for cw in (True,False):s,ct,bt=game(f,cw);rows.append({'i':i,'cw':cw,'score':s,'ct':ct,'bt':bt});print(i,cw,s,flush=True)
          finally:ba.stop();ca.stop()
          score=sum(r['score'] for r in rows);frac=score/len(rows);elo=400*math.log10(frac/(1-frac)) if 0<frac<1 else None;ct=[x for r in rows for x in r['ct']];bt=[x for r in rows for x in r['bt']];out={'games':len(rows),'score':score,'score_fraction':frac,'naive_elo_from_score':elo,'candidate_mean_move_ms':sum(ct)/len(ct),'control_mean_move_ms':sum(bt)/len(bt),'details':rows};open('results/timed.json','w').write(json.dumps(out,indent=2)+'\n');print('FINAL',json.dumps({k:v for k,v in out.items() if k!='details'}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-python-deferred-child-state-${{ github.sha }}
          path: results/
          retention-days: 30
