name: V13 endgame residual training

on:
  push:
    branches:
      - analysis/v13-endgame-residual-20260907
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy scipy scikit-learn
      - name: Download immutable accepted 200-game source
        uses: actions/download-artifact@v4
        with:
          name: m4-static-legality-v1-acceptance-1f44bb9d867c5c8166e1590324c41b66a44ea924
          path: .qualification/frozen-games
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34136520700
      - name: Verify frozen source
        run: echo '429c8c40f79782de1355ffa14c3c6a07d440b348fb4e0937af76150781e3df8e  .qualification/frozen-games/games.pgn' | sha256sum --check --strict
      - name: Fetch pinned Stockfish 19
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qualification/stockfish
          curl --fail --location --retry 3 --output .qualification/stockfish.tar.gz \
            https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz
          echo '9defc0d4e55d49c65a6d042f3e571a39fcea499ade6dbe741b53b8c65e03611f  .qualification/stockfish.tar.gz' | sha256sum --check --strict
          tar -xzf .qualification/stockfish.tar.gz -C .qualification/stockfish
          STOCKFISH_BIN=$(find "$PWD/.qualification/stockfish" -type f -name 'stockfish*' -perm -111 -print -quit)
          test -n "$STOCKFISH_BIN"
          echo "STOCKFISH_BIN=$STOCKFISH_BIN" >> "$GITHUB_ENV"
      - name: Label only low-phase reached positions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/generate_v13_endgame_teacher.py \
            --stockfish "$STOCKFISH_BIN" --pgn .qualification/frozen-games/games.pgn \
            --nodes 12000 --threads 1 --hash-mb 64 --min-ply 20 --max-ply 220 \
            --max-phase 8 --max-positions 8000 \
            --validation-permille 100 --holdout-permille 100 \
            --split-salt 'Chess/v13-endgame-v1' --output-dir teacher-endgame
      - name: Create nested phase corpora
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src=Path('teacher-endgame/teacher.jsonl')
          recs=[json.loads(x) for x in src.read_text().splitlines() if x.strip()]
          for cap in (4,6,8):
              out=Path(f'teacher-p{cap}.jsonl')
              selected=[r for r in recs if int(r['phase']) <= cap]
              out.write_text(''.join(json.dumps(r,sort_keys=True)+'\n' for r in selected))
              counts={s:sum(r['split']==s for r in selected) for s in ('train','validation','holdout')}
              print('phase',cap,'records',len(selected),'splits',counts)
          PY
      - name: Train phase-specific linear residuals
        shell: bash
        run: |
          set -euo pipefail
          for CAP in 4 6 8; do
            python scripts/train_v13_linear_residual.py \
              --teacher "teacher-p${CAP}.jsonl" --output-dir "model-p${CAP}" \
              --target-clip-cp 1800 \
              --alphas '10,30,100,300,1000,3000,10000' \
              --clamps '100,150,200,250,300,400,600,800,1000,0'
          done
          python - <<'PY'
          import json
          for cap in (4,6,8):
              r=json.load(open(f'model-p{cap}/report.json'))
              print('P'+str(cap),json.dumps({
                  'records':r['records'],
                  'alpha':r['selected_alpha'],
                  'clamp':r['selected_clamp_cp'],
                  'baseline_val':r['baseline']['validation'],
                  'model_val':r['quantized_selected']['validation'],
                  'baseline_holdout':r['baseline']['holdout'],
                  'model_holdout':r['quantized_selected']['holdout'],
              },sort_keys=True))
          PY
      - name: Freeze models
        shell: bash
        run: |
          set -euo pipefail
          mkdir bundle
          cp teacher-endgame/manifest.json bundle/teacher-manifest.json
          for CAP in 4 6 8; do
            cp "model-p${CAP}/weights.i16" "bundle/weights-p${CAP}.i16"
            cp "model-p${CAP}/model.json" "bundle/model-p${CAP}.json"
            cp "model-p${CAP}/report.json" "bundle/report-p${CAP}.json"
          done
          sha256sum bundle/* > bundle/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: v13-endgame-residual-${{ github.sha }}
          path: bundle/
          retention-days: 30
