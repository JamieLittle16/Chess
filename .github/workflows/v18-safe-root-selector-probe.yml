name: V18 safe root selector probe

on:
  push:
    branches: [analysis/v18-root-quality-fastfilter-20260911]
    paths: ['.github/workflows/v18-safe-root-selector-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: band8-margin16
            band: 8
            margin: 16
          - variant: band12-margin16
            band: 12
            margin: 16
          - variant: band16-margin20
            band: 16
            margin: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q 'numba==0.67.0' 'numpy==2.5.2' 'chess==1.11.2'
      - name: Build candidate
        run: |
          set -euo pipefail
          rm -rf /tmp/engine; mkdir -p /tmp/engine
          cat ci/v18_postbook_payload/chunk_*.b64 | base64 -d > /tmp/p150.zip
          unzip -q /tmp/p150.zip -d /tmp/engine
          sed -i 's/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.50/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.33/' /tmp/engine/agent.py
          curl --fail --location --retry 5 -sS 'https://raw.githubusercontent.com/michaeldv/donna_opening_books/master/gm2001.bin' -o /tmp/engine/v18_gm2001.bin
          python scripts/apply_v18_see_capture_ordering.py /tmp/engine/experiments/numba_search.py
          python scripts/apply_v18_root_value.py /tmp/engine/experiments/numba_search.py 4
          python scripts/apply_v18_safe_root_selector.py /tmp/engine/experiments/numba_search.py '${{ matrix.band }}' '${{ matrix.margin }}'
          python -m py_compile /tmp/engine/agent.py /tmp/engine/experiments/numba_search.py
      - name: Probe critical
        env:
          PYTHONPATH: /tmp/engine
          VARIANT: ${{ matrix.variant }}
        run: |
          python - <<'PY'
          import os,time,numpy as np
          import agent
          fen='rn1r2k1/ppq2ppp/2b1pn2/6B1/1b1P4/1BNQ1N1P/PP3PP1/R4RK1 b - - 8 13'
          def reset():
              agent._GAME_KEYS.clear(); agent._PENDING_AFTER_OUR_MOVE=None; agent._LAST_CALL_TIME_LEFT_MS=None; agent._LAST_GET_MOVE_ELAPSED_MS=None
              agent._HASH_KEYS.fill(np.uint64(0)); agent._HASH_MOVES.fill(np.int32(-1)); agent._TT_TABLE.fill(np.uint64(0)); agent._QUIET_HISTORY.fill(np.int16(0))
          for ms in (122968,240000):
              reset(); t=time.perf_counter(); m=agent.get_move(fen,ms); dt=time.perf_counter()-t
              print('SAFE_SELECTOR_PROBE',os.environ['VARIANT'],'clock',ms,'move',m,'seconds',round(dt,3),flush=True)
          PY
