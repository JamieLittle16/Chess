name: V15 Python search stack A

on:
  push:
    branches: [analysis/v15-python-search-stack-a-20260908]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - name: Materialize exact A/B and fresh roots
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name 'Little-Gambit-V14.zip' -print -quit); test -n "$ZIP"
          rm -rf /tmp/base /tmp/cand /tmp/m6; mkdir -p /tmp/base /tmp/cand /tmp/m6 results
          unzip -q "$ZIP" -d /tmp/base; cp -a /tmp/base/. /tmp/cand/
          python scripts/patch_v15_python_lmp.py /tmp/cand/experiments/numba_search.py 5 9 999
          python scripts/patch_v15_python_qsearch_delta.py /tmp/cand/experiments/numba_search.py 300
          python -m py_compile /tmp/cand/experiments/*.py /tmp/cand/agent.py
          PYTHONPATH=/tmp/cand python - <<'PY'
          import chess,numpy as np
          from experiments.numba_core import encode_position,move_to_uci
          from experiments.numba_search import iterative_search_stateful
          b=chess.Board();e=encode_position(b);h=np.empty(0,dtype=np.uint64);o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,8000);m=chess.Move.from_uci(move_to_uci(int(o[0])));assert m in b.legal_moves;print(o,m)
          PY
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]; chosen=fresh[1392:1440]
          assert len(chosen)==48 and len(set(chosen))==48
          Path('/tmp/stack-48.epd').write_text('\n'.join(chosen)+'\n')
          PY
      - name: 96-game equal-node confirmation
        run: python -u tools/v14_fixed_node_arena.py /tmp/cand /tmp/base --nodes 16000 --pairs 48 --opening-file /tmp/stack-48.epd --max-plies 220 --json-out results/equal-node.json | tee results/equal-node.log
      - name: 96-game competition-clock gate
        run: python scripts/v15_competition_gate.py --control /tmp/base --candidate /tmp/cand --openings /tmp/stack-48.epd --output results/timed.json --label 'V15 LMP(5,9)+qdelta300'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-python-search-stack-a-${{ github.sha }}
          path: results/
          retention-days: 30
