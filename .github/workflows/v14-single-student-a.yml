name: V14 single-accumulator residual student A

on:
  push:
    branches: [analysis/v14-single-student-a-20260908]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teacher:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact Python runtime
        run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0

      - name: Reconstruct immutable V13 BEST
        shell: bash
        run: |
          set -euo pipefail
          cat .analysis/v13_chunks_*.b64 | base64 -d > /tmp/v13.zip
          echo '658fd954180c2d0d39c02ba6601af36d06cdbd573bfb72c6879169861a7ad092  /tmp/v13.zip' | sha256sum --check --strict
          rm -rf /tmp/v13 && mkdir /tmp/v13
          unzip -q /tmp/v13.zip -d /tmp/v13
          patch /tmp/v13/experiments/numba_search.py < .analysis/v13_jit_refactor.patch
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/v13/experiments/numba_search.py'); s=p.read_text()
          old='    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          new='    correction = correction // 6\n    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          assert s.count(old)==1,s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
          python scripts/patch_v13_legality_context.py /tmp/v13/experiments/numba_core.py
          python scripts/patch_v13_qsearch_tactical.py /tmp/v13/experiments/numba_core.py /tmp/v13/experiments/numba_search.py
          echo 'df346b21be42832a0ae97e7faa15953ab460f0387fb0358961651466557ebde8  /tmp/v13/agent.py' | sha256sum --check --strict
          echo '0306e8145a453d91b9b5ac92e9980931510d9e18f8ba598a7548d08b85165c35  /tmp/v13/experiments/numba_core.py' | sha256sum --check --strict
          echo '401f6580028a72361286bd99bee1f0022c74e6c8a65da8acd47448835a1ff360  /tmp/v13/experiments/numba_search.py' | sha256sum --check --strict
          python -m py_compile tools/v14_generate_selfplay_positions.py tools/v14_label_selfplay_teacher.py scripts/train_v14_single_residual.py

      - name: Generate deterministic V13 self-play distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p student-source
          python -u tools/v14_generate_selfplay_positions.py \
            --engine /tmp/v13 \
            --openings match/openings/m3-uho-lichess-100-v1.epd \
            --nodes 6000 --games 80 --opening-offset 0 \
            --min-ply 8 --max-ply 160 --stride 4 --max-positions 2400 \
            --output student-source/selfplay-positions.json \
            | tee student-source/selfplay.log

      - name: Fetch pinned Stockfish 19
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qualification/stockfish
          curl --fail --location --retry 3 \
            --output .qualification/stockfish.tar.gz \
            https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz
          echo '9defc0d4e55d49c65a6d042f3e571a39fcea499ade6dbe741b53b8c65e03611f  .qualification/stockfish.tar.gz' | sha256sum --check --strict
          tar -xzf .qualification/stockfish.tar.gz -C .qualification/stockfish
          STOCKFISH_BIN=$(find "$PWD/.qualification/stockfish" -type f -name 'stockfish*' -perm -111 -print -quit)
          test -n "$STOCKFISH_BIN"
          echo "STOCKFISH_BIN=$STOCKFISH_BIN" >> "$GITHUB_ENV"
          "$STOCKFISH_BIN" bench 1 1 4 default depth >/dev/null

      - name: Label self-play positions with fixed-node Stockfish
        shell: bash
        run: |
          set -euo pipefail
          python -u tools/v14_label_selfplay_teacher.py \
            --positions student-source/selfplay-positions.json \
            --stockfish "$STOCKFISH_BIN" \
            --nodes 15000 --threads 1 --hash-mb 64 \
            --split-salt Chess/v14-python-single-residual-a \
            --validation-permille 100 --holdout-permille 100 \
            --output student-source/teacher.jsonl \
            | tee student-source/teacher.log
          wc -l student-source/teacher.jsonl
          sha256sum student-source/teacher.jsonl | tee student-source/teacher.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: v14-single-student-teacher-${{ github.sha }}
          path: student-source/
          retention-days: 30

  train:
    needs: teacher
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        hidden: [64, 96]
    name: train-h${{ matrix.hidden }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact Python runtime
        run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - uses: actions/download-artifact@v4
        with:
          name: v14-single-student-teacher-${{ github.sha }}
          path: student-source

      - name: Reconstruct immutable V13 BEST for residual targets
        shell: bash
        run: |
          set -euo pipefail
          cat .analysis/v13_chunks_*.b64 | base64 -d > /tmp/v13.zip
          echo '658fd954180c2d0d39c02ba6601af36d06cdbd573bfb72c6879169861a7ad092  /tmp/v13.zip' | sha256sum --check --strict
          rm -rf /tmp/v13 && mkdir /tmp/v13
          unzip -q /tmp/v13.zip -d /tmp/v13
          patch /tmp/v13/experiments/numba_search.py < .analysis/v13_jit_refactor.patch
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/v13/experiments/numba_search.py'); s=p.read_text()
          old='    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          new='    correction = correction // 6\n    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          assert s.count(old)==1,s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
          python scripts/patch_v13_legality_context.py /tmp/v13/experiments/numba_core.py
          python scripts/patch_v13_qsearch_tactical.py /tmp/v13/experiments/numba_core.py /tmp/v13/experiments/numba_search.py
          echo '401f6580028a72361286bd99bee1f0022c74e6c8a65da8acd47448835a1ff360  /tmp/v13/experiments/numba_search.py' | sha256sum --check --strict

      - name: Train and quantise single residual student
        shell: bash
        run: |
          set -euo pipefail
          OUT="student-h${{ matrix.hidden }}"
          python -u scripts/train_v14_single_residual.py \
            --teacher student-source/teacher.jsonl \
            --engine-dir /tmp/v13 \
            --output-dir "$OUT" \
            --hidden '${{ matrix.hidden }}' \
            --epochs 60 --batch-size 256 --learning-rate 0.003 \
            --weight-decay 0.00001 --seed 20260908 \
            | tee "$OUT.log"
          cat "$OUT/training-metadata.json"
          sha256sum "$OUT/student-h${{ matrix.hidden }}.npz" | tee "$OUT/model.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: v14-single-student-h${{ matrix.hidden }}-${{ github.sha }}
          path: |
            student-h${{ matrix.hidden }}/
            student-h${{ matrix.hidden }}.log
          retention-days: 30
