name: M5 root analysis substrate materialization

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'm5/root-analysis-substrate'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m5/root-analysis-substrate
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Wire module if needed
        id: wire
        run: |
          set -euo pipefail
          if grep -q '^mod root_analysis;$' crates/chess-search/src/lib.rs; then
            echo 'materialized=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 tools/materialize_root_analysis.py
          cargo fmt --all
          git diff --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test -p chess-search --all-features
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/chess-search/src/lib.rs crates/chess-search/src/root_analysis.rs
          git commit -m 'm5: wire objective root-analysis API'
          git push origin HEAD:m5/root-analysis-substrate
          echo 'materialized=false' >> "$GITHUB_OUTPUT"
      - name: Verify committed API
        if: steps.wire.outputs.materialized == 'true'
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test -p chess-search --all-features
          cargo test -p chess-search --test draw_strategy
          cargo test -p chess-core --all-features
          git diff --exit-code
