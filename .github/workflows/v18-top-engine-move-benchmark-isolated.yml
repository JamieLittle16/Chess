name: V18 PUNCH133 isolated top-engine move benchmark

on:
  push:
    branches: [analysis/v18-top-engine-move-benchmark-20260911]
    paths:
      - '.github/workflows/v18-top-engine-move-benchmark-isolated.yml'
      - 'scripts/v18_competitor_move_benchmark.py'
      - 'scripts/v18_competitor_move_benchmark_isolated.py'
      - 'scripts/stockfish_lab.py'
      - 'match/benchmarks/top-engine-recent-20260911/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'Ryan Vincent'
            slug: ryan-vincent
          - target: 'Emile Andrieu'
            slug: emile-andrieu
          - target: 'Lightning Tree'
            slug: lightning-tree
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact runtime
        run: python -m pip install 'numba==0.67.0' 'numpy==2.5.2' 'chess==1.11.2'
      - name: Verify benchmark syntax
        run: python -m py_compile scripts/v18_competitor_move_benchmark.py scripts/v18_competitor_move_benchmark_isolated.py scripts/stockfish_lab.py
      - name: Reconstruct frozen corpus
        run: |
          set -euo pipefail
          cat match/benchmarks/top-engine-recent-20260911/chunk_*.b64 | base64 -d | gzip -dc > /tmp/corpus.pgn
          printf '%s  %s\n' 'dbac26e0f2b451eb7bf80994ca48fdd6b1abbc9f133e528d3e968f007f7aa264' '/tmp/corpus.pgn' | sha256sum -c -
      - name: Reconstruct exact PUNCH133
        run: |
          set -euo pipefail
          rm -rf /tmp/engine /tmp/bench
          mkdir -p /tmp/engine /tmp/bench/${{ matrix.slug }}
          cat ci/v18_postbook_payload/chunk_*.b64 | base64 -d > /tmp/postbook150.zip
          unzip -q /tmp/postbook150.zip -d /tmp/engine
          sed -i 's/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.50/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.33/' /tmp/engine/agent.py
          curl --fail --location --retry 5 'https://raw.githubusercontent.com/michaeldv/donna_opening_books/master/gm2001.bin' -o /tmp/engine/v18_gm2001.bin
          grep -q '_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.33' /tmp/engine/agent.py
      - name: Download Stockfish 19
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 'https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz' -o /tmp/sf.tar.gz
          mkdir -p /tmp/sf
          tar -xzf /tmp/sf.tar.gz -C /tmp/sf
          SF="$(find /tmp/sf -type f -name 'stockfish*' -perm /111 | head -n1)"
          cp "$SF" /tmp/stockfish19
          chmod +x /tmp/stockfish19
      - name: Score isolated move quality
        run: |
          set -euo pipefail
          python scripts/v18_competitor_move_benchmark_isolated.py \
            --pgn /tmp/corpus.pgn \
            --engine-dir /tmp/engine \
            --stockfish /tmp/stockfish19 \
            --target '${{ matrix.target }}' \
            --positions 48 \
            --nodes 200000 \
            --threads 1 \
            --hash-mb 64 \
            --pairwise-margin-cp 8 \
            --seed 20260911 \
            --output-dir /tmp/bench/${{ matrix.slug }}
          cat /tmp/bench/${{ matrix.slug }}/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-top-engine-${{ matrix.slug }}
          path: /tmp/bench/${{ matrix.slug }}
          retention-days: 7
