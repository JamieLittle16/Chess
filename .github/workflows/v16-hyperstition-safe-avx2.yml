name: V16 Hyperstition safe AVX2

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  safe-avx2:
    if: github.head_ref == 'v16/hyperstition-eval-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BENCH_RUSTFLAGS: -C target-cpu=x86-64-v3
      NETWORK_URL: https://github.com/cosmobobak/viridithas-networks/releases/download/v92/hyperstition-b400.nnue.zst
      COMPRESSED_SHA256: 5b4045557ae14c2c89001bdb4dde84ff0bb5b24bbeb79632f868108e56a24c6f
      RAW_SHA256: 36bcc6b3354ecbdb88fb95a341e494558b052223143f38ff6e6387aed99ab193
      RAW_BYTES: '50616896'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Baseline repository gate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features --release

      - name: Fetch exact v92 network
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qualification/hyperstition-safe-avx2
          curl --fail --location --retry 5 "$NETWORK_URL" \
            --output .qualification/hyperstition-safe-avx2/network.nnue.zst
          echo "$COMPRESSED_SHA256  .qualification/hyperstition-safe-avx2/network.nnue.zst" \
            | sha256sum --check --strict
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y zstd
          fi
          zstd --decompress --force \
            .qualification/hyperstition-safe-avx2/network.nnue.zst \
            -o .qualification/hyperstition-safe-avx2/network.nnue
          test "$(stat -c%s .qualification/hyperstition-safe-avx2/network.nnue)" = "$RAW_BYTES"
          echo "$RAW_SHA256  .qualification/hyperstition-safe-avx2/network.nnue" \
            | sha256sum --check --strict

      - name: Build certified scalar baseline
        shell: bash
        run: |
          set -euo pipefail
          RUSTFLAGS="$BENCH_RUSTFLAGS" cargo build --release -p chess-eval \
            --example hyperstition_tail_bench --example hyperstition_eval
          cp target/release/examples/hyperstition_tail_bench \
            .qualification/hyperstition-safe-avx2/baseline-bench
          cp target/release/examples/hyperstition_eval \
            .qualification/hyperstition-safe-avx2/baseline-eval

      - name: Apply safe AVX2 candidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_hyperstition_safe_avx2_probe.py
          cargo fmt --all
          git diff --check
          grep -F 'safe_arch = "1.0.0"' crates/chess-eval/Cargo.toml
          grep -F 'propagate_l1_safe_avx2' crates/chess-eval/src/hyperstition.rs

      - name: Candidate strict gate under AVX2
        shell: bash
        run: |
          set -euo pipefail
          RUSTFLAGS="$BENCH_RUSTFLAGS" cargo clippy --workspace --all-targets --all-features -- -D warnings
          RUSTFLAGS="$BENCH_RUSTFLAGS" cargo test --workspace --all-features --release

      - name: Build safe AVX2 candidate
        shell: bash
        run: |
          set -euo pipefail
          RUSTFLAGS="$BENCH_RUSTFLAGS" cargo build --release -p chess-eval \
            --example hyperstition_tail_bench --example hyperstition_eval
          cp target/release/examples/hyperstition_tail_bench \
            .qualification/hyperstition-safe-avx2/candidate-bench
          cp target/release/examples/hyperstition_eval \
            .qualification/hyperstition-safe-avx2/candidate-eval

      - name: Exact score-vector check and paired timing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import statistics
          import subprocess
          from pathlib import Path

          root = Path('.qualification/hyperstition-safe-avx2')
          network = root / 'network.nnue'
          baseline = root / 'baseline-bench'
          candidate = root / 'candidate-bench'
          iterations = '100000'

          def run(binary: Path):
              cp = subprocess.run(
                  [str(binary), str(network), iterations],
                  text=True,
                  capture_output=True,
                  check=True,
              )
              print(binary.name, cp.stdout, end='')
              score_match = re.search(r'^scores=(.*)$', cp.stdout, re.MULTILINE)
              time_match = re.search(r'ns_per_eval=([0-9.]+)', cp.stdout)
              if score_match is None or time_match is None:
                  raise RuntimeError(f'unparseable benchmark output from {binary}: {cp.stdout!r}')
              return score_match.group(1), float(time_match.group(1))

          # Warm both binaries before paired measurements.
          run(baseline)
          run(candidate)

          baseline_times = []
          candidate_times = []
          baseline_scores = None
          candidate_scores = None
          for round_index in range(5):
              if round_index % 2 == 0:
                  b_scores, b_time = run(baseline)
                  c_scores, c_time = run(candidate)
              else:
                  c_scores, c_time = run(candidate)
                  b_scores, b_time = run(baseline)
              baseline_times.append(b_time)
              candidate_times.append(c_time)
              baseline_scores = b_scores
              candidate_scores = c_scores

          if baseline_scores != candidate_scores:
              raise SystemExit(
                  f'score vector changed: baseline={baseline_scores} candidate={candidate_scores}'
              )

          baseline_median = statistics.median(baseline_times)
          candidate_median = statistics.median(candidate_times)
          speedup = baseline_median / candidate_median
          improvement = (1.0 - candidate_median / baseline_median) * 100.0
          report = (
              f'baseline_ns={baseline_times}\n'
              f'candidate_ns={candidate_times}\n'
              f'baseline_median_ns={baseline_median:.3f}\n'
              f'candidate_median_ns={candidate_median:.3f}\n'
              f'speedup_x={speedup:.4f}\n'
              f'improvement_pct={improvement:.3f}\n'
              f'scores={baseline_scores}\n'
          )
          (root / 'timing.txt').write_text(report, encoding='utf-8')
          print(report)
          if candidate_median > baseline_median * 0.85:
              raise SystemExit(
                  'safe AVX2 candidate did not clear the 15% inference-speed qualification bar'
              )
          PY

      - name: Cross-check standalone scores on edge regimes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path

          root = Path('.qualification/hyperstition-safe-avx2')
          network = root / 'network.nnue'
          baseline = root / 'baseline-eval'
          candidate = root / 'candidate-eval'
          fens = [
              'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1',
              'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR b KQkq - 0 1',
              'r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 0 1',
              '4k3/8/8/8/8/8/4Q3/4K3 w - - 0 1',
              '8/5pk1/6p1/3R4/8/6P1/5PK1/8 w - - 0 1',
              '8/5pk1/6p1/8/3N4/6P1/5PK1/8 b - - 0 1',
              '7k/8/8/8/8/8/8/K7 w - - 0 1',
              '7k/P7/8/8/8/8/7p/K7 w - - 0 1',
          ]

          rows = []
          for fen in fens:
              b = subprocess.run(
                  [str(baseline), str(network), fen], text=True, capture_output=True, check=True
              ).stdout.strip()
              c = subprocess.run(
                  [str(candidate), str(network), fen], text=True, capture_output=True, check=True
              ).stdout.strip()
              rows.append((fen, b, c))
              if b != c:
                  raise SystemExit(f'evaluation mismatch for {fen}: baseline={b} candidate={c}')
          report = '\n'.join(f'{b}\t{c}\t{fen}' for fen, b, c in rows) + '\n'
          (root / 'score-parity.tsv').write_text(report, encoding='utf-8')
          print(report)
          PY

      - name: Record candidate identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "head=$(git rev-parse HEAD)"
            echo "rustc=$(rustc --version)"
            echo "rustflags=$BENCH_RUSTFLAGS"
            echo "network_raw_sha256=$RAW_SHA256"
            echo "safe_arch=1.0.0"
          } > .qualification/hyperstition-safe-avx2/identity.txt

      - name: Upload safe AVX2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v16-hyperstition-safe-avx2-${{ github.sha }}
          path: |
            .qualification/hyperstition-safe-avx2/timing.txt
            .qualification/hyperstition-safe-avx2/score-parity.tsv
            .qualification/hyperstition-safe-avx2/identity.txt
          if-no-files-found: warn
          retention-days: 30
