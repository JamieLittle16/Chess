name: V15 Python targeted Rust-teacher book runtime

on:
  push:
    branches: [analysis/v15-python-rust-teacher-book-runtime-20260908]
    paths:
      - tools/v14_agent_runner.py
      - .github/workflows/v15-python-rust-teacher-book-runtime.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Download exact packaged V14
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - name: Download targeted Rust-teacher book
        uses: actions/download-artifact@v4
        with:
          name: v15-python-rust-teacher-book-3f115e751ca268527420e6902c68f493ec55d574
          path: book-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34282351491
      - name: Materialize book candidate
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name Little-Gambit-V14.zip -print -quit); BOOK=$(find book-artifact -type f -name rust-teacher-book-v1.json -print -quit)
          test -n "$ZIP"; test -n "$BOOK"
          rm -rf /tmp/base /tmp/cand results; mkdir -p /tmp/base /tmp/cand results
          unzip -q "$ZIP" -d /tmp/base; cp -a /tmp/base/. /tmp/cand/
          python - "$BOOK" /tmp/cand/v15_rust_ladder_book.json <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]));entries={k:v['move'] for k,v in p['entries'].items()}
          json.dump({'format':'targeted-rust-v15-v1','entries':entries},open(sys.argv[2],'w'),separators=(',',':'),sort_keys=True)
          print({'entries':len(entries)})
          PY
          python scripts/patch_v15_python_rust_book.py /tmp/cand/agent.py
          python -m py_compile tools/v14_agent_runner.py /tmp/base/agent.py /tmp/cand/agent.py /tmp/cand/experiments/*.py
      - name: Tournament-start timed games with recorded colours
        shell: bash
        run: |
          python - <<'PY'
          import json,queue,subprocess,sys,threading,time
          from pathlib import Path
          import chess
          BASE_MS=2500;INC_MS=50;MAX_PLIES=180;GRACE=1500
          rows=[]
          for line in Path('match/openings/chessathon-observed-starts-v1.tsv').read_text().splitlines():
              if not line or line.startswith('#'): continue
              color,name,fen=line.split('\\t',2);rows.append((color=='white',name,fen))
          book=json.load(open('/tmp/cand/v15_rust_ladder_book.json'))['entries']
          def key(b): return ' '.join(b.fen(en_passant='fen').split()[:4])
          class A:
              def __init__(self,d):
                  self.p=subprocess.Popen([sys.executable,'tools/v14_agent_runner.py',d],stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,bufsize=1);self.q=queue.Queue();threading.Thread(target=lambda:[self.q.put(x.rstrip()) for x in self.p.stdout] or self.q.put(None),daemon=True).start();assert json.loads(self.q.get(timeout=120)).get('ready')
              def reset(self): self.p.stdin.write(json.dumps({'reset':True})+'\n');self.p.stdin.flush();assert json.loads(self.q.get(timeout=5)).get('reset')
              def move(self,b,ms):
                  t=time.monotonic();self.p.stdin.write(json.dumps({'fen':b.fen(),'time_left_ms':max(0,int(ms))})+'\n');self.p.stdin.flush();z=json.loads(self.q.get(timeout=(max(0,ms)+GRACE)/1000));return chess.Move.from_uci(z['move']),(time.monotonic()-t)*1000
              def stop(self): self.p.kill();self.p.wait()
          control=A('/tmp/base');cand=A('/tmp/cand');out=[]
          try:
              for i,(cw,name,fen) in enumerate(rows):
                  b=chess.Board(fen);cl={True:float(BASE_MS),False:float(BASE_MS)};control.reset();cand.reset();hits=0
                  for _ in range(MAX_PLIES):
                      o=b.outcome(claim_draw=True)
                      if o is not None: score=.5 if o.winner is None else float(o.winner==cw);term=b.result(claim_draw=True);break
                      side=b.turn;e=cand if side==cw else control
                      if side==cw and key(b) in book: hits+=1
                      try:m,dt=e.move(b,cl[side]);assert m in b.legal_moves
                      except Exception: score=0.0 if side==cw else 1.0;term='engine-failure';break
                      cl[side]-=dt
                      if cl[side]<0: score=0.0 if side==cw else 1.0;term='flag';break
                      b.push(m);cl[side]+=INC_MS
                  else: score=.5;term='max-ply-draw'
                  z={'index':i,'opening':name,'candidate_white':cw,'score':score,'termination':term,'book_hits':hits};out.append(z);print(z,flush=True)
          finally: control.stop();cand.stop()
          summary={'games':len(out),'score':sum(x['score'] for x in out),'book_hits':sum(x['book_hits'] for x in out),'details':out}
          Path('results/timed.json').write_text(json.dumps(summary,indent=2)+'\n');print('FINAL',summary)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-python-targeted-rust-book-runtime-${{ github.sha }}
          path: results/
          retention-days: 30
