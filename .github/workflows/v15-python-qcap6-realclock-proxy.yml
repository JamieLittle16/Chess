name: V15 Python qcap6 real-clock proxy

on:
  push:
    branches: [analysis/v15-python-qcap6-realclock-proxy-20260908]
    paths:
      - .github/workflows/v15-python-qcap6-realclock-proxy.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  timed:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - name: Materialize exact control and qcap6
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name Little-Gambit-V14.zip -print -quit); test -n "$ZIP"
          rm -rf /tmp/control /tmp/candidate /tmp/m6 results; mkdir -p /tmp/control /tmp/candidate /tmp/m6 results
          unzip -q "$ZIP" -d /tmp/control; cp -a /tmp/control/. /tmp/candidate/
          sed -i 's/^MAX_QPLY = 10$/MAX_QPLY = 6/' /tmp/candidate/experiments/numba_search.py
          python -m py_compile /tmp/control/agent.py /tmp/control/experiments/*.py /tmp/candidate/agent.py /tmp/candidate/experiments/*.py
          PYTHONPATH=/tmp/candidate python - <<'PY'
          import chess
          import agent
          m=chess.Move.from_uci(agent.get_move(chess.STARTING_FEN,12000)); assert m in chess.Board().legal_moves
          print('smoke',m)
          PY
      - name: Build fresh roots
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old];chosen=fresh[800:816]
          assert len(chosen)==16 and len(set(chosen))==16
          Path('/tmp/realclock-16.epd').write_text('\n'.join(chosen)+'\n')
          PY
      - name: 32-game official-increment proxy
        run: python -u scripts/v15_competition_gate.py --control /tmp/control --candidate /tmp/candidate --openings /tmp/realclock-16.epd --output results/timed.json --label 'qcap6 vs V14; 12s+0.5s proxy' --base-ms 12000 --inc-ms 500 --max-plies 180 | tee results/timed.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-python-qcap6-realclock-proxy-${{ github.sha }}
          path: results/
          retention-days: 30
