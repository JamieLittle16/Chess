name: V16 Python search-budget sweep

on:
  workflow_dispatch:
  push:
    branches: [v16/python-time-budget-sweep]
    paths:
      - '.github/workflows/v16-python-time-budget-sweep.yml'
      - 'scripts/patch_v16_python_time_multiplier.py'

permissions:
  actions: read
  contents: read

jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        multiplier: ['1.10', '1.20', '1.30']
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Download exact packaged V14
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - name: Materialize clean control and time candidate
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name Little-Gambit-V14.zip -print -quit); test -n "$ZIP"
          rm -rf /tmp/base /tmp/cand results; mkdir -p /tmp/base /tmp/cand results
          unzip -q "$ZIP" -d /tmp/base; cp -a /tmp/base/. /tmp/cand/
          for D in /tmp/base /tmp/cand; do
            python scripts/patch_v16_python_presort_once.py "$D/experiments/numba_search.py"
            python scripts/patch_v16_python_trusted_continuity.py "$D/agent.py"
          done
          python scripts/patch_v16_python_time_multiplier.py /tmp/cand/agent.py '${{ matrix.multiplier }}'
          python -m py_compile tools/v14_agent_runner.py /tmp/base/agent.py /tmp/cand/agent.py /tmp/cand/experiments/*.py
      - name: Build fresh 32-root suite
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          rm -rf /tmp/m6; mkdir /tmp/m6
          python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]
          roots=fresh[4250:4282]; assert len(roots)==32 and len(set(roots))==32
          Path('/tmp/time-sweep.epd').write_text('\n'.join(roots)+'\n')
          PY
      - name: 64-game competition-clock A/B
        shell: bash
        run: |
          set -euo pipefail
          MULT='${{ matrix.multiplier }}' python -u - <<'PY' | tee results/arena.log
          import json,math,os,queue,subprocess,sys,threading,time
          from collections import Counter
          from pathlib import Path
          import chess
          BASE=2500.; INC=50.; GRACE=1500.; MAX=180
          roots=[x.strip() for x in Path('/tmp/time-sweep.epd').read_text().splitlines() if x.strip()]
          class A:
              def __init__(self,d):
                  self.p=subprocess.Popen([sys.executable,'tools/v14_agent_runner.py',d],stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,bufsize=1);self.q=queue.Queue()
                  def pump():
                      for x in self.p.stdout:self.q.put(x.rstrip())
                      self.q.put(None)
                  threading.Thread(target=pump,daemon=True).start();assert json.loads(self.q.get(timeout=120)).get('ready')
              def reset(self):self.p.stdin.write('{"reset":true}\n');self.p.stdin.flush();assert json.loads(self.q.get(timeout=5)).get('reset')
              def move(self,b,ms):
                  t=time.monotonic();self.p.stdin.write(json.dumps({'fen':b.fen(),'time_left_ms':max(0,int(ms))})+'\n');self.p.stdin.flush();z=json.loads(self.q.get(timeout=(max(0,ms)+GRACE)/1000));return chess.Move.from_uci(z['move']),(time.monotonic()-t)*1000
              def stop(self):self.p.kill();self.p.wait()
          b=A('/tmp/base');c=A('/tmp/cand');rows=[]
          try:
              for i,fen in enumerate(roots):
                  for cw in (True,False):
                      b.reset();c.reset();board=chess.Board(fen);cl={True:BASE,False:BASE};ct=[];bt=[]
                      for _ in range(MAX):
                          o=board.outcome(claim_draw=True)
                          if o is not None:score=.5 if o.winner is None else float(o.winner==cw);term=board.result(claim_draw=True);break
                          side=board.turn;eng=c if side==cw else b
                          try:m,dt=eng.move(board,cl[side]);assert m in board.legal_moves
                          except Exception:score=0. if side==cw else 1.;term='engine-failure';break
                          cl[side]-=dt
                          if cl[side]<0:score=0. if side==cw else 1.;term='flag';break
                          (ct if side==cw else bt).append(dt);board.push(m);cl[side]+=INC
                      else:score=.5;term='max-ply-draw'
                      rows.append({'opening':i,'candidate_white':cw,'score':score,'termination':term,'candidate_ms':ct,'control_ms':bt});print(i,cw,score,term,flush=True)
          finally:b.stop();c.stop()
          n=len(rows);score=sum(r['score'] for r in rows);f=score/n;elo=400*math.log10(f/(1-f)) if 0<f<1 else None;ct=[x for r in rows for x in r['candidate_ms']];bt=[x for r in rows for x in r['control_ms']]
          out={'multiplier':float(os.environ['MULT']),'games':n,'score':score,'score_fraction':f,'naive_elo_from_score':elo,'candidate_mean_move_ms':sum(ct)/len(ct),'control_mean_move_ms':sum(bt)/len(bt),'terminations':dict(Counter(r['termination'] for r in rows)),'details':rows}
          Path('results/result.json').write_text(json.dumps(out,indent=2)+'\n');print('FINAL',json.dumps({k:v for k,v in out.items() if k!='details'}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v16-python-time-${{ matrix.multiplier }}-${{ github.sha }}
          path: results/
          retention-days: 30
