name: V18 qsearch Lightning probe

on:
  push:
    branches: [analysis/v18-qsearch-student-scratch-20260911]
    paths: [.github/workflows/v18-qsearch-lightning-probe.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q 'numba==0.67.0' 'numpy==2.5.2' 'chess==1.11.2'
      - name: Reconstruct baseline and Q-H64
        run: |
          set -euo pipefail
          cat ci/v18_postbook_payload/chunk_*.b64 | base64 -d > /tmp/p150.zip
          for d in /tmp/base /tmp/cand; do
            rm -rf "$d"; mkdir "$d"; unzip -q /tmp/p150.zip -d "$d"
            sed -i 's/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.50/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.33/' "$d/agent.py"
            curl --fail --location --retry 5 -sS 'https://raw.githubusercontent.com/michaeldv/donna_opening_books/master/gm2001.bin' -o "$d/v18_gm2001.bin"
          done
          python scripts/apply_v18_qsearch_full_student.py /tmp/cand/experiments/numba_search.py
      - name: Compare miss
        run: |
          cat >/tmp/probe.py <<'PY'
          import sys,contextlib,numpy as np,chess
          root,label=sys.argv[1:3]; sys.path.insert(0,root)
          with contextlib.redirect_stdout(sys.stderr): import agent
          b=chess.Board('8/6p1/4n3/1P6/P1R3Pk/r1N4P/6K1/8 b - - 8 57')
          for ms in (15000,44240,90000):
            agent._HASH_KEYS.fill(np.uint64(0)); agent._HASH_MOVES.fill(np.int32(-1)); agent._TT_TABLE.fill(np.uint64(0)); agent._QUIET_HISTORY.fill(np.int16(0))
            r=agent.search_position(b,ms,np.empty(0,dtype=np.uint64))
            print(label,ms,r,flush=True)
          PY
          python /tmp/probe.py /tmp/base BASE
          python /tmp/probe.py /tmp/cand QH64
