name: V14 root-qsearch slider checks A

on:
  push:
    branches: [analysis/v14-qcheck-root-a-20260908]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact competition runtime
        run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0

      - name: Reconstruct exact V13 control and qcheck candidate
        shell: bash
        run: |
          set -euo pipefail
          cat .analysis/v13_chunks_*.b64 | base64 -d > /tmp/v13.zip
          echo '658fd954180c2d0d39c02ba6601af36d06cdbd573bfb72c6879169861a7ad092  /tmp/v13.zip' | sha256sum --check --strict
          rm -rf /tmp/base /tmp/cand
          mkdir -p /tmp/base /tmp/cand
          unzip -q /tmp/v13.zip -d /tmp/base
          unzip -q /tmp/v13.zip -d /tmp/cand
          patch /tmp/base/experiments/numba_search.py < .analysis/v13_jit_refactor.patch
          patch /tmp/cand/experiments/numba_search.py < .analysis/v13_jit_refactor.patch
          for DIR in /tmp/base /tmp/cand; do
            DIR="$DIR" python - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['DIR'])/'experiments/numba_search.py'; s=p.read_text()
          old='    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          new='    correction = correction // 6\n    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          assert s.count(old)==1,s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
            python scripts/patch_v13_legality_context.py "$DIR/experiments/numba_core.py"
            python scripts/patch_v13_qsearch_tactical.py "$DIR/experiments/numba_core.py" "$DIR/experiments/numba_search.py"
          done
          echo '401f6580028a72361286bd99bee1f0022c74e6c8a65da8acd47448835a1ff360  /tmp/base/experiments/numba_search.py' | sha256sum --check --strict
          echo '0306e8145a453d91b9b5ac92e9980931510d9e18f8ba598a7548d08b85165c35  /tmp/base/experiments/numba_core.py' | sha256sum --check --strict
          python scripts/patch_v14_qcheck_root.py /tmp/cand/experiments/numba_search.py
          python -m py_compile /tmp/base/experiments/*.py /tmp/cand/experiments/*.py tools/v14_fixed_node_arena.py tools/v14_regression_probe.py
          cmp /tmp/base/agent.py /tmp/cand/agent.py
          cmp /tmp/base/experiments/numba_core.py /tmp/cand/experiments/numba_core.py
          cmp /tmp/base/experiments/v13_residual.i16 /tmp/cand/experiments/v13_residual.i16

      - name: API, board-restoration and directed quiet-check smoke
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp/cand python - <<'PY'
          import chess, numpy as np
          import agent
          from experiments.numba_core import encode_position
          from experiments.numba_search import (
              EVAL_WIDTH, _build_eval_state_into, _retain_root_qsearch_slider_checks,
          )
          for fen in (chess.STARTING_FEN, '2r3k1/4qp2/4b3/p5p1/4P1P1/2Pr2P1/P4PB1/R1Q2RK1 w - - 1 23'):
              board=chess.Board(fen); move=chess.Move.from_uci(agent.get_move(fen,120000)); assert move in board.legal_moves,(fen,move); print('legal',fen,move)

          # After the historical f3 blunder, ...Qc5+ must be present as the intended quiet slider check.
          b=chess.Board('2r3k1/4qp2/4b3/p5p1/4P1P1/2Pr1PP1/P5B1/R1Q2RK1 b - - 0 23')
          e=encode_position(b); pseudo=np.empty(256,dtype=np.int32); moves=np.empty(256,dtype=np.int32); state=np.empty(EVAL_WIDTH,dtype=np.int32); _build_eval_state_into(e.board,state)
          own_king=int(state[5]); opp_king=int(state[4]); before=e.board.copy()
          count,legal_count=_retain_root_qsearch_slider_checks(e.board,e.side,e.castling,e.ep_square,pseudo,moves,own_king,opp_king)
          assert np.array_equal(before,e.board)
          from experiments.numba_core import move_to_uci
          retained=[move_to_uci(int(moves[i])) for i in range(count)]
          print('retained',retained,'legal_count',legal_count)
          assert 'e7c5' in retained, retained
          PY

      - name: Fixed-node runtime cost
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qcheck-results
          cat >/tmp/qcheck_worker.py <<'PY'
          import json,sys,chess,numpy as np
          from experiments.numba_core import encode_position
          from experiments.numba_search import iterative_search_stateful
          for line in sys.stdin:
              q=json.loads(line); b=chess.Board(q['fen']); e=encode_position(b); h=np.empty(0,dtype=np.uint64)
              o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,int(q['nodes']))
              print(json.dumps({'move':int(o[0]),'score':int(o[1]),'depth':int(o[2]),'nodes':int(o[3])}),flush=True)
          PY
          python - <<'PY'
          import json,os,statistics,subprocess,sys,time
          from pathlib import Path
          roots=[x.strip() for x in open('match/openings/m3-uho-lichess-100-v1.epd') if x.strip() and not x.startswith('#')][:40]
          def start(path):
              env=os.environ.copy();env['PYTHONPATH']=path
              return subprocess.Popen([sys.executable,'/tmp/qcheck_worker.py'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env=env)
          def run(p,order):
              total=0;t=time.perf_counter()
              for fen in order:
                  p.stdin.write(json.dumps({'fen':fen,'nodes':30000})+'\n');p.stdin.flush();row=json.loads(p.stdout.readline());total+=row['nodes']
              return time.perf_counter()-t,total
          base=start('/tmp/base');cand=start('/tmp/cand');ratios=[];rows=[]
          try:
              for p in (base,cand):
                  p.stdin.write(json.dumps({'fen':roots[0],'nodes':300})+'\n');p.stdin.flush();json.loads(p.stdout.readline())
              for rep in range(3):
                  order=roots if rep%2==0 else list(reversed(roots))
                  if rep%2==0: bt,bn=run(base,order);ct,cn=run(cand,order)
                  else: ct,cn=run(cand,order);bt,bn=run(base,order)
                  ratio=(cn/ct)/(bn/bt);ratios.append(ratio);rows.append({'rep':rep,'nps_ratio':ratio,'base_nps':bn/bt,'candidate_nps':cn/ct});print(rows[-1])
          finally:
              for p in (base,cand):p.terminate();p.wait()
          summary={'median_nps_ratio':statistics.median(ratios),'records':rows};Path('qcheck-results/throughput.json').write_text(json.dumps(summary,indent=2)+'\n');print(summary)
          PY

      - name: Historical rated-game curve candidate versus V13
        shell: bash
        run: |
          set -euo pipefail
          python tools/v14_regression_probe.py \
            --engine /tmp/cand --control /tmp/base \
            --manifest match/regressions/v14-rated-game-1.json \
            --budgets 10000,30000,100000,300000,1000000 \
            --json-out qcheck-results/rated-game-curve.json \
            | tee qcheck-results/rated-game-curve.log

      - name: Broad fixed-node regression probe
        shell: bash
        run: |
          set -euo pipefail
          python tools/v14_build_probe_corpus.py \
            --openings match/openings/m3-uho-lichess-100-v1.epd \
            --positions 48 --seed 2026090803 \
            --json-out qcheck-results/broad-manifest.json >/dev/null
          python tools/v14_regression_probe.py \
            --engine /tmp/cand --control /tmp/base \
            --manifest qcheck-results/broad-manifest.json --budgets 12000 \
            --json-out qcheck-results/broad-probe.json \
            | tee qcheck-results/broad-probe.log

      - name: Paired equal-node discovery arena
        shell: bash
        run: |
          set -euo pipefail
          python -u tools/v14_fixed_node_arena.py /tmp/cand /tmp/base \
            --nodes 16000 --pairs 32 --opening-offset 0 --max-plies 220 \
            --opening-file match/openings/m3-uho-lichess-100-v1.epd \
            --json-out qcheck-results/arena.json \
            | tee qcheck-results/arena.log
          grep '^FINAL ' qcheck-results/arena.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v14-qcheck-root-a-${{ github.sha }}
          path: qcheck-results/
          retention-days: 30
