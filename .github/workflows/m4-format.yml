name: M4 branch formatter

on:
  push:
    branches:
      - m4/quiescence-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m4/quiescence-v1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatter result
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/chess-search/src/lib.rs crates/chess-search/src/quiescence.rs
          git commit -m 'style: apply pinned rustfmt to M4 search'
          git push origin HEAD:m4/quiescence-v1
