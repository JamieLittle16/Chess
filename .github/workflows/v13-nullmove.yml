name: V13 conservative null move

on:
  push:
    branches:
      - analysis/v13-nullmove-20260907
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arena:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: r2p6, reduction: 2, min_phase: 6, seed: 99301 }
          - { name: r2p8, reduction: 2, min_phase: 8, seed: 99302 }
          - { name: r3p8, reduction: 3, min_phase: 8, seed: 99303 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact runtime
        run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Reconstruct equal quarter-residual candidate and control
        shell: bash
        run: |
          set -euo pipefail
          cat .analysis/v13_chunks_*.b64 | base64 -d > /tmp/v13.zip
          echo '658fd954180c2d0d39c02ba6601af36d06cdbd573bfb72c6879169861a7ad092  /tmp/v13.zip' | sha256sum -c -
          rm -rf /tmp/cand /tmp/base
          mkdir /tmp/base
          unzip -q /tmp/v13.zip -d /tmp/base
          patch /tmp/base/experiments/numba_search.py < .analysis/v13_jit_refactor.patch
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/base/experiments/numba_search.py'); s=p.read_text()
          old='    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          new='    correction = correction // 4\n    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          assert s.count(old)==1,s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
          cp -a /tmp/base /tmp/cand
          python scripts/patch_v13_nullmove.py /tmp/cand/experiments/numba_search.py \
            --reduction '${{ matrix.reduction }}' --min-phase '${{ matrix.min_phase }}'
          python -m py_compile /tmp/base/agent.py /tmp/base/experiments/*.py /tmp/cand/agent.py /tmp/cand/experiments/*.py
          grep -n -A55 -B6 'Conservative null-move pruning' /tmp/cand/experiments/numba_search.py
      - name: Fixed-node direct A/B on UHO positions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          /usr/bin/time -f 'ARENA_WALL_SEC=%e MAX_RSS_KB=%M' \
            python -u .v13/v13_arena.py /tmp/cand /tmp/base 20000 20 '${{ matrix.seed }}' 220 \
              match/openings/m3-uho-lichess-100-v1.epd 40 \
            | tee results/${{ matrix.name }}.log
          grep '^FINAL ' results/${{ matrix.name }}.log
      - uses: actions/upload-artifact@v4
        with:
          name: v13-nullmove-${{ matrix.name }}-${{ github.sha }}
          path: results/${{ matrix.name }}.log
          retention-days: 7
