name: V18 active prior ROOT4 ASP40 filter

on:
  push:
    branches: [analysis/v18-reckless-root-prior-20260911]
    paths: ['.github/workflows/v18-active-root4-asp40-filter.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filter:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q 'numba==0.67.0' 'numpy==2.5.2' 'chess==1.11.2'
      - name: Reconstruct corpus
        run: |
          cat match/benchmarks/top-engine-recent-20260911/chunk_00.b64 match/benchmarks/top-engine-recent-20260911/chunk_01.b64 match/benchmarks/top-engine-recent-20260911/chunk_02.b64 match/benchmarks/top-engine-recent-20260911/chunk_03a.b64 match/benchmarks/top-engine-recent-20260911/chunk_03b.b64 match/benchmarks/top-engine-recent-20260911/chunk_03c.b64 match/benchmarks/top-engine-recent-20260911/chunk_03d.b64 match/benchmarks/top-engine-recent-20260911/chunk_04.b64 | base64 -d | gzip -dc > /tmp/recent.pgn
          echo 'dbac26e0f2b451eb7bf80994ca48fdd6b1abbc9f133e528d3e968f007f7aa264  /tmp/recent.pgn' | sha256sum -c -
      - name: Build combo
        run: |
          set -euo pipefail
          rm -rf /tmp/engine /tmp/bench; mkdir -p /tmp/engine /tmp/bench
          cat ci/v18_postbook_payload/chunk_*.b64 | base64 -d > /tmp/p150.zip
          unzip -q /tmp/p150.zip -d /tmp/engine
          sed -i 's/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.50/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.33/' /tmp/engine/agent.py
          curl --fail --location --retry 5 -sS 'https://raw.githubusercontent.com/michaeldv/donna_opening_books/master/gm2001.bin' -o /tmp/engine/v18_gm2001.bin
          python scripts/apply_v18_see_capture_ordering.py /tmp/engine/experiments/numba_search.py
          python scripts/apply_v18_root_value.py /tmp/engine/experiments/numba_search.py 4
          python scripts/apply_v18_aspiration40.py /tmp/engine/experiments/numba_search.py
          python - <<'PY'
          from pathlib import Path
          W={'DEV':7,'CASTLE':10,'ESCAPE':8,'UNSAFE':11,'CHECK':4,'OFFENSE':5,'KINGPAWN':4}
          p=Path('/tmp/engine/agent.py'); s=p.read_text(); marker='\ndef _internal_move_from_chess(board: chess.Board, move: chess.Move) -> int:\n'
          helper=f'''\ndef _threat_aware_root_prior(board: chess.Board) -> chess.Move | None:\n    if board.ply()>32 or len(board.piece_map())<18: return None\n    us=board.turn; them=not us; king_sq=board.king(us)\n    if king_sq is None: return None\n    hn={{chess.B1,chess.G1}} if us==chess.WHITE else {{chess.B8,chess.G8}}; hb={{chess.C1,chess.F1}} if us==chess.WHITE else {{chess.C8,chess.F8}}\n    vals={{chess.PAWN:1,chess.KNIGHT:3,chess.BISHOP:3,chess.ROOK:5,chess.QUEEN:9,chess.KING:0}}; best=None; bs=0\n    for m in board.legal_moves:\n        if board.is_capture(m) or m.promotion is not None: continue\n        pc=board.piece_type_at(m.from_square)\n        if pc is None: continue\n        sc=0\n        if board.is_castling(m): sc+={W['CASTLE']}\n        if pc==chess.KNIGHT and m.from_square in hn: sc+={W['DEV']}\n        elif pc==chess.BISHOP and m.from_square in hb: sc+={W['DEV']}\n        attacked=board.is_attacked_by(them,m.from_square); chk=board.gives_check(m); c=board.copy(stack=False); c.push(m); safe=not c.is_attacked_by(c.turn,m.to_square)\n        if attacked and safe: sc+={W['ESCAPE']}\n        if not safe: sc-={W['UNSAFE']}\n        if chk: sc+={W['CHECK']}\n        if safe:\n            for sq in c.attacks(m.to_square):\n                t=c.piece_at(sq)\n                if t is not None and t.color==c.turn: sc+={W['OFFENSE']}*vals.get(t.piece_type,0)\n        if pc==chess.PAWN and abs(chess.square_file(m.from_square)-chess.square_file(king_sq))<=1: sc-={W['KINGPAWN']}\n        if sc>bs: bs=sc; best=m\n    return best\n\n'''
          assert s.count(marker)==1; s=s.replace(marker,helper+marker,1)
          old='''    book_move = _book_prior(board)\n    root_prior_move = -1 if book_move is None else _internal_move_from_chess(board, book_move)\n'''; new='''    book_move = _book_prior(board)\n    if book_move is None:\n        book_move = _threat_aware_root_prior(board)\n    root_prior_move = -1 if book_move is None else _internal_move_from_chess(board, book_move)\n'''; assert s.count(old)==1; p.write_text(s.replace(old,new,1))
          PY
          python -m py_compile /tmp/engine/agent.py /tmp/engine/experiments/numba_search.py
          (cd /tmp/engine && python -c 'import agent; assert agent._ENGINE_READY; print("COMBO_READY")')
      - name: Cold Stockfish and Emile 48
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/stockfish_lab.py'); s=p.read_text(); old='''        root_moves = None if root_move is None else [root_move]\n        info = self.engine.analyse(\n'''; new='''        self.engine.configure({"Clear Hash": None})\n        root_moves = None if root_move is None else [root_move]\n        info = self.engine.analyse(\n'''; assert s.count(old)==1; p.write_text(s.replace(old,new,1))
          PY
          curl --fail --location --retry 5 -sS 'https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz' -o /tmp/sf.tar.gz
          echo '9defc0d4e55d49c65a6d042f3e571a39fcea499ade6dbe741b53b8c65e03611f  /tmp/sf.tar.gz' | sha256sum -c -
          mkdir -p /tmp/sf; tar -xzf /tmp/sf.tar.gz -C /tmp/sf; SF="$(find /tmp/sf -type f -name 'stockfish*' -perm /111 | head -n1)"; cp "$SF" /tmp/stockfish19; chmod +x /tmp/stockfish19
          python scripts/v18_competitor_move_benchmark_v2.py --pgn /tmp/recent.pgn --engine-dir /tmp/engine --stockfish /tmp/stockfish19 --target 'Emile Andrieu' --positions 48 --nodes 200000 --threads 1 --hash-mb 64 --pairwise-margin-cp 8 --seed 20260911 --output-dir /tmp/bench
          python - <<'PY'
          import json
          x=json.load(open('/tmp/bench/summary.json')); c=x['candidate']; p=x['pairwise']; r=x['candidate_runtime']
          print('COMBO_RESULT CPL',c['mean_cp_loss'],'BEST',c['best_move_matches'],'PAIR',p['score'],'BLUNDERS',c['blunders_cp_ge_150'],'SEVERE',c['severe_cp_ge_300'],'IMPORT',r['import_seconds'],'MEANSEC',r['mean_move_seconds'])
          PY
