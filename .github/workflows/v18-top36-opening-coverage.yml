name: V18 top-36 Chessathon opening coverage

on:
  push:
    branches: [analysis/v18-top36-opening-coverage-20260911]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q 'chess==1.11.2'

      - name: Reconstruct exact books
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat ci/v18_postbook_payload/chunk_*.b64 | base64 -d > /tmp/p150.zip
          rm -rf /tmp/base && mkdir /tmp/base && unzip -q /tmp/p150.zip -d /tmp/base
          curl --fail --location --retry 5 -sS \
            'https://raw.githubusercontent.com/michaeldv/donna_opening_books/master/gm2001.bin' \
            -o /tmp/gm2001.bin
          for pair in '2024 10170991013' '2025 10171369612' '2026 10171021582'; do
            set -- $pair; y=$1; id=$2
            curl --fail --location --retry 5 \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/JamieLittle16/Chess/actions/artifacts/${id}/zip" \
              -o "/tmp/${y}.zip"
            mkdir -p "/tmp/${y}"; unzip -q "/tmp/${y}.zip" -d "/tmp/${y}"
          done

      - name: Build need-3 and certified GM-miss overlays
        run: |
          python - <<'PY'
          import collections, glob, struct
          S=struct.Struct('>QHHI')
          def load(path):
              d=collections.defaultdict(list)
              with open(path,'rb') as f:
                  while True:
                      b=f.read(16)
                      if not b: break
                      k,m,w,l=S.unpack(b); d[k].append((m,w,l))
              for k in d:d[k].sort(key=lambda x:(-x[1],x[0]))
              return d
          def find(y,name):
              xs=glob.glob(f'/tmp/{y}/**/{name}',recursive=True); assert xs,(y,name); return xs[0]
          gm=load('/tmp/gm2001.bin'); years={y:load(find(y,'broadcast-all-min2.bin')) for y in ('2024','2025','2026')}
          rows=[]
          for k in set().union(*(set(d) for d in years.values())):
              vals=[years[y][k][0] for y in years if k in years[y]]
              if len(vals)<3 or k in gm or len({m for m,w,l in vals})!=1: continue
              rows.append((k,vals[0][0],min(65535,sum(w for m,w,l in vals)),0))
          rows.sort()
          with open('/tmp/need3.bin','wb') as f:
              for r in rows:f.write(S.pack(*r))
          cert=find('2026','broadcast-sf19-certified.bin'); certrows=[]
          with open(cert,'rb') as f:
              while True:
                  b=f.read(16)
                  if not b: break
                  r=S.unpack(b)
                  if r[0] not in gm: certrows.append(r)
          with open('/tmp/cert_gmmiss.bin','wb') as f:
              for r in certrows:f.write(S.pack(*r))
          print('NEED3_ENTRIES',len(rows),'CERT_GMMISS_ENTRIES',len(certrows))
          assert len(rows)==56608
          assert len(certrows)==3962
          PY

      - name: Measure 36-start coverage
        run: |
          cat >/tmp/starts.epd <<'EOF'
          r1bqkb1r/pp3ppp/5n2/3pn3/8/2PB4/PP2NPPP/RNBQK2R w KQkq - 0 8
          r1bqkb1r/1p2pppp/p1np1n2/6B1/3NP3/2N5/PPPQ1PPP/R3KB1R b KQkq - 1 7
          r1bq1rk1/pp1nbpp1/2p1pn1p/3p4/2PP4/5NP1/PPQ1PPBP/RNBR2K1 w - - 2 9
          r1bqkb1r/1p3ppp/p1np1n2/4p3/P3P3/N1N5/1PP2PPP/R1BQKB1R b KQkq - 1 8
          r1bqk2r/ppp1bppp/2np1n2/4p3/P1B1P3/2NP1N2/1PP2PPP/R1BQK2R b KQkq - 0 6
          r1bqk1nr/pp3pbp/2npp1p1/2p5/4PP2/2NP2P1/PPP3BP/R1BQK1NR w KQkq - 0 7
          rnbq1rk1/ppp1bppp/4pn2/3p4/2PP4/N4NP1/PP2PPBP/R1BQK2R b KQ - 0 6
          r1bqkb1r/ppp2ppp/2n2n2/3p4/3NP3/5P2/PPP3PP/RNBQKB1R w KQkq - 0 6
          r1bqk2r/pp3ppp/2nbpn2/2pp4/3P1B2/P1P1P3/1P1N1PPP/R2QKBNR w KQkq - 1 7
          r1bqkbnr/pp1p1ppp/2n1p3/1N6/4P3/8/PPP2PPP/RNBQKB1R b KQkq - 2 5
          rn1qk2r/pbp1bppp/1p1ppn2/8/2PP1B2/5NP1/PP2PPBP/RN1Q1RK1 b kq - 1 7
          r1bq1rk1/pp2ppbp/2np1np1/2p5/2P4P/2NP1NP1/PP2PPB1/R1BQK2R w KQ - 0 8
          rnbqk2r/ppp2ppp/3b4/3p4/2PPn3/5N2/PP2BPPP/RNBQK2R b KQkq - 0 7
          rn1qkbnr/pp2ppp1/2p3bp/8/3P3P/5NN1/PPP2PP1/R1BQKB1R b KQkq - 1 7
          r1bq1rk1/2p1bppp/p2p1n2/np2p3/4P3/1B1P1N1P/PPP2PP1/RNBQR1K1 w - - 1 10
          rnbqk2r/pp2ppbp/3p1np1/8/3NP3/2N1B2P/PPP2PP1/R2QKB1R b KQkq - 2 7
          rnbqk2r/ppp1bppp/4pn2/3p4/2P5/P4NP1/1P1PPPBP/RNBQK2R b KQkq - 0 5
          rnbq1rk1/ppp1ppbp/3p1np1/8/3PP3/2N2N2/PPP1BPPP/R1BQ1RK1 b - - 5 6
          r1bq1rk1/pp2ppbp/2np1np1/2p5/2P4P/2NP1NP1/PP2PPB1/1RBQK2R b K - 1 8
          rnbq1rk1/ppp2ppp/4pn2/8/1bBP4/2N1P2P/PP3PP1/R1BQK1NR b KQ - 0 7
          r1bqk2r/pppp1ppp/2n2n2/1B2p3/1b2P3/2NP1N2/PPP2PPP/R1BQK2R b KQkq - 0 5
          rnbqkb1r/pp3ppp/5n2/2pp4/3P4/8/PPPNBPPP/R1BQK1NR w KQkq - 2 6
          rnbq1rk1/ppp1bppp/4pn2/3p4/2P5/3P1NP1/PP2PPBP/RNBQ1RK1 b - - 2 6
          r1bqkbnr/pp1p1ppp/2n1p3/8/3NP3/6P1/PPP2P1P/RNBQKB1R b KQkq - 0 5
          rnbqr1k1/ppp2pbp/3p1np1/8/2PNP3/2N1B3/PPQ1BPPP/R3K2R b KQ - 2 9
          rn1qkb1r/1p3ppp/p2pbn2/4p3/4P3/1NN1B3/PPPQ1PPP/R3KB1R b KQkq - 3 8
          r1bqkb1r/pp1p1ppp/2n1pn2/8/3NP3/2NQ4/PPP2PPP/R1B1KB1R b KQkq - 4 6
          rnbqk2r/ppp1ppbp/6p1/8/3PP3/2P5/P4PPP/1RBQKBNR b Kkq - 2 7
          rnbqk2r/ppp3pp/3bpn2/3p1p2/3P1B2/4PNP1/PPP2PBP/RN1QK2R b KQkq - 0 6
          rnbqk1nr/1p3ppp/p7/2bp4/P7/1N6/1PP2PPP/R1BQKBNR b KQkq - 1 7
          r2qkb1r/pp3ppp/2npbn2/3Np3/4P3/1N3P2/PPP3PP/R1BQKB1R b KQkq - 3 8
          1rbqk1nr/pp3pbp/2npp1p1/2p5/4PP2/2NPBNP1/PPP3BP/R2QK2R b KQk - 3 8
          r1bqk2r/pppp1ppp/2n2n2/1B6/1b1NP3/2P5/PP3PPP/RNBQK2R b KQkq - 0 6
          r1bqk2r/pp3ppp/2nbpn2/2pp4/3P4/P1P1P1B1/1P1N1PPP/R2QKBNR b KQkq - 2 7
          r1b1k2r/pp2nppp/2n1p3/q1ppP3/P2P4/2P2N2/2PB1PPP/R2QKB1R b KQkq - 4 9
          rnbq1rk1/ppp2ppp/3b4/3p4/3Pn3/3BBN2/PPP2PPP/RN1Q1RK1 b - - 5 8
          EOF
          sed -i 's/^          //' /tmp/starts.epd
          python - <<'PY'
          import chess, chess.polyglot
          fens=[x.strip() for x in open('/tmp/starts.epd') if x.strip()]
          assert len(fens)==36
          readers={name:chess.polyglot.open_reader(path) for name,path in {
              'gm':'/tmp/gm2001.bin','cert':'/tmp/cert_gmmiss.bin','need3':'/tmp/need3.bin'}.items()}
          totals={'gm_prior':0,'gm_direct':0,'cert':0,'need3':0,'any_direct':0}
          try:
              for i,fen in enumerate(fens,1):
                  b=chess.Board(fen)
                  gm=[e for e in readers['gm'].find_all(b) if e.move in b.legal_moves and int(e.weight)>0]
                  gm.sort(key=lambda e:(-int(e.weight),e.move.uci()))
                  prior=gm[0].move.uci() if gm and b.ply()<=22 else '-'
                  direct='-'; topw=totw=0; share=0.0
                  if gm and b.ply()<=18:
                      topw=int(gm[0].weight); totw=sum(int(e.weight) for e in gm); share=topw/totw
                      if topw>=16 and (share>=0.70 or (topw>=96 and share>=0.60)): direct=gm[0].move.uci()
                  cert=[e for e in readers['cert'].find_all(b) if e.move in b.legal_moves and int(e.weight)>0]
                  need3=[e for e in readers['need3'].find_all(b) if e.move in b.legal_moves and int(e.weight)>0]
                  cm=cert[0].move.uci() if cert and b.ply()<=18 else '-'
                  nm=max(need3,key=lambda e:int(e.weight)).move.uci() if need3 and b.ply()<=22 else '-'
                  totals['gm_prior']+=prior!='-'; totals['gm_direct']+=direct!='-'; totals['cert']+=cm!='-'; totals['need3']+=nm!='-'; totals['any_direct']+=(direct!='-' or cm!='-')
                  print(f'ROW {i:02d} ply={b.ply():02d} GM_PRIOR={prior} GM_DIRECT={direct} topw={topw} share={share:.3f} CERT={cm} NEED3={nm} FEN={fen}')
              print('SUMMARY',totals,'N',len(fens))
          finally:
              for r in readers.values():r.close()
          PY
