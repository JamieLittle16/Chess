name: M4 promote accepted RFP early legal probe v1

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize-and-verify:
    if: github.head_ref == 'm4/promote-rfp-early-legal-probe-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Materialize exact accepted sources
        run: |
          set -euo pipefail
          MOVEGEN_EXPECTED=7eb040275a6dec56e95effff13880d0353afe9adee49806956bfbc6d6b5c1da0
          CORE_EXPECTED=e07ad84047557eb6444e5f4460c6195443c959fbd1b0303f639016237a1a36a5
          SEARCH_EXPECTED=5e6369536ce2b2d6e123e0ed400224e9ce21aaae5492f8caba9cdc3139919557
          CURRENT=$(sha256sum crates/chess-search/src/lib.rs | cut -d' ' -f1)
          if [[ "$CURRENT" != "$SEARCH_EXPECTED" ]]; then
            python3 tools/apply_rfp_early_legal_probe_v1.py
            cargo fmt --all
          fi
          echo "$MOVEGEN_EXPECTED  crates/chess-core/src/movegen.rs" | sha256sum --check --strict
          echo "$CORE_EXPECTED  crates/chess-core/src/lib.rs" | sha256sum --check --strict
          echo "$SEARCH_EXPECTED  crates/chess-search/src/lib.rs" | sha256sum --check --strict
          git diff --check
      - name: Verify accepted production shape
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          cargo test -p chess-search --test draw_strategy
          OUTPUT=$(cargo run --release --quiet -p chess-bench)
          printf '%s\n' "$OUTPUT"
          grep -q 'signature 0x4c3bbe8701fbbb68' <<< "$OUTPUT"
      - name: Commit materialized sources if needed
        run: |
          set -euo pipefail
          if git diff --quiet -- crates/chess-core/src/movegen.rs crates/chess-core/src/lib.rs crates/chess-search/src/lib.rs; then
            echo 'Exact accepted sources already committed.'
            exit 0
          fi
          git config user.name 'Jamie Little'
          git config user.email '160879046+JamieLittle16@users.noreply.github.com'
          git add crates/chess-core/src/movegen.rs crates/chess-core/src/lib.rs crates/chess-search/src/lib.rs
          git commit -m 'm4: materialize accepted RFP early legal probe v1'
          git push origin HEAD:${{ github.head_ref }}
