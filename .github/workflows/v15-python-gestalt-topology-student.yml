name: V15 Python Gestalt-topology student

on:
  push:
    branches: [analysis/v15-python-gestalt-topology-student-20260908]
    paths:
      - scripts/train_v15_gestalt_topology_student.py
      - .github/workflows/v15-python-gestalt-topology-student.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  train:
    strategy:
      fail-fast: false
      matrix:
        hidden: [16, 24, 32]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Download exact packaged V14
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - name: Download exact Gestalt teacher labels
        uses: actions/download-artifact@v4
        with:
          pattern: v15-gestalt-labels-*-c3331960a207e4bb10e13252d62be27788d6af5d
          path: label-artifacts
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34266694827
      - name: Train exact-topology quantized residual
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name Little-Gambit-V14.zip -print -quit);test -n "$ZIP"
          rm -rf /tmp/v14 results;mkdir -p /tmp/v14 results
          unzip -q "$ZIP" -d /tmp/v14
          cat label-artifacts/gestalt-*.jsonl > results/teacher.jsonl
          python -u scripts/train_v15_gestalt_topology_student.py --teacher results/teacher.jsonl --engine-dir /tmp/v14 --output-dir results/h${{ matrix.hidden }} --hidden ${{ matrix.hidden }} --epochs 30 --batch-size 256 | tee results/h${{ matrix.hidden }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-gestalt-topology-h${{ matrix.hidden }}-${{ github.sha }}
          path: results/
          retention-days: 30
