name: V15 Python direct Gestalt residual

on:
  push:
    branches: [analysis/v15-python-direct-gestalt-residual-20260909]
    paths:
      - scripts/train_v15_gestalt_direct_residual.py
      - scripts/patch_v15_python_leaf_direct_residual.py
      - .github/workflows/v15-python-direct-gestalt-residual.yml
  workflow_dispatch:

permissions: {contents: read, actions: read}

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        hidden: [8, 12, 16]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0

      - name: Download exact Rust search-leaf Gestalt corpus
        uses: actions/download-artifact@v4
        with:
          name: v15-rust-search-leaf-gestalt-70736f6f056d42aa8ceee37e0b282e4f02d34556
          path: leaf-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34277063353

      - name: Download exact packaged V14
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775

      - name: Train direct Gestalt-minus-V14 residual
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name Little-Gambit-V14.zip -print -quit); test -n "$ZIP"
          TEACHER=$(find leaf-artifact -type f -name teacher.jsonl -print -quit); test -n "$TEACHER"
          rm -rf /tmp/v14 results; mkdir -p /tmp/v14 results
          unzip -q "$ZIP" -d /tmp/v14
          python -u scripts/train_v15_gestalt_direct_residual.py \
            --teacher "$TEACHER" --engine-dir /tmp/v14 \
            --output-dir results/model --hidden ${{ matrix.hidden }} \
            --epochs 24 --batch-size 256 | tee results/train.log

      - name: Materialize exact-speed control and residual candidate
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name Little-Gambit-V14.zip -print -quit); test -n "$ZIP"
          MODEL=$(find results/model -type f -name 'gestalt-direct-residual-h${{ matrix.hidden }}.npz' -print -quit); test -n "$MODEL"
          rm -rf /tmp/base /tmp/cand; mkdir -p /tmp/base /tmp/cand
          unzip -q "$ZIP" -d /tmp/base; cp -a /tmp/base/. /tmp/cand/
          for D in /tmp/base /tmp/cand; do
            python scripts/patch_v15_python_presort_once.py "$D/experiments/numba_search.py"
            python scripts/patch_v15_python_fused_h64_direct.py "$D/experiments/v14_student_single_runtime.py"
            python scripts/patch_v15_python_inline_fused_h64.py "$D/experiments/v14_student_single_runtime.py"
            python scripts/patch_v15_python_fused_h64_zero_guard.py "$D/experiments/v14_student_single_runtime.py"
            python scripts/patch_v15_python_lazy_h64_chain.py "$D/experiments/numba_search.py"
            python scripts/patch_v15_python_scoremeta_hotloop.py "$D/experiments/numba_search.py"
          done
          cp "$MODEL" /tmp/cand/experiments/v15_gestalt_residual.npz
          python scripts/patch_v15_python_leaf_direct_residual.py /tmp/cand/experiments/numba_search.py --cap-cp 600
          python -m py_compile tools/v14_agent_runner.py /tmp/base/agent.py /tmp/cand/agent.py /tmp/base/experiments/*.py /tmp/cand/experiments/*.py
          PYTHONPATH=/tmp/cand python - <<'PY'
          import chess,numpy as np
          from experiments.numba_core import encode_position,move_to_uci
          from experiments.numba_search import iterative_search_stateful
          b=chess.Board();e=encode_position(b);h=np.empty(0,dtype=np.uint64)
          o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,12000)
          m=chess.Move.from_uci(move_to_uci(int(o[0])));assert m in b.legal_moves,(m,o)
          print('SMOKE',m,tuple(int(x) for x in o))
          PY

      - name: Round61 regression diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/probe.py <<'PY'
          import chess,json,numpy as np
          from experiments.numba_core import encode_position,move_to_uci
          from experiments.numba_search import iterative_search_stateful
          fen='2r3k1/4qp2/4b3/p5p1/4P1P1/2Pr2P1/P4PB1/R1Q2RK1 w - - 1 23'
          b=chess.Board(fen);h=np.empty(0,dtype=np.uint64)
          rows=[]
          for n in (300000,1000000):
            e=encode_position(b);o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,n)
            rows.append({'nodes_requested':n,'move':move_to_uci(int(o[0])),'score':int(o[1]),'depth':int(o[2]),'nodes':int(o[3])})
          print(json.dumps(rows))
          PY
          echo BASE | tee results/round61.log
          PYTHONPATH=/tmp/base python /tmp/probe.py | tee -a results/round61.log
          echo RESIDUAL-H${{ matrix.hidden }} | tee -a results/round61.log
          PYTHONPATH=/tmp/cand python /tmp/probe.py | tee -a results/round61.log

      - name: Build fresh disjoint roots
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          rm -rf /tmp/m6; mkdir /tmp/m6
          python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]
          eq=fresh[4100:4148];tm=fresh[4150:4182]
          assert len(eq)==48 and len(tm)==32 and not set(eq)&set(tm)
          Path('/tmp/equal.epd').write_text('\n'.join(eq)+'\n')
          Path('/tmp/timed.epd').write_text('\n'.join(tm)+'\n')
          PY

      - name: 96-game equal-node strength screen
        run: python -u tools/v14_fixed_node_arena.py /tmp/cand /tmp/base --nodes 30000 --pairs 48 --opening-file /tmp/equal.epd --opening-offset 0 --max-plies 200 --json-out results/equal-node.json | tee results/equal-node.log

      - name: Five-repetition throughput
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/w.py <<'PY'
          import json,sys,chess,numpy as np
          from experiments.numba_core import encode_position
          from experiments.numba_search import iterative_search_stateful
          for line in sys.stdin:
            q=json.loads(line);b=chess.Board(q['fen']);e=encode_position(b);h=np.empty(0,dtype=np.uint64)
            o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,int(q['nodes']))
            print(json.dumps({'nodes':int(o[3]),'depth':int(o[2])}),flush=True)
          PY
          python - <<'PY'
          import json,os,statistics,subprocess,sys,time
          from pathlib import Path
          roots=Path('/tmp/equal.epd').read_text().splitlines()[:20]
          def start(d):
            e=os.environ.copy();e['PYTHONPATH']=d
            return subprocess.Popen([sys.executable,'/tmp/w.py'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env=e)
          def one(p,f,n):
            p.stdin.write(json.dumps({'fen':f,'nodes':n})+'\n');p.stdin.flush();return json.loads(p.stdout.readline())
          b=start('/tmp/base');c=start('/tmp/cand');rat=[];rows=[]
          try:
            one(b,roots[0],500);one(c,roots[0],500)
            for r in range(5):
              order=roots if r%2==0 else list(reversed(roots))
              def timed(p):
                nn=0;t=time.perf_counter()
                for f in order:nn+=one(p,f,35000)['nodes']
                return nn/(time.perf_counter()-t)
              if r%2==0:bn=timed(b);cn=timed(c)
              else:cn=timed(c);bn=timed(b)
              rat.append(cn/bn);rows.append({'rep':r,'base_nps':bn,'candidate_nps':cn,'ratio':cn/bn})
          finally:
            b.terminate();c.terminate();b.wait();c.wait()
          out={'median_nps_ratio':statistics.median(rat),'rows':rows}
          Path('results/throughput.json').write_text(json.dumps(out,indent=2)+'\n');print('FINAL',out)
          PY

      - name: 64-game competition-clock screen
        run: python -u scripts/v15_competition_gate.py --candidate /tmp/cand --control /tmp/base --openings /tmp/timed.epd --output results/timed-64.json --label direct-residual-h${{ matrix.hidden }} --base-ms 2500 --inc-ms 50 --max-plies 180 | tee results/timed-64.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-python-direct-residual-h${{ matrix.hidden }}-${{ github.sha }}
          path: results/
          retention-days: 30
