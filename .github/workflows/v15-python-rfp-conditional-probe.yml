name: V15 Python RFP conditional-probe qualification

on:
  push:
    branches: [analysis/v15-python-rfp-conditional-probe-20260908]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - name: Materialize exact A/B
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name 'Little-Gambit-V14.zip' -print -quit); test -n "$ZIP"
          rm -rf /tmp/base /tmp/cand; mkdir -p /tmp/base /tmp/cand results
          unzip -q "$ZIP" -d /tmp/base; cp -a /tmp/base/. /tmp/cand/
          python scripts/patch_v15_python_rfp_conditional_probe.py /tmp/cand/experiments/numba_search.py
          python -m py_compile /tmp/base/agent.py /tmp/base/experiments/*.py /tmp/cand/agent.py /tmp/cand/experiments/*.py
          cmp /tmp/base/agent.py /tmp/cand/agent.py
          cmp /tmp/base/experiments/numba_core.py /tmp/cand/experiments/numba_core.py
          diff -u /tmp/base/experiments/numba_search.py /tmp/cand/experiments/numba_search.py > results/integration.patch || true
          test -s results/integration.patch
      - name: Build fresh pinned roots
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          mkdir -p /tmp/m6; python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old];chosen=fresh[720:768];assert len(chosen)==48
          Path('/tmp/rfp2-48.epd').write_text('\n'.join(chosen)+'\n')
          PY
      - name: Exact fixed-node equivalence and throughput
        shell: bash
        run: |
          cat >/tmp/w.py <<'PY'
          import json,sys,chess,numpy as np
          from experiments.numba_core import encode_position
          from experiments.numba_search import iterative_search_stateful
          for line in sys.stdin:
              q=json.loads(line);b=chess.Board(q['fen']);e=encode_position(b);h=np.empty(0,dtype=np.uint64);o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,int(q['nodes']));print(json.dumps({'move':int(o[0]),'score':int(o[1]),'depth':int(o[2]),'nodes':int(o[3])}),flush=True)
          PY
          python - <<'PY'
          import json,os,statistics,subprocess,sys,time
          from pathlib import Path
          roots=[x.strip() for x in Path('/tmp/rfp2-48.epd').read_text().splitlines() if x.strip()]
          def st(d):
              e=os.environ.copy();e['PYTHONPATH']=d;return subprocess.Popen([sys.executable,'/tmp/w.py'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env=e)
          def one(p,f,n):p.stdin.write(json.dumps({'fen':f,'nodes':n})+'\n');p.stdin.flush();return json.loads(p.stdout.readline())
          b=st('/tmp/base');c=st('/tmp/cand')
          try:
              one(b,roots[0],500);one(c,roots[0],500);bad=[]
              for i,f in enumerate(roots):
                  x=one(b,f,20000);y=one(c,f,20000)
                  if x!=y:bad.append({'i':i,'base':x,'cand':y})
              if bad:raise SystemExit('semantic mismatch '+json.dumps(bad[:3]))
              ratios=[];rows=[]
              for r in range(5):
                  order=roots[:20] if r%2==0 else list(reversed(roots[:20]))
                  def timed(p):
                      nn=0;t=time.perf_counter()
                      for f in order:nn+=one(p,f,30000)['nodes']
                      return nn/(time.perf_counter()-t)
                  if r%2==0:bn=timed(b);cn=timed(c)
                  else:cn=timed(c);bn=timed(b)
                  ratios.append(cn/bn);rows.append({'rep':r,'base_nps':bn,'candidate_nps':cn,'ratio':cn/bn})
              out={'equivalent_roots':len(roots),'median_nps_ratio':statistics.median(ratios),'rows':rows};Path('results/throughput.json').write_text(json.dumps(out,indent=2)+'\n');print('FINAL',out)
          finally:b.terminate();c.terminate();b.wait();c.wait()
          PY
      - name: 48 colour-swapped competition-clock games
        shell: bash
        run: |
          python - <<'PY'
          import json,math,queue,subprocess,sys,threading,time
          from collections import Counter,deque
          from pathlib import Path
          import chess
          BASE_MS=2500;INC_MS=50;MAX_PLIES=180;GRACE_MS=1200;opens=[x.strip() for x in Path('/tmp/rfp2-48.epd').read_text().splitlines() if x.strip()][:24]
          class A:
              def __init__(self,d):
                  self.p=subprocess.Popen([sys.executable,'tools/v14_agent_runner.py',d],stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,bufsize=1);self.q=queue.Queue();self.err=deque(maxlen=80);threading.Thread(target=self.o,daemon=True).start();threading.Thread(target=self.e,daemon=True).start();assert json.loads(self.line(95)).get('ready')
              def o(self):
                  for x in self.p.stdout:self.q.put(x.rstrip())
                  self.q.put(None)
              def e(self):
                  for x in self.p.stderr:self.err.append(x.rstrip())
              def line(self,t):
                  try:x=self.q.get(timeout=t)
                  except queue.Empty as ex:raise RuntimeError('timeout') from ex
                  if x is None:raise RuntimeError('closed '+'\n'.join(self.err))
                  return x
              def reset(self):self.p.stdin.write('{"reset":true}\n');self.p.stdin.flush();assert json.loads(self.line(5)).get('reset')
              def move(self,b,ms):self.p.stdin.write(json.dumps({'fen':b.fen(),'time_left_ms':max(0,int(ms))})+'\n');self.p.stdin.flush();z=json.loads(self.line((max(0,ms)+GRACE_MS)/1000));m=chess.Move.from_uci(z['move']);assert m in b.legal_moves;return m
              def stop(self):
                  if self.p.poll() is None:self.p.kill()
                  self.p.wait(timeout=5)
          base=A('/tmp/base');cand=A('/tmp/cand');rows=[];pairs=[]
          def play(fen,cw):
              b=chess.Board(fen);cl={chess.WHITE:float(BASE_MS),chess.BLACK:float(BASE_MS)};base.reset();cand.reset();tim=[]
              for _ in range(MAX_PLIES):
                  o=b.outcome(claim_draw=True)
                  if o is not None:return (0.5 if o.winner is None else float(o.winner==cw)),b.result(claim_draw=True),tim
                  side=b.turn;use=side==cw;e=cand if use else base;t=time.monotonic()
                  try:m=e.move(b,cl[side])
                  except Exception as ex:return (0.0 if use else 1.0),f'engine-failure:{type(ex).__name__}',tim
                  dt=(time.monotonic()-t)*1000;cl[side]-=dt
                  if cl[side]<0:return (0.0 if use else 1.0),'flag',tim
                  tim.append((use,dt));b.push(m);cl[side]+=INC_MS
              return 0.5,'max-ply-draw',tim
          try:
              for i,f in enumerate(opens):
                  ps=0.0
                  for cw in (True,False):
                      s,r,t=play(f,cw);ps+=s;rows.append({'opening':i,'candidate_white':cw,'score':s,'result':r,'candidate_ms':[v for x,v in t if x],'control_ms':[v for x,v in t if not x]});print(i,cw,s,r,flush=True)
                  pairs.append(ps)
          finally:base.stop();cand.stop()
          score=sum(x['score'] for x in rows);n=len(rows);f=score/n;elo=400*math.log10(f/(1-f)) if 0<f<1 else None;ct=[v for x in rows for v in x['candidate_ms']];bt=[v for x in rows for v in x['control_ms']];out={'candidate':'V15 RFP conditional legal probe','games':n,'score':score,'score_fraction':f,'naive_elo_from_score':elo,'pair_histogram':dict(Counter(str(x) for x in pairs)),'candidate_mean_move_ms':sum(ct)/max(1,len(ct)),'control_mean_move_ms':sum(bt)/max(1,len(bt)),'details':rows};Path('results/timed.json').write_text(json.dumps(out,indent=2)+'\n');print('FINAL',json.dumps({k:v for k,v in out.items() if k!='details'}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-python-rfp-conditional-probe-${{ github.sha }}
          path: results/
          retention-days: 30
