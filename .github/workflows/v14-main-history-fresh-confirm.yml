name: V14-A main history fresh confirmation

on:
  push:
    branches: [analysis/v14-main-history-a-20260908]

permissions:
  contents: read

jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact competition runtime
        run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Reconstruct exact V13 and frozen V14-A
        shell: bash
        run: |
          set -euo pipefail
          cat .analysis/v13_chunks_*.b64 | base64 -d > /tmp/v13.zip
          echo '658fd954180c2d0d39c02ba6601af36d06cdbd573bfb72c6879169861a7ad092  /tmp/v13.zip' | sha256sum -c -
          rm -rf /tmp/v13-control /tmp/v14-a
          mkdir -p /tmp/v13-control /tmp/v14-a
          unzip -q /tmp/v13.zip -d /tmp/v13-control
          unzip -q /tmp/v13.zip -d /tmp/v14-a
          for DIR in /tmp/v13-control /tmp/v14-a; do
            patch "$DIR/experiments/numba_search.py" < .analysis/v13_jit_refactor.patch
            DIR="$DIR" python - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['DIR']) / 'experiments/numba_search.py'
          s = p.read_text()
          old = '    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          new = '    correction = correction // 6\n    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1))
          PY
            python scripts/patch_v13_legality_context.py "$DIR/experiments/numba_core.py"
            python scripts/patch_v13_qsearch_tactical.py "$DIR/experiments/numba_core.py" "$DIR/experiments/numba_search.py"
          done
          echo '0306e8145a453d91b9b5ac92e9980931510d9e18f8ba598a7548d08b85165c35  /tmp/v13-control/experiments/numba_core.py' | sha256sum -c -
          echo '401f6580028a72361286bd99bee1f0022c74e6c8a65da8acd47448835a1ff360  /tmp/v13-control/experiments/numba_search.py' | sha256sum -c -
          python scripts/patch_v14_main_history.py /tmp/v14-a/experiments/numba_search.py
          cmp /tmp/v13-control/experiments/numba_core.py /tmp/v14-a/experiments/numba_core.py
          cmp /tmp/v13-control/experiments/v13_residual.i16 /tmp/v14-a/experiments/v13_residual.i16
          grep -Fq 'QUIET_HISTORY_MAX = 16_384' /tmp/v14-a/experiments/numba_search.py
          grep -Fq 'QUIET_HISTORY_ORDER_SCALE = 128' /tmp/v14-a/experiments/numba_search.py
      - name: Run 80 fresh colour-reversed fixed-node games
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v14-a-fresh-results
          cat >/tmp/v14_game_worker.py <<'PY'
          import json
          import sys
          import chess
          import numpy as np
          from experiments.numba_core import encode_position, move_to_uci
          from experiments.numba_search import iterative_search_stateful, position_key

          def key_for_fen(fen):
              b = chess.Board(fen)
              e = encode_position(b)
              return int(position_key(e.board, e.side, e.castling, e.ep_square))

          for line in sys.stdin:
              q = json.loads(line)
              board = chess.Board(q['fen'])
              encoded = encode_position(board)
              prior = q.get('prior', [])
              keep = min(board.halfmove_clock, len(prior))
              history = (
                  np.asarray([key_for_fen(f) for f in prior[-keep:]], dtype=np.uint64)
                  if keep else np.empty(0, dtype=np.uint64)
              )
              out = iterative_search_stateful(
                  encoded.board, encoded.side, encoded.castling, encoded.ep_square,
                  board.halfmove_clock, history, len(history), int(q['nodes'])
              )
              print(json.dumps({'uci': move_to_uci(int(out[0]))}), flush=True)
          PY
          python - <<'PY'
          import json, math, os, subprocess, sys
          import chess

          all_openings = [x.strip() for x in open('match/openings/m3-uho-lichess-100-v1.epd') if x.strip()]
          openings = all_openings[16:56]
          assert len(openings) == 40
          NODES = 12000
          MAX_PLIES = 120

          def start(path):
              env = os.environ.copy(); env['PYTHONPATH'] = path
              return subprocess.Popen([sys.executable, '/tmp/v14_game_worker.py'], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True, bufsize=1, env=env)

          def ask(proc, board, prior):
              proc.stdin.write(json.dumps({'fen': board.fen(), 'prior': prior, 'nodes': NODES}) + '\n')
              proc.stdin.flush()
              reply = json.loads(proc.stdout.readline())
              move = chess.Move.from_uci(reply['uci'])
              assert move in board.legal_moves, (board.fen(), reply)
              return move

          base, cand = start('/tmp/v13-control'), start('/tmp/v14-a')

          def play(fen, candidate_white):
              board = chess.Board(fen); prior = []
              for _ in range(MAX_PLIES):
                  move = ask(cand if board.turn == candidate_white else base, board, prior)
                  prior.append(board.fen()); board.push(move)
                  if board.is_game_over(claim_draw=True):
                      result = board.result(claim_draw=True)
                      if result == '1/2-1/2': return 0.5, result
                      won = (result == '1-0') == candidate_white
                      return (1.0 if won else 0.0), result
              return 0.5, 'max-ply-draw'

          scores = []; details = []
          try:
              warm = chess.Board(openings[0]); ask(base, warm, []); ask(cand, warm, [])
              for local_index, fen in enumerate(openings):
                  source_index = local_index + 16
                  for candidate_white in (True, False):
                      score, result = play(fen, candidate_white)
                      scores.append(score)
                      row = {'source_opening': source_index, 'candidate_white': candidate_white, 'candidate_score': score, 'result': result}
                      details.append(row); print(row, flush=True)
          finally:
              for p in (base, cand): p.terminate(); p.wait()

          total = sum(scores); games = len(scores); pct = total / games
          elo = 400.0 * math.log10(pct / (1.0 - pct)) if 0 < pct < 1 else None
          summary = {
              'candidate': 'V14-A-main-quiet-history',
              'control': 'exact-final-V13',
              'book_slice': 'm3-uho-lichess-100-v1[16:56]',
              'disjoint_from_discovery': True,
              'nodes_per_move': NODES,
              'games': games,
              'score': total,
              'score_fraction': pct,
              'naive_elo_from_score': elo,
              'note': 'Fresh confirmation. Do not merge solely from this result; positive replication advances to larger SPRT.',
              'games_detail': details,
          }
          print(json.dumps(summary, indent=2))
          with open('v14-a-fresh-results/main-history-fresh.json', 'w') as f: json.dump(summary, f, indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v14-a-main-history-fresh-${{ github.sha }}
          path: v14-a-fresh-results/
          retention-days: 14
