name: V16 Python history-pruning fused H64

on:
  push:
    branches: [analysis/v16-python-history-pruning-fused-20260909]
    paths:
      - '.github/workflows/v16-python-history-pruning-fused.yml'
      - 'scripts/patch_v15_python_fused_h64_direct.py'
      - 'scripts/patch_v15_python_inline_fused_h64.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Download exact V14
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - name: Materialize identical history+pruning A/B
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name Little-Gambit-V14.zip -print -quit); test -n "$ZIP"
          rm -rf /tmp/base /tmp/cand results /tmp/m6; mkdir -p /tmp/base /tmp/cand results /tmp/m6
          unzip -q "$ZIP" -d /tmp/base
          python scripts/patch_v16_python_presort_once.py /tmp/base/experiments/numba_search.py
          python scripts/patch_v16_python_trusted_continuity.py /tmp/base/agent.py
          python scripts/patch_v16_python_rust_history.py /tmp/base/experiments/numba_search.py
          python scripts/patch_v16_python_full_pruning_oracle.py /tmp/base/experiments/numba_search.py
          cp -a /tmp/base/. /tmp/cand/
          python scripts/patch_v15_python_fused_h64_direct.py /tmp/cand/experiments/v14_student_single_runtime.py
          python scripts/patch_v15_python_inline_fused_h64.py /tmp/cand/experiments/v14_student_single_runtime.py
          python -m py_compile /tmp/base/agent.py /tmp/cand/agent.py /tmp/base/experiments/*.py /tmp/cand/experiments/*.py
      - name: Build fresh roots
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]; eq=fresh[4300:4332]; tm=fresh[4335:4367]
          assert len(eq)==32 and len(tm)==32
          Path('/tmp/eq.epd').write_text('\n'.join(eq)+'\n');Path('/tmp/tm.epd').write_text('\n'.join(tm)+'\n')
          PY
      - name: Exact fixed-node parity
        run: python -u tools/v14_fixed_node_arena.py /tmp/cand /tmp/base --nodes 25000 --pairs 32 --opening-file /tmp/eq.epd --max-plies 220 --json-out results/parity.json | tee results/parity.log
      - name: Five-repetition throughput
        shell: bash
        run: |
          cat >/tmp/w.py <<'PY'
          import json,sys,chess,numpy as np
          from experiments.numba_core import encode_position
          from experiments.numba_search import iterative_search_stateful
          for line in sys.stdin:
              q=json.loads(line);b=chess.Board(q['fen']);e=encode_position(b);h=np.empty(0,dtype=np.uint64)
              o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,int(q['nodes']))
              print(json.dumps({'nodes':int(o[3])}),flush=True)
          PY
          python - <<'PY'
          import json,os,statistics,subprocess,sys,time
          from pathlib import Path
          roots=Path('/tmp/eq.epd').read_text().splitlines()[:20]
          def start(d):
              e=os.environ.copy();e['PYTHONPATH']=d
              return subprocess.Popen([sys.executable,'/tmp/w.py'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env=e)
          def one(p,f):p.stdin.write(json.dumps({'fen':f,'nodes':35000})+'\n');p.stdin.flush();return json.loads(p.stdout.readline())['nodes']
          b=start('/tmp/base');c=start('/tmp/cand');rat=[];rows=[]
          try:
              one(b,roots[0]);one(c,roots[0])
              for r in range(5):
                  order=roots if r%2==0 else list(reversed(roots))
                  def timed(p):
                      n=0;t=time.perf_counter()
                      for f in order:n+=one(p,f)
                      return n/(time.perf_counter()-t)
                  if r%2==0:bn=timed(b);cn=timed(c)
                  else:cn=timed(c);bn=timed(b)
                  rat.append(cn/bn);rows.append({'rep':r,'ratio':cn/bn})
          finally:b.terminate();c.terminate();b.wait();c.wait()
          out={'median_nps_ratio':statistics.median(rat),'rows':rows};Path('results/throughput.json').write_text(json.dumps(out,indent=2)+'\n');print('FINAL',out)
          PY
      - name: 64-game clock sanity
        run: python -u scripts/v15_competition_gate.py --control /tmp/base --candidate /tmp/cand --openings /tmp/tm.epd --output results/timed.json --label history-pruning-fused --base-ms 2500 --inc-ms 50 --max-plies 180 --grace-ms 1500 | tee results/timed.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v16-python-history-pruning-fused-${{ github.sha }}
          path: results/
          retention-days: 30
