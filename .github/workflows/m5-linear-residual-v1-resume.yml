name: M5 Rust linear residual v1 resume

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  resume-screen:
    if: github.head_ref == 'm5/linear-residual-v1-resume'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Download immutable trained candidate evidence
        uses: actions/download-artifact@v4
        with:
          name: m5-rust-linear-residual-v1-37c9cecd345b506ef45b52eac97703b4beba32bd
          path: trained-evidence
          repository: JamieLittle16/Chess
          run-id: '34164095270'
          github-token: ${{ github.token }}

      - name: Verify and materialize exact trained candidate
        shell: bash
        run: |
          set -euo pipefail
          test -f trained-evidence/candidate.patch
          echo 'e09f57fdc89d41b9b489ed31c7ce399519c9cc677ae3906ca5f5fd489b446ecb  trained-evidence/candidate.patch' | sha256sum --check --strict
          grep -Fq '"weights_sha256": "9df52b4c6f233a610cb4ef15090671c9e654a3ecc19e1c9729f16ad52dab0d64"' trained-evidence/provenance.json
          git apply trained-evidence/candidate.patch
          # The original run stopped only on Clippy's large-const-array lint. Static storage is
          # semantically identical for this immutable table and avoids duplicating 49 KiB at use sites.
          sed -i 's/^const WEIGHTS: \[i16; FEATURE_COUNT\] = \[/static WEIGHTS: [i16; FEATURE_COUNT] = [/' \
            crates/chess-eval/src/linear_residual_generated.rs
          cargo fmt
          git diff --check
          mkdir -p .qualification/resume
          git diff --binary > .qualification/resume/candidate-resumed.patch
          sha256sum .qualification/resume/candidate-resumed.patch | tee .qualification/resume/candidate-resumed-patch.sha256
          cp trained-evidence/provenance.json .qualification/resume/provenance.json
          cp trained-evidence/static-report.json .qualification/resume/static-report.json
          cp trained-evidence/alpha300-report.json .qualification/resume/alpha300-report.json
          cp trained-evidence/diverse-report.json .qualification/resume/diverse-report.json

      - name: Candidate correctness and build
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --release
          cargo run --quiet --release -p chess-bench | tee .qualification/resume/candidate-bench.txt
          CARGO_TARGET_DIR="$PWD/target-candidate" cargo build --release -p chess-uci
          cp target-candidate/release/chess-uci candidate-engine
          sha256sum candidate-engine | tee .qualification/resume/candidate-engine.sha256

      - name: Build exact frozen production reference
        shell: bash
        run: |
          set -euo pipefail
          REFERENCE_SHA=169fb5d424d90ebc45577ecaabe2a8fa0b4c1c10
          git fetch --quiet origin "$REFERENCE_SHA"
          git worktree add --detach .qualification/reference "$REFERENCE_SHA"
          CARGO_TARGET_DIR="$PWD/target-reference" cargo run --quiet --release -p chess-bench --manifest-path .qualification/reference/Cargo.toml | tee .qualification/resume/reference-bench.txt
          grep -Fx 'signature 0x4c3bbe8701fbbb68' .qualification/resume/reference-bench.txt
          CARGO_TARGET_DIR="$PWD/target-reference" cargo build --release -p chess-uci --manifest-path .qualification/reference/Cargo.toml
          cp target-reference/release/chess-uci reference-engine
          sha256sum reference-engine | tee .qualification/resume/reference-engine.sha256
          echo "$REFERENCE_SHA" | tee .qualification/resume/reference-main.sha

      - name: Build pinned Fastchess 1.8.2-alpha
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/Disservin/fastchess.git .qualification/fastchess-src
          git -C .qualification/fastchess-src checkout --quiet f618e34540f94f4719ad3817950618dabe441318
          test "$(git -C .qualification/fastchess-src rev-parse HEAD)" = 'f618e34540f94f4719ad3817950618dabe441318'
          make -C .qualification/fastchess-src -j2

      - name: Run paired 100-game equal-node screen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qualification/resume/equal-nodes
          .qualification/fastchess-src/fastchess \
            -engine cmd="$PWD/candidate-engine" name=linear-residual-v1 nodes=25000 option.Hash=32 \
            -engine cmd="$PWD/reference-engine" name=production-main nodes=25000 option.Hash=32 \
            -openings file=match/openings/m3-uho-lichess-100-v1.epd format=epd order=random \
            -srand 20261129 \
            -rounds 50 -repeat -concurrency 1 -maxmoves 300 \
            -ratinginterval 20 \
            -pgnout file=.qualification/resume/equal-nodes/games.pgn notation=uci append=false nodes=true nps=true \
            -log file=.qualification/resume/equal-nodes/uci.log level=info engine=true append=false \
            | tee .qualification/resume/equal-nodes/fastchess.stdout.log

      - name: Record immutable resume identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qualification/resume
          cat > .qualification/resume/evidence.txt <<EOF
          experiment=rust-linear-residual-v1-resume
          source_training_run=34164095270
          source_candidate_patch_sha256=e09f57fdc89d41b9b489ed31c7ce399519c9cc677ae3906ca5f5fd489b446ecb
          blended_weights_sha256=9df52b4c6f233a610cb4ef15090671c9e654a3ecc19e1c9729f16ad52dab0d64
          only_resume_source_change=const-to-static storage for immutable weight table
          production_reference=169fb5d424d90ebc45577ecaabe2a8fa0b4c1c10
          equal_nodes_per_move=25000
          equal_node_games=100
          equal_node_seed=20261129
          opening_sha256=599a45efb446e91952d13e79bc7fec8de319e332036a54552a3e8e4af91f9cf1
          fastchess_commit=f618e34540f94f4719ad3817950618dabe441318
          EOF

      - name: Upload complete resumed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-rust-linear-residual-v1-resume-${{ github.sha }}
          path: .qualification/resume/
          retention-days: 30
