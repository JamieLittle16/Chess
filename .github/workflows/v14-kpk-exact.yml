name: V14 exact KPK endgame layer

on:
  push:
    branches: [analysis/v14-kpk-exact-20260908]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact competition runtime
        run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0

      - name: Generate and exhaustively verify KPK bitbase
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python -u scripts/build_v14_kpk_bitbase.py /tmp/v14_kpk.u8 | tee results/bitbase.log
          test "$(stat -c %s /tmp/v14_kpk.u8)" = 196608
          sha256sum /tmp/v14_kpk.u8 | tee results/bitbase.sha256

      - name: Reconstruct exact V13 and KPK candidate
        shell: bash
        run: |
          set -euo pipefail
          cat .analysis/v13_chunks_*.b64 | base64 -d > /tmp/v13.zip
          echo '658fd954180c2d0d39c02ba6601af36d06cdbd573bfb72c6879169861a7ad092  /tmp/v13.zip' | sha256sum --check --strict
          rm -rf /tmp/base /tmp/cand && mkdir -p /tmp/base /tmp/cand
          unzip -q /tmp/v13.zip -d /tmp/base; unzip -q /tmp/v13.zip -d /tmp/cand
          patch /tmp/base/experiments/numba_search.py < .analysis/v13_jit_refactor.patch
          patch /tmp/cand/experiments/numba_search.py < .analysis/v13_jit_refactor.patch
          for DIR in /tmp/base /tmp/cand; do
            DIR="$DIR" python - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['DIR'])/'experiments/numba_search.py';s=p.read_text()
          old='    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          new='    correction = correction // 6\n    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          assert s.count(old)==1;p.write_text(s.replace(old,new,1))
          PY
            python scripts/patch_v13_legality_context.py "$DIR/experiments/numba_core.py"
            python scripts/patch_v13_qsearch_tactical.py "$DIR/experiments/numba_core.py" "$DIR/experiments/numba_search.py"
          done
          echo '401f6580028a72361286bd99bee1f0022c74e6c8a65da8acd47448835a1ff360  /tmp/base/experiments/numba_search.py' | sha256sum --check --strict
          cp /tmp/v14_kpk.u8 /tmp/cand/v14_kpk.u8
          python scripts/patch_v14_kpk_exact.py /tmp/cand/agent.py
          python -m py_compile /tmp/base/agent.py /tmp/base/experiments/*.py /tmp/cand/agent.py /tmp/cand/experiments/*.py
          cmp /tmp/base/experiments/numba_core.py /tmp/cand/experiments/numba_core.py
          cmp /tmp/base/experiments/numba_search.py /tmp/cand/experiments/numba_search.py
          cmp /tmp/base/experiments/v13_residual.i16 /tmp/cand/experiments/v13_residual.i16

      - name: Directed historical KPK sentinel
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp/cand python - <<'PY'
          import chess,agent
          fen='4k3/8/8/5K2/8/6P1/8/8 w - - 0 54'
          b=chess.Board(fen);legal=list(b.legal_moves)
          print('root_probe',agent._kpk_probe(b))
          rows=[]
          for m in legal:
              rows.append((m.uci(),agent._kpk_child_value(b,m)))
          print('children',rows)
          searched=chess.Move.from_uci('g3g4')
          selected=agent._kpk_exact_override(b,searched,legal)
          print('historical',searched.uci(),'->',selected.uci())
          # The exact layer must improve the historical V13 move under its own proven WDL/distance.
          old=agent._kpk_child_value(b,searched);new=agent._kpk_child_value(b,selected)
          assert old is not None and new is not None
          assert (new[0] and not old[0]) or (new[0]==old[0] and new[0] and new[1] < old[1]),(old,new,selected)
          PY

      - name: Random exact override invariants
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp/cand python - <<'PY'
          import random,chess,agent
          rng=random.Random(20260908);checked=0;changed=0
          while checked<2000:
              pawn_side=rng.choice([chess.WHITE,chess.BLACK]);pawn_rank=rng.randrange(1,7);pawn_file=rng.randrange(8)
              pawn=chess.square(pawn_file,pawn_rank);wk=rng.randrange(64);bk=rng.randrange(64)
              if len({pawn,wk,bk})<3:continue
              board=chess.Board(None);board.set_piece_at(wk,chess.Piece(chess.KING,chess.WHITE));board.set_piece_at(bk,chess.Piece(chess.KING,chess.BLACK));board.set_piece_at(pawn,chess.Piece(chess.PAWN,pawn_side));board.turn=rng.choice([True,False]);board.halfmove_clock=0
              if not board.is_valid():continue
              probe=agent._kpk_probe(board)
              if probe is None:continue
              legal=list(board.legal_moves)
              if not legal:continue
              baseline=rng.choice(legal);chosen=agent._kpk_exact_override(board,baseline,legal)
              assert chosen in legal
              bval=agent._kpk_child_value(board,baseline);cval=agent._kpk_child_value(board,chosen)
              assert bval is not None and cval is not None
              pawn_to_move=board.turn==pawn_side
              if pawn_to_move:
                  # Chosen can never turn a win into a draw; if both win it cannot lengthen conversion.
                  assert not (bval[0] and not cval[0]),(board.fen(),baseline,chosen,bval,cval)
                  if bval[0] and cval[0]: assert cval[1] <= bval[1]
              else:
                  # Defender can never turn a draw into a loss; if lost it cannot shorten resistance.
                  assert not ((not bval[0]) and cval[0]),(board.fen(),baseline,chosen,bval,cval)
                  if bval[0] and cval[0]: assert cval[1] >= bval[1]
              changed+=chosen!=baseline;checked+=1
          print('random_kpk_checked',checked,'changed',changed)
          PY

      - name: Non-KPK production API smoke
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp/cand python - <<'PY'
          import chess,agent,time
          for fen in (chess.STARTING_FEN,'2r3k1/4qp2/4b3/p5p1/4P1P1/2Pr2P1/P4PB1/R1Q2RK1 w - - 1 23'):
              b=chess.Board(fen);m=chess.Move.from_uci(agent.get_move(fen,80000));assert m in b.legal_moves;print('legal',m)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v14-kpk-exact-${{ github.sha }}
          path: results/
          retention-days: 30
