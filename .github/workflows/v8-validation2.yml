name: V8 independent validation control

on:
  push:
    branches:
      - analysis/v8-validation2-20260907
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: val-a, start: 30, count: 5}
          - {name: val-b, start: 35, count: 5}
          - {name: val-c, start: 40, count: 5}
          - {name: val-d, start: 45, count: 5}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install chess==1.11.2 numpy==2.5.2 numba==0.67.0
          sudo apt-get update -qq
          sudo apt-get install -y stockfish
      - name: Reconstruct exact V8
        run: |
          cat .analysis/v8_chunks_*.b64 | base64 -d > /tmp/v8.zip
          echo 'bf96f04aff0aef0125f85d61c6193cc614bbe619721c63894823a55a9d89ece2  /tmp/v8.zip' | sha256sum -c -
          rm -rf /tmp/v8 && mkdir -p /tmp/v8
          unzip -q /tmp/v8.zip -d /tmp/v8
      - name: Build pinned Rust
        run: cargo build --release -p chess-uci
      - name: Run unseen-opening control and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          STOCKFISH="$(command -v stockfish || true)"
          if [ -z "$STOCKFISH" ]; then STOCKFISH=/usr/games/stockfish; fi
          OUT="analysis-results/${{ matrix.name }}"
          mkdir -p "$OUT"
          python tools/v9_rust_diagnostic.py \
            --agent /tmp/v8 \
            --runner tools/v9_agent_runner.py \
            --engine target/release/chess-uci \
            --stockfish "$STOCKFISH" \
            --openings match/openings/m3-uho-lichess-100-v1.epd \
            --opening-start ${{ matrix.start }} \
            --opening-count ${{ matrix.count }} \
            --base-ms 2500 \
            --increment-ms 50 \
            --analysis-nodes 10000 \
            --out-dir "$OUT" | tee "$OUT/run.log"
      - name: Upload validation shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-validation-${{ matrix.name }}
          path: analysis-results/${{ matrix.name }}
          if-no-files-found: error
          retention-days: 7
