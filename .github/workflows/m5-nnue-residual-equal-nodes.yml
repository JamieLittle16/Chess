name: M5 residual NNUE equal-nodes screen

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  equal-nodes:
    if: github.head_ref == 'm5/nnue-search-ab-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Build one shared release engine binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p chess-uci
          test -x target/release/chess-uci
          sha256sum target/release/chess-uci | tee engine.sha256
      - name: Download frozen validation-selected residual model
        uses: actions/download-artifact@v4
        with:
          name: m5-nnue-residual-v1-0da545630ea1408f61e8c10d03252bdd8c11eeca
          path: .qualification/residual
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34147825482
      - name: Verify exact screened model
        shell: bash
        run: |
          set -euo pipefail
          MODEL=$(find "$PWD/.qualification/residual" -type f -name 'nnue-residual-32-v1.nnue' -print -quit)
          test -n "$MODEL"
          echo "7e156b6b7d18bdbfd61f98c9257b493918d9d19bfe94bbcadef401fc6835bc5b  $MODEL" | sha256sum --check --strict
          echo "RESIDUAL_MODEL=$MODEL" >> "$GITHUB_ENV"
      - name: Build pinned Fastchess 1.8.2-alpha
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/Disservin/fastchess.git .qualification/fastchess-src
          git -C .qualification/fastchess-src checkout --quiet f618e34540f94f4719ad3817950618dabe441318
          test "$(git -C .qualification/fastchess-src rev-parse HEAD)" = 'f618e34540f94f4719ad3817950618dabe441318'
          make -C .qualification/fastchess-src -j2
          test -x .qualification/fastchess-src/fastchess
      - name: Create same-binary candidate and reference launchers
        shell: bash
        run: |
          set -euo pipefail
          ENGINE="$PWD/target/release/chess-uci"
          MODEL="$RESIDUAL_MODEL"
          mkdir -p .qualification/launchers .qualification/equal-nodes
          cat > .qualification/launchers/candidate.sh <<EOF
          #!/usr/bin/env bash
          export CHESS_EXPERIMENTAL_RESIDUAL_NNUE='$MODEL'
          exec '$ENGINE'
          EOF
          cat > .qualification/launchers/reference.sh <<EOF
          #!/usr/bin/env bash
          unset CHESS_EXPERIMENTAL_RESIDUAL_NNUE
          exec '$ENGINE'
          EOF
          chmod +x .qualification/launchers/candidate.sh .qualification/launchers/reference.sh
      - name: Run paired 100-game equal-nodes screen
        shell: bash
        run: |
          set -euo pipefail
          .qualification/fastchess-src/fastchess \
            -engine cmd="$PWD/.qualification/launchers/candidate.sh" name=residual-33-over-16 nodes=25000 option.Hash=32 \
            -engine cmd="$PWD/.qualification/launchers/reference.sh" name=classical nodes=25000 option.Hash=32 \
            -openings file=match/openings/m3-uho-lichess-100-v1.epd format=epd order=random \
            -srand 20261017 \
            -rounds 50 -repeat -concurrency 1 -maxmoves 300 \
            -ratinginterval 20 \
            -pgnout file=.qualification/equal-nodes/games.pgn notation=uci append=false nodes=true nps=true \
            -log file=.qualification/equal-nodes/uci.log level=info engine=true append=false \
            | tee .qualification/equal-nodes/fastchess.stdout.log
      - name: Record immutable experiment identities
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qualification/equal-nodes
          cp engine.sha256 .qualification/equal-nodes/engine.sha256 || true
          cat > .qualification/equal-nodes/evidence.txt <<EOF
          model_sha256=7e156b6b7d18bdbfd61f98c9257b493918d9d19bfe94bbcadef401fc6835bc5b
          residual_scale=33/16
          nodes_per_move=25000
          games=100
          seed=20261017
          opening_sha256=599a45efb446e91952d13e79bc7fec8de319e332036a54552a3e8e4af91f9cf1
          fastchess_commit=f618e34540f94f4719ad3817950618dabe441318
          EOF
      - name: Upload equal-nodes evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-nnue-residual-equal-nodes-${{ github.sha }}
          path: .qualification/equal-nodes/
          retention-days: 30
