name: V18 SEE top-eight cold-TT benchmark

on:
  push:
    branches: [analysis/v18-see-top8-benchmark-20260911]
    paths: ['.github/workflows/v18-see-top8-coldtt-benchmark.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'Ryan Vincent'
            slug: ryan-vincent
          - target: 'Lightning Tree'
            slug: lightning-tree
          - target: 'Emile Andrieu'
            slug: emile-andrieu
          - target: 'what even is en passant'
            slug: what-even-is-en-passant
          - target: 'Gijs Smit'
            slug: gijs-smit
          - target: 'Opus Carlsen'
            slug: opus-carlsen
          - target: 'Stonkfish'
            slug: stonkfish
          - target: 'BetaGo'
            slug: betago
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q 'numba==0.67.0' 'numpy==2.5.2' 'chess==1.11.2'

      - name: Reconstruct full 71-game holdout corpus
        run: |
          set -euo pipefail
          cat match/benchmarks/aichessathon-top-engines/chunk_*.b64 | base64 -d | gzip -dc > /tmp/top8.pgn
          printf '%s  %s\n' '81c44dee067b39db09938f159e3192245abc5c4c52896b986b71f53b1cce5187' /tmp/top8.pgn | sha256sum -c -

      - name: Reconstruct exact PUNCH133 and apply SEE leader
        run: |
          set -euo pipefail
          rm -rf /tmp/engine /tmp/bench
          mkdir -p /tmp/engine /tmp/bench/${{ matrix.slug }}
          cat ci/v18_postbook_payload/chunk_*.b64 | base64 -d > /tmp/p150.zip
          unzip -q /tmp/p150.zip -d /tmp/engine
          sed -i 's/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.50/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.33/' /tmp/engine/agent.py
          curl --fail --location --retry 5 -sS 'https://raw.githubusercontent.com/michaeldv/donna_opening_books/master/gm2001.bin' -o /tmp/engine/v18_gm2001.bin
          python scripts/apply_v18_see_capture_ordering.py /tmp/engine/experiments/numba_search.py
          python -m py_compile /tmp/engine/agent.py /tmp/engine/experiments/numba_search.py scripts/v18_competitor_move_benchmark_v2.py scripts/stockfish_lab.py
          (cd /tmp/engine && python -c 'import agent; assert agent._ENGINE_READY; print("SEE_ENGINE_READY")')

      - name: Make Stockfish root analyses cold and independent
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/stockfish_lab.py')
          s=p.read_text()
          old='''        root_moves = None if root_move is None else [root_move]\n        info = self.engine.analyse(\n'''
          new='''        # Every oracle call is an independent fixed-node root analysis.\n        # Clearing Hash prevents discovery/history/candidate call order from biasing TT warmth.\n        self.engine.configure({"Clear Hash": None})\n        root_moves = None if root_move is None else [root_move]\n        info = self.engine.analyse(\n'''
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          PY
          python -m py_compile scripts/stockfish_lab.py

      - name: Download Stockfish 19
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 -sS 'https://github.com/official-stockfish/Stockfish/releases/latest/download/stockfish-linux-x86-64-universal.tar.gz' -o /tmp/sf.tar.gz
          mkdir -p /tmp/sf
          tar -xzf /tmp/sf.tar.gz -C /tmp/sf
          SF="$(find /tmp/sf -type f -name 'stockfish*' -perm /111 | head -n1)"
          cp "$SF" /tmp/stockfish19
          chmod +x /tmp/stockfish19
          /tmp/stockfish19 compiler

      - name: Score SEE leader against ${{ matrix.target }}
        run: |
          python scripts/v18_competitor_move_benchmark_v2.py \
            --pgn /tmp/top8.pgn \
            --engine-dir /tmp/engine \
            --stockfish /tmp/stockfish19 \
            --target '${{ matrix.target }}' \
            --positions 48 \
            --nodes 200000 \
            --threads 1 \
            --hash-mb 64 \
            --pairwise-margin-cp 8 \
            --seed 20260911 \
            --output-dir /tmp/bench/${{ matrix.slug }}
          cat /tmp/bench/${{ matrix.slug }}/summary.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: see-top8-${{ matrix.slug }}
          path: /tmp/bench/${{ matrix.slug }}
          retention-days: 7

  aggregate:
    runs-on: ubuntu-24.04
    needs: benchmark
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: see-top8-*
          path: bench
          merge-multiple: false
      - name: Aggregate all eight rivals
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths=sorted(Path('bench').glob('**/summary.json'))
          print('SUMMARIES',len(paths),paths)
          rows=[json.loads(p.read_text()) for p in paths]
          if not rows:
              raise SystemExit('no benchmark summaries')
          total=sum(r['positions'] for r in rows)
          payload={
            'targets_completed':len(rows),
            'positions_total':total,
            'weighted_historical_mean_cp_loss':sum(r['historical']['mean_cp_loss']*r['positions'] for r in rows)/total,
            'weighted_candidate_mean_cp_loss':sum(r['candidate']['mean_cp_loss']*r['positions'] for r in rows)/total,
            'weighted_pairwise_score':sum(r['pairwise']['score']*r['positions'] for r in rows)/total,
            'targets':rows,
          }
          Path('see-top8-summary.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          for r in sorted(rows,key=lambda x:x['target']):
              print(r['target'], 'N',r['positions'], 'RIVAL_CPL',r['historical']['mean_cp_loss'], 'SEE_CPL',r['candidate']['mean_cp_loss'], 'PAIR',r['pairwise']['score'], 'WTL',r['pairwise']['wins'],r['pairwise']['ties'],r['pairwise']['losses'])
          print('WEIGHTED',payload['weighted_historical_mean_cp_loss'],payload['weighted_candidate_mean_cp_loss'],payload['weighted_pairwise_score'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: see-top8-summary
          path: see-top8-summary.json
          retention-days: 7
