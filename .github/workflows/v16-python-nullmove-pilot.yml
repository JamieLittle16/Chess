name: V16 Python null-move pilot

on:
  workflow_dispatch:
  push:
    branches: [v16/python-nullmove-pilot]
    paths:
      - '.github/workflows/v16-python-nullmove-pilot.yml'
      - 'scripts/patch_v16_python_nullmove.py'

permissions:
  actions: read
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Download exact final V15
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V15-FINAL-725be3e8595d1e54b1f12e11f2b9d92f1e415ebc
          path: final-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34298586524
      - name: Build candidate
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find final-artifact -type f -name Little-Gambit-V15.zip -print -quit); test -n "$ZIP"
          echo '81e22344bf9a6b41f16e32f29f93c0b6074afe63e4fd51002a537e6a091f2852  '"$ZIP" | sha256sum --check --strict
          rm -rf /tmp/control /tmp/candidate results && mkdir /tmp/control /tmp/candidate results
          unzip -q "$ZIP" -d /tmp/control && cp -a /tmp/control/. /tmp/candidate/
          python scripts/patch_v16_python_nullmove.py /tmp/candidate/experiments/numba_search.py | tee results/patch.txt
          python - <<'PY' | tee results/startup-patch.txt
          from pathlib import Path
          p=Path('/tmp/candidate/experiments/numba_search.py'); s=p.read_text(); changed=[]
          for name in ('_legal_moves_for_state','_advance_eval_state_into','_child_position_key'):
              old=f'@njit(cache=False, inline="always")\ndef {name}('
              if old not in s: raise SystemExit(f'missing {name}')
              s=s.replace(old,f'@njit(cache=False)\ndef {name}(',1); changed.append(name)
          p.write_text(s); print('DEINLINED',changed)
          PY
          python -m py_compile /tmp/candidate/agent.py /tmp/candidate/experiments/*.py
          grep -q 'V16 null-move pilot' /tmp/candidate/experiments/numba_search.py
          find /tmp/candidate -type d -name __pycache__ -prune -exec rm -rf {} +
          (cd /tmp/candidate && zip -q -9 -r "$GITHUB_WORKSPACE/results/Little-Gambit-V16-nullmove.zip" .)
      - name: Hard 65-second cold-start gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cold /tmp/nm-home /tmp/nm-cache /tmp/nm-numba && mkdir /tmp/cold
          unzip -q results/Little-Gambit-V16-nullmove.zip -d /tmp/cold
          /usr/bin/time -f 'PROCESS_WALL_SECONDS %e\nPROCESS_CPU_SECONDS %U' -o results/cold-process.txt \
            timeout 65s env PYTHONPATH=/tmp/cold HOME=/tmp/nm-home XDG_CACHE_HOME=/tmp/nm-cache NUMBA_CACHE_DIR=/tmp/nm-numba OMP_NUM_THREADS=1 \
            python - <<'PY' > results/cold.txt 2>&1
          import json,sys,time
          from importlib import import_module
          t=time.perf_counter(); sys.path.insert(0,'/tmp/cold'); import_module('agent'); ready=time.perf_counter()-t
          print('READY_SECONDS',ready); print(json.dumps({'ready':True}))
          PY
          cat results/cold-process.txt results/cold.txt
      - name: Build fresh UHO roots
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          rm -rf /tmp/m6; mkdir /tmp/m6
          python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]
          roots=fresh[4640:4720]
          assert len(roots)==80 and len(set(roots))==80
          Path('/tmp/nm-node.epd').write_text('\n'.join(roots[:48])+'\n')
          Path('/tmp/nm-clock.epd').write_text('\n'.join(roots[48:80])+'\n')
          PY
      - name: 96-game equal-node screen
        run: python -u tools/v14_fixed_node_arena.py /tmp/candidate /tmp/control --nodes 20000 --pairs 48 --opening-file /tmp/nm-node.epd --max-plies 220 --json-out results/equal-node.json | tee results/equal-node.log
      - name: 64-game timed screen
        run: python -u scripts/v15_competition_gate.py --control /tmp/control --candidate /tmp/candidate --openings /tmp/nm-clock.epd --output results/timed.json --label 'V16 null-move pilot vs exact V15' --base-ms 2500 --inc-ms 50 --max-plies 180 --grace-ms 1500 | tee results/timed.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v16-nullmove-${{ github.sha }}
          path: results/
          retention-days: 30
