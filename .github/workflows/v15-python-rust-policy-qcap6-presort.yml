name: V15 Python effective Rust policy over presorted qcap6

on:
  push:
    branches: [analysis/v15-python-rust-policy-qcap6-presort-20260908]
    paths:
      - scripts/patch_v15_python_root_policy_persistent.py
      - .github/workflows/v15-python-rust-policy-qcap6-presort.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        mode: [seed3, persistent3]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install runtime and exporter
        run: |
          python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: Download exact packaged V14
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - name: Download ranked Rust V15 H64 policy
        uses: actions/download-artifact@v4
        with:
          name: rust-v15-policy-h64-bae844a67f0ffa899ab893cf5b41f5f7e4896d32
          path: policy-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34265888488
      - name: Materialize presorted qcap6 control and policy candidate
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name Little-Gambit-V14.zip -print -quit)
          PT=$(find policy-artifact -type f -name root-policy-h64.pt -print -quit)
          test -n "$ZIP"; test -n "$PT"
          rm -rf /tmp/base /tmp/cand /tmp/m6 results
          mkdir -p /tmp/base /tmp/cand /tmp/m6 results
          unzip -q "$ZIP" -d /tmp/base
          cp -a /tmp/base/. /tmp/cand/
          for D in /tmp/base /tmp/cand; do
            python scripts/patch_v15_python_qsearch_cap.py "$D/experiments/numba_search.py" 6
            python scripts/patch_v15_python_presort_once.py "$D/experiments/numba_search.py"
          done
          python scripts/export_v15_root_policy_npz.py "$PT" /tmp/cand/experiments/v15_root_policy.npz
          if [ "$MODE" = seed3 ]; then
            python scripts/patch_v15_python_root_policy_runtime.py /tmp/cand/experiments/numba_search.py 3
          else
            python scripts/patch_v15_python_root_policy_persistent.py /tmp/cand/experiments/numba_search.py 3
          fi
          python -m py_compile tools/v14_agent_runner.py /tmp/base/agent.py /tmp/base/experiments/*.py /tmp/cand/agent.py /tmp/cand/experiments/*.py
          grep -n '^MAX_QPLY' /tmp/base/experiments/numba_search.py /tmp/cand/experiments/numba_search.py
          PYTHONPATH=/tmp/cand python - <<'PY'
          import chess,numpy as np
          from experiments.numba_core import encode_position,move_to_uci
          from experiments.numba_search import iterative_search_stateful
          b=chess.Board();e=encode_position(b);h=np.empty(0,dtype=np.uint64)
          o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,8000)
          m=chess.Move.from_uci(move_to_uci(int(o[0])));assert m in b.legal_moves,(o,m)
          print(tuple(int(x) for x in o[:4]),m)
          PY
      - name: Build unseen roots
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]
          screen=fresh[4582:4630]; timed=fresh[4632:4664]
          assert len(screen)==48 and len(set(screen))==48 and len(timed)==32 and not set(screen)&set(timed)
          Path('/tmp/policy-screen-48.epd').write_text('\n'.join(screen)+'\n')
          Path('/tmp/policy-timed-32.epd').write_text('\n'.join(timed)+'\n')
          print({'fresh_total':len(fresh),'screen':[4582,4630],'timed':[4632,4664]})
          PY
      - name: Fixed-node throughput
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          cat >/tmp/worker.py <<'PY'
          import json,sys,chess,numpy as np
          from experiments.numba_core import encode_position
          from experiments.numba_search import iterative_search_stateful
          for line in sys.stdin:
              q=json.loads(line);b=chess.Board(q['fen']);e=encode_position(b);h=np.empty(0,dtype=np.uint64)
              o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,int(q['nodes']))
              print(json.dumps({'nodes':int(o[3]),'depth':int(o[2])}),flush=True)
          PY
          python - <<'PY'
          import json,os,statistics,subprocess,sys,time
          from pathlib import Path
          mode=os.environ['MODE']; roots=[x.strip() for x in Path('/tmp/policy-screen-48.epd').read_text().splitlines() if x.strip()][:16]
          def start(d):
              e=os.environ.copy();e['PYTHONPATH']=d;return subprocess.Popen([sys.executable,'/tmp/worker.py'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env=e)
          def one(p,fen,n):p.stdin.write(json.dumps({'fen':fen,'nodes':n})+'\n');p.stdin.flush();return json.loads(p.stdout.readline())
          def timed(p,order):
              nodes=0;ds=[];t=time.perf_counter()
              for fen in order:
                  z=one(p,fen,25000);nodes+=z['nodes'];ds.append(z['depth'])
              return nodes/(time.perf_counter()-t),sum(ds)/len(ds)
          b=start('/tmp/base');c=start('/tmp/cand');rat=[];rows=[]
          try:
              one(b,roots[0],500);one(c,roots[0],500)
              for r in range(3):
                  order=roots if r%2==0 else list(reversed(roots))
                  if r%2==0:bn,bd=timed(b,order);cn,cd=timed(c,order)
                  else:cn,cd=timed(c,order);bn,bd=timed(b,order)
                  rat.append(cn/bn);rows.append({'base_nps':bn,'candidate_nps':cn,'ratio':cn/bn,'base_depth':bd,'candidate_depth':cd})
          finally:b.terminate();c.terminate();b.wait();c.wait()
          out={'mode':mode,'median_nps_ratio':statistics.median(rat),'rows':rows};Path('results/throughput.json').write_text(json.dumps(out,indent=2)+'\n');print('FINAL',out)
          PY
      - name: 96-game equal-node screen
        run: python -u tools/v14_fixed_node_arena.py /tmp/cand /tmp/base --nodes 18000 --pairs 48 --opening-file /tmp/policy-screen-48.epd --opening-offset 0 --max-plies 220 --json-out results/equal-node.json | tee results/equal-node.log
      - name: 64-game competition-clock gate
        run: python -u scripts/v15_competition_gate.py --candidate /tmp/cand --control /tmp/base --openings /tmp/policy-timed-32.epd --output results/timed.json --label rust-policy-${{ matrix.mode }}-presort-qcap6 --base-ms 2500 --inc-ms 50 --max-plies 180 | tee results/timed.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-python-rust-policy-${{ matrix.mode }}-presort-qcap6-${{ github.sha }}
          path: results/
          retention-days: 30
