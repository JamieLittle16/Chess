name: Round49 Stockfish Audit

on:
  push:
    branches:
      - analysis/round49-stockfish

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Stockfish
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y stockfish
      - name: Audit every Little Gambit move
        run: |
          python3 - <<'PY'
          import os, re, subprocess

          engine = '/usr/games/stockfish' if os.path.exists('/usr/games/stockfish') else 'stockfish'
          positions = [
          (1,'Ne7','c6e7','r1bqk2r/1pp2ppp/1bnp1n2/pP2p3/P1B1P3/2PP1N2/5PPP/RNBQK2R b - - 0 1'),
          (2,'c6','c7c6','r1bqk2r/1pp1nppp/1b1p1n2/pP2p3/P1B1P3/2PP1N2/5PPP/RNBQ1RK1 b - - 0 1'),
          (3,'exd4','e5d4','r1bqk2r/1p2nppp/1bpp1n2/pP2p3/P1BPP3/2P2N2/5PPP/RNBQ1RK1 b - - 0 1'),
          (4,'d5','d6d5','r1bqk2r/1p2nppp/1bpp1n2/pP6/P1BpP3/2P2N2/5PPP/RNBQR1K1 b - - 0 1'),
          (5,'cxd5','c6d5','r1bqk2r/1p2nppp/1bp2n2/pP1P4/P1Bp4/2P2N2/5PPP/RNBQR1K1 b - - 0 1'),
          (6,'Be6','c8e6','r1bqk2r/1p2nppp/1b3n2/pP1p4/P1Bp4/B1P2N2/5PPP/RN1QR1K1 b - - 0 1'),
          (7,'dxc3','d4c3','r2qk2r/1p2nppp/1b2bn2/pP1p4/P2p4/BBP2N2/5PPP/RN1QR1K1 b - - 0 1'),
          (8,'Ng4','f6g4','r2qk2r/1p2nppp/1b2bn2/pP1p4/P7/BBN2N2/5PPP/R2QR1K1 b - - 0 1'),
          (9,'Qc7','d8c7','r2qk2r/1p2nppp/1b2b3/pP1p4/P5n1/BBN2N2/4RPPP/R2Q2K1 b - - 0 1'),
          (10,'Bxf2+','b6f2','r3k2r/1pq1nppp/1b2b3/pP1p4/P5n1/BBN2N2/4RPPP/2RQ2K1 b - - 0 1'),
          (11,'Qb6','c7b6','r3k2r/1pq1nppp/4b3/pP1p4/P5n1/BBN2N2/5RPP/2RQ2K1 b - - 0 1'),
          (12,'Nxf2','g4f2','r3k2r/1p2nppp/1q2b3/pP1p4/P5n1/BBN2N2/2R2RPP/3Q2K1 b - - 0 1'),
          (13,'Rd8','a8d8','r3k2r/1p2nppp/1q2b3/pP1p4/P7/BBN2N2/5RPP/3Q2K1 b - - 0 1'),
          (14,'Ng6','e7g6','3rk2r/1p2nppp/1q2b3/pP1p4/P2N4/BBN5/5RPP/3Q2K1 b - - 0 1'),
          (15,'h5','h7h5','3rk2r/1p3ppp/1q2b1n1/pP1p4/P2N4/BBN5/5RPP/3Q3K b - - 0 1'),
          (16,'fxe6','f7e6','3rk2r/1p3pp1/1q2N1n1/pP1p3p/P7/BBN5/5RPP/3Q3K b - - 0 1'),
          (17,'Kd7','e8d7','3rk2r/1p4p1/1q2p1n1/pP1p3p/P7/BBN5/5RPP/4Q2K b - - 0 1'),
          (18,'Kc8','d7c8','3r3r/1p1k1Rp1/1q2p1n1/pP1p3p/P7/BBN5/6PP/4Q2K b - - 0 1'),
          (19,'Nf8','g6f8','2kr3r/1p4R1/1q2p1n1/pP1p3p/P7/BBN5/6PP/4Q2K b - - 0 1'),
          (20,'Kb8','c8b8','2kr1n1r/1p4R1/1q2p3/pP1p3p/P7/BBN5/6PP/2Q4K b - - 0 1'),
          (21,'Ka7','b8a7','1k1r1n1r/1p4R1/1q2p3/pP1p2Qp/P7/BBN5/6PP/7K b - - 0 1'),
          (22,'Rc8','d8c8','3r1n1r/kp4R1/1q2p3/pP1p2Qp/P3N3/BB6/6PP/7K b - - 0 1'),
          (23,'Rc7','c8c7','2r2n1r/kp4R1/1q1Np3/pP1p2Qp/P7/BB6/6PP/7K b - - 0 1'),
          (24,'Qxc7','b6c7','5n1r/kpR5/1q1Np3/pP1p2Qp/P7/BB6/6PP/7K b - - 0 1'),
          (25,'Kxb6','a7b6','5n1r/kpq5/1P1Np3/p2p2Qp/P7/BB6/6PP/7K b - - 0 1'),
          (26,'Ka6','b6a6','5n1r/1pq5/1k1Np3/p2p3p/P7/BB2Q3/6PP/7K b - - 0 1'),
          (27,'b6','b7b6','5n1r/1pq5/k2Np3/p2p3p/P7/B3Q3/6PP/3B3K b - - 0 1'),
          (28,'Ka7','a6a7','5n1r/2q5/kp1Np3/p2p3p/P7/B3Q3/4B1PP/7K b - - 0 1'),
          (29,'Kb7','a7b7','5n1r/k1q5/1p2p3/pN1p3p/P7/B3Q3/4B1PP/7K b - - 0 1'),
          (30,'h4','h5h4','5n1r/1kN5/1p2p3/p2p3p/P7/B3Q3/4B1PP/7K b - - 0 1'),
          (31,'Nxe6','f8e6','5n1r/1k6/1p2N3/p2p4/P6p/B3Q3/4B1PP/7K b - - 0 1'),
          (32,'Ka7','b7a7','7r/1k6/1p2Q3/p2p4/P6p/B7/4B1PP/7K b - - 0 1'),
          (33,'Ka8','a7a8','7r/k4Q2/1p6/p2p4/P6p/B7/4B1PP/7K b - - 0 1'),
          (34,'Ka7','a8a7','k6r/8/1p6/p2Q4/P6p/B7/4B1PP/7K b - - 0 1'),
          (35,'Ka8','a7a8','7r/k2Q4/1p6/p7/P6p/B7/4B1PP/7K b - - 0 1'),
          (36,'Ka7','a8a7','k6r/8/1p6/p2Q4/P6p/B7/4B1PP/7K b - - 0 1'),
          (37,'Ka8','a7a8','7r/k2Q4/1p6/p7/P6p/B7/4B1PP/7K b - - 0 1'),
          ]

          p = subprocess.Popen([engine], stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, bufsize=1)
          def cmd(s):
              p.stdin.write(s+'\n'); p.stdin.flush()
          def wait(tok):
              while True:
                  line=p.stdout.readline()
                  if not line: raise RuntimeError('engine exited')
                  if line.strip()==tok: return
          cmd('uci'); wait('uciok')
          cmd('setoption name Threads value 1')
          cmd('setoption name Hash value 64')
          cmd('isready'); wait('readyok')

          score_re = re.compile(r' score (cp|mate) (-?\d+)')
          def search(fen, only=None):
              cmd('position fen '+fen)
              g='go nodes 120000'
              if only: g += ' searchmoves '+only
              cmd(g)
              last=None; best=None; pv=None
              while True:
                  line=p.stdout.readline().strip()
                  if line.startswith('info ') and ' score ' in line:
                      m=score_re.search(line)
                      if m:
                          kind,val=m.group(1),int(m.group(2)); last=(kind,val)
                          mm=re.search(r' pv (.+)$',line)
                          if mm: pv=mm.group(1)
                  elif line.startswith('bestmove '):
                      best=line.split()[1]; break
              if last is None: return None,best,pv
              kind,val=last
              score = (100000-val*1000 if val>0 else -100000-val*1000) if kind=='mate' else val
              return score,best,pv

          print('IDX SAN PLAYED BEST BEST_CP PLAYED_CP LOSS PV')
          for idx,san,move,fen in positions:
              best_cp,best,pv = search(fen)
              played_cp,_,_ = search(fen,move)
              loss = None if best_cp is None or played_cp is None else best_cp-played_cp
              print(idx, san, move, best, best_cp, played_cp, loss, pv)
          cmd('quit')
          PY
