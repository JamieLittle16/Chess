name: M6 promote accepted gestalt source

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  promote-source:
    if: github.head_ref == 'm6/gestalt-production-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Materialize the exact accepted SPRT source patch once
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'struct GestaltSearchEvaluator' crates/chess-search/src/lib.rs \
             && grep -q 'fn apply_delta(' crates/chess-eval/src/gestalt.rs; then
            echo 'accepted gestalt source is already materialized'
            exit 0
          fi

          python scripts/apply_gestalt_avx2_probe.py
          python scripts/apply_gestalt_search_probe.py
          cargo fmt --all
          git diff --check

          git diff --binary -- \
            crates/chess-eval/src/gestalt.rs \
            crates/chess-search/src/lib.rs \
            crates/chess-search/src/quiescence.rs \
            > /tmp/accepted-source.patch
          echo 'e5004c7eaae315a7562c5f2f7a7e2baf3302b074c57174d81c6f1b501a73f44e  /tmp/accepted-source.patch' \
            | sha256sum --check --strict

          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --release --exclude chess-bench
          cargo test -p chess-bench --release tests::suite_is_deterministic_within_the_same_build

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            crates/chess-eval/src/gestalt.rs \
            crates/chess-search/src/lib.rs \
            crates/chess-search/src/quiescence.rs
          git commit -m 'm6: promote accepted mature gestalt evaluator to source'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Strict committed-source gate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --release
