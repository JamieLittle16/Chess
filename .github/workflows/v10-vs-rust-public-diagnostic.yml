name: Round 61 V13 BEST Stockfish postmortem

on:
  push:
    branches:
      - analysis/round61-v13best-postmortem-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-chess and Stockfish
        run: |
          python -m pip install chess==1.11.2
          sudo apt-get update -qq
          sudo apt-get install -y stockfish
      - name: Analyse exact Round 61 PGN
        shell: bash
        run: |
          cat > /tmp/round61.pgn <<'PGN'
          [Event "AI Chessathon Rated"]
          [Site "aichessathon.com"]
          [Date "2026.09.08"]
          [Round "61"]
          [White "Little Gambit"]
          [Black "SaucyBeans"]
          [Result "0-1"]
          [FEN "r1bq1rk1/pp1pppbp/2n2np1/2p5/2PP4/2N2NP1/PP2PPBP/R1BQ1RK1 b - - 0 7"]
          [SetUp "1"]
          [Termination "checkmate"]

          7... cxd4 8. Nxd4 a5 9. c5 d5 10. cxd6 Nxd4 11. dxe7 Qxe7 12. Qxd4 Rd8 13. Qh4 Be6 14. Bg5 h6 15. Bxh6 Bxh6 16. Qxh6 Rac8 17. e4 Ng4 18. Qf4 g5 19. Qc1 b5 20. h3 b4 21. hxg4 bxc3 22. bxc3 Rd3 23. f3 Qc5+ 24. Rf2 Rcd8 25. a4 Bc4 26. Qb1 Rd2 27. Qe1 Re2 28. Qxe2 Bxe2 29. Bh3 Rd2 30. Re1 Bc4 31. Re3 Qxe3 32. Kh1 Qxf2 33. f4 Qh2# 0-1
          PGN
          cat > /tmp/analyse.py <<'PY'
          import chess
          import chess.pgn
          import chess.engine
          import json

          ENGINE = "/usr/games/stockfish"
          NODES = 250_000
          MATE = 100_000

          with open('/tmp/round61.pgn') as f:
              game = chess.pgn.read_game(f)
          board = game.board()
          engine = chess.engine.SimpleEngine.popen_uci(ENGINE)
          rows = []
          try:
              for ply, move in enumerate(game.mainline_moves(), start=1):
                  san = board.san(move)
                  if board.turn == chess.WHITE:
                      before_fen = board.fen()
                      best = engine.analyse(board, chess.engine.Limit(nodes=NODES))
                      forced = engine.analyse(board, chess.engine.Limit(nodes=NODES), root_moves=[move])
                      best_score = best['score'].pov(chess.WHITE).score(mate_score=MATE)
                      actual_score = forced['score'].pov(chess.WHITE).score(mate_score=MATE)
                      best_move = best['pv'][0] if best.get('pv') else None
                      best_san = board.san(best_move) if best_move else None
                      best_pv = []
                      probe = board.copy()
                      for pv_move in best.get('pv', [])[:8]:
                          try:
                              best_pv.append(probe.san(pv_move))
                              probe.push(pv_move)
                          except Exception:
                              break
                      actual_pv = []
                      probe = board.copy()
                      for pv_move in forced.get('pv', [])[:8]:
                          try:
                              actual_pv.append(probe.san(pv_move))
                              probe.push(pv_move)
                          except Exception:
                              break
                      rows.append({
                          'white_move_number': board.fullmove_number,
                          'move': san,
                          'uci': move.uci(),
                          'fen_before': before_fen,
                          'best_move': best_san,
                          'best_score_cp_white': best_score,
                          'actual_score_cp_white': actual_score,
                          'loss_cp': None if best_score is None or actual_score is None else best_score - actual_score,
                          'best_pv': best_pv,
                          'actual_pv': actual_pv,
                      })
                  board.push(move)
          finally:
              engine.quit()

          with open('/tmp/round61-analysis.json','w') as f:
              json.dump(rows, f, indent=2)
          rows_sorted = sorted(rows, key=lambda r: (r['loss_cp'] if r['loss_cp'] is not None else -1), reverse=True)
          with open('/tmp/round61-analysis.txt','w') as f:
              f.write('Round 61 Little Gambit (V13 BEST) Stockfish 16 postmortem\n')
              f.write(f'Nodes per best/forced analysis: {NODES}\n\n')
              f.write('Chronological:\n')
              for r in rows:
                  f.write(f"{r['white_move_number']:>2}. {r['move']:<7} best={r['best_move']:<7} before={r['best_score_cp_white']:>7} afterMove={r['actual_score_cp_white']:>7} loss={r['loss_cp']:>6}  PV={' '.join(r['best_pv'])}\n")
              f.write('\nLargest losses:\n')
              for r in rows_sorted[:12]:
                  f.write(f"{r['white_move_number']:>2}. {r['move']:<7} best={r['best_move']:<7} before={r['best_score_cp_white']:>7} afterMove={r['actual_score_cp_white']:>7} loss={r['loss_cp']:>6}  bestPV={' '.join(r['best_pv'])} actualPV={' '.join(r['actual_pv'])}\n")
          print(open('/tmp/round61-analysis.txt').read())
          PY
          python /tmp/analyse.py
      - name: Upload postmortem
        uses: actions/upload-artifact@v4
        with:
          name: round61-v13best-stockfish-postmortem
          path: |
            /tmp/round61-analysis.json
            /tmp/round61-analysis.txt
          retention-days: 7
