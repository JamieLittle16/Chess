name: V14 final shell-guard confirmation

on:
  push:
    branches: [analysis/v14-final-shell-confirm-20260908]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Download H64 model
        uses: actions/download-artifact@v4
        with:
          pattern: v14-single-student-h64-bb7d2a4ed05ff78d344cc4374d54e35189584993
          path: model-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34202820525
      - name: Materialize final control and guarded candidate
        shell: bash
        run: |
          set -euo pipefail
          MODEL=$(find model-artifact -type f -name 'student-h64.npz' -print -quit);test -n "$MODEL"
          echo '3422cecc3b1226767412e08746ffd6eef9f7e38602ac15b9256b475e6762b598  '"$MODEL" | sha256sum --check --strict
          curl --fail --location --retry 3 -o /tmp/shell_guard.py https://raw.githubusercontent.com/JamieLittle16/Chess/1820b463fc4f8af591b468f372cb07b36a807794/scripts/patch_v14_shell_breach_guard.py
          cat .analysis/v13_chunks_*.b64 | base64 -d >/tmp/v13.zip
          rm -rf /tmp/control /tmp/cand
          for DIR in /tmp/control /tmp/cand; do
            mkdir -p "$DIR";unzip -q /tmp/v13.zip -d "$DIR"
            patch "$DIR/experiments/numba_search.py" < .analysis/v13_jit_refactor.patch
            DIR="$DIR" python - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['DIR'])/'experiments/numba_search.py';s=p.read_text()
          old='    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          new='    correction = correction // 6\n    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          assert s.count(old)==1;p.write_text(s.replace(old,new,1))
          PY
            python scripts/patch_v13_legality_context.py "$DIR/experiments/numba_core.py"
            python scripts/patch_v13_qsearch_tactical.py "$DIR/experiments/numba_core.py" "$DIR/experiments/numba_search.py"
            cp experiments/v14_student_single_runtime.py "$DIR/experiments/v14_student_single_runtime.py"
            cp "$MODEL" "$DIR/experiments/v14_student_h64.npz"
            python scripts/patch_v14_single_student_search.py "$DIR/experiments/numba_search.py" --numerator 1 --denominator 12
            python scripts/patch_v14_student_lean_qsearch.py "$DIR/experiments/numba_search.py"
            python scripts/patch_v14_lazy_stable_ordering.py "$DIR/experiments/numba_search.py"
          done
          python /tmp/shell_guard.py /tmp/cand/experiments/numba_search.py
          python -m py_compile /tmp/control/experiments/*.py /tmp/cand/experiments/*.py
          mkdir -p guard-results

      - name: Rated f3 sentinel
        shell: bash
        run: |
          set -euo pipefail
          python tools/v14_regression_probe.py --engine /tmp/cand --control /tmp/control --manifest match/regressions/v14-rated-game-1.json --budgets 300000,1000000 --json-out guard-results/rated-f3.json | tee guard-results/rated-f3.log
          python - <<'PY'
          import json
          d=json.load(open('guard-results/rated-f3.json'))
          c=d['candidate']['v13-rated-1-f3-prophylaxis']['searches']
          assert all(x['uci']!='f2f3' for x in c),c
          print('f3_removed',[(x['budget'],x['uci']) for x in c])
          PY

      - name: Throughput
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/nps.py <<'PY'
          import json,sys,chess,numpy as np
          from experiments.numba_core import encode_position
          from experiments.numba_search import iterative_search_stateful
          for line in sys.stdin:
              q=json.loads(line);b=chess.Board(q['fen']);e=encode_position(b);h=np.empty(0,dtype=np.uint64);o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,int(q['nodes']));print(json.dumps({'nodes':int(o[3])}),flush=True)
          PY
          python - <<'PY'
          import json,os,statistics,subprocess,sys,time
          from pathlib import Path
          roots=[x.strip() for x in open('match/openings/m3-uho-lichess-100-v1.epd') if x.strip() and not x.startswith('#')][:40]
          def st(path):e=os.environ.copy();e['PYTHONPATH']=path;return subprocess.Popen([sys.executable,'/tmp/nps.py'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env=e)
          def run(p,order):
              n=0;t=time.perf_counter()
              for f in order:p.stdin.write(json.dumps({'fen':f,'nodes':30000})+'\n');p.stdin.flush();n+=json.loads(p.stdout.readline())['nodes']
              return time.perf_counter()-t,n
          a=st('/tmp/control');b=st('/tmp/cand');rs=[]
          try:
              for p in (a,b):p.stdin.write(json.dumps({'fen':roots[0],'nodes':300})+'\n');p.stdin.flush();json.loads(p.stdout.readline())
              for rep in range(3):
                  order=roots if rep%2==0 else list(reversed(roots));at,an=run(a,order);bt,bn=run(b,order);r=(bn/bt)/(an/at);rs.append(r);print(rep,r)
          finally:a.terminate();b.terminate();a.wait();b.wait()
          out={'median_guard_vs_control_nps':statistics.median(rs),'records':rs};Path('guard-results/throughput.json').write_text(json.dumps(out,indent=2)+'\n');print(out)
          PY

      - name: Build untouched official-UHO tail
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/master/UHO_Lichess_4852_v1.epd.zip
          rm -rf /tmp/uho && mkdir /tmp/uho && unzip -q /tmp/uho.zip -d /tmp/uho
          UHO=$(find /tmp/uho -type f -name '*.epd' -print -quit);test -n "$UHO"
          UHO="$UHO" python - <<'PY'
          import os,chess
          from pathlib import Path
          rows=Path(os.environ['UHO']).read_text(errors='ignore').splitlines();out=[]
          for raw in rows[4500:]:
              f=raw.strip().split()
              if len(f)<4:continue
              fen=' '.join(f[:4])+' 0 1'
              try:b=chess.Board(fen)
              except ValueError:continue
              if b.is_game_over(claim_draw=False):continue
              out.append(fen)
              if len(out)==48:break
          assert len(out)==48,len(out);Path('/tmp/tail.epd').write_text('\n'.join(out)+'\n')
          PY

      - name: Fresh 96-game fixed-node guard versus final control
        shell: bash
        run: |
          set -euo pipefail
          python -u tools/v14_fixed_node_arena.py /tmp/cand /tmp/control --nodes 16000 --pairs 48 --opening-file /tmp/tail.epd --max-plies 220 --json-out guard-results/equal-96.json | tee guard-results/equal-96.log
          grep '^FINAL ' guard-results/equal-96.log

      - name: Fresh 64-game timed guard versus final control
        shell: bash
        run: |
          set -euo pipefail
          python -u tools/v14_timed_agent_arena.py /tmp/cand /tmp/control --opening-file /tmp/tail.epd --pairs 32 --base-ms 2500 --increment-ms 50 --max-plies 180 --json-out guard-results/timed-64.json | tee guard-results/timed-64.log
          grep '^FINAL ' guard-results/timed-64.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v14-final-shell-confirm-${{ github.sha }}
          path: guard-results/
          retention-days: 30
