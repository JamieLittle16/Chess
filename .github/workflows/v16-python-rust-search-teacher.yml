name: V16 Python shallow Rust-search teacher

on:
  workflow_dispatch:
  push:
    branches: [v16/python-rust-search-teacher]
    paths:
      - '.github/workflows/v16-python-rust-search-teacher.yml'
      - 'tools/v16_label_rust_search_teacher.py'

permissions:
  actions: read
  contents: read

env:
  GESTALT_URL: https://github.com/cosmobobak/viridithas-networks/releases/download/v85/gestalt-b840.nnue
  GESTALT_SHA256: 956a6afcce5de1cdbc953ae3817ff760f3e6036441f34dcd524d6e2e7d0e71f6

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact Python runtime
        run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Download exact packaged V14
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - name: Download frozen Rust-search-leaf corpus
        uses: actions/download-artifact@v4
        with:
          name: v15-rust-search-leaf-gestalt-70736f6f056d42aa8ceee37e0b282e4f02d34556
          path: leaf-corpus
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34277063353
      - name: Download frozen static H16 initializer
        uses: actions/download-artifact@v4
        with:
          name: v15-leaf-gestalt-topology-h16-70736f6f056d42aa8ceee37e0b282e4f02d34556
          path: leaf-h16
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34277063353
      - name: Build exact Rust V15 teacher and fetch Gestalt
        shell: bash
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3
        run: |
          set -euo pipefail
          cargo build --release -p chess-uci
          mkdir -p teacher
          cp target/release/chess-uci teacher/chess-uci
          curl --fail --location --retry 5 "$GESTALT_URL" -o teacher/gestalt-b840.nnue
          test "$(stat -c%s teacher/gestalt-b840.nnue)" = '21242944'
          echo "$GESTALT_SHA256  teacher/gestalt-b840.nnue" | sha256sum --check --strict
      - name: Label 24k leaves with depth-4 Rust V15 search
        shell: bash
        run: |
          set -euo pipefail
          LEAVES=$(find leaf-corpus -type f -name '*.jsonl' -print -quit)
          test -n "$LEAVES"
          mkdir -p results
          python -u tools/v16_label_rust_search_teacher.py \
            --input "$LEAVES" --output results/search-teacher.jsonl \
            --engine teacher/chess-uci --network teacher/gestalt-b840.nnue \
            --depth 4 --train 18000 --validation 3000 --holdout 3000 \
            | tee results/label.log
          test "$(wc -l < results/search-teacher.jsonl)" = '24000'
          sha256sum results/search-teacher.jsonl > results/search-teacher.sha256
      - name: Fine-tune H16 on shallow-search values
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name Little-Gambit-V14.zip -print -quit)
          INIT=$(find leaf-h16 -type f -name gestalt-topology-h16.npz -print -quit)
          test -n "$ZIP";test -n "$INIT"
          rm -rf /tmp/v14 model
          mkdir -p /tmp/v14
          unzip -q "$ZIP" -d /tmp/v14
          python -u scripts/train_v16_leaf_phase_head.py \
            --teacher results/search-teacher.jsonl --engine-dir /tmp/v14 --init-model "$INIT" \
            --output-dir model --phase-heads 1 \
            --epochs 18 --batch-size 256 --lr 0.00035 --weight-decay 0.00001 --seed 20260910 \
            | tee results/train.log
          cat model/metadata.json | tee results/model-metadata.json
      - name: Materialize clean control and search-teacher H16
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name Little-Gambit-V14.zip -print -quit)
          MODEL=$(find model -type f -name leaf-phase-h1.npz -print -quit)
          test -n "$ZIP";test -n "$MODEL"
          rm -rf /tmp/base /tmp/cand
          mkdir -p /tmp/base /tmp/cand
          unzip -q "$ZIP" -d /tmp/base
          cp -a /tmp/base/. /tmp/cand/
          for D in /tmp/base /tmp/cand; do
            python scripts/patch_v16_python_presort_once.py "$D/experiments/numba_search.py"
            python scripts/patch_v16_python_trusted_continuity.py "$D/agent.py"
          done
          MODEL="$MODEL" python - <<'PY'
          import os,numpy as np
          src=np.load(os.environ['MODEL'],allow_pickle=False)
          assert src['output_us'].shape==(1,16) and src['output_them'].shape==(1,16)
          np.savez_compressed('/tmp/cand/experiments/v16_leaf_topology_student.npz',
              feature_weights=src['feature_weights'],feature_bias=src['feature_bias'],
              output_us=src['output_us'][0],output_them=src['output_them'][0],
              scale_denominator=src['scale_denominator'])
          PY
          python scripts/patch_v16_python_leaf_topology_runtime.py /tmp/cand/experiments/numba_search.py 16
          python -m py_compile tools/v14_agent_runner.py tools/v14_fixed_node_arena.py scripts/v15_competition_gate.py /tmp/base/agent.py /tmp/cand/agent.py /tmp/cand/experiments/*.py
          PYTHONPATH=/tmp/cand python - <<'PY'
          import chess,numpy as np
          from experiments.numba_core import encode_position,move_to_uci
          from experiments.numba_search import iterative_search_stateful
          b=chess.Board();e=encode_position(b);h=np.empty(0,dtype=np.uint64)
          o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,8000)
          u=move_to_uci(int(o[0]));assert chess.Move.from_uci(u) in b.legal_moves
          print('smoke',u,tuple(int(x) for x in o[:4]))
          PY
      - name: Build fresh qualification roots
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          rm -rf /tmp/m6;mkdir /tmp/m6
          python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]
          screen=fresh[4100:4132];timed=fresh[4140:4172]
          assert len(screen)==32 and len(timed)==32 and not set(screen)&set(timed)
          Path('/tmp/search-teacher-screen.epd').write_text('\n'.join(screen)+'\n')
          Path('/tmp/search-teacher-timed.epd').write_text('\n'.join(timed)+'\n')
          PY
      - name: Three-run throughput gate
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/nps_worker.py <<'PY'
          import json,sys,chess,numpy as np
          from experiments.numba_core import encode_position
          from experiments.numba_search import iterative_search_stateful
          for line in sys.stdin:
              q=json.loads(line);b=chess.Board(q['fen']);e=encode_position(b);h=np.empty(0,dtype=np.uint64)
              o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,int(q['nodes']))
              print(json.dumps({'nodes':int(o[3])}),flush=True)
          PY
          python - <<'PY'
          import json,os,statistics,subprocess,sys,time
          from pathlib import Path
          roots=Path('/tmp/search-teacher-screen.epd').read_text().splitlines()[:12]
          def start(d):
              e=os.environ.copy();e['PYTHONPATH']=d;return subprocess.Popen([sys.executable,'/tmp/nps_worker.py'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env=e)
          def one(p,f,n):p.stdin.write(json.dumps({'fen':f,'nodes':n})+'\n');p.stdin.flush();return json.loads(p.stdout.readline())['nodes']
          def run(p,order):
              n=0;t=time.perf_counter()
              for f in order:n+=one(p,f,20000)
              return n/(time.perf_counter()-t)
          b=start('/tmp/base');c=start('/tmp/cand');rat=[]
          try:
              one(b,roots[0],300);one(c,roots[0],300)
              for k in range(3):
                  order=roots if k%2==0 else list(reversed(roots))
                  if k%2==0:bn=run(b,order);cn=run(c,order)
                  else:cn=run(c,order);bn=run(b,order)
                  rat.append(cn/bn)
          finally:b.terminate();c.terminate();b.wait();c.wait()
          out={'median_nps_ratio':statistics.median(rat),'ratios':rat};open('results/throughput.json','w').write(json.dumps(out,indent=2)+'\n');print('FINAL',out)
          PY
      - name: 64-game equal-node screen
        run: python -u tools/v14_fixed_node_arena.py /tmp/cand /tmp/base --nodes 18000 --pairs 32 --opening-file /tmp/search-teacher-screen.epd --opening-offset 0 --max-plies 220 --json-out results/equal-node.json | tee results/equal-node.log
      - name: 64-game competition-clock gate
        run: python -u scripts/v15_competition_gate.py --candidate /tmp/cand --control /tmp/base --openings /tmp/search-teacher-timed.epd --output results/timed.json --label rust-search-depth4-h16 --base-ms 2500 --inc-ms 50 --max-plies 180 | tee results/timed.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v16-python-rust-search-teacher-${{ github.sha }}
          path: |
            results/
            model/
          retention-days: 30
