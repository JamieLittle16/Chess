name: V16 Python search-leaf topology runtime

on:
  workflow_dispatch:
  push:
    branches: [v16/python-leaf-topology-runtime]
    paths:
      - '.github/workflows/v16-python-leaf-topology-runtime.yml'
      - 'scripts/patch_v16_python_leaf_topology_runtime.py'
      - 'tools/v14_fixed_node_arena.py'
      - 'scripts/v15_competition_gate.py'

permissions:
  actions: read
  contents: read

jobs:
  qualify-h16:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact competition runtime
        run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Download exact packaged V14
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - name: Download real-search-leaf H16 model
        uses: actions/download-artifact@v4
        with:
          name: v15-leaf-gestalt-topology-h16-70736f6f056d42aa8ceee37e0b282e4f02d34556
          path: leaf-model
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34277063353
      - name: Materialize clean control and H16 candidate
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name Little-Gambit-V14.zip -print -quit)
          MODEL=$(find leaf-model -type f -name gestalt-topology-h16.npz -print -quit)
          test -n "$ZIP"; test -n "$MODEL"
          rm -rf /tmp/base /tmp/cand results
          mkdir -p /tmp/base /tmp/cand results
          unzip -q "$ZIP" -d /tmp/base
          cp -a /tmp/base/. /tmp/cand/
          for D in /tmp/base /tmp/cand; do
            python scripts/patch_v16_python_presort_once.py "$D/experiments/numba_search.py"
            python scripts/patch_v16_python_trusted_continuity.py "$D/agent.py"
          done
          cp "$MODEL" /tmp/cand/experiments/v16_leaf_topology_student.npz
          python scripts/patch_v16_python_leaf_topology_runtime.py /tmp/cand/experiments/numba_search.py 16
          python -m py_compile tools/v14_agent_runner.py tools/v14_fixed_node_arena.py scripts/v15_competition_gate.py /tmp/base/agent.py /tmp/cand/agent.py /tmp/base/experiments/*.py /tmp/cand/experiments/*.py
          python - <<'PY'
          import numpy as np
          m=np.load('/tmp/cand/experiments/v16_leaf_topology_student.npz',allow_pickle=False)
          print({k:list(m[k].shape) for k in m.files})
          assert m['feature_weights'].shape==(6912,16)
          assert m['feature_bias'].shape==(16,)
          assert m['output_us'].shape==(16,)
          assert m['output_them'].shape==(16,)
          assert int(m['scale_denominator'].reshape(-1)[0])==1
          PY
      - name: Exact feature-index and incremental-state certification
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp/cand python - <<'PY'
          import random
          import chess
          import numpy as np
          from experiments.numba_core import encode_position, generate_legal_moves, make_move_copy, move_to_uci
          from experiments.numba_search import (
              EVAL_WIDTH,
              _advance_eval_state_into,
              _build_eval_state_into,
              _leaf_topology_feature_index,
          )

          BUCKET_MAP=[
              0,1,2,3,12,11,10,9, 4,4,5,5,14,14,13,13,
              6,6,6,6,15,15,15,15, 7,7,7,7,16,16,16,16,
              8,8,8,8,17,17,17,17, 8,8,8,8,17,17,17,17,
              8,8,8,8,17,17,17,17, 8,8,8,8,17,17,17,17,
          ]
          def expected(perspective,king_square,signed_piece,square):
              kf=king_square&7; kr=king_square>>3
              mapped=king_square if perspective==1 else (7-kr)*8+kf
              bucket=BUCKET_MAP[mapped]%9
              mirror=kf>=4
              f=square&7; r=square>>3
              if mirror: f=7-f
              if perspective!=1: r=7-r
              same=(signed_piece>0)==(perspective==1)
              plane=(0 if same else 1)*6+(abs(signed_piece)-1)
              return bucket*768+plane*64+r*8+f

          checked=0
          for perspective in (1,-1):
              for king in range(64):
                  for piece in (-6,-5,-4,-3,-2,-1,1,2,3,4,5,6):
                      for square in range(64):
                          got=int(_leaf_topology_feature_index(perspective,king,piece,square))
                          want=expected(perspective,king,piece,square)
                          assert got==want,(perspective,king,piece,square,got,want)
                          checked+=1
          print('feature-index cases',checked)

          def internal_move(board,uci):
              e=encode_position(board)
              moves,count=generate_legal_moves(e.board,e.side,e.castling,e.ep_square)
              hits=[int(moves[i]) for i in range(int(count)) if move_to_uci(int(moves[i]))==uci]
              assert len(hits)==1,(board.fen(),uci,[move_to_uci(int(moves[i])) for i in range(int(count))])
              return e,hits[0]

          def check_move(board,uci):
              e,m=internal_move(board,uci)
              parent=np.empty(EVAL_WIDTH,dtype=np.int32); _build_eval_state_into(e.board,parent)
              child=np.empty(EVAL_WIDTH,dtype=np.int32); _advance_eval_state_into(e.board,e.side,m,parent,child)
              board2,next_side,next_castling,next_ep=make_move_copy(e.board,e.side,e.castling,e.ep_square,m)
              rebuilt=np.empty(EVAL_WIDTH,dtype=np.int32); _build_eval_state_into(board2,rebuilt)
              assert next_side==-e.side
              if not np.array_equal(child,rebuilt):
                  bad=np.flatnonzero(child!=rebuilt)
                  raise AssertionError((board.fen(),uci,bad.tolist(),child[bad].tolist(),rebuilt[bad].tolist()))
              pushed=board.copy(); pushed.push_uci(uci)
              pe=encode_position(pushed)
              assert np.array_equal(board2,pe.board)
              assert next_side==pe.side and next_castling==pe.castling and next_ep==pe.ep_square
              return pushed

          explicit=[
              ('r3k2r/8/8/8/8/8/8/R3K2R w KQkq - 0 1','e1g1'),
              ('r3k2r/8/8/8/8/8/8/R3K2R b KQkq - 0 1','e8c8'),
              ('8/8/8/3pP3/8/8/8/4K2k w - d6 0 1','e5d6'),
              ('7k/P7/8/8/8/8/8/7K w - - 0 1','a7a8q'),
              ('7k/8/8/8/8/8/8/K7 w - - 0 1','a1b1'),
              ('8/8/8/8/8/8/k7/7K b - - 0 1','a2b3'),
          ]
          for fen,uci in explicit: check_move(chess.Board(fen),uci)

          rng=random.Random(20260909)
          total=0
          for game in range(20):
              b=chess.Board()
              for ply in range(60):
                  legal=list(b.legal_moves)
                  if not legal: break
                  move=legal[rng.randrange(len(legal))]
                  b=check_move(b,move.uci()); total+=1
                  if b.is_game_over(claim_draw=True): break
          print('incremental states exact',total,'random moves +',len(explicit),'explicit')
          PY
      - name: Search smoke
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp/cand python - <<'PY'
          import chess,numpy as np
          from experiments.numba_core import encode_position,move_to_uci
          from experiments.numba_search import iterative_search_stateful
          for fen in [chess.STARTING_FEN,'r3k2r/ppp2ppp/2npbn2/3qp3/3P4/2P1PN2/PP1NBPPP/R2QKB1R w KQkq - 4 8']:
              b=chess.Board(fen);e=encode_position(b);h=np.empty(0,dtype=np.uint64)
              o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,8000)
              u=move_to_uci(int(o[0])); assert chess.Move.from_uci(u) in b.legal_moves
              print(fen,u,tuple(int(x) for x in o[:4]))
          PY
      - name: Build fresh disjoint qualification roots
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          rm -rf /tmp/m6;mkdir /tmp/m6
          python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]
          screen=fresh[3900:3948]; timed=fresh[3960:3992]
          assert len(screen)==48 and len(timed)==32 and len(set(screen))==48 and len(set(timed))==32 and not set(screen)&set(timed)
          Path('/tmp/leaf-screen.epd').write_text('\n'.join(screen)+'\n')
          Path('/tmp/leaf-timed.epd').write_text('\n'.join(timed)+'\n')
          PY
      - name: Alternating fixed-node throughput
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/nps_worker.py <<'PY'
          import json,sys,chess,numpy as np
          from experiments.numba_core import encode_position
          from experiments.numba_search import iterative_search_stateful
          for line in sys.stdin:
              q=json.loads(line);b=chess.Board(q['fen']);e=encode_position(b);h=np.empty(0,dtype=np.uint64)
              o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,int(q['nodes']))
              print(json.dumps({'nodes':int(o[3]),'depth':int(o[2])}),flush=True)
          PY
          python - <<'PY'
          import json,os,statistics,subprocess,sys,time
          from pathlib import Path
          roots=Path('/tmp/leaf-screen.epd').read_text().splitlines()[:16]
          def start(d):
              e=os.environ.copy();e['PYTHONPATH']=d
              return subprocess.Popen([sys.executable,'/tmp/nps_worker.py'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env=e)
          def one(p,fen,n):
              p.stdin.write(json.dumps({'fen':fen,'nodes':n})+'\n');p.stdin.flush();return json.loads(p.stdout.readline())
          def timed(p,order):
              nodes=0;depth=[];t=time.perf_counter()
              for fen in order:
                  z=one(p,fen,25000);nodes+=z['nodes'];depth.append(z['depth'])
              return nodes/(time.perf_counter()-t),sum(depth)/len(depth)
          b=start('/tmp/base');c=start('/tmp/cand');ratios=[];rows=[]
          try:
              one(b,roots[0],500);one(c,roots[0],500)
              for r in range(5):
                  order=roots if r%2==0 else list(reversed(roots))
                  if r%2==0: bn,bd=timed(b,order);cn,cd=timed(c,order)
                  else: cn,cd=timed(c,order);bn,bd=timed(b,order)
                  ratios.append(cn/bn);rows.append({'base_nps':bn,'candidate_nps':cn,'ratio':cn/bn,'base_depth':bd,'candidate_depth':cd})
          finally:
              b.terminate();c.terminate();b.wait();c.wait()
          out={'median_nps_ratio':statistics.median(ratios),'ratios':ratios,'rows':rows}
          Path('results/throughput.json').write_text(json.dumps(out,indent=2)+'\n');print('FINAL',out)
          PY
      - name: 96-game equal-node chess screen
        run: python -u tools/v14_fixed_node_arena.py /tmp/cand /tmp/base --nodes 18000 --pairs 48 --opening-file /tmp/leaf-screen.epd --opening-offset 0 --max-plies 220 --json-out results/equal-node.json | tee results/equal-node.log
      - name: 64-game competition-clock gate
        run: python -u scripts/v15_competition_gate.py --candidate /tmp/cand --control /tmp/base --openings /tmp/leaf-timed.epd --output results/timed.json --label leaf-topology-h16 --base-ms 2500 --inc-ms 50 --max-plies 180 | tee results/timed.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v16-python-leaf-topology-h16-${{ github.sha }}
          path: results/
          retention-days: 30
