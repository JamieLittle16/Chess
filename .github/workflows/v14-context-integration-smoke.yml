name: V14 contextual integration smoke

on:
  push:
    branches: [analysis/v14-context-student-20260908]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Reconstruct exact V13 and apply contextual replacement
        shell: bash
        run: |
          set -euo pipefail
          cat .analysis/v13_chunks_*.b64 | base64 -d >/tmp/v13.zip
          echo '658fd954180c2d0d39c02ba6601af36d06cdbd573bfb72c6879169861a7ad092  /tmp/v13.zip' | sha256sum -c --strict
          rm -rf /tmp/cand; mkdir /tmp/cand; unzip -q /tmp/v13.zip -d /tmp/cand
          patch /tmp/cand/experiments/numba_search.py < .analysis/v13_jit_refactor.patch
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/cand/experiments/numba_search.py');s=p.read_text();old='    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into(';new='    correction = correction // 6\n    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into(';assert s.count(old)==1;p.write_text(s.replace(old,new,1))
          PY
          python scripts/patch_v13_legality_context.py /tmp/cand/experiments/numba_core.py
          python scripts/patch_v13_qsearch_tactical.py /tmp/cand/experiments/numba_core.py /tmp/cand/experiments/numba_search.py
          cp experiments/v14_context_student_runtime.py /tmp/cand/experiments/
          python - <<'PY'
          import numpy as np
          H=64; F=9*768
          # Structural fixture only. Sparse nonzero rows exercise inference and move transport without a trained model.
          rng=np.random.default_rng(14014)
          w=np.zeros((F,H),dtype=np.int16)
          rows=rng.choice(F,size=256,replace=False);w[rows]=rng.integers(-8,9,size=(256,H),dtype=np.int16)
          np.savez_compressed('/tmp/cand/experiments/v14_context_model.npz',feature_weights=w,feature_bias=np.zeros(H,dtype=np.int16),output_weights=rng.integers(-4,5,size=H,dtype=np.int16),output_bias=np.zeros(1,dtype=np.int32))
          PY
          python scripts/patch_v14_context_student_search.py /tmp/cand/experiments/numba_search.py --hidden 64 --numerator 1 --denominator 1
          python -m py_compile /tmp/cand/experiments/numba_search.py /tmp/cand/experiments/v14_context_student_runtime.py
      - name: Prove full-state parity and exercise qsearch/search
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp/cand python - <<'PY'
          import chess,numpy as np
          from experiments.numba_core import encode_position,encode_move
          from experiments.numba_search import EVAL_WIDTH,EVAL_CONTEXT,_build_eval_state_into,_advance_eval_state_into,iterative_search_stateful
          b=chess.Board();e=encode_position(b);parent=np.empty(EVAL_WIDTH,dtype=np.int32);_build_eval_state_into(e.board,parent)
          # This legal trajectory deliberately moves both kings across context-zone boundaries.
          seq=('e2e4','e7e5','e1e2','e8e7','e2d3','e7d6','d3c3','d6c6')
          crossed=0
          for uci in seq:
              m=chess.Move.from_uci(uci);assert m in b.legal_moves,(uci,b.fen())
              im=encode_move(m.from_square,m.to_square,m.promotion or 0,0);e=encode_position(b);child=np.empty(EVAL_WIDTH,dtype=np.int32);_advance_eval_state_into(e.board,e.side,im,parent,child)
              oldctx=int(parent[EVAL_CONTEXT]);b.push(m);e2=encode_position(b);full=np.empty(EVAL_WIDTH,dtype=np.int32);_build_eval_state_into(e2.board,full)
              if int(child[EVAL_CONTEXT])!=oldctx:crossed+=1
              assert np.array_equal(child,full),(uci,np.flatnonzero(child!=full).tolist())
              parent=child
          assert crossed>=2,crossed
          h=np.empty(0,dtype=np.uint64);o=iterative_search_stateful(e2.board,e2.side,e2.castling,e2.ep_square,b.halfmove_clock,h,0,12000)
          print('context_integration_ok','crossed',crossed,'width',EVAL_WIDTH,'search',tuple(map(int,o)))
          PY
