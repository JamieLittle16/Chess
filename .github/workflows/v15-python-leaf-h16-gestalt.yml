name: V15 Python leaf-only H16 Gestalt screen

on:
  push:
    branches:
      - analysis/v15-python-leaf-h16-gestalt-20260909
    paths:
      - scripts/patch_v15_python_leaf_h16_gestalt.py
      - .github/workflows/v15-python-leaf-h16-gestalt.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: full
            runtime_den: 1
          - name: half
            runtime_den: 2
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0

      - name: Download exact packaged V14
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775

      - name: Download H16 search-leaf Gestalt student
        uses: actions/download-artifact@v4
        with:
          name: v15-leaf-gestalt-topology-h16-70736f6f056d42aa8ceee37e0b282e4f02d34556
          path: h16-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34277063353

      - name: Materialize best exact-speed control and leaf-H16 candidate
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name Little-Gambit-V14.zip -print -quit); test -n "$ZIP"
          MODEL=$(find h16-artifact -type f -name gestalt-topology-h16.npz -print -quit); test -n "$MODEL"
          rm -rf /tmp/base /tmp/cand results; mkdir -p /tmp/base /tmp/cand results
          unzip -q "$ZIP" -d /tmp/base; cp -a /tmp/base/. /tmp/cand/

          # Qualified control: exact V14 semantics, +8.05% median NPS versus presort-only.
          python scripts/patch_v15_python_presort_once.py /tmp/base/experiments/numba_search.py
          python scripts/patch_v15_python_fused_h64_direct.py /tmp/base/experiments/v14_student_single_runtime.py
          python scripts/patch_v15_python_inline_fused_h64.py /tmp/base/experiments/v14_student_single_runtime.py
          python scripts/patch_v15_python_fused_h64_zero_guard.py /tmp/base/experiments/v14_student_single_runtime.py
          python scripts/patch_v15_python_lazy_h64_chain.py /tmp/base/experiments/numba_search.py
          python scripts/patch_v15_python_scoremeta_hotloop.py /tmp/base/experiments/numba_search.py

          # Candidate: no H64 transport at all.  Presort + metadata stay; H16 is rebuilt only at leaf.
          python scripts/patch_v15_python_presort_once.py /tmp/cand/experiments/numba_search.py
          python scripts/patch_v15_python_scoremeta_hotloop.py /tmp/cand/experiments/numba_search.py
          cp "$MODEL" /tmp/cand/experiments/v15_gestalt_h16.npz
          python scripts/patch_v15_python_leaf_h16_gestalt.py /tmp/cand/experiments/numba_search.py --runtime-den ${{ matrix.runtime_den }}

          python -m py_compile tools/v14_agent_runner.py /tmp/base/agent.py /tmp/cand/agent.py /tmp/base/experiments/*.py /tmp/cand/experiments/*.py
          diff -u /tmp/base/experiments/numba_search.py /tmp/cand/experiments/numba_search.py > results/search.patch || true
          test -s results/search.patch

      - name: Certify compiled H16 leaf scorer against pure reference
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp/cand python - <<'PY'
          import chess, numpy as np
          from experiments.numba_core import encode_position
          import experiments.numba_search as ns

          model=np.load('/tmp/cand/experiments/v15_gestalt_h16.npz',allow_pickle=False)
          W=np.asarray(model['feature_weights'],dtype=np.int16)
          B=np.asarray(model['feature_bias'],dtype=np.int16)
          OU=np.asarray(model['output_us'],dtype=np.int16)
          OT=np.asarray(model['output_them'],dtype=np.int16)
          den=int(np.asarray(model['scale_denominator']).reshape(-1)[0])*int(ns.GESTALT_RUNTIME_DEN)
          bucket=np.asarray((
              0,1,2,3,12,11,10,9,4,4,5,5,14,14,13,13,6,6,6,6,15,15,15,15,
              7,7,7,7,16,16,16,16,8,8,8,8,17,17,17,17,8,8,8,8,17,17,17,17,
              8,8,8,8,17,17,17,17,8,8,8,8,17,17,17,17),dtype=np.int16)
          def tdiv(v,d): return v//d if v>=0 else -((-v)//d)
          def fi(board,perspective,piece,sq):
              k=board.king(perspective); assert k is not None
              mapped=k if perspective else chess.square(chess.square_file(k),7-chess.square_rank(k))
              b=int(bucket[mapped])%9; mirror=chess.square_file(k)>=4
              f=chess.square_file(sq); r=chess.square_rank(sq)
              if mirror: f=7-f
              if not perspective: r=7-r
              owner=0 if piece.color==perspective else 1
              return b*768+(owner*6+(piece.piece_type-1))*64+r*8+f
          def ref(board,side):
              aw=B.astype(np.int64).copy(); ab=B.astype(np.int64).copy()
              for sq,p in board.piece_map().items():
                  aw += W[fi(board,chess.WHITE,p,sq)].astype(np.int64)
                  ab += W[fi(board,chess.BLACK,p,sq)].astype(np.int64)
              aw=np.clip(aw,0,255); ab=np.clip(ab,0,255)
              us,them=(aw,ab) if side==1 else (ab,aw)
              raw=int(np.sum(us*us*OU.astype(np.int64)+them*them*OT.astype(np.int64)))
              cp=tdiv(tdiv(raw,255)*400,255*64)
              return tdiv(cp,den)
          fens=[
              chess.STARTING_FEN,
              'r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 0 1',
              '2r3k1/4qpp1/1p2p2p/p2nP3/3P4/P2Q1P2/1P3P1P/2R3K1 b - - 0 1',
              '8/2p5/3p1k2/3Pp3/4P3/5K2/8/8 w - - 0 1',
          ]
          for fen in fens:
              b=chess.Board(fen); e=encode_position(b); st=np.empty(ns.EVAL_WIDTH,dtype=np.int32)
              ns._build_eval_state_into(e.board,st)
              got=int(ns._evaluate_gestalt_leaf(e.board,e.side,st))
              v13=int(ns._evaluate_state_v13_only(e.side,st))
              expected=v13+ref(b,e.side)
              print(fen,{'v13':v13,'gestalt':got-v13,'total':got})
              assert got==expected,(fen,got,expected)
          print('H16_REFERENCE_PARITY_OK')
          PY

      - name: Search smoke
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp/cand python - <<'PY'
          import chess,numpy as np
          from experiments.numba_core import encode_position,move_to_uci
          from experiments.numba_search import iterative_search_stateful
          for fen in [chess.STARTING_FEN,'r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 0 1']:
              b=chess.Board(fen);e=encode_position(b);h=np.empty(0,dtype=np.uint64)
              o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,16000)
              m=chess.Move.from_uci(move_to_uci(int(o[0])));assert m in b.legal_moves,(fen,o,m)
              print(fen,tuple(int(x) for x in o),m)
          PY

      - name: Build fresh disjoint qualification roots
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          rm -rf /tmp/m6; mkdir /tmp/m6
          python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]
          equal=fresh[3500:3548]; timed=fresh[3550:3582]
          assert len(equal)==48 and len(timed)==32 and not set(equal)&set(timed)
          Path('/tmp/h16-equal.epd').write_text('\n'.join(equal)+'\n')
          Path('/tmp/h16-timed.epd').write_text('\n'.join(timed)+'\n')
          PY

      - name: 96-game equal-node strength screen
        run: python -u tools/v14_fixed_node_arena.py /tmp/cand /tmp/base --nodes 30000 --pairs 48 --opening-file /tmp/h16-equal.epd --opening-offset 0 --max-plies 200 --json-out results/equal-node.json | tee results/equal-node.log

      - name: Five-repetition throughput versus exact-speed control
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/w.py <<'PY'
          import json,sys,chess,numpy as np
          from experiments.numba_core import encode_position
          from experiments.numba_search import iterative_search_stateful
          for line in sys.stdin:
              q=json.loads(line);b=chess.Board(q['fen']);e=encode_position(b);h=np.empty(0,dtype=np.uint64)
              o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,int(q['nodes']))
              print(json.dumps({'move':int(o[0]),'score':int(o[1]),'depth':int(o[2]),'nodes':int(o[3])}),flush=True)
          PY
          python - <<'PY'
          import json,os,statistics,subprocess,sys,time
          from pathlib import Path
          roots=Path('/tmp/h16-equal.epd').read_text().splitlines()[:20]
          def start(d):
              e=os.environ.copy();e['PYTHONPATH']=d
              return subprocess.Popen([sys.executable,'/tmp/w.py'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env=e)
          def one(p,f,n):
              p.stdin.write(json.dumps({'fen':f,'nodes':n})+'\n');p.stdin.flush();return json.loads(p.stdout.readline())
          b=start('/tmp/base');c=start('/tmp/cand');rat=[];rows=[]
          try:
              one(b,roots[0],500);one(c,roots[0],500)
              for r in range(5):
                  order=roots if r%2==0 else list(reversed(roots))
                  def timed(p):
                      nodes=0;ds=[];t=time.perf_counter()
                      for f in order:
                          o=one(p,f,35000);nodes+=o['nodes'];ds.append(o['depth'])
                      return nodes/(time.perf_counter()-t),sum(ds)/len(ds)
                  if r%2==0:bn,bd=timed(b);cn,cd=timed(c)
                  else:cn,cd=timed(c);bn,bd=timed(b)
                  rat.append(cn/bn);rows.append({'rep':r,'base_nps':bn,'candidate_nps':cn,'ratio':cn/bn,'base_depth':bd,'candidate_depth':cd})
          finally:
              b.terminate();c.terminate();b.wait();c.wait()
          out={'median_nps_ratio':statistics.median(rat),'rows':rows}
          Path('results/throughput.json').write_text(json.dumps(out,indent=2)+'\n');print('FINAL',out)
          PY

      - name: 64-game competition-clock screen
        run: python -u scripts/v15_competition_gate.py --candidate /tmp/cand --control /tmp/base --openings /tmp/h16-timed.epd --output results/timed-64.json --label leaf-h16-${{ matrix.name }} --base-ms 2500 --inc-ms 50 --max-plies 180 | tee results/timed-64.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-python-leaf-h16-${{ matrix.name }}-${{ github.sha }}
          path: results/
          retention-days: 30
