name: V18 deep recheck top-engine start moves

on:
  push:
    branches: [analysis/v18-top36-opening-coverage-20260911]
    paths: [.github/workflows/v18-topstart-deep-recheck.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q 'chess==1.11.2'
      - name: Fetch references
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 -sS 'https://raw.githubusercontent.com/michaeldv/donna_opening_books/master/gm2001.bin' -o /tmp/gm2001.bin
          mkdir -p /tmp/sf19
          curl -L --fail --retry 3 --retry-delay 2 -o /tmp/stockfish-19.tar.gz https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz
          echo '9defc0d4e55d49c65a6d042f3e571a39fcea499ade6dbe741b53b8c65e03611f  /tmp/stockfish-19.tar.gz' | sha256sum -c -
          tar -xzf /tmp/stockfish-19.tar.gz -C /tmp/sf19
          SF=$(find /tmp/sf19 -type f -name 'stockfish*' | head -n1); chmod +x "$SF"; echo "STOCKFISH=$SF" >> "$GITHUB_ENV"
      - name: Deep compare observed and current DIRECT moves
        run: |
          cat >/tmp/recheck.tsv <<'EOF'
          Emile Andrieu	c6	rnbqk2r/ppp2ppp/3b4/3p4/2PPn3/5N2/PP2BPPP/RNBQK2R b KQkq - 0 7
          Emile Andrieu	d6	r1bqkbnr/pp1p1ppp/2n1p3/1N6/4P3/8/PPP2PPP/RNBQKB1R b KQkq - 2 5
          Lightning Tree	O-O	r1bqk2r/ppp1bppp/2np1n2/4p3/P1B1P3/2NP1N2/1PP2PPP/R1BQK2R b KQkq - 0 6
          Ryan Vincent	Be7	rn1qkb1r/1p3ppp/p2pbn2/4p3/4P3/1NN1B3/PPPQ1PPP/R3KB1R b KQkq - 3 8
          Lightning Tree	Nf3	r1bqk1nr/pp3pbp/2npp1p1/2p5/4PP2/2NP2P1/PPP3BP/R1BQK1NR w KQkq - 0 7
          Ryan Vincent	Bc5	r1bqk2r/pppp1ppp/2n2n2/1B6/1b1NP3/2P5/PP3PPP/RNBQK2R b KQkq - 0 6
          Ryan Vincent	Bd6	rnbqk1nr/1p3ppp/p7/2bp4/P7/1N6/1PP2PPP/R1BQKBNR b KQkq - 1 7
          Lightning Tree	c6	rnbq1rk1/ppp1bppp/4pn2/3p4/2PP4/N4NP1/PP2PPBP/R1BQK2R b KQ - 0 6
          EOF
          sed -i 's/^          //' /tmp/recheck.tsv
          python - <<'PY'
          import os,chess,chess.engine,chess.polyglot
          def direct(reader,b):
              es=[e for e in reader.find_all(b) if e.move in b.legal_moves and int(e.weight)>0]
              if not es or b.ply()>18:return None
              es.sort(key=lambda e:-int(e.weight)); tw=int(es[0].weight); total=sum(int(e.weight) for e in es); sh=tw/total
              return es[0].move if tw>=16 and (sh>=.70 or (tw>=96 and sh>=.60)) else None
          eng=chess.engine.SimpleEngine.popen_uci(os.environ['STOCKFISH']);eng.configure({'Threads':1,'Hash':128})
          gm=chess.polyglot.open_reader('/tmp/gm2001.bin')
          try:
              for raw in open('/tmp/recheck.tsv'):
                  player,san,fen=raw.rstrip().split('\t',2);b=chess.Board(fen);obs=b.parse_san(san);dm=direct(gm,b)
                  candidates=[]
                  for tag,m in [('OBS',obs),('GM_DIRECT',dm)]:
                      if m is None or any(x[1]==m for x in candidates):continue
                      candidates.append((tag,m))
                  best=eng.analyse(b,chess.engine.Limit(nodes=2_000_000)); pov=b.turn; bs=best['score'].pov(pov).score(mate_score=100000); bm=best['pv'][0]
                  vals=[]
                  for tag,m in candidates:
                      info=eng.analyse(b,chess.engine.Limit(nodes=2_000_000),root_moves=[m]); sc=info['score'].pov(pov).score(mate_score=100000); vals.append((tag,m.uci(),sc,max(0,bs-sc)))
                  print('ROW',player,'obs',obs.uci(),'sf_best',bm.uci(),'best_cp',bs,'gm_direct',dm.uci() if dm else '-', 'VALUES',vals,'FEN',fen,flush=True)
          finally: gm.close();eng.quit()
          PY
