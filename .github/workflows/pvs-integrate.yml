name: PVS integration helper

on:
  push:
    branches:
      - m4/pvs-v1

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Apply principal variation search
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/chess-search/src/lib.rs')
          lines = path.read_text().splitlines()
          picker_line = 'let mut picker = MovePicker::new(&mut moves, hint);'
          pickers = [i for i, line in enumerate(lines) if line.strip() == picker_line]
          if len(pickers) != 2:
              raise SystemExit(f'expected two search pickers, found {len(pickers)}')

          def loop_end(start: int) -> int:
              depth = 0
              seen = False
              for i in range(start, len(lines)):
                  depth += lines[i].count('{') - lines[i].count('}')
                  seen = True
                  if seen and depth == 0:
                      return i
              raise SystemExit('unterminated search loop')

          root_loop = [
              '        let mut first_move = true;',
              '        while let Some(mv) = picker.next(position) {',
              '            let undo = position.make_move(mv);',
              '            let child = if first_move {',
              '                self.negamax(',
              '                    position,',
              '                    prior_history,',
              '                    depth - 1,',
              '                    -INFINITY,',
              '                    -alpha,',
              '                    1,',
              '                    1,',
              '                    control,',
              '                )',
              '            } else {',
              '                // Later root moves first get a null-window probe. Good ordering',
              '                // should make most fail low; only alpha-raising moves are re-searched.',
              '                let probe = self.negamax(',
              '                    position,',
              '                    prior_history,',
              '                    depth - 1,',
              '                    -alpha - 1,',
              '                    -alpha,',
              '                    1,',
              '                    1,',
              '                    control,',
              '                );',
              '                match probe {',
              '                    Some(probe_child) if -probe_child > alpha => self.negamax(',
              '                        position,',
              '                        prior_history,',
              '                        depth - 1,',
              '                        -INFINITY,',
              '                        -alpha,',
              '                        1,',
              '                        1,',
              '                        control,',
              '                    ),',
              '                    probe => probe,',
              '                }',
              '            };',
              '            position.unmake_move(mv, undo);',
              '            let score = -child?;',
              '            first_move = false;',
              '',
              '            if score > best_score {',
              '                best_score = score;',
              '                best_move = Some(mv);',
              '            }',
              '            alpha = alpha.max(score);',
              '        }',
          ]

          node_loop = [
              '        let mut first_move = true;',
              '        while let Some(mv) = picker.next(position) {',
              '            let undo = position.make_move(mv);',
              '            let child = if first_move {',
              '                self.negamax(',
              '                    position,',
              '                    prior_history,',
              '                    depth - 1,',
              '                    -beta,',
              '                    -alpha,',
              '                    ply + 1,',
              '                    path_len + 1,',
              '                    control,',
              '                )',
              '            } else {',
              '                // Principal variation search probes later moves with a one-point',
              '                // window and verifies only genuine alpha improvements.',
              '                let probe = self.negamax(',
              '                    position,',
              '                    prior_history,',
              '                    depth - 1,',
              '                    -alpha - 1,',
              '                    -alpha,',
              '                    ply + 1,',
              '                    path_len + 1,',
              '                    control,',
              '                );',
              '                match probe {',
              '                    Some(probe_child)',
              '                        if -probe_child > alpha && -probe_child < beta =>',
              '                    {',
              '                        self.negamax(',
              '                            position,',
              '                            prior_history,',
              '                            depth - 1,',
              '                            -beta,',
              '                            -alpha,',
              '                            ply + 1,',
              '                            path_len + 1,',
              '                            control,',
              '                        )',
              '                    }',
              '                    probe => probe,',
              '                }',
              '            };',
              '            position.unmake_move(mv, undo);',
              '            let score = -child?;',
              '            first_move = false;',
              '',
              '            if score > best {',
              '                best = score;',
              '                best_move = Some(mv);',
              '            }',
              '            alpha = alpha.max(score);',
              '            if alpha >= beta {',
              '                break;',
              '            }',
              '        }',
          ]

          # Replace from the bottom so the first replacement cannot shift the second index.
          for picker_idx, replacement in ((pickers[1], node_loop), (pickers[0], root_loop)):
              start = picker_idx + 1
              if lines[start].strip() != 'while let Some(mv) = picker.next(position) {':
                  raise SystemExit('unexpected code between picker and search loop')
              end = loop_end(start)
              lines[start:end + 1] = replacement

          path.write_text('\n'.join(lines) + '\n')
          PY

          cargo fmt --all
          cargo clippy -p chess-search --all-targets --all-features -- -D warnings
          cargo test -p chess-search --all-features

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/chess-search/src/lib.rs
          git diff --cached --quiet && exit 0
          git commit -m 'search: add principal variation search probes'
          git push origin HEAD:m4/pvs-v1
