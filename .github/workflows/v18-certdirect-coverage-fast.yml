name: V18 certified GM-miss coverage fast
on:
  push:
    branches: [analysis/v18-certdirect-coverage-fast-20260911]
permissions:
  contents: read
  actions: read
jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q 'chess==1.11.2'
      - name: Download certified artifact and exact GM book
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/JamieLittle16/Chess/actions/artifacts/10171021582/zip' -o /tmp/cert.zip
          mkdir -p /tmp/cert && unzip -q /tmp/cert.zip -d /tmp/cert
          curl --fail --location -sS 'https://raw.githubusercontent.com/michaeldv/donna_opening_books/master/gm2001.bin' -o /tmp/gm.bin
      - name: Build GM-miss subset and measure coverage
        run: |
          python - <<'PY'
          import glob,struct,chess,chess.polyglot
          S=struct.Struct('>QHHI')
          full=glob.glob('/tmp/cert/**/broadcast-sf19-certified.bin',recursive=True)[0]
          gmkeys=set()
          with open('/tmp/gm.bin','rb') as f:
              while b:=f.read(16):gmkeys.add(S.unpack(b)[0])
          rows=[]
          with open(full,'rb') as f:
              while b:=f.read(16):
                  r=S.unpack(b)
                  if r[0] not in gmkeys:rows.append(r)
          rows.sort(key=lambda x:(x[0],x[1]))
          with open('/tmp/overlay.bin','wb') as f:
              for r in rows:f.write(S.pack(*r))
          print('OVERLAY',len(rows),len(rows)*16)
          historical=[
          ('Taimanov','r1bqkbnr/pp1p1ppp/2n1p3/8/3NP3/P7/1PP2PPP/RNBQKB1R b KQkq - 0 5'),
          ('Semi-Slav','r1b1k2r/pp1nqppp/2pbpn2/3p4/P1PP4/2N1PN2/1P2BPPP/R1BQ1RK1 b kq - 4 8'),
          ('Italian','r1bqk2r/1pp2ppp/1bnp1n2/pP2p3/P1B1P3/2PP1N2/5PPP/RNBQK2R b KQkq - 0 8'),
          ('London','r1bqk2r/pp3ppp/2nbpn2/2pp4/3P1B2/P1P1P3/1P1N1PPP/R2QKBNR w KQkq - 1 7'),
          ('French Classical','r1bqk2r/pp1n1ppp/2n1p3/2bpP3/5P2/2NB1N2/PPP3PP/R1BQK2R b KQkq - 1 8'),
          ('Najdorf','rnbqk2r/1p2bppp/p2ppn2/8/4PPP1/1NN5/PPP4P/R1BQKB1R b KQkq - 0 8'),
          ('Queens Indian','rn1q1rk1/pbppbppp/1p2pn2/8/2PP4/5NP1/PP2PPBP/RNBQR1K1 b - - 6 7'),
          ('English Symm','r1bq1rk1/pp1pppbp/2n2np1/2p5/2PP4/2N2NP1/PP2PPBP/R1BQ1RK1 b - - 0 7'),
          ('Sveshnikov','r1bqkb1r/1p3ppp/p1np1n2/4p3/P3P3/N1N5/1PP2PPP/R1BQKB1R b KQkq - 1 8'),
          ('French Tarrasch','rnbqkbnr/pp3ppp/8/2pp4/3P4/7P/PPPN1PP1/R1BQKBNR b KQkq - 0 5')]
          official=[
          ('English','r1bqk2r/pp1pppbp/2n2np1/2p5/2P5/2N1PNP1/PP1P1PBP/R1BQK2R b KQkq - 0 6'),
          ('French Winawer','r1b1k2r/pp2nppp/2n1p3/q1ppP3/P2P4/2P2N2/2PB1PPP/R2QKB1R b KQkq - 4 9'),
          ('Petroff','rnbqkb1r/pp3ppp/2p5/1B1p4/3Pn3/5N2/PPP2PPP/RNBQK2R w KQkq - 0 7'),
          ('Scotch','r1bq1rk1/pppp1ppp/2n2n2/1Bb5/3NP3/2P5/PP3PPP/RNBQ1RK1 w - - 3 8'),
          ('Grunfeld','rnbqk2r/pp2ppbp/6p1/2p5/3PP3/2P1BN2/P4PPP/R2QKB1R b KQkq - 1 8'),
          ('French Classical','r1bqk2r/pp1n1ppp/2n1p3/2bpP3/5P2/2NB4/PPP3PP/R1BQK1NR w KQkq - 0 8'),
          ('Sicilian Closed','1rbqk1nr/pp2ppbp/2np2p1/2p5/P3P3/2NP2P1/1PP1NPBP/R1BQK2R b KQk - 0 7'),
          ('Sveshnikov','r1bqkb1r/pp3ppp/2np4/1N1Pp3/8/8/PPP2PPP/R1BQKB1R b KQkq - 0 8')]
          def score(label,items,r):
              hits=0
              for name,fen in items:
                  b=chess.Board(fen);es=list(r.find_all(b));hits+=bool(es)
                  print(label,name,'HIT' if es else 'MISS',es[0].move.uci() if es else '-')
              print(label+'_SUMMARY',hits,'/',len(items))
          with chess.polyglot.open_reader('/tmp/overlay.bin') as r:
              score('HIST',historical,r);score('OFFICIAL',official,r)
              uho=[x.strip() for x in open('match/openings/m3-uho-lichess-100-v1.epd') if x.strip() and not x.startswith('#')]
              hits=sum(bool(list(r.find_all(chess.Board(f)))) for f in uho)
              print('UHO_SUMMARY',hits,'/',len(uho))
          PY
