name: V16 Python quiet-history score reuse qualification

on:
  workflow_dispatch:
  push:
    branches: [analysis/v16-python-history-score-reuse]
    paths:
      - '.github/workflows/v16-python-history-score-reuse.yml'
      - 'scripts/patch_v16_python_history_score_reuse.py'
      - 'scripts/patch_v16_python_presort_once.py'
      - 'scripts/patch_v16_python_trusted_continuity.py'
      - 'scripts/patch_v16_python_rust_history.py'
      - 'tools/v14_fixed_node_arena.py'
      - 'scripts/v15_competition_gate.py'
permissions: {actions: read, contents: read}
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - name: Materialize history control and score-reuse candidate
        shell: bash
        run: |
          ZIP=$(find v14-artifact -type f -name Little-Gambit-V14.zip -print -quit);test -n "$ZIP";rm -rf /tmp/control /tmp/candidate results;mkdir -p /tmp/control /tmp/candidate results;unzip -q "$ZIP" -d /tmp/control
          python scripts/patch_v16_python_presort_once.py /tmp/control/experiments/numba_search.py
          python scripts/patch_v16_python_trusted_continuity.py /tmp/control/agent.py
          python scripts/patch_v16_python_rust_history.py /tmp/control/experiments/numba_search.py
          cp -a /tmp/control/. /tmp/candidate/;python scripts/patch_v16_python_history_score_reuse.py /tmp/candidate/experiments/numba_search.py
          python -m py_compile tools/v14_agent_runner.py tools/v14_fixed_node_arena.py scripts/v15_competition_gate.py /tmp/control/agent.py /tmp/control/experiments/*.py /tmp/candidate/agent.py /tmp/candidate/experiments/*.py
      - name: Build roots
        shell: bash
        run: |
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip'|sha256sum --check --strict;rm -rf /tmp/m6;mkdir /tmp/m6;python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')};a=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()];f=[x for x in a if x not in old];c=f[3200:3264];assert len(c)==64;Path('/tmp/parity.epd').write_text('\n'.join(c[:16])+'\n');Path('/tmp/node.epd').write_text('\n'.join(c[16:40])+'\n');Path('/tmp/clock.epd').write_text('\n'.join(c[40:64])+'\n')
          PY
      - name: Exact parity and throughput
        shell: bash
        run: |
          cat >/tmp/w.py <<'PY'
          import json,sys,time,chess,numpy as np
          from experiments.numba_core import encode_position,move_to_uci
          from experiments.numba_search import iterative_search_stateful
          for l in sys.stdin:
              q=json.loads(l);b=chess.Board(q['fen']);e=encode_position(b);h=np.empty(0,dtype=np.uint64);t=time.perf_counter();o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,q['nodes']);dt=time.perf_counter()-t;print(json.dumps({'m':move_to_uci(int(o[0])),'s':int(o[1]),'d':int(o[2]),'n':int(o[3]),'t':dt}),flush=True)
          PY
          python - <<'PY'
          import json,os,statistics,subprocess,sys
          from pathlib import Path
          pr=Path('/tmp/parity.epd').read_text().splitlines();nr=Path('/tmp/node.epd').read_text().splitlines()[:16]
          def st(d):e=os.environ.copy();e['PYTHONPATH']=d;return subprocess.Popen([sys.executable,'/tmp/w.py'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env=e)
          def one(p,f,n):p.stdin.write(json.dumps({'fen':f,'nodes':n})+'\n');p.stdin.flush();return json.loads(p.stdout.readline())
          a=st('/tmp/control');b=st('/tmp/candidate');r=[]
          try:
              one(a,pr[0],500);one(b,pr[0],500)
              for n in (2000,7000,18000):
                  for f in pr:
                      x=one(a,f,n);y=one(b,f,n);assert {k:x[k] for k in 'msdn'}=={k:y[k] for k in 'msdn'},(n,f,x,y)
              for z in range(7):
                  an=bn=0;at=bt=0.0
                  for f in (nr if z%2==0 else list(reversed(nr))):
                      x=one(a,f,30000);y=one(b,f,30000);an+=x['n'];bn+=y['n'];at+=x['t'];bt+=y['t']
                  r.append((bn/bt)/(an/at))
          finally:a.terminate();b.terminate();a.wait();b.wait()
          out={'median_nps_ratio':statistics.median(r),'ratios':r};Path('results/throughput.json').write_text(json.dumps(out,indent=2)+'\n');print('FINAL',json.dumps(out))
          PY
      - name: 48-game equal-node guard
        run: python -u tools/v14_fixed_node_arena.py /tmp/candidate /tmp/control --nodes 20000 --pairs 24 --opening-file /tmp/node.epd --max-plies 220 --json-out results/equal-node.json | tee results/equal-node.log
      - name: 48-game clock gate
        run: python -u scripts/v15_competition_gate.py --control /tmp/control --candidate /tmp/candidate --openings /tmp/clock.epd --output results/timed.json --label 'V16 history score reuse' --base-ms 2500 --inc-ms 50 --max-plies 180 --grace-ms 1500 | tee results/timed.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'v16-python-history-score-reuse-${{ github.sha }}', path: results/, retention-days: 30}
