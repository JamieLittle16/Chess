name: Python V15 safe fallback package

on:
  push:
    branches:
      - release/python-v15-safe-fallback-20260909
    paths:
      - .github/workflows/python-v15-safe-package.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Download exact packaged V14
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - name: Download replicated b050 search-leaf H64
        uses: actions/download-artifact@v4
        with:
          name: v15-python-searchleaf-h64-b050-94ef8e11b956050aaa057863010ce555d76733af
          path: model-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34290665543
      - name: Materialize safe V15
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name Little-Gambit-V14.zip -print -quit); test -n "$ZIP"
          MODEL=$(find model-artifact -type f -path '*/model/v14_student_h64.npz' -print -quit)
          if [ -z "$MODEL" ]; then MODEL=$(find model-artifact -type f -name v14_student_h64.npz -print -quit); fi
          test -n "$MODEL"
          rm -rf build results; mkdir -p build results
          unzip -q "$ZIP" -d build
          cp "$MODEL" build/experiments/v14_student_h64.npz
          python scripts/patch_v15_python_presort_once.py build/experiments/numba_search.py
          python scripts/patch_v15_python_fused_h64_direct.py build/experiments/v14_student_single_runtime.py
          python scripts/patch_v15_python_inline_fused_h64.py build/experiments/v14_student_single_runtime.py
          python scripts/patch_v15_python_fused_h64_zero_guard.py build/experiments/v14_student_single_runtime.py
          python scripts/patch_v15_python_lazy_h64_chain.py build/experiments/numba_search.py
          python scripts/patch_v15_python_scoremeta_hotloop.py build/experiments/numba_search.py
          python -m py_compile build/agent.py build/experiments/*.py
      - name: Agent protocol and legality smoke
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess,sys,chess
          p=subprocess.Popen([sys.executable,'tools/v14_agent_runner.py','build'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,bufsize=1)
          ready=json.loads(p.stdout.readline()); assert ready.get('ready') is True,ready
          for fen,ms in [(chess.STARTING_FEN,120000),('r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 0 1',120000)]:
              p.stdin.write(json.dumps({'fen':fen,'time_left_ms':ms})+'\n');p.stdin.flush()
              out=json.loads(p.stdout.readline());m=chess.Move.from_uci(out['move']);assert m in chess.Board(fen).legal_moves,(fen,out)
              print(fen,out)
          p.kill();p.wait()
          PY
      - name: Package exact submission layout
        shell: bash
        run: |
          set -euo pipefail
          (cd build && zip -qr ../Little-Gambit-V15-SAFE.zip .)
          sha256sum Little-Gambit-V15-SAFE.zip | tee results/sha256.txt
          unzip -l Little-Gambit-V15-SAFE.zip | tee results/listing.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Little-Gambit-V15-SAFE-${{ github.sha }}
          path: |
            Little-Gambit-V15-SAFE.zip
            results/
          retention-days: 30
