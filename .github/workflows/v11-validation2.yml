name: V11 independent validation

on:
  push:
    branches:
      - analysis/v11-validation2-20260907
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: val-a
            start: 30
            count: 5
          - name: val-b
            start: 35
            count: 5
          - name: val-c
            start: 40
            count: 5
          - name: val-d
            start: 45
            count: 5

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install chess==1.11.2 numpy==2.5.2 numba==0.67.0
          sudo apt-get update -qq
          sudo apt-get install -y stockfish
      - name: Reconstruct exact V11
        run: |
          cat .analysis/v11_chunks_*.b64 | base64 -d > /tmp/v11.zip
          echo 'fd06e9f5718b9af3be3b13f8d6b67f92018b43ce2f2cb991063d2a281310d0b8  /tmp/v11.zip' | sha256sum -c -
          rm -rf /tmp/v11 && mkdir -p /tmp/v11
          unzip -q /tmp/v11.zip -d /tmp/v11
      - name: Build pinned Rust
        run: cargo build --release -p chess-uci
      - name: Run independent games and Stockfish diagnostics
        shell: bash
        run: |
          set -euo pipefail
          STOCKFISH="$(command -v stockfish || true)"
          if [ -z "$STOCKFISH" ]; then STOCKFISH=/usr/games/stockfish; fi
          OUT="analysis-results/${{ matrix.name }}"
          mkdir -p "$OUT"
          python tools/v9_rust_diagnostic.py \
            --agent /tmp/v11 \
            --runner tools/v9_agent_runner.py \
            --engine target/release/chess-uci \
            --stockfish "$STOCKFISH" \
            --openings match/openings/m3-uho-lichess-100-v1.epd \
            --opening-start ${{ matrix.start }} \
            --opening-count ${{ matrix.count }} \
            --base-ms 2500 \
            --increment-ms 50 \
            --analysis-nodes 10000 \
            --out-dir "$OUT" | tee "$OUT/run.log"
          {
            echo "rust_sha=44c1e16d3713cdca1ff1bd71f7596ef3b5804037"
            echo "candidate=Little-Gambit-V11-FINAL.zip"
            echo "v11_zip_sha256=fd06e9f5718b9af3be3b13f8d6b67f92018b43ce2f2cb991063d2a281310d0b8"
            echo "opening_start=${{ matrix.start }}"
            echo "opening_count=${{ matrix.count }}"
            echo "base_ms=2500"
            echo "increment_ms=50"
            echo "analysis_nodes=10000"
          } > "$OUT/provenance.txt"
      - name: Upload validation shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v11-validation-${{ matrix.name }}
          path: analysis-results/${{ matrix.name }}
          if-no-files-found: error
          retention-days: 7
