name: V16 Python vs Rust V15 calibration

on:
  workflow_dispatch:
  push:
    branches: [v16/python-rust-calibration]
    paths:
      - '.github/workflows/v16-python-rust-calibration.yml'
      - 'tools/python_agent_uci.py'

permissions:
  actions: read
  contents: read

env:
  GESTALT_URL: https://github.com/cosmobobak/viridithas-networks/releases/download/v85/gestalt-b840.nnue
  GESTALT_SHA256: 956a6afcce5de1cdbc953ae3817ff760f3e6036441f34dcd524d6e2e7d0e71f6
  FASTCHESS_COMMIT: f618e34540f94f4719ad3817950618dabe441318

jobs:
  calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact Python competition runtime
        run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Download exact packaged V14
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - name: Materialize clean Python candidate
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name Little-Gambit-V14.zip -print -quit)
          test -n "$ZIP"
          rm -rf /tmp/python .qualification
          mkdir -p /tmp/python .qualification/bin .qualification/net .qualification/launchers .qualification/match
          unzip -q "$ZIP" -d /tmp/python
          python scripts/patch_v16_python_presort_once.py /tmp/python/experiments/numba_search.py
          python scripts/patch_v16_python_trusted_continuity.py /tmp/python/agent.py
          python -m py_compile tools/python_agent_uci.py /tmp/python/agent.py /tmp/python/experiments/*.py
      - name: Build production Rust V15
        shell: bash
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3
        run: |
          set -euo pipefail
          cargo build --release -p chess-uci
          cp target/release/chess-uci .qualification/bin/rust-v15
          chmod +x .qualification/bin/rust-v15
          sha256sum .qualification/bin/rust-v15 | tee .qualification/match/rust-binary.sha256
      - name: Download exact Gestalt v85
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 "$GESTALT_URL" -o .qualification/net/gestalt-b840.nnue
          test "$(stat -c%s .qualification/net/gestalt-b840.nnue)" = '21242944'
          echo "$GESTALT_SHA256  .qualification/net/gestalt-b840.nnue" | sha256sum --check --strict
      - name: Build fresh 32-root calibration book
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip \
            https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          rm -rf /tmp/m6; mkdir /tmp/m6
          python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]
          chosen=fresh[3600:3632]
          assert len(chosen)==32 and len(set(chosen))==32
          Path('.qualification/match/python-rust-32.epd').write_text('\n'.join(chosen)+'\n')
          PY
      - name: Build pinned Fastchess
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/Disservin/fastchess.git .qualification/fastchess-src
          git -C .qualification/fastchess-src checkout --quiet "$FASTCHESS_COMMIT"
          test "$(git -C .qualification/fastchess-src rev-parse HEAD)" = "$FASTCHESS_COMMIT"
          make -C .qualification/fastchess-src -j2
      - name: Create launchers and UCI smoke
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD"
          cat > .qualification/launchers/python.sh <<EOF
          #!/usr/bin/env bash
          exec python '$ROOT/tools/python_agent_uci.py' /tmp/python
          EOF
          cat > .qualification/launchers/rust.sh <<EOF
          #!/usr/bin/env bash
          export CHESS_GESTALT_NETWORK='$ROOT/.qualification/net/gestalt-b840.nnue'
          exec '$ROOT/.qualification/bin/rust-v15'
          EOF
          chmod +x .qualification/launchers/python.sh .qualification/launchers/rust.sh
          { printf 'uci\nisready\nucinewgame\nposition startpos\ngo movetime 100\nquit\n'; } | .qualification/launchers/python.sh | tee .qualification/match/python-smoke.txt
          { printf 'uci\nisready\nposition startpos\ngo movetime 100\nquit\n'; } | .qualification/launchers/rust.sh | tee .qualification/match/rust-smoke.txt
          grep -q '^uciok$' .qualification/match/python-smoke.txt
          grep -q '^bestmove ' .qualification/match/python-smoke.txt
          grep -q '^uciok$' .qualification/match/rust-smoke.txt
          grep -q '^bestmove ' .qualification/match/rust-smoke.txt
      - name: 64-game paired wall-clock calibration
        shell: bash
        run: |
          set -euo pipefail
          .qualification/fastchess-src/fastchess \
            -engine cmd="$PWD/.qualification/launchers/python.sh" name=python-v16 tc=2.5+0.05 \
            -engine cmd="$PWD/.qualification/launchers/rust.sh" name=rust-v15 tc=2.5+0.05 option.Hash=32 \
            -openings file="$PWD/.qualification/match/python-rust-32.epd" format=epd order=sequential \
            -rounds 32 -repeat -concurrency 1 -maxmoves 300 -ratinginterval 16 \
            -pgnout file=.qualification/match/games.pgn notation=uci append=false nodes=true nps=true \
            -log file=.qualification/match/uci.log level=info engine=true append=false \
            | tee .qualification/match/fastchess.stdout.log
      - uses: actions/upload-artifact@v4
        with:
          name: v16-python-rust-calibration-${{ github.sha }}
          path: .qualification/match/
          retention-days: 30
