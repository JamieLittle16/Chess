name: V18 Gestalt V13 damp400
on:
  push:
    branches: [analysis/v18-v13-gestalt-damp400-20260910]
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'numba==0.67.0' 'numpy==2.5.2' 'chess==1.11.2'
      - name: Build exact baseline and damp400
        run: |
          set -euo pipefail
          cat ci/v18_postbook_payload/chunk_*.b64 | base64 -d > /tmp/p150.zip
          for d in /tmp/base /tmp/cand; do
            rm -rf "$d"; mkdir "$d"; unzip -q /tmp/p150.zip -d "$d"
            sed -i 's/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.50/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.33/' "$d/agent.py"
            curl --fail --location --retry 5 -sS 'https://raw.githubusercontent.com/michaeldv/donna_opening_books/master/gm2001.bin' -o "$d/v18_gm2001.bin"
          done
          python - <<'PY'
          import json,numpy as np,hashlib
          p='/tmp/cand/experiments/v13_residual.i16'; w=np.fromfile(p,dtype=np.int16).astype(np.int32)
          delta=json.load(open('ci/v13-gestalt-delta400.json'))
          for i,d in delta: w[i]+=d
          w.astype(np.int16).tofile(p)
          print('CHANGED',len(delta),'SHA',hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
      - name: Fixed-node and SF19 gate
        run: |
          python - <<'PY'
          from pathlib import Path
          src=[x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')][:50]
          crit=['r2q1rk1/1b1n1pbp/pp1ppnp1/8/PPPNPP2/2NBB2P/2Q3P1/R3K2R w KQ - 1 14','r1bqk1nr/3n1pbp/3pp1p1/1B1p4/4P3/2N1B3/PP1QNPPP/R3K2R b KQkq - 0 11','rnb1kb1r/2q2ppp/p1pp1n2/1p2p3/2PPP3/2NBB3/PP2NPPP/R2QK2R w KQkq - 0 8','rnb1k2r/2q1bppp/p1pp1n2/1p2p3/2PPP3/1QNBB3/PP2NPPP/R3K2R w KQkq - 2 9','r5k1/2q1bppp/p1p5/3p1P2/P1P3n1/QB1n4/1P1BNPPP/R4K1R w - - 0 20']
          Path('/tmp/uho.txt').write_text('\n'.join(src)+'\n');Path('/tmp/crit.txt').write_text('\n'.join(crit)+'\n')
          PY
          cat >/tmp/run.py <<'PY'
          import sys,json,time,chess,numpy as np
          sys.path.insert(0,sys.argv[1]);import agent
          from experiments.numba_core import encode_position,move_to_uci
          from experiments.numba_search import iterative_search_stateful
          H=np.empty(0,dtype=np.uint64);rows=[]
          for i,fen in enumerate(open(sys.argv[2])):
            b=chess.Board(fen.strip());e=encode_position(b);agent._TT_TABLE.fill(0);agent._QUIET_HISTORY.fill(0);agent._HASH_KEYS.fill(0);agent._HASH_MOVES.fill(-1)
            t=time.perf_counter();m,s,d,n=iterative_search_stateful(e.board.copy(),e.side,e.castling,e.ep_square,b.halfmove_clock,H,0,500000)
            rows.append({'i':i,'fen':b.fen(),'move':move_to_uci(m),'score':int(s),'depth':int(d),'nodes':int(n),'sec':time.perf_counter()-t})
          open(sys.argv[3],'w').write('\n'.join(json.dumps(x) for x in rows)+'\n')
          PY
          python /tmp/run.py /tmp/base /tmp/uho.txt /tmp/base.jsonl
          python /tmp/run.py /tmp/cand /tmp/uho.txt /tmp/cand.jsonl
          echo CRITICAL_BASE; python /tmp/run.py /tmp/base /tmp/crit.txt /tmp/cbase.jsonl; cat /tmp/cbase.jsonl
          echo CRITICAL_CAND; python /tmp/run.py /tmp/cand /tmp/crit.txt /tmp/ccand.jsonl; cat /tmp/ccand.jsonl
          curl --fail --location --retry 5 -sS 'https://github.com/official-stockfish/Stockfish/releases/latest/download/stockfish-linux-x86-64-universal.tar.gz' -o /tmp/sf.tar.gz
          mkdir /tmp/sf; tar -xzf /tmp/sf.tar.gz -C /tmp/sf; SF="$(find /tmp/sf -type f -name 'stockfish*' -perm /111 | head -n1)"; cp "$SF" /tmp/sf19; chmod +x /tmp/sf19
          python - <<'PY'
          import json,chess,chess.engine
          A=[json.loads(x) for x in open('/tmp/base.jsonl')];B=[json.loads(x) for x in open('/tmp/cand.jsonl')]
          D=[(a,b) for a,b in zip(A,B) if a['move']!=b['move']];print('ROOT_DIFFS',len(D))
          sf=chess.engine.SimpleEngine.popen_uci('/tmp/sf19');sf.configure({'Threads':1,'Hash':64});imp=bad=tie=net=0
          def cp(s,p):
            v=s.pov(p).score(mate_score=100000);return int(v if v is not None else 0)
          for a,b in D:
            bd=chess.Board(a['fen']);pov=bd.turn
            if 'Clear Hash' in sf.options:sf.configure({'Clear Hash':None})
            best=sf.analyse(bd,chess.engine.Limit(nodes=100000));bc=cp(best['score'],pov);loss=[]
            for r in (a,b):
              if 'Clear Hash' in sf.options:sf.configure({'Clear Hash':None})
              q=sf.analyse(bd,chess.engine.Limit(nodes=100000),root_moves=[chess.Move.from_uci(r['move'])]);loss.append(max(0,bc-cp(q['score'],pov)))
            d=loss[0]-loss[1];net+=d;imp+=d>5;bad+=d<-5;tie+=abs(d)<=5
            print('DIFF',a['i'],a['move'],b['move'],'best',best['pv'][0].uci(),'loss',loss,'delta',d)
          sf.quit();print('SUMMARY improved',imp,'worse',bad,'tie',tie,'NET_CP',net)
          print('TIME',sum(x['sec'] for x in A),sum(x['sec'] for x in B),'NODES',sum(x['nodes'] for x in A),sum(x['nodes'] for x in B))
          PY
