name: V14 final assembly candidate

on:
  push:
    branches: [analysis/v14-final-assembly-20260908]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact competition runtime
        run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0

      - name: Download exact H64 model and hard regression suite
        uses: actions/download-artifact@v4
        with:
          pattern: v14-single-student-h64-bb7d2a4ed05ff78d344cc4374d54e35189584993
          path: model-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34202820525
      - uses: actions/download-artifact@v4
        with:
          name: v14-hard-regression-mine-7340f0cfdbc244bf7d13d7e65ca39480f1b4c1cd
          path: hard-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34203292382

      - name: Build exact KPK table from pinned qualified generator
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/build_kpk.py https://raw.githubusercontent.com/JamieLittle16/Chess/22cfec2269f87ddf14a9f929f1eda2d6e4ec21d8/scripts/build_v14_kpk_bitbase.py
          curl --fail --location --retry 3 -o /tmp/patch_kpk.py https://raw.githubusercontent.com/JamieLittle16/Chess/22cfec2269f87ddf14a9f929f1eda2d6e4ec21d8/scripts/patch_v14_kpk_exact.py
          python /tmp/build_kpk.py /tmp/v14_kpk.u8 | tee /tmp/kpk-build.log
          test "$(stat -c %s /tmp/v14_kpk.u8)" = 196608
          echo 'c2cc0534a984124c5a75e250bab65f2756ade47341bbca84d6b6871fdb2977f2  /tmp/v14_kpk.u8' | sha256sum --check --strict

      - name: Materialize exact V13 control and V14 candidate
        shell: bash
        run: |
          set -euo pipefail
          MODEL=$(find model-artifact -type f -name 'student-h64.npz' -print -quit)
          test -n "$MODEL"
          echo '3422cecc3b1226767412e08746ffd6eef9f7e38602ac15b9256b475e6762b598  '"$MODEL" | sha256sum --check --strict
          cat .analysis/v13_chunks_*.b64 | base64 -d > /tmp/v13.zip
          echo '658fd954180c2d0d39c02ba6601af36d06cdbd573bfb72c6879169861a7ad092  /tmp/v13.zip' | sha256sum --check --strict
          rm -rf /tmp/base /tmp/cand /tmp/prelazy
          for DIR in /tmp/base /tmp/cand /tmp/prelazy; do
            mkdir -p "$DIR"; unzip -q /tmp/v13.zip -d "$DIR"
            patch "$DIR/experiments/numba_search.py" < .analysis/v13_jit_refactor.patch
            DIR="$DIR" python - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['DIR'])/'experiments/numba_search.py';s=p.read_text()
          old='    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          new='    correction = correction // 6\n    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          assert s.count(old)==1,s.count(old);p.write_text(s.replace(old,new,1))
          PY
            python scripts/patch_v13_legality_context.py "$DIR/experiments/numba_core.py"
            python scripts/patch_v13_qsearch_tactical.py "$DIR/experiments/numba_core.py" "$DIR/experiments/numba_search.py"
          done
          echo 'df346b21be42832a0ae97e7faa15953ab460f0387fb0358961651466557ebde8  /tmp/base/agent.py' | sha256sum --check --strict
          echo '0306e8145a453d91b9b5ac92e9980931510d9e18f8ba598a7548d08b85165c35  /tmp/base/experiments/numba_core.py' | sha256sum --check --strict
          echo '401f6580028a72361286bd99bee1f0022c74e6c8a65da8acd47448835a1ff360  /tmp/base/experiments/numba_search.py' | sha256sum --check --strict
          for DIR in /tmp/cand /tmp/prelazy; do
            cp experiments/v14_student_single_runtime.py "$DIR/experiments/v14_student_single_runtime.py"
            cp "$MODEL" "$DIR/experiments/v14_student_h64.npz"
            python scripts/patch_v14_single_student_search.py "$DIR/experiments/numba_search.py" --numerator 1 --denominator 12
            python scripts/patch_v14_student_lean_qsearch.py "$DIR/experiments/numba_search.py"
          done
          python scripts/patch_v14_lazy_stable_ordering.py /tmp/cand/experiments/numba_search.py
          cp /tmp/v14_kpk.u8 /tmp/cand/v14_kpk.u8
          python /tmp/patch_kpk.py /tmp/cand/agent.py
          python -m py_compile tools/v14_agent_runner.py tools/v14_timed_agent_arena.py /tmp/base/agent.py /tmp/base/experiments/*.py /tmp/prelazy/agent.py /tmp/prelazy/experiments/*.py /tmp/cand/agent.py /tmp/cand/experiments/*.py
          mkdir -p final-results

      - name: Lazy ordering remains semantics preserving on neural control
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/sig_worker.py <<'PY'
          import json,sys,chess,numpy as np
          from experiments.numba_core import encode_position
          from experiments.numba_search import iterative_search_stateful
          for line in sys.stdin:
              q=json.loads(line);b=chess.Board(q['fen']);e=encode_position(b);h=np.empty(0,dtype=np.uint64)
              o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,int(q['nodes']))
              print(json.dumps([int(o[0]),int(o[1]),int(o[2]),int(o[3])]),flush=True)
          PY
          python - <<'PY'
          import json,os,subprocess,sys
          roots=[x.strip() for x in open('match/openings/m3-uho-lichess-100-v1.epd') if x.strip() and not x.startswith('#')][:40]
          def st(path):
              e=os.environ.copy();e['PYTHONPATH']=path;return subprocess.Popen([sys.executable,'/tmp/sig_worker.py'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env=e)
          def ask(p,fen,n):p.stdin.write(json.dumps({'fen':fen,'nodes':n})+'\n');p.stdin.flush();return json.loads(p.stdout.readline())
          a=st('/tmp/prelazy');b=st('/tmp/cand');checked=0
          try:
              for fen in roots:
                  for n in (4000,16000,40000):
                      x=ask(a,fen,n);y=ask(b,fen,n);assert x==y,(fen,n,x,y);checked+=1
          finally:a.terminate();b.terminate();a.wait();b.wait()
          print('identical_neural_searches',checked)
          PY

      - name: KPK exhaustive artifact and directed override smoke
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/kpk-build.log final-results/kpk-build.log
          PYTHONPATH=/tmp/cand python - <<'PY'
          import chess,agent,random
          fen='4k3/8/8/5K2/8/6P1/8/8 w - - 0 54';b=chess.Board(fen);legal=list(b.legal_moves)
          old=chess.Move.from_uci('g3g4');selected=agent._kpk_exact_override(b,old,legal)
          oldv=agent._kpk_child_value(b,old);newv=agent._kpk_child_value(b,selected)
          print('historical_kpk',old,oldv,'->',selected,newv);assert newv is not None and oldv is not None
          assert (newv[0] and not oldv[0]) or (newv[0]==oldv[0] and newv[0] and newv[1]<oldv[1])
          rng=random.Random(14014);checked=0
          while checked<500:
              ps=rng.choice([True,False]);p=chess.square(rng.randrange(8),rng.randrange(1,7));wk=rng.randrange(64);bk=rng.randrange(64)
              if len({p,wk,bk})<3:continue
              q=chess.Board(None);q.set_piece_at(wk,chess.Piece(chess.KING,True));q.set_piece_at(bk,chess.Piece(chess.KING,False));q.set_piece_at(p,chess.Piece(chess.PAWN,ps));q.turn=rng.choice([True,False])
              if not q.is_valid() or agent._kpk_probe(q) is None or not list(q.legal_moves):continue
              legal=list(q.legal_moves);old=rng.choice(legal);new=agent._kpk_exact_override(q,old,legal);assert new in legal;checked+=1
          print('kpk_random_legal',checked)
          PY

      - name: Rated-game and mined-hard regression gates
        shell: bash
        run: |
          set -euo pipefail
          python tools/v14_regression_probe.py --engine /tmp/cand --control /tmp/base --manifest match/regressions/v14-rated-game-1.json --budgets 30000,100000,300000,1000000 --json-out final-results/rated-game-1.json | tee final-results/rated-game-1.log
          HARD=$(find hard-artifact -type f -name 'v14-hard-search-16.json' -print -quit);test -n "$HARD"
          python tools/v14_regression_probe.py --engine /tmp/cand --control /tmp/base --manifest "$HARD" --budgets 12000,30000 --json-out final-results/hard-16.json | tee final-results/hard-16.log

      - name: Fixed-node throughput
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/nps.py <<'PY'
          import json,sys,chess,numpy as np
          from experiments.numba_core import encode_position
          from experiments.numba_search import iterative_search_stateful
          for line in sys.stdin:
              q=json.loads(line);b=chess.Board(q['fen']);e=encode_position(b);h=np.empty(0,dtype=np.uint64);o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,int(q['nodes']));print(json.dumps({'nodes':int(o[3])}),flush=True)
          PY
          python - <<'PY'
          import json,os,statistics,subprocess,sys,time
          from pathlib import Path
          roots=[x.strip() for x in open('match/openings/m3-uho-lichess-100-v1.epd') if x.strip() and not x.startswith('#')][:40]
          def st(path):e=os.environ.copy();e['PYTHONPATH']=path;return subprocess.Popen([sys.executable,'/tmp/nps.py'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env=e)
          def run(p,order):
              n=0;t=time.perf_counter()
              for f in order:p.stdin.write(json.dumps({'fen':f,'nodes':30000})+'\n');p.stdin.flush();n+=json.loads(p.stdout.readline())['nodes']
              return time.perf_counter()-t,n
          a=st('/tmp/base');b=st('/tmp/cand');rs=[];rows=[]
          try:
              for p in (a,b):p.stdin.write(json.dumps({'fen':roots[0],'nodes':300})+'\n');p.stdin.flush();json.loads(p.stdout.readline())
              for rep in range(3):
                  order=roots if rep%2==0 else list(reversed(roots))
                  if rep%2==0:at,an=run(a,order);bt,bn=run(b,order)
                  else:bt,bn=run(b,order);at,an=run(a,order)
                  r=(bn/bt)/(an/at);rs.append(r);rows.append({'rep':rep,'ratio':r,'base_nps':an/at,'v14_nps':bn/bt});print(rows[-1])
          finally:a.terminate();b.terminate();a.wait();b.wait()
          out={'median_v14_vs_v13_nps':statistics.median(rs),'records':rows};Path('final-results/throughput.json').write_text(json.dumps(out,indent=2)+'\n');print(out)
          PY

      - name: Build two disjoint official Stockfish UHO test books
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/master/UHO_Lichess_4852_v1.epd.zip
          rm -rf /tmp/uho && mkdir /tmp/uho && unzip -q /tmp/uho.zip -d /tmp/uho
          UHO=$(find /tmp/uho -type f -name '*.epd' -print -quit);test -n "$UHO"
          UHO="$UHO" python - <<'PY'
          import os,chess
          from pathlib import Path
          rows=Path(os.environ['UHO']).read_text(errors='ignore').splitlines()
          def build(lo,hi,n,path):
              out=[]
              for raw in rows[lo:hi]:
                  f=raw.strip().split()
                  if len(f)<4:continue
                  fen=' '.join(f[:4])+' 0 1'
                  try:b=chess.Board(fen)
                  except ValueError:continue
                  if b.is_game_over(claim_draw=False):continue
                  out.append(fen)
                  if len(out)==n:break
              assert len(out)==n,(path,len(out));Path(path).write_text('\n'.join(out)+'\n')
          build(3000,3700,48,'/tmp/equal.epd')
          build(3900,4500,32,'/tmp/timed.epd')
          PY

      - name: Fresh 96-game equal-node V14 versus V13
        shell: bash
        run: |
          set -euo pipefail
          python -u tools/v14_fixed_node_arena.py /tmp/cand /tmp/base --nodes 16000 --pairs 48 --opening-offset 0 --max-plies 220 --opening-file /tmp/equal.epd --json-out final-results/equal-node-96.json | tee final-results/equal-node-96.log
          grep '^FINAL ' final-results/equal-node-96.log

      - name: Production-timed 64-game V14 versus V13
        shell: bash
        run: |
          set -euo pipefail
          python -u tools/v14_timed_agent_arena.py /tmp/cand /tmp/base --opening-file /tmp/timed.epd --pairs 32 --base-ms 2500 --increment-ms 50 --max-plies 180 --json-out final-results/timed-64.json | tee final-results/timed-64.log
          grep '^FINAL ' final-results/timed-64.log

      - name: Package V14 candidate and smoke exact archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/package && mkdir -p /tmp/package/experiments
          cp /tmp/cand/agent.py /tmp/package/agent.py
          cp /tmp/cand/v14_kpk.u8 /tmp/package/v14_kpk.u8
          cp /tmp/cand/experiments/__init__.py /tmp/package/experiments/__init__.py
          cp /tmp/cand/experiments/numba_core.py /tmp/package/experiments/numba_core.py
          cp /tmp/cand/experiments/numba_search.py /tmp/package/experiments/numba_search.py
          cp /tmp/cand/experiments/v13_residual.i16 /tmp/package/experiments/v13_residual.i16
          cp /tmp/cand/experiments/v14_student_single_runtime.py /tmp/package/experiments/v14_student_single_runtime.py
          cp /tmp/cand/experiments/v14_student_h64.npz /tmp/package/experiments/v14_student_h64.npz
          (cd /tmp/package && zip -q -9 -r "$GITHUB_WORKSPACE/final-results/Little-Gambit-V14-CANDIDATE.zip" .)
          sha256sum final-results/Little-Gambit-V14-CANDIDATE.zip | tee final-results/package.sha256
          unzip -l final-results/Little-Gambit-V14-CANDIDATE.zip | tee final-results/package-contents.txt
          rm -rf /tmp/smoke && mkdir /tmp/smoke && unzip -q final-results/Little-Gambit-V14-CANDIDATE.zip -d /tmp/smoke
          PYTHONPATH=/tmp/smoke python - <<'PY'
          import agent,chess
          fen=chess.STARTING_FEN;m=chess.Move.from_uci(agent.get_move(fen,80000));assert m in chess.Board(fen).legal_moves;print('packaged_move',m)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Little-Gambit-V14-assembly-${{ github.sha }}
          path: final-results/
          retention-days: 30
