name: V15 ranked Rust teacher policy

on:
  push:
    branches: [analysis/v15-rust-teacher-policy-20260908]
    paths:
      - crates/chess-search/examples/rust_v15_policy_teacher.rs
      - scripts/train_v15_rust_policy_soft.py
      - .github/workflows/v15-rust-teacher-policy.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  labels:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build exact Rust V15 teacher
        run: cargo build --release -p chess-search --example rust_v15_policy_teacher
      - name: Download exact Gestalt production network
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/teacher
          curl --fail --location --retry 5 \
            'https://github.com/cosmobobak/viridithas-networks/releases/download/v85/gestalt-b840.nnue' \
            --output /tmp/teacher/gestalt-b840.nnue
          test "$(stat -c%s /tmp/teacher/gestalt-b840.nnue)" = '21242944'
          echo '956a6afcce5de1cdbc953ae3817ff760f3e6036441f34dcd524d6e2e7d0e71f6  /tmp/teacher/gestalt-b840.nnue' | sha256sum --check --strict
      - name: Build disjoint 750-position teacher shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          rm -rf /tmp/m6; mkdir /tmp/m6
          python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          import os
          from pathlib import Path
          shard=int(os.environ['SHARD'])
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]
          start=1500+750*shard
          chosen=fresh[start:start+750]
          assert len(chosen)==750 and len(set(chosen))==750, (shard,start,len(chosen))
          Path('/tmp/teacher/roots.epd').write_text('\n'.join(chosen)+'\n')
          print('shard',shard,'start',start,'end',start+len(chosen))
          PY
      - name: Label top six full-window Rust V15 root candidates
        shell: bash
        env:
          CHESS_GESTALT_NETWORK: /tmp/teacher/gestalt-b840.nnue
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          /usr/bin/time -v target/release/examples/rust_v15_policy_teacher 4 6 32 \
            </tmp/teacher/roots.epd >/tmp/teacher/raw.tsv 2>/tmp/teacher/time.log
          test "$(wc -l </tmp/teacher/raw.tsv)" -ge 700
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          shard=int(os.environ['SHARD'])
          out=[]
          for line in Path('/tmp/teacher/raw.tsv').read_text().splitlines():
              fen,payload=line.split('\t',1)
              candidates=[]
              for item in payload.split(','):
                  move,score=item.rsplit(':',1)
                  candidates.append({'move':move,'score':int(score)})
              bucket=int.from_bytes(hashlib.sha256(fen.encode()).digest()[:8],'big')%10
              split='holdout' if bucket==0 else ('validation' if bucket==1 else 'train')
              out.append(json.dumps({'split':split,'fen':fen,'candidates':candidates},separators=(',',':')))
          path=Path(f'/tmp/teacher/labels-{shard}.jsonl')
          path.write_text('\n'.join(out)+'\n')
          counts={s:sum(json.loads(x)['split']==s for x in out) for s in ('train','validation','holdout')}
          print({'records':len(out),'split_counts':counts,'first':json.loads(out[0])})
          PY
          cat /tmp/teacher/time.log
      - uses: actions/upload-artifact@v4
        with:
          name: rust-v15-policy-labels-${{ matrix.shard }}-${{ github.sha }}
          path: |
            /tmp/teacher/labels-${{ matrix.shard }}.jsonl
            /tmp/teacher/time.log
          retention-days: 30

  train:
    needs: labels
    strategy:
      fail-fast: false
      matrix:
        hidden: [64, 96]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install training runtime
        run: |
          python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          pattern: rust-v15-policy-labels-*-${{ github.sha }}
          path: label-artifacts
          merge-multiple: true
      - name: Merge labels and train soft policy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          cat label-artifacts/labels-*.jsonl > results/rust-v15-policy-teacher.jsonl
          echo "records=$(wc -l < results/rust-v15-policy-teacher.jsonl)"
          python -u scripts/train_v15_rust_policy_soft.py \
            --teacher results/rust-v15-policy-teacher.jsonl \
            --output results/root-policy-h${{ matrix.hidden }}.pt \
            --hidden ${{ matrix.hidden }} --epochs 8 --temperature 60 --max-gap 600 \
            | tee results/train-h${{ matrix.hidden }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-v15-policy-h${{ matrix.hidden }}-${{ github.sha }}
          path: results/
          retention-days: 30
