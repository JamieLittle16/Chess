name: V15 Python final endpoint direct generation confirmation

on:
  push:
    branches:
      - analysis/v15-python-final-endpoint-confirm2-20260909
    paths:
      - .github/workflows/v15-python-final-endpoint-confirm.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0

      - name: Download exact packaged V14
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775

      - name: Download replicated b050 model artifact
        uses: actions/download-artifact@v4
        with:
          name: v15-python-searchleaf-h64-b050-94ef8e11b956050aaa057863010ce555d76733af
          path: b050-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34290665543

      - name: Materialize exact V14 control and assembled V15 candidate
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name Little-Gambit-V14.zip -print -quit); test -n "$ZIP"
          MODEL=$(find b050-artifact -type f -path '*/model/v14_student_h64.npz' -print -quit); test -n "$MODEL"
          rm -rf /tmp/base /tmp/cand results; mkdir -p /tmp/base /tmp/cand results
          unzip -q "$ZIP" -d /tmp/base; cp -a /tmp/base/. /tmp/cand/

          python scripts/patch_v15_python_presort_once.py /tmp/cand/experiments/numba_search.py
          python scripts/patch_v15_python_fused_h64_direct.py /tmp/cand/experiments/v14_student_single_runtime.py
          python scripts/patch_v15_python_inline_fused_h64.py /tmp/cand/experiments/v14_student_single_runtime.py
          python scripts/patch_v15_python_fused_h64_zero_guard.py /tmp/cand/experiments/v14_student_single_runtime.py
          python scripts/patch_v15_python_lazy_h64_chain.py /tmp/cand/experiments/numba_search.py
          python scripts/patch_v15_python_scoremeta_hotloop.py /tmp/cand/experiments/numba_search.py
          cp "$MODEL" /tmp/cand/experiments/v14_student_h64.npz
          python scripts/patch_v15_python_lean_lmr_history.py /tmp/cand/experiments/numba_search.py --threshold 2048

          python -m py_compile tools/v14_agent_runner.py /tmp/base/agent.py /tmp/cand/agent.py /tmp/base/experiments/*.py /tmp/cand/experiments/*.py
          sha256sum /tmp/base/experiments/v14_student_h64.npz /tmp/cand/experiments/v14_student_h64.npz | tee results/model-sha256.txt
          grep -n 'LEAN_LMR_HISTORY_THRESHOLD = 2048' /tmp/cand/experiments/numba_search.py | tee results/lmr-marker.txt

      - name: Competition API smoke and canonical regression snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/probe.py <<'PY'
          import chess,numpy as np
          from experiments.numba_core import encode_position,move_to_uci
          from experiments.numba_search import iterative_search_stateful
          for fen,n in [
              (chess.STARTING_FEN,20000),
              ('2r3k1/4qp2/4b3/p5p1/4P1P1/2Pr2P1/P4PB1/R1Q2RK1 w - - 1 23',300000),
          ]:
              b=chess.Board(fen); e=encode_position(b); h=np.empty(0,dtype=np.uint64)
              o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,n)
              m=chess.Move.from_uci(move_to_uci(int(o[0]))); assert m in b.legal_moves
              print(fen,m,tuple(int(x) for x in o))
          PY
          echo CONTROL | tee results/smoke.txt
          PYTHONPATH=/tmp/base python /tmp/probe.py | tee -a results/smoke.txt
          echo V15 | tee -a results/smoke.txt
          PYTHONPATH=/tmp/cand python /tmp/probe.py | tee -a results/smoke.txt

      - name: Build fresh 96-root generation suite
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          rm -rf /tmp/m6; mkdir -p /tmp/m6
          python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]
          roots=fresh[4200:4296]
          assert len(roots)==96 and len(set(roots))==96
          Path('/tmp/final-192.epd').write_text('\n'.join(roots)+'\n')
          PY

      - name: 192-game direct V15 versus exact V14 competition-clock match
        run: python -u scripts/v15_competition_gate.py --candidate /tmp/cand --control /tmp/base --openings /tmp/final-192.epd --output results/final-192.json --label v15-final-endpoint --base-ms 2500 --inc-ms 50 --max-plies 180 | tee results/final-192.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-python-final-endpoint-${{ github.sha }}
          path: results/
          retention-days: 30
