name: V14 generation-2 student v2

on:
  push:
    branches: [analysis/v14-student-gen2-20260908]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  smoke-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Reconstruct exact V13 BEST
        shell: bash
        run: |
          set -euo pipefail
          cat .analysis/v13_chunks_*.b64 | base64 -d >/tmp/v13.zip
          echo '658fd954180c2d0d39c02ba6601af36d06cdbd573bfb72c6879169861a7ad092  /tmp/v13.zip' | sha256sum -c --strict
          rm -rf /tmp/base; mkdir /tmp/base; unzip -q /tmp/v13.zip -d /tmp/base
          patch /tmp/base/experiments/numba_search.py < .analysis/v13_jit_refactor.patch
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/base/experiments/numba_search.py'); s=p.read_text()
          old='    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          new='    correction = correction // 6\n    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          assert s.count(old)==1; p.write_text(s.replace(old,new,1))
          PY
          python scripts/patch_v13_legality_context.py /tmp/base/experiments/numba_core.py
          python scripts/patch_v13_qsearch_tactical.py /tmp/base/experiments/numba_core.py /tmp/base/experiments/numba_search.py
          echo '401f6580028a72361286bd99bee1f0022c74e6c8a65da8acd47448835a1ff360  /tmp/base/experiments/numba_search.py' | sha256sum -c --strict
      - name: Download qualified H64 smoke weights
        shell: bash
        run: |
          set -euo pipefail
          mkdir /tmp/model
          curl --fail --location --retry 3 -H 'Authorization: Bearer ${{ github.token }}' -H 'Accept: application/vnd.github+json' \
            -o /tmp/model.zip https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10046590207/zip
          unzip -q /tmp/model.zip -d /tmp/model
          MODEL=$(find /tmp/model -name student-h64.npz -print -quit); test -n "$MODEL"
          echo '3422cecc3b1226767412e08746ffd6eef9f7e38602ac15b9256b475e6762b598  '"$MODEL" | sha256sum -c --strict
          echo "SMOKE_MODEL=$MODEL" >> "$GITHUB_ENV"
      - name: Compile and prove incremental/full refresh parity
        shell: bash
        run: |
          set -euo pipefail
          for MODE in additive replacement; do
            DIR=/tmp/$MODE; rm -rf "$DIR"; cp -a /tmp/base "$DIR"
            cp experiments/v14_student_single_runtime.py "$DIR/experiments/"
            cp "$SMOKE_MODEL" "$DIR/experiments/v14_student_model.npz"
            python scripts/patch_v14_gen2_student_search.py "$DIR/experiments/numba_search.py" --hidden 64 --numerator 1 --denominator 12 --mode "$MODE"
            python -m py_compile "$DIR/experiments/numba_search.py" "$DIR/experiments/v14_student_single_runtime.py"
            PYTHONPATH="$DIR" MODE="$MODE" python - <<'PY'
          import os, chess, numpy as np
          from experiments.numba_core import encode_position, encode_move
          from experiments.numba_search import EVAL_WIDTH,_build_eval_state_into,_advance_eval_state_into,iterative_search_stateful
          b=chess.Board(); e=encode_position(b); parent=np.empty(EVAL_WIDTH,dtype=np.int32); _build_eval_state_into(e.board,parent)
          for uci in ('e2e4','e7e5','g1f3','b8c6','f1b5','a7a6','b5a4','g8f6'):
              m=chess.Move.from_uci(uci); assert m in b.legal_moves
              im=encode_move(m.from_square,m.to_square,m.promotion or 0,0)
              eb=encode_position(b); child=np.empty(EVAL_WIDTH,dtype=np.int32); _advance_eval_state_into(eb.board,eb.side,im,parent,child)
              b.push(m); eb2=encode_position(b); full=np.empty(EVAL_WIDTH,dtype=np.int32); _build_eval_state_into(eb2.board,full)
              assert np.array_equal(child,full),(os.environ['MODE'],uci,np.flatnonzero(child!=full).tolist())
              parent=child
          h=np.empty(0,dtype=np.uint64)
          out=iterative_search_stateful(eb2.board,eb2.side,eb2.castling,eb2.ep_square,b.halfmove_clock,h,0,8000)
          print(os.environ['MODE'],EVAL_WIDTH,tuple(map(int,out)))
          PY
          done

  teacher-v2:
    needs: smoke-v2
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Reconstruct exact V13 BEST
        shell: bash
        run: |
          set -euo pipefail
          cat .analysis/v13_chunks_*.b64 | base64 -d >/tmp/v13.zip
          rm -rf /tmp/v13; mkdir /tmp/v13; unzip -q /tmp/v13.zip -d /tmp/v13
          patch /tmp/v13/experiments/numba_search.py < .analysis/v13_jit_refactor.patch
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/v13/experiments/numba_search.py'); s=p.read_text(); old='    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('; new='    correction = correction // 6\n    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('; assert s.count(old)==1; p.write_text(s.replace(old,new,1))
          PY
          python scripts/patch_v13_legality_context.py /tmp/v13/experiments/numba_core.py
          python scripts/patch_v13_qsearch_tactical.py /tmp/v13/experiments/numba_core.py /tmp/v13/experiments/numba_search.py
      - name: Build disjoint UHO training roots
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/master/UHO_Lichess_4852_v1.epd.zip
          rm -rf /tmp/uho; mkdir /tmp/uho; unzip -q /tmp/uho.zip -d /tmp/uho
          UHO=$(find /tmp/uho -name '*.epd' -print -quit); UHO="$UHO" python - <<'PY'
          import os,chess
          from pathlib import Path
          rows=Path(os.environ['UHO']).read_text(errors='ignore').splitlines(); out=[]
          for raw in rows[500:1800]:
              f=raw.strip().split()
              if len(f)<4: continue
              fen=' '.join(f[:4])+' 0 1'
              try:b=chess.Board(fen)
              except ValueError: continue
              if not b.is_game_over(claim_draw=False): out.append(fen)
              if len(out)>=320: break
          assert len(out)==320; Path('/tmp/train.epd').write_text('\n'.join(out)+'\n')
          PY
      - name: Generate V13 positions
        shell: bash
        run: |
          mkdir gen2-source
          python -u tools/v14_generate_selfplay_positions.py --engine /tmp/v13 --openings /tmp/train.epd --nodes 4500 --games 320 --opening-offset 0 --min-ply 8 --max-ply 160 --stride 3 --max-positions 10000 --output gen2-source/positions.json | tee gen2-source/generate.log
      - name: Fetch pinned Stockfish 19 and label
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/sf.tar.gz https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz
          echo '9defc0d4e55d49c65a6d042f3e571a39fcea499ade6dbe741b53b8c65e03611f  /tmp/sf.tar.gz' | sha256sum -c --strict
          mkdir /tmp/sf; tar -xzf /tmp/sf.tar.gz -C /tmp/sf
          SF=$(find /tmp/sf -type f -name 'stockfish*' -perm -111 -print -quit); test -n "$SF"
          python -u tools/v14_label_selfplay_teacher.py --positions gen2-source/positions.json --stockfish "$SF" --nodes 12000 --threads 1 --hash-mb 64 --split-salt Chess/v14-gen2-large-20260908 --validation-permille 100 --holdout-permille 100 --output gen2-source/teacher.jsonl | tee gen2-source/teacher.log
          wc -l gen2-source/teacher.jsonl; sha256sum gen2-source/teacher.jsonl | tee gen2-source/teacher.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: v14-gen2-teacher-v2-${{ github.sha }}
          path: gen2-source/
          retention-days: 30

  train-v2:
    needs: teacher-v2
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        baseline: [v13, classical]
        hidden: [64, 96]
    name: train-v2-${{ matrix.baseline }}-h${{ matrix.hidden }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - uses: actions/download-artifact@v4
        with:
          name: v14-gen2-teacher-v2-${{ github.sha }}
          path: gen2-source
      - name: Reconstruct exact V13 BEST for targets
        shell: bash
        run: |
          set -euo pipefail
          cat .analysis/v13_chunks_*.b64 | base64 -d >/tmp/v13.zip
          rm -rf /tmp/v13; mkdir /tmp/v13; unzip -q /tmp/v13.zip -d /tmp/v13
          patch /tmp/v13/experiments/numba_search.py < .analysis/v13_jit_refactor.patch
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/v13/experiments/numba_search.py'); s=p.read_text(); old='    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('; new='    correction = correction // 6\n    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('; assert s.count(old)==1; p.write_text(s.replace(old,new,1))
          PY
          python scripts/patch_v13_legality_context.py /tmp/v13/experiments/numba_core.py
          python scripts/patch_v13_qsearch_tactical.py /tmp/v13/experiments/numba_core.py /tmp/v13/experiments/numba_search.py
      - name: Train quantized student
        shell: bash
        run: |
          set -euo pipefail
          OUT=student-${{ matrix.baseline }}-h${{ matrix.hidden }}
          python -u scripts/train_v14_single_residual.py --teacher gen2-source/teacher.jsonl --engine-dir /tmp/v13 --output-dir "$OUT" --hidden ${{ matrix.hidden }} --baseline ${{ matrix.baseline }} --epochs 40 --batch-size 512 --learning-rate 0.002 --weight-decay 0.00002 --seed 20260908 | tee "$OUT.log"
          sha256sum "$OUT/student-h${{ matrix.hidden }}.npz" | tee "$OUT/model.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: v14-gen2-v2-${{ matrix.baseline }}-h${{ matrix.hidden }}-${{ github.sha }}
          path: |
            student-${{ matrix.baseline }}-h${{ matrix.hidden }}/
            student-${{ matrix.baseline }}-h${{ matrix.hidden }}.log
          retention-days: 30
