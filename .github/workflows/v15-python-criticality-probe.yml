name: V15 Python marginal-search criticality probe

on:
  push:
    branches: [analysis/v15-python-criticality-probe-20260908]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install exact runtime and Stockfish
        run: |
          python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
          sudo apt-get update -qq
          sudo apt-get install -y stockfish
      - uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - name: Build exact V14 and fresh roots
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name 'Little-Gambit-V14.zip' -print -quit); test -n "$ZIP"
          rm -rf /tmp/v14 /tmp/m6; mkdir -p /tmp/v14 /tmp/m6 results
          unzip -q "$ZIP" -d /tmp/v14
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]; chosen=fresh[848:944]
          assert len(chosen)==96 and len(set(chosen))==96
          Path('/tmp/criticality-96.epd').write_text('\n'.join(chosen)+'\n')
          PY
      - name: Collect marginal-search labels and fit tiny predictor
        shell: bash
        env:
          PYTHONPATH: /tmp/v14
        run: |
          python - <<'PY'
          import json,math,os,subprocess,sys
          from pathlib import Path
          import chess, chess.engine, numpy as np
          from experiments.numba_core import encode_position, move_from, move_to, move_promotion, KNIGHT, BISHOP, ROOK, QUEEN
          from experiments.numba_search import iterative_search_stateful

          roots=[x.strip() for x in Path('/tmp/criticality-96.epd').read_text().splitlines() if x.strip()]
          promo={int(KNIGHT):'n',int(BISHOP):'b',int(ROOK):'r',int(QUEEN):'q'}
          def uci(m):
              a=int(move_from(m)); z=int(move_to(m)); p=int(move_promotion(m))
              return chess.square_name(a)+chess.square_name(z)+promo.get(p,'')
          def search(b,n):
              e=encode_position(b); h=np.empty(0,dtype=np.uint64)
              o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,n)
              return {'move':uci(int(o[0])),'score':int(o[1]),'depth':int(o[2]),'nodes':int(o[3])}
          def static_features(b):
              legal=list(b.legal_moves); caps=sum(b.is_capture(m) for m in legal); promos=sum(m.promotion is not None for m in legal)
              checks=0
              for m in legal:
                  b.push(m); checks += int(b.is_check()); b.pop()
              values={chess.PAWN:1,chess.KNIGHT:3,chess.BISHOP:3,chess.ROOK:5,chess.QUEEN:9}
              material=sum(values.get(p.piece_type,0) for p in b.piece_map().values())
              return [len(legal),caps,promos,checks,int(b.is_check()),material]
          sf_path='/usr/games/stockfish' if Path('/usr/games/stockfish').exists() else 'stockfish'
          sf=chess.engine.SimpleEngine.popen_uci(sf_path); rows=[]
          try:
              # Warm Numba before measuring examples.
              search(chess.Board(roots[0]),500)
              for i,fen in enumerate(roots):
                  b=chess.Board(fen); s4=search(b,4000); s8=search(b,8000); s32=search(b,32000)
                  m8=chess.Move.from_uci(s8['move']); m32=chess.Move.from_uci(s32['move'])
                  def sf_score(m):
                      info=sf.analyse(b,chess.engine.Limit(depth=10),root_moves=[m])
                      v=info['score'].pov(b.turn).score(mate_score=100000); return int(v if v is not None else 0)
                  v8=sf_score(m8); v32=v8 if m32==m8 else sf_score(m32)
                  label=max(0,v32-v8)
                  feat=static_features(b)+[s4['score']/100.0,s8['score']/100.0,abs(s8['score'])/100.0,(s8['score']-s4['score'])/100.0,int(s8['move']!=s4['move']),s4['depth'],s8['depth'],s8['depth']-s4['depth']]
                  rows.append({'i':i,'fen':fen,'features':feat,'label_cp':label,'sf_8k':v8,'sf_32k':v32,'s4':s4,'s8':s8,'s32':s32})
                  print(i,label,s8['move'],s32['move'],flush=True)
          finally: sf.quit()

          X=np.asarray([r['features'] for r in rows],dtype=np.float64); y=np.asarray([r['label_cp'] for r in rows],dtype=np.float64)
          rng=np.random.default_rng(20260908); idx=np.arange(len(rows)); rng.shuffle(idx); tr=idx[:64]; te=idx[64:]
          mu=X[tr].mean(0); sd=X[tr].std(0); sd[sd<1e-9]=1.0; Z=(X-mu)/sd
          A=np.c_[np.ones(len(tr)),Z[tr]]; lam=5.0; reg=np.eye(A.shape[1])*lam; reg[0,0]=0
          w=np.linalg.solve(A.T@A+reg,A.T@y[tr]); pred=np.c_[np.ones(len(te)),Z[te]]@w
          # Hand baseline: best-move churn plus score volatility, deliberately using the same completed-iteration information.
          hand=80.0*X[te,10]+35.0*np.abs(X[te,9])+10.0*np.maximum(0,1-X[te,13])
          def corr(a,b):
              return float(np.corrcoef(a,b)[0,1]) if np.std(a)>1e-9 and np.std(b)>1e-9 else 0.0
          def topq(signal):
              n=max(1,len(signal)//4); pick=np.argsort(signal)[-n:]; return float(y[te][pick].mean()),int((y[te][pick]>=50).sum()),n
          result={'examples':len(rows),'train':len(tr),'test':len(te),'positive_fraction':float((y>0).mean()),'ge50_fraction':float((y>=50).mean()),'mean_label_cp':float(y.mean()),'test_ridge_corr':corr(pred,y[te]),'test_hand_corr':corr(hand,y[te]),'test_ridge_top_quartile_mean_cp':topq(pred)[0],'test_hand_top_quartile_mean_cp':topq(hand)[0],'test_overall_mean_cp':float(y[te].mean()),'ridge_top_quartile_ge50':topq(pred)[1:],'hand_top_quartile_ge50':topq(hand)[1:],'feature_mean':mu.tolist(),'feature_scale':sd.tolist(),'ridge_weights':w.tolist(),'rows':rows}
          Path('results/criticality.json').write_text(json.dumps(result,indent=2)+'\n'); print('FINAL',json.dumps({k:v for k,v in result.items() if k!='rows'}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-python-criticality-probe-${{ github.sha }}
          path: results/
          retention-days: 30
