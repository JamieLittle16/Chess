name: V15 Python runtime plus H64 evaluator interaction

on:
  push:
    branches:
      - analysis/v15-python-runtime-evaluator-interaction-20260909
    paths:
      - .github/workflows/v15-python-runtime-evaluator-interaction.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  screen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: b100
            artifact: v15-python-h64-finetune-b100-bb9ec0a83c41ed648c9f70755dee5623a786b662
          - name: b200
            artifact: v15-python-h64-finetune-b200-bb9ec0a83c41ed648c9f70755dee5623a786b662
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Download exact packaged V14
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - name: Download H64 candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: h64-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34286341719
      - name: Materialize exact V14 control and runtime plus evaluator candidate
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name Little-Gambit-V14.zip -print -quit); MODEL=$(find h64-artifact -type f -name v14_student_h64.npz -print -quit)
          test -n "$ZIP"; test -n "$MODEL"
          rm -rf /tmp/base /tmp/cand /tmp/m6 results; mkdir -p /tmp/base /tmp/cand /tmp/m6 results
          unzip -q "$ZIP" -d /tmp/base; cp -a /tmp/base/. /tmp/cand/
          python scripts/patch_v15_python_presort_once.py /tmp/cand/experiments/numba_search.py
          python scripts/patch_v15_python_fused_h64_direct.py /tmp/cand/experiments/v14_student_single_runtime.py
          python scripts/patch_v15_python_inline_fused_h64.py /tmp/cand/experiments/v14_student_single_runtime.py
          cp "$MODEL" /tmp/cand/experiments/v14_student_h64.npz
          python -m py_compile tools/v14_agent_runner.py /tmp/base/agent.py /tmp/cand/agent.py /tmp/base/experiments/*.py /tmp/cand/experiments/*.py
          PYTHONPATH=/tmp/cand python - <<'PY'
          import chess,numpy as np
          from experiments.numba_core import encode_position,move_to_uci
          from experiments.numba_search import iterative_search_stateful
          b=chess.Board();e=encode_position(b);h=np.empty(0,dtype=np.uint64);o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,8000)
          m=chess.Move.from_uci(move_to_uci(int(o[0])));assert m in b.legal_moves;print(tuple(int(x) for x in o),m)
          PY
      - name: Build fresh 48-root suite
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]; roots=fresh[4800:4848]
          assert len(roots)==48 and len(set(roots))==48
          Path('/tmp/eval-interaction-48.epd').write_text('\n'.join(roots)+'\n')
          PY
      - name: 96-game competition-clock interaction screen vs exact V14
        run: python -u scripts/v15_competition_gate.py --candidate /tmp/cand --control /tmp/base --openings /tmp/eval-interaction-48.epd --output results/timed-96.json --label runtime-${{ matrix.name }}-vs-v14 --base-ms 2500 --inc-ms 50 --max-plies 180 | tee results/timed-96.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-python-runtime-evaluator-${{ matrix.name }}-${{ github.sha }}
          path: results/
          retention-days: 30
