name: V13 final best qualification

on:
  push:
    branches: [analysis/v13-final-best-20260907]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact competition runtime
        run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Reconstruct final candidate and semantic control
        shell: bash
        run: |
          set -euo pipefail
          cat .analysis/v13_chunks_*.b64 | base64 -d > /tmp/v13.zip
          echo '658fd954180c2d0d39c02ba6601af36d06cdbd573bfb72c6879169861a7ad092  /tmp/v13.zip' | sha256sum -c -
          rm -rf /tmp/base /tmp/cand; mkdir /tmp/base /tmp/cand
          unzip -q /tmp/v13.zip -d /tmp/base; unzip -q /tmp/v13.zip -d /tmp/cand
          patch /tmp/base/experiments/numba_search.py < .analysis/v13_jit_refactor.patch
          patch /tmp/cand/experiments/numba_search.py < .analysis/v13_jit_refactor.patch
          for DIR in /tmp/base /tmp/cand; do
            DIR="$DIR" python - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['DIR'])/'experiments/numba_search.py'; s=p.read_text()
          old='    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          new='    correction = correction // 6\n    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          assert s.count(old)==1,s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
            python scripts/patch_v13_legality_context.py "$DIR/experiments/numba_core.py"
          done
          python scripts/patch_v13_qsearch_tactical.py /tmp/cand/experiments/numba_core.py /tmp/cand/experiments/numba_search.py
          python -m py_compile /tmp/base/agent.py /tmp/base/experiments/*.py /tmp/cand/agent.py /tmp/cand/experiments/*.py
          grep -q 'correction = correction // 6' /tmp/cand/experiments/numba_search.py
          grep -q 'def generate_legal_tactical_moves_into_with_king' /tmp/cand/experiments/numba_core.py
      - name: Competition API smoke
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp/cand python - <<'PY'
          import chess, agent
          cases=[
            chess.STARTING_FEN,
            'r1bq1rk1/pp2bppp/2n1pn2/2pp4/3P4/2PBPN2/PP3PPP/R1BQ1RK1 w - - 2 9',
            'k3r3/8/8/8/8/8/4R3/4K3 w - - 0 1',
          ]
          for fen in cases:
              b=chess.Board(fen)
              mv=agent.get_move(fen,120000)
              assert chess.Move.from_uci(mv) in b.legal_moves,(fen,mv)
              print('legal',mv)
          PY
      - name: Exact fixed-node semantic parity and speed
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/worker.py <<'PY'
          import json,sys,chess,numpy as np
          from experiments.numba_core import encode_position
          from experiments.numba_search import iterative_search_stateful
          for line in sys.stdin:
              q=json.loads(line); b=chess.Board(q['fen']); e=encode_position(b); h=np.empty(0,dtype=np.uint64)
              o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,int(q['nodes']))
              print(json.dumps({'move':int(o[0]),'score':int(o[1]),'depth':int(o[2]),'nodes':int(o[3])}),flush=True)
          PY
          python - <<'PY'
          import json,os,subprocess,sys,time,statistics
          roots=[x.strip() for x in open('match/openings/m3-uho-lichess-100-v1.epd') if x.strip() and not x.startswith('#')][:40]
          def start(path):
              env=os.environ.copy();env['PYTHONPATH']=path
              return subprocess.Popen([sys.executable,'/tmp/worker.py'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env=env)
          def ask(p,fen,n):
              p.stdin.write(json.dumps({'fen':fen,'nodes':n})+'\n');p.stdin.flush();return json.loads(p.stdout.readline())
          a=start('/tmp/base');b=start('/tmp/cand');rat=[]
          try:
              ask(a,roots[0],300);ask(b,roots[0],300)
              for rep in range(3):
                  order=roots if rep%2==0 else list(reversed(roots))
                  t=time.perf_counter(); ar=[ask(a,f,30000) for f in order]; at=time.perf_counter()-t
                  t=time.perf_counter(); br=[ask(b,f,30000) for f in order]; bt=time.perf_counter()-t
                  assert ar==br,(rep,next((i for i,(x,y) in enumerate(zip(ar,br)) if x!=y),None))
                  rat.append(at/bt); print('rep',rep,'speedup',at/bt)
          finally:
              a.terminate();b.terminate();a.wait();b.wait()
          med=statistics.median(rat);print('identical',120,'median_speedup',med)
          assert med>1.10,rat
          PY
      - name: Package exact final V13
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cand/__pycache__ /tmp/cand/experiments/__pycache__
          mkdir -p final-artifact
          (cd /tmp/cand && zip -X -qr "$GITHUB_WORKSPACE/final-artifact/Little-Gambit-V13-BEST.zip" .)
          cp /tmp/cand/agent.py final-artifact/agent.py
          sha256sum final-artifact/Little-Gambit-V13-BEST.zip final-artifact/agent.py /tmp/cand/experiments/numba_core.py /tmp/cand/experiments/numba_search.py /tmp/cand/experiments/v13_residual.i16 | tee final-artifact/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Little-Gambit-V13-BEST-${{ github.sha }}
          path: final-artifact/
          retention-days: 14
