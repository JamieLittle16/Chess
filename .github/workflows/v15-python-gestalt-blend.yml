name: V15 Python search-compatible Gestalt blend sweep

on:
  push:
    branches: [analysis/v15-python-gestalt-blend-20260908]
    paths:
      - scripts/build_v15_gestalt_blend_teacher.py
      - .github/workflows/v15-python-gestalt-blend.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: b125
            blend: '0.125'
          - name: b250
            blend: '0.25'
          - name: b500
            blend: '0.50'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Download exact packaged V14
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - name: Download frozen exact-Gestalt label shards
        uses: actions/download-artifact@v4
        with:
          pattern: v15-gestalt-labels-*-c3331960a207e4bb10e13252d62be27788d6af5d
          path: gestalt-labels
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34266694827
      - name: Build blended teacher and H16 replacement
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name Little-Gambit-V14.zip -print -quit); test -n "$ZIP"
          rm -rf /tmp/v14 results; mkdir -p /tmp/v14 results
          unzip -q "$ZIP" -d /tmp/v14
          cat gestalt-labels/gestalt-*.jsonl > results/gestalt.jsonl
          python -u scripts/build_v15_gestalt_blend_teacher.py \
            --teacher results/gestalt.jsonl --engine-dir /tmp/v14 \
            --blend ${{ matrix.blend }} --output results/blended.jsonl \
            | tee results/blend.log
          python -u scripts/train_v15_bucket_student.py \
            --teacher results/blended.jsonl --engine-dir /tmp/v14 \
            --output-dir results/model --hidden 16 --epochs 25 --batch-size 256 --seed 20260908 \
            | tee results/train.log
      - name: Materialize presorted qcap6 control and blend candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/base /tmp/cand /tmp/m6; mkdir -p /tmp/base /tmp/cand /tmp/m6
          cp -a /tmp/v14/. /tmp/base/; cp -a /tmp/v14/. /tmp/cand/
          for D in /tmp/base /tmp/cand; do
            python scripts/patch_v15_python_qsearch_cap.py "$D/experiments/numba_search.py" 6
            python scripts/patch_v15_python_presort_once.py "$D/experiments/numba_search.py"
          done
          cp results/model/bucket-h16.npz /tmp/cand/experiments/v15_bucket_student.npz
          python scripts/patch_v15_python_bucket_student_runtime.py /tmp/cand/experiments/numba_search.py 16
          python -m py_compile tools/v14_agent_runner.py /tmp/base/agent.py /tmp/cand/agent.py /tmp/base/experiments/*.py /tmp/cand/experiments/*.py
          PYTHONPATH=/tmp/cand python - <<'PY'
          import chess,numpy as np
          from experiments.numba_core import encode_position,move_to_uci
          from experiments.numba_search import iterative_search_stateful
          b=chess.Board();e=encode_position(b);h=np.empty(0,dtype=np.uint64)
          o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,8000)
          m=chess.Move.from_uci(move_to_uci(int(o[0]))); assert m in b.legal_moves
          print(tuple(int(x) for x in o[:4]),m)
          PY
      - name: Build unseen roots
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]
          screen=fresh[4664:4712]; timed=fresh[4714:4746]
          assert len(screen)==48 and len(timed)==32 and not set(screen)&set(timed)
          Path('/tmp/blend-screen.epd').write_text('\n'.join(screen)+'\n')
          Path('/tmp/blend-timed.epd').write_text('\n'.join(timed)+'\n')
          print({'fresh_total':len(fresh),'screen':[4664,4712],'timed':[4714,4746]})
          PY
      - name: Throughput
        shell: bash
        run: |
          cat >/tmp/worker.py <<'PY'
          import json,sys,chess,numpy as np
          from experiments.numba_core import encode_position
          from experiments.numba_search import iterative_search_stateful
          for line in sys.stdin:
              q=json.loads(line);b=chess.Board(q['fen']);e=encode_position(b);h=np.empty(0,dtype=np.uint64)
              o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,int(q['nodes']))
              print(json.dumps({'nodes':int(o[3]),'depth':int(o[2])}),flush=True)
          PY
          python - <<'PY'
          import json,os,statistics,subprocess,sys,time
          from pathlib import Path
          roots=Path('/tmp/blend-screen.epd').read_text().splitlines()[:16]
          def start(d):
              e=os.environ.copy();e['PYTHONPATH']=d;return subprocess.Popen([sys.executable,'/tmp/worker.py'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env=e)
          def one(p,fen,n):p.stdin.write(json.dumps({'fen':fen,'nodes':n})+'\n');p.stdin.flush();return json.loads(p.stdout.readline())
          def timed(p,order):
              nodes=0;ds=[];t=time.perf_counter()
              for fen in order:
                  z=one(p,fen,25000);nodes+=z['nodes'];ds.append(z['depth'])
              return nodes/(time.perf_counter()-t),sum(ds)/len(ds)
          b=start('/tmp/base');c=start('/tmp/cand');rat=[];rows=[]
          try:
              one(b,roots[0],500);one(c,roots[0],500)
              for r in range(3):
                  order=roots if r%2==0 else list(reversed(roots))
                  if r%2==0:bn,bd=timed(b,order);cn,cd=timed(c,order)
                  else:cn,cd=timed(c,order);bn,bd=timed(b,order)
                  rat.append(cn/bn);rows.append({'base_nps':bn,'candidate_nps':cn,'ratio':cn/bn,'base_depth':bd,'candidate_depth':cd})
          finally:b.terminate();c.terminate();b.wait();c.wait()
          out={'blend':${{ matrix.blend }},'median_nps_ratio':statistics.median(rat),'rows':rows};Path('results/throughput.json').write_text(json.dumps(out,indent=2)+'\n');print('FINAL',out)
          PY
      - name: 96-game equal-node screen
        run: python -u tools/v14_fixed_node_arena.py /tmp/cand /tmp/base --nodes 18000 --pairs 48 --opening-file /tmp/blend-screen.epd --opening-offset 0 --max-plies 220 --json-out results/equal-node.json | tee results/equal-node.log
      - name: 64-game competition-clock gate
        run: python -u scripts/v15_competition_gate.py --candidate /tmp/cand --control /tmp/base --openings /tmp/blend-timed.epd --output results/timed.json --label gestalt-${{ matrix.name }}-qcap6-presort --base-ms 2500 --inc-ms 50 --max-plies 180 | tee results/timed.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-python-gestalt-${{ matrix.name }}-qcap6-presort-${{ github.sha }}
          path: results/
          retention-days: 30
