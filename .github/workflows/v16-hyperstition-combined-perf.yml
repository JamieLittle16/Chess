name: V16 Hyperstition combined performance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qualify:
    if: github.head_ref == 'v16/hyperstition-combined-perf'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RUSTFLAGS: -C target-cpu=x86-64-v3
      HYPER_URL: https://github.com/cosmobobak/viridithas-networks/releases/download/v92/hyperstition-b400.nnue.zst
      HYPER_RAW_SHA256: 36bcc6b3354ecbdb88fb95a341e494558b052223143f38ff6e6387aed99ab193
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Strict canonical Hyperstition gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qualification/hyper-combined .qualification/bin
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features --release

      - name: Download exact Hyperstition v92 network
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 "$HYPER_URL" --output .qualification/hyper-combined/hyperstition-b400.nnue.zst
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y zstd
          fi
          zstd --decompress --force .qualification/hyper-combined/hyperstition-b400.nnue.zst -o .qualification/hyper-combined/hyperstition-b400.nnue
          test "$(stat -c%s .qualification/hyper-combined/hyperstition-b400.nnue)" = '50616896'
          echo "$HYPER_RAW_SHA256  .qualification/hyper-combined/hyperstition-b400.nnue" | sha256sum --check --strict

      - name: Benchmark canonical evaluator
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p chess-eval --example hyperstition_tail_bench
          cp target/release/examples/hyperstition_tail_bench .qualification/bin/baseline-tail
          chmod +x .qualification/bin/baseline-tail
          for run in 1 2 3 4 5; do
            .qualification/bin/baseline-tail .qualification/hyper-combined/hyperstition-b400.nnue 300000 | tee ".qualification/hyper-combined/baseline-${run}.txt"
          done

      - name: Apply both independently accepted exact-performance patches
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_hyperstition_l2_avx2_probe.py
          python scripts/apply_hyperstition_bucket_fastpath_probe.py
          cargo fmt --all
          git diff --check
          git diff -- crates/chess-eval/src/hyperstition.rs > .qualification/hyper-combined/candidate.patch
          test -s .qualification/hyper-combined/candidate.patch
          sha256sum scripts/apply_hyperstition_l2_avx2_probe.py scripts/apply_hyperstition_bucket_fastpath_probe.py > .qualification/hyper-combined/patchers.sha256

      - name: Strict combined correctness gate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features --release
          cargo build --release -p chess-eval --example hyperstition_tail_bench
          cp target/release/examples/hyperstition_tail_bench .qualification/bin/candidate-tail
          chmod +x .qualification/bin/candidate-tail

      - name: Benchmark combined evaluator
        shell: bash
        run: |
          set -euo pipefail
          for run in 1 2 3 4 5; do
            .qualification/bin/candidate-tail .qualification/hyper-combined/hyperstition-b400.nnue 300000 | tee ".qualification/hyper-combined/candidate-${run}.txt"
          done

      - name: Require exact outputs and ten-percent median win
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee .qualification/hyper-combined/performance-summary.txt
          import re
          import statistics
          from pathlib import Path

          def read(prefix):
              times = []
              identities = []
              for run in range(1, 6):
                  text = Path(f'.qualification/hyper-combined/{prefix}-{run}.txt').read_text()
                  scores = re.search(r'^scores=(.+)$', text, re.MULTILINE)
                  summary = re.search(r'^summary .*ns_per_eval=([0-9.]+) checksum=(-?[0-9]+)$', text, re.MULTILINE)
                  if not scores or not summary:
                      raise SystemExit(f'could not parse {prefix} run {run}')
                  identities.append((scores.group(1), summary.group(2)))
                  times.append(float(summary.group(1)))
              if len(set(identities)) != 1:
                  raise SystemExit(f'{prefix} identity varied: {identities}')
              return times, identities[0]

          baseline, base_id = read('baseline')
          candidate, cand_id = read('candidate')
          if base_id != cand_id:
              raise SystemExit(f'evaluator output changed: baseline={base_id} candidate={cand_id}')
          base_med = statistics.median(baseline)
          cand_med = statistics.median(candidate)
          ratio = cand_med / base_med
          print(f'baseline_runs_ns={baseline}')
          print(f'candidate_runs_ns={candidate}')
          print(f'baseline_median_ns={base_med:.3f}')
          print(f'candidate_median_ns={cand_med:.3f}')
          print(f'time_ratio={ratio:.4f}x')
          print(f'speedup={base_med/cand_med:.4f}x')
          print(f'identity={base_id}')
          if ratio > 0.90:
              raise SystemExit(f'combined candidate failed 10% speedup gate: ratio={ratio:.4f}')
          PY

      - name: Record experiment identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat > .qualification/hyper-combined/evidence.txt <<EOF
          purpose=measure composition of accepted Hyperstition L2 SIMD and output-bucket fastpath
          baseline=canonical Hyperstition v92 with materialized safe-AVX2 L1
          candidate=baseline plus order-preserving safe-AVX2/FMA L2 plus aggregate-occupancy output bucket
          network_sha256=$HYPER_RAW_SHA256
          compile_target=x86-64-v3
          benchmark_iterations_per_fen=300000
          benchmark_fens=6
          repetitions=5 each
          correctness=full workspace tests plus bit-exact L2 test plus real-network score/checksum identity
          minimum_speedup_gate=10 percent
          EOF

      - name: Upload evidence without network bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v16-hyperstition-combined-perf-${{ github.sha }}
          path: .qualification/hyper-combined/
          retention-days: 30
