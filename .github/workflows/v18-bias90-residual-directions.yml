name: V18 BIAS90 residual directions
on:
  push:
    branches: [analysis/v18-bias90-residual-directions-20260910]
permissions:
  contents: read
  actions: read
jobs:
  screen:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: static125, sbp: 10000, abp: 0, dbp: 0, mix: 1250}
          - {name: static250, sbp: 10000, abp: 0, dbp: 0, mix: 2500}
          - {name: alpha125, sbp: 0, abp: 10000, dbp: 0, mix: 1250}
          - {name: alpha250, sbp: 0, abp: 10000, dbp: 0, mix: 2500}
          - {name: diverse125, sbp: 0, abp: 0, dbp: 10000, mix: 1250}
          - {name: diverse250, sbp: 0, abp: 0, dbp: 10000, mix: 2500}
          - {name: tri250, sbp: 7000, abp: 1500, dbp: 1500, mix: 2500}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q 'numba==0.67.0' 'numpy==2.5.2' 'chess==1.11.2'
      - uses: actions/download-artifact@v4
        with:
          name: v13-static-teacher-residual-5e0243e7b78e088675fcf2177175d21d31f9be4d
          path: /tmp/models/static
          repository: JamieLittle16/Chess
          run-id: 34159146417
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: v13-diverse-residual-v2-b8306a4473fd1d6b1062cc85ce05e02f58226fa0
          path: /tmp/models/diverse
          repository: JamieLittle16/Chess
          run-id: 34158845488
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: v13-alpha300-residual-b951334a9d57f7288a833dfd522ee4660c1f0b8f
          path: /tmp/models/alpha300
          repository: JamieLittle16/Chess
          run-id: 34158910686
          github-token: ${{ github.token }}
      - name: Build exact BIAS90 baseline and candidate
        env:
          SBP: ${{ matrix.sbp }}
          ABP: ${{ matrix.abp }}
          DBP: ${{ matrix.dbp }}
          MIX: ${{ matrix.mix }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          cat ci/v18_postbook_payload/chunk_*.b64 | base64 -d > /tmp/p150.zip
          for d in /tmp/base /tmp/cand; do
            rm -rf "$d"; mkdir "$d"; unzip -q /tmp/p150.zip -d "$d"
            sed -i 's/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.50/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.33/' "$d/agent.py"
            sed -i 's/RESIDUAL_BIAS = 61/RESIDUAL_BIAS = 90/' "$d/experiments/numba_search.py"
            curl --fail --location --retry 5 -sS 'https://raw.githubusercontent.com/michaeldv/donna_opening_books/master/gm2001.bin' -o "$d/v18_gm2001.bin"
          done
          python - <<'PY'
          import os,hashlib,numpy as np
          cur=np.fromfile('/tmp/base/experiments/v13_residual.i16',dtype='<i2').astype(np.float64)
          S=np.fromfile('/tmp/models/static/weights.i16',dtype='<i2').astype(np.float64)
          A=np.fromfile('/tmp/models/alpha300/weights.i16',dtype='<i2').astype(np.float64)
          D=np.fromfile('/tmp/models/diverse/weights.i16',dtype='<i2').astype(np.float64)
          sbp,abp,dbp,mix=map(int,(os.environ['SBP'],os.environ['ABP'],os.environ['DBP'],os.environ['MIX']))
          assert sbp+abp+dbp==10000
          target=(sbp*S+abp*A+dbp*D)/10000.0
          cand=np.rint(cur+(mix/10000.0)*(target-cur)).clip(-32768,32767).astype('<i2')
          cand.tofile('/tmp/cand/experiments/v13_residual.i16')
          changed=int(np.count_nonzero(cand.astype(np.int32)-cur.astype(np.int32)))
          l1=float(np.mean(np.abs(cand.astype(np.int32)-cur.astype(np.int32))))
          print('MODEL',os.environ['NAME'],'CHANGED',changed,'MEAN_ABS_DELTA',l1)
          print('BASE_SHA',hashlib.sha256(open('/tmp/base/experiments/v13_residual.i16','rb').read()).hexdigest())
          print('CAND_SHA',hashlib.sha256(open('/tmp/cand/experiments/v13_residual.i16','rb').read()).hexdigest())
          PY
      - name: Fixed-node 50-root A/B
        run: |
          cat >/tmp/run.py <<'PY'
          import sys,json,time,chess,numpy as np
          from pathlib import Path
          sys.path.insert(0,sys.argv[1]);import agent
          from experiments.numba_core import encode_position,move_to_uci
          from experiments.numba_search import iterative_search_stateful
          H=np.empty(0,dtype=np.uint64); rows=[]
          lines=[x for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')][:50]
          for i,line in enumerate(lines):
            b=chess.Board(line);e=encode_position(b)
            agent._HASH_KEYS.fill(0);agent._HASH_MOVES.fill(-1);agent._TT_TABLE.fill(0);agent._QUIET_HISTORY.fill(0)
            t=time.perf_counter();m,s,d,n=iterative_search_stateful(e.board.copy(),e.side,e.castling,e.ep_square,b.halfmove_clock,H,0,500000)
            rows.append({'i':i,'fen':b.fen(),'move':move_to_uci(m),'score':int(s),'depth':int(d),'nodes':int(n),'sec':time.perf_counter()-t})
          open(sys.argv[2],'w').write('\n'.join(json.dumps(x) for x in rows)+'\n')
          PY
          python /tmp/run.py /tmp/base /tmp/base.jsonl
          python /tmp/run.py /tmp/cand /tmp/cand.jsonl
          python - <<'PY'
          import json
          A=[json.loads(x) for x in open('/tmp/base.jsonl')];B=[json.loads(x) for x in open('/tmp/cand.jsonl')]
          D=[(a['i'],a['move'],b['move'],a['score'],b['score']) for a,b in zip(A,B) if a['move']!=b['move']]
          print('ROOT_DIFFS',len(D));[print('DIFF',x) for x in D]
          print('SECS',sum(x['sec'] for x in A),sum(x['sec'] for x in B))
          PY
      - name: SF19 judge changed roots
        run: |
          curl --fail --location --retry 5 -sS 'https://github.com/official-stockfish/Stockfish/releases/latest/download/stockfish-linux-x86-64-universal.tar.gz' -o /tmp/sf.tar.gz
          mkdir -p /tmp/sf; tar -xzf /tmp/sf.tar.gz -C /tmp/sf
          SF="$(find /tmp/sf -type f -name 'stockfish*' -perm /111 | head -n1)"; cp "$SF" /tmp/sf19; chmod +x /tmp/sf19
          python - <<'PY'
          import json,chess,chess.engine
          A=[json.loads(x) for x in open('/tmp/base.jsonl')];B=[json.loads(x) for x in open('/tmp/cand.jsonl')]
          sf=chess.engine.SimpleEngine.popen_uci('/tmp/sf19');sf.configure({'Threads':1,'Hash':64})
          def cp(s,p):
            v=s.pov(p).score(mate_score=100000);return int(v if v is not None else 0)
          imp=bad=tie=net=0; worst=0
          for a,b in zip(A,B):
            if a['move']==b['move']:continue
            bd=chess.Board(a['fen']);pov=bd.turn
            if 'Clear Hash' in sf.options:sf.configure({'Clear Hash':None})
            best=sf.analyse(bd,chess.engine.Limit(nodes=100000));bc=cp(best['score'],pov);vals=[]
            for r in (a,b):
              if 'Clear Hash' in sf.options:sf.configure({'Clear Hash':None})
              q=sf.analyse(bd,chess.engine.Limit(nodes=100000),root_moves=[chess.Move.from_uci(r['move'])]);vals.append(cp(q['score'],pov))
            la=max(0,bc-vals[0]);lb=max(0,bc-vals[1]);delta=la-lb;net+=delta;worst=min(worst,delta)
            if delta>5:imp+=1
            elif delta<-5:bad+=1
            else:tie+=1
            print('SF_DIFF',a['i'],a['move'],b['move'],'loss',la,lb,'delta',delta)
          sf.quit();print('SF_SUMMARY',imp,bad,tie,'NET_CP',net,'WORST',worst)
          PY
