name: M4 aspiration windows v1 screening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  aspiration-v1:
    if: github.head_ref == 'm4/aspiration-windows-v1-screening'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Apply isolated aspiration candidate
        run: |
          set -euo pipefail
          python3 tools/apply_aspiration_windows_v1.py
          cargo fmt --all
          git diff --check
          test -n "$(git diff -- crates/chess-search/src/lib.rs)"
      - name: Verify search and draw correctness
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          cargo test -p chess-search --test draw_strategy
          OUTPUT=$(cargo run --release --quiet -p chess-bench)
          printf '%s\n' "$OUTPUT"
          grep -q 'signature 0x4c3bbe8701fbbb68' <<< "$OUTPUT"
      - name: Build candidate
        run: |
          set -euo pipefail
          CANDIDATE_TARGET="$PWD/.qualification/candidate-target"
          CARGO_TARGET_DIR="$CANDIDATE_TARGET" cargo build --release -p chess-uci
          echo "CANDIDATE_BIN=$CANDIDATE_TARGET/release/chess-uci" >> "$GITHUB_ENV"
      - name: Build accepted production reference
        run: |
          set -euo pipefail
          REFERENCE_SHA=70484195439dc79d3610e36bcac88feb801a7721
          git fetch --depth=1 origin "$REFERENCE_SHA"
          git worktree add --detach .qualification/reference "$REFERENCE_SHA"
          REFERENCE_TARGET="$PWD/.qualification/reference-target"
          (cd .qualification/reference && CARGO_TARGET_DIR="$REFERENCE_TARGET" cargo build --release -p chess-uci)
          echo "REFERENCE_BIN=$REFERENCE_TARGET/release/chess-uci" >> "$GITHUB_ENV"
      - name: Verify fixed-depth production parity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess

          candidate = os.environ["CANDIDATE_BIN"]
          reference = os.environ["REFERENCE_BIN"]
          cases = [
              ("startpos", "position startpos", 4),
              (
                  "kiwipete",
                  "position fen r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 0 1",
                  4,
              ),
              ("en-passant", "position fen 8/8/8/3pP3/8/8/8/K6k w - d6 0 1", 4),
              ("promotion", "position fen 7k/P7/8/8/8/8/8/K7 w - - 0 1", 4),
              ("mate-net", "position fen 7k/5Q2/6K1/8/8/8/8/8 w - - 0 1", 4),
          ]

          def result(binary: str, position: str, depth: int):
              commands = f"uci\nisready\n{position}\ngo depth {depth}\nquit\n"
              proc = subprocess.run(
                  [binary],
                  input=commands,
                  text=True,
                  capture_output=True,
                  check=True,
                  timeout=60,
              )
              info = [line for line in proc.stdout.splitlines() if line.startswith("info depth ")]
              best = [line for line in proc.stdout.splitlines() if line.startswith("bestmove ")]
              if not info or not best:
                  raise SystemExit(f"missing UCI result from {binary}:\n{proc.stdout}\n{proc.stderr}")
              tokens = info[-1].split()
              try:
                  score_index = tokens.index("score")
                  score = (tokens[score_index + 1], tokens[score_index + 2])
              except (ValueError, IndexError) as exc:
                  raise SystemExit(f"cannot parse score from {info[-1]!r}") from exc
              return score, best[-1].split()[1]

          for name, position, depth in cases:
              cand = result(candidate, position, depth)
              ref = result(reference, position, depth)
              print(f"PARITY {name} depth={depth} candidate={cand} reference={ref}")
              if cand != ref:
                  raise SystemExit(f"aspiration production-parity mismatch for {name}: {cand} != {ref}")
          PY
      - name: Fetch pinned Fastchess
        run: |
          set -euo pipefail
          mkdir -p .qualification/fastchess
          curl --fail --location --retry 3 --output .qualification/fastchess.tar https://github.com/Disservin/fastchess/releases/download/v1.8.2-alpha/fastchess-linux-x86-64.tar
          echo '1003f920bebe841acdab5e6d7871e93171a4586857b3ec91c21ef5777f26ff96  .qualification/fastchess.tar' | sha256sum --check --strict
          tar -xf .qualification/fastchess.tar -C .qualification/fastchess
          FASTCHESS_BIN=$(find "$PWD/.qualification/fastchess" -type f -name fastchess -perm -111 -print -quit)
          test -n "$FASTCHESS_BIN"
          echo "FASTCHESS_BIN=$FASTCHESS_BIN" >> "$GITHUB_ENV"
      - name: Record identities
        run: |
          set -euo pipefail
          "$FASTCHESS_BIN" -version
          sha256sum "$CANDIDATE_BIN" "$REFERENCE_BIN" "$FASTCHESS_BIN" match/openings/m3-uho-lichess-100-v1.epd
      - name: Run paired equal-time screen
        run: |
          set -euo pipefail
          SHORT_SHA=${GITHUB_SHA:0:12}
          python3 scripts/match_harness.py \
            --protocol match/protocols/m4-aspiration-windows-v1-screening.json \
            --candidate "$CANDIDATE_BIN" \
            --candidate-name "Chess-M4-aspiration-v1@$SHORT_SHA" \
            --candidate-option Hash=32 \
            --reference "$REFERENCE_BIN" \
            --reference-name 'Chess-RFP-probe-prod@70484195439d' \
            --reference-option Hash=32 \
            --fastchess "$FASTCHESS_BIN" \
            --openings match/openings/m3-uho-lichess-100-v1.epd \
            --output-dir screening-results
      - name: Retain exact patched source
        if: always()
        run: |
          mkdir -p screening-results/exact-source/crates/chess-search/src
          cp crates/chess-search/src/lib.rs screening-results/exact-source/crates/chess-search/src/lib.rs
          sha256sum crates/chess-search/src/lib.rs > screening-results/exact-source/chess-search-lib.sha256
      - name: Upload retained evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-aspiration-windows-v1-${{ github.sha }}
          path: screening-results/
          retention-days: 30
