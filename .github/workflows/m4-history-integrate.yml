name: M4 history integration

on:
  push:
    branches:
      - m4/history-killers-v1

permissions:
  contents: write

jobs:
  integrate:
    if: "${{ github.event.head_commit.message == 'ci: run history integration' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m4/history-killers-v1
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Integrate searcher-owned quiet heuristics
        shell: python
        run: |
          from pathlib import Path
          path = Path('crates/chess-search/src/lib.rs')
          text = path.read_text()

          def replace_once(old, new):
              global text
              if old not in text:
                  raise SystemExit(f'missing integration anchor: {old!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'use chess_core::{ChessMove, Position, generate_legal_moves_mut};\nuse chess_eval::evaluate;\nuse move_picker::MovePicker;',
              'use chess_core::{ChessMove, Color, Position, generate_legal_moves_mut};\nuse chess_eval::evaluate;\nuse move_picker::{HistoryTable, MovePicker, is_quiet};',
          )
          replace_once(
              '    path_keys: [u64; MAX_SEARCH_PLY],\n}',
              '    path_keys: [u64; MAX_SEARCH_PLY],\n    killers: [[Option<ChessMove>; 2]; MAX_SEARCH_PLY],\n    history: HistoryTable,\n}',
          )
          replace_once(
              '            path_keys: [0; MAX_SEARCH_PLY],\n        }',
              '            path_keys: [0; MAX_SEARCH_PLY],\n            killers: [[None; 2]; MAX_SEARCH_PLY],\n            history: HistoryTable::new(),\n        }',
          )

          picker = '        let mut picker = MovePicker::new(&mut moves, hint);'
          if text.count(picker) != 2:
              raise SystemExit(f'expected 2 picker anchors, got {text.count(picker)}')
          text = text.replace(
              picker,
              '        let killers = self.killers[0];\n        let mut picker = MovePicker::with_killers(&mut moves, hint, killers);',
              1,
          )
          text = text.replace(
              picker,
              '        let killers = self.killers.get(usize::from(ply)).copied().unwrap_or([None, None]);\n        let mut picker = MovePicker::with_killers(&mut moves, hint, killers);',
              1,
          )

          loop = '        while let Some(mv) = picker.next(position) {'
          if text.count(loop) != 2:
              raise SystemExit(f'expected 2 picker loops, got {text.count(loop)}')
          text = text.replace(
              loop,
              '        while let Some(mv) = picker.next_with_history(position, &self.history) {',
              2,
          )

          replace_once(
              '            if alpha >= beta {\n                break;\n            }',
              '            if alpha >= beta {\n                if is_quiet(mv) {\n                    self.record_quiet_cutoff(position.side_to_move(), mv, depth, ply);\n                }\n                break;\n            }',
          )

          method_anchor = '    fn fallback_result(&self, position: &mut Position, prior_history: &[u64]) -> SearchResult {'
          method = (
              '    fn record_quiet_cutoff(\n'
              '        &mut self,\n'
              '        side: Color,\n'
              '        mv: ChessMove,\n'
              '        depth: u8,\n'
              '        ply: u16,\n'
              '    ) {\n'
              '        self.history.record_cutoff(side, mv, depth);\n'
              '        if let Some(killers) = self.killers.get_mut(usize::from(ply))\n'
              '            && killers[0] != Some(mv)\n'
              '        {\n'
              '            killers[1] = killers[0];\n'
              '            killers[0] = Some(mv);\n'
              '        }\n'
              '    }\n\n'
          )
          replace_once(method_anchor, method + method_anchor)
          path.write_text(text)
      - name: Format
        run: cargo fmt --all
      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/chess-search/src/lib.rs crates/chess-search/src/move_picker.rs
          git diff --cached --check
          git commit -m 'search: integrate killer and history quiet ordering'
          git push origin HEAD:m4/history-killers-v1
