name: M4 LMR v3 over RFP acceptance

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  acceptance:
    if: github.head_ref == 'm4/lmr-v3-over-rfp-acceptance'
    name: Exact-source LMR v3 acceptance over RFP
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Materialize exact screened candidate once
        run: |
          set -euo pipefail
          EXPECTED=c360b892f7c5686bc977c5ab56aa85920fd844fe7043836ae305caf483a5af82
          CURRENT=$(sha256sum crates/chess-search/src/lib.rs | cut -d' ' -f1)
          if [ "$CURRENT" = "$EXPECTED" ]; then
            echo 'MATERIALIZED_NOW=0' >> "$GITHUB_ENV"
            exit 0
          fi
          python3 tools/apply_lmr_v3_over_rfp.py
          cargo fmt --all
          echo "$EXPECTED  crates/chess-search/src/lib.rs" | sha256sum --check --strict
          git diff --check
          test -n "$(git diff -- crates/chess-search/src/lib.rs)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/chess-search/src/lib.rs
          git commit -m 'experiment: materialize exact screened LMR v3 source'
          git push origin HEAD:${{ github.head_ref }}
          echo 'MATERIALIZED_NOW=1' >> "$GITHUB_ENV"
      - name: Stop first pass after materialization
        if: env.MATERIALIZED_NOW == '1'
        run: echo 'Exact screened source committed; acceptance runs on the next PR event.'
      - name: Verify exact committed source and correctness
        if: env.MATERIALIZED_NOW != '1'
        run: |
          set -euo pipefail
          echo 'c360b892f7c5686bc977c5ab56aa85920fd844fe7043836ae305caf483a5af82  crates/chess-search/src/lib.rs' | sha256sum --check --strict
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test -p chess-search --all-features
          cargo test -p chess-search --test draw_strategy
          cargo test -p chess-core --all-features
          cargo test -p chess-engine --all-features
          cargo test -p chess-uci --all-features
      - name: Build candidate
        if: env.MATERIALIZED_NOW != '1'
        run: |
          set -euo pipefail
          CANDIDATE_TARGET="$PWD/.qualification/candidate-target"
          CARGO_TARGET_DIR="$CANDIDATE_TARGET" cargo build --release -p chess-uci
          echo "CANDIDATE_BIN=$CANDIDATE_TARGET/release/chess-uci" >> "$GITHUB_ENV"
      - name: Build accepted RFP production reference
        if: env.MATERIALIZED_NOW != '1'
        run: |
          set -euo pipefail
          REFERENCE_SHA=44c1e16d3713cdca1ff1bd71f7596ef3b5804037
          git fetch --depth=1 origin "$REFERENCE_SHA"
          git worktree add --detach .qualification/reference "$REFERENCE_SHA"
          REFERENCE_TARGET="$PWD/.qualification/reference-target"
          (
            cd .qualification/reference
            CARGO_TARGET_DIR="$REFERENCE_TARGET" cargo build --release -p chess-uci
          )
          echo "REFERENCE_BIN=$REFERENCE_TARGET/release/chess-uci" >> "$GITHUB_ENV"
      - name: Fetch pinned Fastchess
        if: env.MATERIALIZED_NOW != '1'
        run: |
          set -euo pipefail
          mkdir -p .qualification/fastchess
          curl --fail --location --retry 3 --output .qualification/fastchess.tar \
            https://github.com/Disservin/fastchess/releases/download/v1.8.2-alpha/fastchess-linux-x86-64.tar
          echo '1003f920bebe841acdab5e6d7871e93171a4586857b3ec91c21ef5777f26ff96  .qualification/fastchess.tar' | sha256sum --check --strict
          tar -xf .qualification/fastchess.tar -C .qualification/fastchess
          FASTCHESS_BIN=$(find "$PWD/.qualification/fastchess" -type f -name fastchess -perm -111 -print -quit)
          test -n "$FASTCHESS_BIN"
          echo "FASTCHESS_BIN=$FASTCHESS_BIN" >> "$GITHUB_ENV"
      - name: Record identities
        if: env.MATERIALIZED_NOW != '1'
        run: |
          set -euo pipefail
          "$FASTCHESS_BIN" -version
          sha256sum "$CANDIDATE_BIN" "$REFERENCE_BIN" "$FASTCHESS_BIN" match/openings/m3-uho-lichess-100-v1.epd
      - name: Run clean 200-game acceptance
        if: env.MATERIALIZED_NOW != '1'
        run: |
          set -euo pipefail
          SHORT_SHA=${GITHUB_SHA:0:12}
          python3 scripts/match_harness.py \
            --protocol match/protocols/m4-lmr-v3-over-rfp-acceptance.json \
            --candidate "$CANDIDATE_BIN" \
            --candidate-name "Chess-M4-rfp+lmr-v3-accept@$SHORT_SHA" \
            --candidate-option Hash=32 \
            --reference "$REFERENCE_BIN" \
            --reference-name 'Chess-RFP-prod@44c1e16d3713' \
            --reference-option Hash=32 \
            --fastchess "$FASTCHESS_BIN" \
            --openings match/openings/m3-uho-lichess-100-v1.epd \
            --output-dir acceptance-results
      - name: Retain acceptance evidence
        if: env.MATERIALIZED_NOW != '1' && always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-lmr-v3-over-rfp-acceptance-${{ github.sha }}
          path: acceptance-results/
          if-no-files-found: warn
          retention-days: 30
