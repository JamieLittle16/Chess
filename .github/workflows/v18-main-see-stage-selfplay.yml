name: V18 main SEE stage selfplay

on:
  push:
    branches: [analysis/v18-main-see-stage-scratch-20260911]
    paths:
      - '.github/workflows/v18-main-see-stage-selfplay.yml'
      - 'scripts/apply_v18_main_see_staging.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q 'numba==0.67.0' 'numpy==2.5.2' 'chess==1.11.2'
      - name: Reconstruct and compile
        run: |
          set -euo pipefail
          cat ci/v18_postbook_payload/chunk_*.b64 | base64 -d > /tmp/p150.zip
          for d in /tmp/base /tmp/cand; do
            rm -rf "$d"; mkdir "$d"; unzip -q /tmp/p150.zip -d "$d"
            sed -i 's/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.50/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.33/' "$d/agent.py"
            curl --fail --location --retry 5 -sS 'https://raw.githubusercontent.com/michaeldv/donna_opening_books/master/gm2001.bin' -o "$d/v18_gm2001.bin"
          done
          python scripts/apply_v18_main_see_staging.py /tmp/cand/experiments/numba_search.py
          python -m py_compile /tmp/cand/experiments/numba_search.py
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/cand/experiments/numba_search.py').read_text()
          assert s.count('score = -2_000_000 +') == 1
          assert 'if quiet and order_score < 5_590_000:' in s
          assert 'if score < 5_040_000 and (meta & 2) == 0:' in s
          # Generic/qsearch scorer remains in its baseline capture band.
          assert s.count('score += 7_000_000 + 16 * int(PIECE_VALUE[target]) - int(PIECE_VALUE[attacker])') == 2
          print('PATCH_GUARDS_OK')
          PY
          echo BASE_IMPORT; (cd /tmp/base && /usr/bin/time -f 'IMPORT_SEC %e' python -c 'import agent')
          echo CAND_IMPORT; (cd /tmp/cand && /usr/bin/time -f 'IMPORT_SEC %e' python -c 'import agent')
      - name: Fixed-node screen
        run: |
          cat >/tmp/probe.py <<'PY'
          import sys,contextlib,numpy as np,chess,time
          root,label=sys.argv[1:3]; sys.path.insert(0,root)
          with contextlib.redirect_stdout(sys.stderr): import agent
          fens=[
            'r3r1k1/ppp2ppp/2np1n2/8/2B1P3/2P2N2/PP3PPP/R2R2K1 w - - 0 16',
            '8/6p1/4n3/1P6/P1R3Pk/r1N4P/6K1/8 b - - 8 57',
            'r1bq1rk1/pp2bppp/2n1pn2/2pp4/8/1PN1PN2/PBPPBPPP/R2Q1RK1 w - - 2 9',
            '4rrk1/1pp2ppp/p1nq1n2/3p4/3P4/P1N1PN2/1PQ2PPP/2R1R1K1 w - - 2 19',
          ]
          for i,fen in enumerate(fens):
            b=chess.Board(fen); agent._HASH_KEYS.fill(np.uint64(0)); agent._HASH_MOVES.fill(np.int32(-1)); agent._TT_TABLE.fill(np.uint64(0)); agent._QUIET_HISTORY.fill(np.int16(0))
            enc=agent.encode_position(b); st=time.perf_counter(); m,s,d,n=agent.iterative_search_stateful(enc.board,enc.side,enc.castling,enc.ep_square,b.halfmove_clock,np.empty(0,dtype=np.uint64),0,250000)
            print(label,i,agent.move_to_uci(int(m)),int(s),int(d),int(n),'SEC',round(time.perf_counter()-st,4),flush=True)
          PY
          python /tmp/probe.py /tmp/base BASE
          python /tmp/probe.py /tmp/cand MAINSEE

  selfplay:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q 'numba==0.67.0' 'numpy==2.5.2' 'chess==1.11.2'
      - name: Reconstruct baseline and candidate
        run: |
          set -euo pipefail
          cat ci/v18_postbook_payload/chunk_*.b64 | base64 -d > /tmp/p150.zip
          for d in /tmp/base /tmp/cand; do
            rm -rf "$d"; mkdir "$d"; unzip -q /tmp/p150.zip -d "$d"
            sed -i 's/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.50/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.33/' "$d/agent.py"
            curl --fail --location --retry 5 -sS 'https://raw.githubusercontent.com/michaeldv/donna_opening_books/master/gm2001.bin' -o "$d/v18_gm2001.bin"
          done
          python scripts/apply_v18_main_see_staging.py /tmp/cand/experiments/numba_search.py
      - name: Paired 30+0.5 selfplay
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          cat >/tmp/worker.py <<'PY'
          import sys,json,contextlib,numpy as np
          with contextlib.redirect_stdout(sys.stderr): import agent
          def reset():
            agent._GAME_KEYS.clear(); agent._PENDING_AFTER_OUR_MOVE=None
            agent._LAST_CALL_TIME_LEFT_MS=None; agent._LAST_GET_MOVE_ELAPSED_MS=None
            agent._CLOCK_OVERHEAD_EMA_MS=40.0; agent._CLOCK_FEEDBACK_SAMPLES=0
            if hasattr(agent,'_BOOK_POST_SEARCH_BOOSTS'): agent._BOOK_POST_SEARCH_BOOSTS=0
            agent._HASH_KEYS.fill(np.uint64(0)); agent._HASH_MOVES.fill(np.int32(-1)); agent._TT_TABLE.fill(np.uint64(0)); agent._QUIET_HISTORY.fill(np.int16(0))
          for line in sys.stdin:
            try:
              q=json.loads(line)
              if q['op']=='reset': reset(); ans={'ok':True}
              else: ans={'move':agent.get_move(q['fen'],int(q['ms']))}
            except Exception as e: ans={'error':type(e).__name__+': '+str(e)}
            print(json.dumps(ans),flush=True)
          PY
          cat >/tmp/match.py <<'PY'
          import subprocess,sys,json,time,random,math,chess,os
          from pathlib import Path
          class W:
            def __init__(self,d):
              self.p=subprocess.Popen([sys.executable,'/tmp/worker.py'],cwd=d,stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env={**os.environ,'PYTHONPATH':d})
            def ask(self,q):
              self.p.stdin.write(json.dumps(q)+'\n'); self.p.stdin.flush(); r=json.loads(self.p.stdout.readline())
              if 'error' in r: raise RuntimeError(r['error'])
              return r
            def reset(self): self.ask({'op':'reset'})
            def close(self): self.p.terminate(); self.p.wait(timeout=5)
          shard=int(os.environ['SHARD']); baseclock=30.; inc=.5; pairs=4
          opens=[x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')]
          random.Random(20260911 ^ 0x5EE).shuffle(opens); opens=opens[shard*pairs:(shard+1)*pairs]
          base=W('/tmp/base'); cand=W('/tmp/cand'); pts=[]; fails=[]
          try:
            for pi,fen in enumerate(opens):
              for leg in range(2):
                base.reset(); cand.reset(); b=chess.Board(fen); cl={'base':baseclock,'cand':baseclock}; cw=(leg==0); fail=None
                for _ in range(300):
                  if b.outcome(claim_draw=True): break
                  side='cand' if b.turn==cw else 'base'; w=cand if side=='cand' else base
                  st=time.perf_counter(); r=w.ask({'op':'move','fen':b.fen(),'ms':max(1,round(cl[side]*1000))}); cl[side]-=time.perf_counter()-st
                  if cl[side]<0: fail=side+' flag'; break
                  try: m=chess.Move.from_uci(r['move'])
                  except Exception: fail=side+' illegal'; break
                  if m not in b.legal_moves: fail=side+' illegal'; break
                  b.push(m); cl[side]+=inc
                out=b.outcome(claim_draw=True)
                cp=(0. if fail and fail.startswith('cand') else 1.) if fail else (.5 if out is None or out.winner is None else (1. if out.winner==cw else 0.))
                pts.append(cp)
                if fail: fails.append((pi,leg,fail))
                print('GAME',len(pts),'POINT',cp,'TOTAL',sum(pts),'FAIL',fail,flush=True)
          finally: base.close(); cand.close()
          p=sum(pts)/len(pts); q=max(1e-6,min(1-1e-6,p))
          print('FINAL MAIN-SEE shard',shard,'points',sum(pts),'games',len(pts),'score',p,'REL_ELO',400*math.log10(q/(1-q)),'FAILS',fails)
          PY
          python /tmp/match.py
