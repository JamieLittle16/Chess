name: V16 Python H16 root guardian screen

on:
  push:
    branches: [analysis/v16-python-h16-root-guardian-20260909]
    paths:
      - '.github/workflows/v16-python-h16-root-guardian.yml'
      - 'scripts/patch_v16_python_h16_root_guardian.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        den: [8, 16, 32]
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Download exact V14
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - name: Download H16 guardian model
        uses: actions/download-artifact@v4
        with:
          name: v15-leaf-gestalt-topology-h16-70736f6f056d42aa8ceee37e0b282e4f02d34556
          path: h16-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34277063353
      - name: Materialize history+pruning control and guardian candidate
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name Little-Gambit-V14.zip -print -quit); MODEL=$(find h16-artifact -type f -name gestalt-topology-h16.npz -print -quit)
          test -n "$ZIP"; test -n "$MODEL"
          rm -rf /tmp/base /tmp/cand /tmp/m6 results; mkdir -p /tmp/base /tmp/cand /tmp/m6 results
          unzip -q "$ZIP" -d /tmp/base
          python scripts/patch_v16_python_presort_once.py /tmp/base/experiments/numba_search.py
          python scripts/patch_v16_python_trusted_continuity.py /tmp/base/agent.py
          python scripts/patch_v16_python_rust_history.py /tmp/base/experiments/numba_search.py
          python scripts/patch_v16_python_full_pruning_oracle.py /tmp/base/experiments/numba_search.py
          cp -a /tmp/base/. /tmp/cand/
          cp "$MODEL" /tmp/cand/experiments/v16_guardian_h16.npz
          python scripts/patch_v16_python_h16_root_guardian.py /tmp/cand/experiments/numba_search.py ${{ matrix.den }}
          python -m py_compile /tmp/base/agent.py /tmp/cand/agent.py /tmp/base/experiments/*.py /tmp/cand/experiments/*.py
      - name: Canonical Round61 probe
        shell: bash
        run: |
          cat >/tmp/probe.py <<'PY'
          import chess,json,numpy as np
          from experiments.numba_core import encode_position,move_to_uci
          from experiments.numba_search import iterative_search_stateful
          fen='2r3k1/4qp2/4b3/p5p1/4P1P1/2Pr2P1/P4PB1/R1Q2RK1 w - - 1 23'
          b=chess.Board(fen);e=encode_position(b);h=np.empty(0,dtype=np.uint64)
          for n in (300000,1000000):
              o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,n)
              print(json.dumps({'budget':n,'move':move_to_uci(int(o[0])),'score':int(o[1]),'depth':int(o[2]),'nodes':int(o[3])}))
          PY
          echo CONTROL; PYTHONPATH=/tmp/base python /tmp/probe.py | tee results/round61-control.jsonl
          echo GUARDIAN; PYTHONPATH=/tmp/cand python /tmp/probe.py | tee results/round61-guardian.jsonl
      - name: Build fresh roots
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old];eq=fresh[4370:4418];tm=fresh[4420:4452]
          assert len(eq)==48 and len(tm)==32
          Path('/tmp/eq.epd').write_text('\n'.join(eq)+'\n');Path('/tmp/tm.epd').write_text('\n'.join(tm)+'\n')
          PY
      - name: 96-game equal-node screen
        run: python -u tools/v14_fixed_node_arena.py /tmp/cand /tmp/base --nodes 20000 --pairs 48 --opening-file /tmp/eq.epd --max-plies 220 --json-out results/equal-node.json | tee results/equal-node.log
      - name: 64-game clock screen
        run: python -u scripts/v15_competition_gate.py --control /tmp/base --candidate /tmp/cand --openings /tmp/tm.epd --output results/timed.json --label h16-root-guardian-${{ matrix.den }} --base-ms 2500 --inc-ms 50 --max-plies 180 --grace-ms 1500 | tee results/timed.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v16-python-h16-root-guardian-${{ matrix.den }}-${{ github.sha }}
          path: results/
          retention-days: 30
