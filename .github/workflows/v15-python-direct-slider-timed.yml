name: V15 Python lean direct-slider timed qualification

on:
  push:
    branches: [analysis/v15-python-direct-slider-timed-20260908]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  timed:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact competition runtime
        run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0

      - name: Download exact packaged V14
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775

      - name: Materialize exact V14 control and lean candidate
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name 'Little-Gambit-V14.zip' -print -quit)
          test -n "$ZIP"
          rm -rf /tmp/base /tmp/cand
          mkdir -p /tmp/base /tmp/cand results
          unzip -q "$ZIP" -d /tmp/base
          cp -a /tmp/base/. /tmp/cand/
          python scripts/patch_v15_python_direct_slider_qcheck.py /tmp/cand/experiments/numba_search.py
          python -m py_compile tools/v14_agent_runner.py /tmp/base/agent.py /tmp/base/experiments/*.py /tmp/cand/agent.py /tmp/cand/experiments/*.py
          diff -u /tmp/base/experiments/numba_search.py /tmp/cand/experiments/numba_search.py > results/integration.patch || true
          test -s results/integration.patch
          cmp /tmp/base/agent.py /tmp/cand/agent.py
          cmp /tmp/base/experiments/numba_core.py /tmp/cand/experiments/numba_core.py
          cmp /tmp/base/experiments/v13_residual.i16 /tmp/cand/experiments/v13_residual.i16
          cmp /tmp/base/experiments/v14_student_h64.npz /tmp/cand/experiments/v14_student_h64.npz

      - name: Build fresh pinned 32-root timed book
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip \
            https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          curl --fail --location --retry 3 -o /tmp/build_m6.py \
            https://raw.githubusercontent.com/JamieLittle16/Chess/91c8f05f6cebb78605f86c4b483d87d906533bcc/scripts/build_m6_opening_suite.py
          mkdir -p /tmp/m6
          python /tmp/build_m6.py --archive /tmp/uho.zip --output-dir /tmp/m6
          echo '5445819229270140036023a507c41edffc9307ac2cca1ca2efd20e1ddb8d670e  /tmp/m6/m6-uho-lichess-5000-v1.epd' | sha256sum --check --strict
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]
          chosen=fresh[192:224]
          assert len(chosen)==32 and len(set(chosen))==32
          Path('/tmp/v15-direct-timed-32.epd').write_text('\n'.join(chosen)+'\n')
          PY
          sha256sum /tmp/v15-direct-timed-32.epd | tee results/timed-openings.sha256

      - name: Competition API timed A/B — 64 colour-swapped games
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,math,queue,subprocess,sys,threading,time
          from collections import Counter,deque
          from pathlib import Path
          import chess

          BASE_MS=2500
          INC_MS=50
          MAX_PLIES=180
          GRACE_MS=1200
          openings=[x.strip() for x in Path('/tmp/v15-direct-timed-32.epd').read_text().splitlines() if x.strip()]
          assert len(openings)==32

          class Agent:
              def __init__(self,directory):
                  self.proc=subprocess.Popen(
                      [sys.executable,'tools/v14_agent_runner.py',directory],
                      stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.PIPE,
                      text=True,bufsize=1)
                  self.lines=queue.Queue();self.stderr=deque(maxlen=100)
                  threading.Thread(target=self._out,daemon=True).start()
                  threading.Thread(target=self._err,daemon=True).start()
                  payload=json.loads(self._line(95.0));assert payload.get('ready') is True,payload
              def _out(self):
                  for line in self.proc.stdout:self.lines.put(line.rstrip('\n'))
                  self.lines.put(None)
              def _err(self):
                  for line in self.proc.stderr:self.stderr.append(line.rstrip('\n'))
              def _line(self,timeout):
                  try:line=self.lines.get(timeout=timeout)
                  except queue.Empty as exc:raise RuntimeError('protocol timeout') from exc
                  if line is None:raise RuntimeError('protocol closed: '+'\n'.join(self.stderr))
                  return line
              def reset(self):
                  self.proc.stdin.write(json.dumps({'reset':True})+'\n');self.proc.stdin.flush()
                  payload=json.loads(self._line(5.0));assert payload.get('reset') is True,payload
              def move(self,board,clock_ms):
                  self.proc.stdin.write(json.dumps({'fen':board.fen(),'time_left_ms':max(0,int(clock_ms))})+'\n');self.proc.stdin.flush()
                  payload=json.loads(self._line((max(0,clock_ms)+GRACE_MS)/1000.0))
                  move=chess.Move.from_uci(payload['move']);assert move in board.legal_moves,(board.fen(),payload)
                  return move
              def stop(self):
                  if self.proc.poll() is None:self.proc.kill()
                  self.proc.wait(timeout=5)

          base=Agent('/tmp/base');cand=Agent('/tmp/cand')
          rows=[];pair_scores=[]
          def play(fen,cand_white):
              board=chess.Board(fen)
              clocks={chess.WHITE:float(BASE_MS),chess.BLACK:float(BASE_MS)}
              base.reset();cand.reset();timings=[]
              for _ in range(MAX_PLIES):
                  outcome=board.outcome(claim_draw=True)
                  if outcome is not None:
                      score=0.5 if outcome.winner is None else float(outcome.winner==cand_white)
                      return score,board.result(claim_draw=True),board.ply(),clocks,timings
                  mover=board.turn;use_cand=mover==cand_white;engine=cand if use_cand else base
                  started=time.monotonic()
                  try:move=engine.move(board,clocks[mover])
                  except Exception as exc:
                      elapsed=(time.monotonic()-started)*1000.0;clocks[mover]-=elapsed
                      return (0.0 if use_cand else 1.0),f'engine-failure:{type(exc).__name__}',board.ply(),clocks,timings
                  elapsed=(time.monotonic()-started)*1000.0;clocks[mover]-=elapsed
                  if clocks[mover]<0:
                      return (0.0 if use_cand else 1.0),'flag',board.ply(),clocks,timings
                  timings.append({'candidate':use_cand,'elapsed_ms':elapsed})
                  board.push(move);clocks[mover]+=INC_MS
              return 0.5,'max-ply-draw',board.ply(),clocks,timings

          try:
              for idx,fen in enumerate(openings):
                  pair=0.0
                  for cw in (True,False):
                      score,result,plies,clocks,timings=play(fen,cw);pair+=score
                      row={'opening':idx,'candidate_white':cw,'candidate_score':score,'result':result,'plies':plies,
                           'candidate_move_ms':[round(t['elapsed_ms'],3) for t in timings if t['candidate']],
                           'control_move_ms':[round(t['elapsed_ms'],3) for t in timings if not t['candidate']]}
                      rows.append(row)
                      print({k:v for k,v in row.items() if not k.endswith('_move_ms')},flush=True)
                  pair_scores.append(pair)
          finally:
              base.stop();cand.stop()

          total=sum(r['candidate_score'] for r in rows);games=len(rows);fraction=total/games
          elo=400.0*math.log10(fraction/(1.0-fraction)) if 0.0<fraction<1.0 else None
          ct=[x for r in rows for x in r['candidate_move_ms']];bt=[x for r in rows for x in r['control_move_ms']]
          summary={'candidate':'V15 lean direct-slider qcheck','control':'exact packaged V14',
                   'time_control_ms':[BASE_MS,INC_MS],'games':games,'score':total,'score_fraction':fraction,
                   'naive_elo_from_score':elo,'pair_score_histogram':dict(Counter(str(x) for x in pair_scores)),
                   'terminations':dict(Counter(r['result'] for r in rows)),
                   'candidate_mean_move_ms':sum(ct)/max(1,len(ct)),'control_mean_move_ms':sum(bt)/max(1,len(bt)),
                   'games_detail':rows}
          Path('results/timed-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print('FINAL',json.dumps({k:v for k,v in summary.items() if k!='games_detail'}))
          PY

      - name: Build timed-qualified candidate package
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /tmp/cand ]; then
            (cd /tmp/cand && zip -q -9 -r "$GITHUB_WORKSPACE/results/Little-Gambit-V15-python-direct-qcheck-timed.zip" .)
            sha256sum results/Little-Gambit-V15-python-direct-qcheck-timed.zip > results/package.sha256
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-python-direct-slider-timed-${{ github.sha }}
          path: results/
          retention-days: 30
