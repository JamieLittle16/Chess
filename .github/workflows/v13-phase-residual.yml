name: V13 phase-aware residual

on:
  push:
    branches:
      - analysis/v13-phase-residual-20260907
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arena:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: p2-half, low_phase: 2, low_num: 1, low_den: 2, lower_phase: -1, lower_num: 1, lower_den: 2, seed: 99101 }
          - { name: p4-half, low_phase: 4, low_num: 1, low_den: 2, lower_phase: -1, lower_num: 1, lower_den: 2, seed: 99102 }
          - { name: p4-threequarter, low_phase: 4, low_num: 3, low_den: 4, lower_phase: -1, lower_num: 3, lower_den: 4, seed: 99103 }
          - { name: staged, low_phase: 4, low_num: 1, low_den: 2, lower_phase: 2, lower_num: 1, lower_den: 1, seed: 99104 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact runtime
        run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Reconstruct uniform-quarter control and phase-aware candidate
        shell: bash
        env:
          LOW_PHASE: ${{ matrix.low_phase }}
          LOW_NUM: ${{ matrix.low_num }}
          LOW_DEN: ${{ matrix.low_den }}
          LOWER_PHASE: ${{ matrix.lower_phase }}
          LOWER_NUM: ${{ matrix.lower_num }}
          LOWER_DEN: ${{ matrix.lower_den }}
        run: |
          set -euo pipefail
          cat .analysis/v13_chunks_*.b64 | base64 -d > /tmp/v13.zip
          echo '658fd954180c2d0d39c02ba6601af36d06cdbd573bfb72c6879169861a7ad092  /tmp/v13.zip' | sha256sum -c -
          rm -rf /tmp/cand /tmp/base
          mkdir /tmp/base
          unzip -q /tmp/v13.zip -d /tmp/base
          patch /tmp/base/experiments/numba_search.py < .analysis/v13_jit_refactor.patch
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/base/experiments/numba_search.py'); s=p.read_text()
          old='    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          new='    correction = correction // 4\n    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          assert s.count(old)==1,s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
          cp -a /tmp/base /tmp/cand
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path('/tmp/cand/experiments/numba_search.py'); s=p.read_text()
          old='    correction = correction // 4\n    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          lp=int(os.environ['LOW_PHASE']); ln=int(os.environ['LOW_NUM']); ld=int(os.environ['LOW_DEN'])
          xp=int(os.environ['LOWER_PHASE']); xn=int(os.environ['LOWER_NUM']); xd=int(os.environ['LOWER_DEN'])
          lines=['    phase_for_residual = int(state[EVAL_PHASE])']
          if xp >= 0:
              lines += [f'    if phase_for_residual <= {xp}:', f'        correction = (correction * {xn}) // {xd}', f'    elif phase_for_residual <= {lp}:', f'        correction = (correction * {ln}) // {ld}', '    else:', '        correction = correction // 4']
          else:
              lines += [f'    if phase_for_residual <= {lp}:', f'        correction = (correction * {ln}) // {ld}', '    else:', '        correction = correction // 4']
          new='\n'.join(lines)+'\n    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          assert s.count(old)==1,s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
          python -m py_compile /tmp/base/agent.py /tmp/base/experiments/*.py /tmp/cand/agent.py /tmp/cand/experiments/*.py
          grep -n -A12 -B3 'phase_for_residual' /tmp/cand/experiments/numba_search.py
      - name: Fixed-node direct A/B on UHO positions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          /usr/bin/time -f 'ARENA_WALL_SEC=%e MAX_RSS_KB=%M' \
            python -u .v13/v13_arena.py /tmp/cand /tmp/base 20000 20 '${{ matrix.seed }}' 220 \
              match/openings/m3-uho-lichess-100-v1.epd 0 \
            | tee results/${{ matrix.name }}.log
          grep '^FINAL ' results/${{ matrix.name }}.log
      - uses: actions/upload-artifact@v4
        with:
          name: v13-phase-${{ matrix.name }}-${{ github.sha }}
          path: results/${{ matrix.name }}.log
          retention-days: 7
