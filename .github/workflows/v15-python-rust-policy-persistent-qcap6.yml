name: V15 Python persistent Rust-policy over qcap6+presort

on:
  push:
    branches: [analysis/v15-python-rust-policy-persistent-qcap6-20260908]
    paths:
      - scripts/patch_v15_python_root_policy_runtime.py
      - .github/workflows/v15-python-rust-policy-persistent-qcap6.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install runtime and exporter
        run: |
          python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: Download exact packaged V14
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V14-PACKAGE-ae1dc230b9208f5ec46c9a661c3f0e526d6f0e56
          path: v14-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34214504775
      - name: Download exact Rust-V15-teacher H64 policy
        uses: actions/download-artifact@v4
        with:
          name: rust-v15-policy-h64-bae844a67f0ffa899ab893cf5b41f5f7e4896d32
          path: policy-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34265888488
      - name: Materialize qcap6+presort control and persistent-policy candidate
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find v14-artifact -type f -name Little-Gambit-V14.zip -print -quit)
          PT=$(find policy-artifact -type f -name root-policy-h64.pt -print -quit)
          test -n "$ZIP"; test -n "$PT"
          rm -rf /tmp/base /tmp/cand /tmp/m6 results; mkdir -p /tmp/base /tmp/cand /tmp/m6 results
          unzip -q "$ZIP" -d /tmp/base
          python scripts/patch_v15_python_qsearch_cap.py /tmp/base/experiments/numba_search.py 6
          python scripts/patch_v15_python_presort_once.py /tmp/base/experiments/numba_search.py
          cp -a /tmp/base/. /tmp/cand/
          python scripts/export_v15_root_policy_npz.py "$PT" /tmp/cand/experiments/v15_root_policy.npz
          python scripts/patch_v15_python_root_policy_runtime.py /tmp/cand/experiments/numba_search.py 3
          python -m py_compile /tmp/base/agent.py /tmp/cand/agent.py /tmp/base/experiments/*.py /tmp/cand/experiments/*.py
      - name: Build teacher-disjoint roots
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/uho.zip https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  /tmp/uho.zip' | sha256sum --check --strict
          python scripts/build_m6_opening_suite.py --archive /tmp/uho.zip --output-dir /tmp/m6
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('/tmp/m6/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]
          chosen=fresh[4600:4648]
          assert len(chosen)==48 and len(set(chosen))==48, len(chosen)
          Path('/tmp/persistent-policy-48.epd').write_text('\n'.join(chosen)+'\n')
          print({'fresh':len(fresh),'range':[4600,4648]})
          PY
      - name: Throughput
        shell: bash
        run: |
          cat >/tmp/worker.py <<'PY'
          import json,sys,chess,numpy as np
          from experiments.numba_core import encode_position
          from experiments.numba_search import iterative_search_stateful
          for line in sys.stdin:
              q=json.loads(line);b=chess.Board(q['fen']);e=encode_position(b);h=np.empty(0,dtype=np.uint64)
              o=iterative_search_stateful(e.board,e.side,e.castling,e.ep_square,b.halfmove_clock,h,0,int(q['nodes']))
              print(json.dumps({'nodes':int(o[3]),'depth':int(o[2])}),flush=True)
          PY
          python - <<'PY'
          import json,os,statistics,subprocess,sys,time
          from pathlib import Path
          roots=Path('/tmp/persistent-policy-48.epd').read_text().splitlines()[:12]
          def start(d):
              e=os.environ.copy();e['PYTHONPATH']=d;return subprocess.Popen([sys.executable,'/tmp/worker.py'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1,env=e)
          def one(p,f,n):p.stdin.write(json.dumps({'fen':f,'nodes':n})+'\n');p.stdin.flush();return json.loads(p.stdout.readline())
          def run(p,order):
              n=0;ds=[];t=time.perf_counter()
              for f in order:
                  z=one(p,f,25000);n+=z['nodes'];ds.append(z['depth'])
              return n/(time.perf_counter()-t),sum(ds)/len(ds)
          b=start('/tmp/base');c=start('/tmp/cand');rs=[];rows=[]
          try:
              one(b,roots[0],500);one(c,roots[0],500)
              for r in range(3):
                  order=roots if r%2==0 else list(reversed(roots))
                  if r%2==0:bn,bd=run(b,order);cn,cd=run(c,order)
                  else:cn,cd=run(c,order);bn,bd=run(b,order)
                  rs.append(cn/bn);rows.append({'rep':r,'ratio':cn/bn,'base_nps':bn,'candidate_nps':cn,'base_depth':bd,'candidate_depth':cd})
          finally:b.terminate();c.terminate();b.wait();c.wait()
          out={'median_nps_ratio':statistics.median(rs),'rows':rows};Path('results/throughput.json').write_text(json.dumps(out,indent=2)+'\n');print('FINAL',out)
          PY
      - name: 96-game equal-node screen
        run: python -u tools/v14_fixed_node_arena.py /tmp/cand /tmp/base --nodes 18000 --pairs 48 --opening-file /tmp/persistent-policy-48.epd --opening-offset 0 --max-plies 220 --json-out results/arena.json | tee results/arena.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-python-persistent-rust-policy-${{ github.sha }}
          path: results/
          retention-days: 30
