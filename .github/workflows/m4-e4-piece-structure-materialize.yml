name: M4 E4 piece structure materialize

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'm4/e4-piece-structure-final'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m4/e4-piece-structure-final
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Materialize once
        run: |
          set -euo pipefail
          if grep -q 'BISHOP_PAIR_MG_BONUS' crates/chess-eval/src/lib.rs; then
            echo 'E4 already materialized'
            exit 0
          fi
          python3 tools/materialize_e4_piece_structure.py
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test -p chess-eval --all-features
          cargo test -p chess-search --all-features
          cargo test -p chess-core --all-features
          cargo test -p chess-engine --all-features
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/chess-eval/src/lib.rs
          git commit -m 'eval: add bishop-pair and rook-file structure'
          git push origin HEAD:m4/e4-piece-structure-final
