name: V14 H64 student 1/12 fresh replication

on:
  push:
    branches: [analysis/v14-single-student-s12-confirm-20260908]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact competition runtime
        run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0

      - name: Download exact selected H64 model
        uses: actions/download-artifact@v4
        with:
          name: v14-single-student-h64-bb7d2a4ed05ff78d344cc4374d54e35189584993
          path: model-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34202820525

      - name: Derive independent 5000-position UHO suite and exclude M3 roots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fresh-openings
          curl --fail --location --retry 3 \
            --output fresh-openings/UHO_Lichess_4852_v1.epd.zip \
            https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
          echo '4e298f11e8acfa106babe02968f2e61582145e7874c59284690b20b9650e0e07  fresh-openings/UHO_Lichess_4852_v1.epd.zip' | sha256sum --check --strict
          python scripts/build_m6_opening_suite.py \
            --archive fresh-openings/UHO_Lichess_4852_v1.epd.zip \
            --output-dir fresh-openings/derived
          echo '5445819229270140036023a507c41edffc9307ac2cca1ca2efd20e1ddb8d670e  fresh-openings/derived/m6-uho-lichess-5000-v1.epd' | sha256sum --check --strict
          python - <<'PY'
          from pathlib import Path
          old={x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')}
          large=[x.strip() for x in Path('fresh-openings/derived/m6-uho-lichess-5000-v1.epd').read_text().splitlines() if x.strip()]
          fresh=[x for x in large if x not in old]
          assert len(fresh)>=4900,len(fresh)
          chosen=fresh[:48]
          assert len(set(chosen))==48
          Path('fresh-openings/confirm-48.epd').write_text('\n'.join(chosen)+'\n')
          print('m3_roots',len(old),'m6_roots',len(large),'fresh_after_exclusion',len(fresh),'chosen',len(chosen))
          PY
          sha256sum fresh-openings/confirm-48.epd | tee fresh-openings/confirm-48.sha256

      - name: Reconstruct exact V13 control and H64 1/12 candidate
        shell: bash
        run: |
          set -euo pipefail
          MODEL=$(find model-artifact -type f -name 'student-h64.npz' -print -quit)
          test -n "$MODEL"
          echo '3422cecc3b1226767412e08746ffd6eef9f7e38602ac15b9256b475e6762b598  '"$MODEL" | sha256sum --check --strict
          cat .analysis/v13_chunks_*.b64 | base64 -d > /tmp/v13.zip
          echo '658fd954180c2d0d39c02ba6601af36d06cdbd573bfb72c6879169861a7ad092  /tmp/v13.zip' | sha256sum --check --strict
          rm -rf /tmp/base /tmp/cand && mkdir -p /tmp/base /tmp/cand
          unzip -q /tmp/v13.zip -d /tmp/base
          unzip -q /tmp/v13.zip -d /tmp/cand
          patch /tmp/base/experiments/numba_search.py < .analysis/v13_jit_refactor.patch
          patch /tmp/cand/experiments/numba_search.py < .analysis/v13_jit_refactor.patch
          for DIR in /tmp/base /tmp/cand; do
            DIR="$DIR" python - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['DIR'])/'experiments/numba_search.py'; s=p.read_text()
          old='    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          new='    correction = correction // 6\n    return score + correction\n\n\n@njit(cache=False, inline="never")\ndef _advance_residual_state_into('
          assert s.count(old)==1,s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
            python scripts/patch_v13_legality_context.py "$DIR/experiments/numba_core.py"
            python scripts/patch_v13_qsearch_tactical.py "$DIR/experiments/numba_core.py" "$DIR/experiments/numba_search.py"
          done
          echo '401f6580028a72361286bd99bee1f0022c74e6c8a65da8acd47448835a1ff360  /tmp/base/experiments/numba_search.py' | sha256sum --check --strict
          cp experiments/v14_student_single_runtime.py /tmp/cand/experiments/v14_student_single_runtime.py
          cp "$MODEL" /tmp/cand/experiments/v14_student_h64.npz
          python scripts/patch_v14_single_student_search.py /tmp/cand/experiments/numba_search.py --numerator 1 --denominator 12
          python -m py_compile /tmp/base/experiments/*.py /tmp/cand/experiments/*.py tools/v14_fixed_node_arena.py

      - name: Recheck incremental accumulator before replication
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp/cand python - <<'PY'
          import random,chess,numpy as np
          from experiments.numba_core import encode_position,generate_legal_moves,move_to_uci
          from experiments.numba_search import EVAL_WIDTH,STUDENT_OFFSET,_advance_eval_state_into,_build_eval_state_into
          rng=random.Random(0x121264);board=chess.Board();checked=0
          for _ in range(1200):
              if board.is_game_over(claim_draw=False) or board.ply()>140 or rng.random()<0.04: board=chess.Board()
              legal=list(board.legal_moves)
              if not legal: continue
              py=rng.choice(legal);e=encode_position(board);moves,count=generate_legal_moves(e.board,e.side,e.castling,e.ep_square);internal=-1
              for i in range(int(count)):
                  m=int(moves[i])
                  if move_to_uci(m)==py.uci(): internal=m;break
              assert internal>=0
              parent=np.empty(EVAL_WIDTH,dtype=np.int32);child=np.empty(EVAL_WIDTH,dtype=np.int32);_build_eval_state_into(e.board,parent);_advance_eval_state_into(e.board,e.side,internal,parent,child)
              after=board.copy(stack=False);after.push(py);ea=encode_position(after);rebuilt=np.empty(EVAL_WIDTH,dtype=np.int32);_build_eval_state_into(ea.board,rebuilt)
              assert np.array_equal(child[STUDENT_OFFSET:],rebuilt[STUDENT_OFFSET:])
              board.push(py);checked+=1
          assert checked>=1100,checked
          print('incremental_rebuild_confirmed',checked)
          PY

      - name: Fresh 96-game equal-node replication
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p confirm-results
          python -u tools/v14_fixed_node_arena.py /tmp/cand /tmp/base \
            --nodes 16000 --pairs 48 --opening-offset 0 --max-plies 220 \
            --opening-file fresh-openings/confirm-48.epd \
            --json-out confirm-results/arena.json \
            | tee confirm-results/arena.log
          grep '^FINAL ' confirm-results/arena.log
          cp fresh-openings/confirm-48.epd fresh-openings/confirm-48.sha256 confirm-results/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v14-student-s12-fresh-confirm-${{ github.sha }}
          path: confirm-results/
          retention-days: 30
