name: V18 H64 den8 qualification
on:
  push:
    branches: [analysis/v18-h64-den8-qualify-20260910]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/v18-stockfish-calibration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'numba==0.67.0' 'numpy==2.5.2' 'chess==1.11.2'
      - name: Build exact PUNCH133 and den8
        run: |
          set -euo pipefail
          cat ci/v18_postbook_payload/chunk_*.b64 | base64 -d > /tmp/p150.zip
          for d in /tmp/base /tmp/cand; do
            rm -rf "$d";mkdir "$d";unzip -q /tmp/p150.zip -d "$d"
            sed -i 's/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.50/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.33/' "$d/agent.py"
            curl --fail --location --retry 5 -sS 'https://raw.githubusercontent.com/michaeldv/donna_opening_books/master/gm2001.bin' -o "$d/v18_gm2001.bin"
          done
          sed -i 's/STUDENT_SCALE_DEN = 12/STUDENT_SCALE_DEN = 8/' /tmp/cand/experiments/numba_search.py
      - name: 50-root fixed-node and SF19 judge
        run: |
          cat >/tmp/run.py <<'PY'
          import sys,json,time,chess,numpy as np
          from pathlib import Path
          sys.path.insert(0,sys.argv[1]);import agent
          from experiments.numba_core import encode_position,move_to_uci
          from experiments.numba_search import iterative_search_stateful
          H=np.empty(0,dtype=np.uint64);rows=[]
          lines=[x for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')][:50]
          for i,line in enumerate(lines):
            b=chess.Board(line);e=encode_position(b);agent._TT_TABLE.fill(0);agent._QUIET_HISTORY.fill(0);agent._HASH_KEYS.fill(0);agent._HASH_MOVES.fill(-1)
            t=time.perf_counter();m,s,d,n=iterative_search_stateful(e.board.copy(),e.side,e.castling,e.ep_square,b.halfmove_clock,H,0,500000)
            rows.append({'i':i,'fen':b.fen(),'move':move_to_uci(m),'score':int(s),'depth':int(d),'nodes':int(n),'sec':time.perf_counter()-t})
          open(sys.argv[2],'w').write('\n'.join(json.dumps(x) for x in rows)+'\n')
          PY
          python /tmp/run.py /tmp/base /tmp/base.jsonl
          python /tmp/run.py /tmp/cand /tmp/cand.jsonl
          curl --fail --location --retry 5 -sS 'https://github.com/official-stockfish/Stockfish/releases/latest/download/stockfish-linux-x86-64-universal.tar.gz' -o /tmp/sf.tar.gz
          mkdir /tmp/sf;tar -xzf /tmp/sf.tar.gz -C /tmp/sf;SF="$(find /tmp/sf -type f -name 'stockfish*' -perm /111 | head -n1)";cp "$SF" /tmp/sf19;chmod +x /tmp/sf19
          python - <<'PY'
          import json,chess,chess.engine
          A=[json.loads(x) for x in open('/tmp/base.jsonl')];B=[json.loads(x) for x in open('/tmp/cand.jsonl')]
          D=[(a,b) for a,b in zip(A,B) if a['move']!=b['move']];print('ROOT_DIFFS',len(D))
          sf=chess.engine.SimpleEngine.popen_uci('/tmp/sf19');sf.configure({'Threads':1,'Hash':64});net=imp=bad=tie=0
          def cp(s,p):
            v=s.pov(p).score(mate_score=100000);return int(v if v is not None else 0)
          for a,b in D:
            bd=chess.Board(a['fen']);pov=bd.turn
            if 'Clear Hash' in sf.options:sf.configure({'Clear Hash':None})
            best=sf.analyse(bd,chess.engine.Limit(nodes=150000));bc=cp(best['score'],pov);loss=[]
            for r in (a,b):
              if 'Clear Hash' in sf.options:sf.configure({'Clear Hash':None})
              q=sf.analyse(bd,chess.engine.Limit(nodes=150000),root_moves=[chess.Move.from_uci(r['move'])]);loss.append(max(0,bc-cp(q['score'],pov)))
            d=loss[0]-loss[1];net+=d;imp+=d>5;bad+=d<-5;tie+=abs(d)<=5
            print('DIFF',a['i'],a['move'],b['move'],'best',best['pv'][0].uci(),'loss',loss,'delta',d)
          sf.quit();print('SUMMARY improved',imp,'worse',bad,'tie',tie,'NET_CP',net)
          print('TIME',sum(x['sec'] for x in A),sum(x['sec'] for x in B),'NODES',sum(x['nodes'] for x in A),sum(x['nodes'] for x in B))
          PY
      - name: Known positions at 2M
        run: |
          cat >/tmp/crit.py <<'PY'
          import sys,chess,numpy as np
          sys.path.insert(0,sys.argv[1]);import agent
          from experiments.numba_core import encode_position,move_to_uci
          from experiments.numba_search import iterative_search_stateful
          H=np.empty(0,dtype=np.uint64);cases=[('castle','r2q1rk1/1b1n1pbp/pp1ppnp1/8/PPPNPP2/2NBB2P/2Q3P1/R3K2R w KQ - 1 14'),('dxe4','r1bqk1nr/3n1pbp/3pp1p1/1B1p4/4P3/2N1B3/PP1QNPPP/R3K2R b KQkq - 0 11'),('Qb3','rnb1kb1r/2q2ppp/p1pp1n2/1p2p3/2PPP3/2NBB3/PP2NPPP/R2QK2R w KQkq - 0 8'),('a4','rnb1k2r/2q1bppp/p1pp1n2/1p2p3/2PPP3/1QNBB3/PP2NPPP/R3K2R w KQkq - 2 9'),('a3a2','r5k1/2q1bppp/p1p5/3p1P2/P1P3n1/QB1n4/1P1BNPPP/R4K1R w - - 0 20')]
          for name,fen in cases:
            b=chess.Board(fen);e=encode_position(b);agent._TT_TABLE.fill(0);agent._QUIET_HISTORY.fill(0);agent._HASH_KEYS.fill(0);agent._HASH_MOVES.fill(-1)
            m,s,d,n=iterative_search_stateful(e.board.copy(),e.side,e.castling,e.ep_square,b.halfmove_clock,H,0,2000000);print(name,move_to_uci(m),int(s),int(d),int(n))
          PY
          echo BASE;python /tmp/crit.py /tmp/base
          echo CAND;python /tmp/crit.py /tmp/cand
