name: V18 compensated shelter180 screen
on:
  push:
    branches: [analysis/v18-shelter180-compensated-20260910]
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/v18-stockfish-calibration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'numba==0.67.0' 'numpy==2.5.2' 'chess==1.11.2'
      - name: Reconstruct baseline and compensated candidate
        shell: bash
        run: |
          set -euo pipefail
          cat ci/v18_postbook_payload/chunk_*.b64 | base64 -d > /tmp/p150.zip
          for d in /tmp/base /tmp/cand; do
            rm -rf "$d"; mkdir "$d"; unzip -q /tmp/p150.zip -d "$d"
            sed -i 's/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.50/_BOOK_POST_SEARCH_BOOST_MULT: Final = 1.33/' "$d/agent.py"
          done
          python - <<'PY'
          import numpy as np,hashlib
          p='/tmp/cand/experiments/v13_residual.i16'; w=np.fromfile(p,dtype=np.int16).astype(np.int32)
          scale=180
          coeff={(1,0):100,(1,1):85,(1,2):25,(2,0):55,(2,1):45,(2,2):15,(3,0):10,(3,1):8}
          # Reward actual own-pawn shelter exactly as SHELTER180.
          for kf in (1,2):
            bucket=kf
            for pr in range(8):
              for pf in range(8):
                c=coeff.get((pr,abs(pf-kf)),0)
                if c: w[bucket*768 + pr*8 + pf] += (scale*c+50)//100
            # Compensate the bucket with the value of an intact three-pawn second-rank shield:
            # center pawn 100%, two adjacent pawns 85% each = 270% of scale.
            king_idx=bucket*768 + 5*64 + kf
            w[king_idx] -= (scale*270+50)//100
          assert w.min()>=-32768 and w.max()<=32767
          w.astype(np.int16).tofile(p)
          print('sha',hashlib.sha256(open(p,'rb').read()).hexdigest(),'minmax',w.min(),w.max())
          PY
          cmp /tmp/base/experiments/numba_search.py /tmp/cand/experiments/numba_search.py
          cmp /tmp/base/agent.py /tmp/cand/agent.py
      - name: Build 55-position suite
        run: |
          python - <<'PY'
          from pathlib import Path
          src=[x.strip() for x in Path('match/openings/m3-uho-lichess-100-v1.epd').read_text().splitlines() if x.strip() and not x.startswith('#')]
          crit=[
          'r2q1rk1/1b1n1pbp/pp1ppnp1/8/PPPNPP2/2NBB2P/2Q3P1/R3K2R w KQ - 1 14',
          'r1bqk1nr/3n1pbp/3pp1p1/1B1p4/4P3/2N1B3/PP1QNPPP/R3K2R b KQkq - 0 11',
          'rnb1kb1r/2q2ppp/p1pp1n2/1p2p3/2PPP3/2NBB3/PP2NPPP/R2QK2R w KQkq - 0 8',
          'rnb1k2r/2q1bppp/p1pp1n2/1p2p3/2PPP3/1QNBB3/PP2NPPP/R3K2R w KQkq - 2 9',
          'r5k1/2q1bppp/p1p5/3p1P2/P1P3n1/QB1n4/1P1BNPPP/R4K1R w - - 0 20']
          Path('/tmp/positions.txt').write_text('\n'.join(src[:50]+crit)+'\n')
          PY
      - name: Fixed-node A/B
        run: |
          cat >/tmp/run.py <<'PY'
          import sys,json,time,chess,numpy as np
          sys.path.insert(0,sys.argv[1]); import agent
          from experiments.numba_core import encode_position,move_to_uci
          from experiments.numba_search import iterative_search_stateful
          h=np.empty(0,dtype=np.uint64); out=[]
          for i,line in enumerate(open('/tmp/positions.txt')):
            b=chess.Board(line.strip()); enc=encode_position(b)
            agent._HASH_KEYS.fill(0);agent._HASH_MOVES.fill(-1);agent._TT_TABLE.fill(0);agent._QUIET_HISTORY.fill(0)
            t=time.perf_counter();m,s,d,n=iterative_search_stateful(enc.board.copy(),enc.side,enc.castling,enc.ep_square,b.halfmove_clock,h,0,500000)
            out.append({'i':i,'fen':b.fen(),'move':move_to_uci(m),'score':int(s),'depth':int(d),'nodes':int(n),'sec':time.perf_counter()-t})
          open(sys.argv[2],'w').write('\n'.join(json.dumps(x) for x in out)+'\n')
          PY
          python /tmp/run.py /tmp/base /tmp/base.jsonl
          python /tmp/run.py /tmp/cand /tmp/cand.jsonl
      - name: SF19 judge changed roots
        run: |
          curl --fail --location --retry 5 -sS 'https://github.com/official-stockfish/Stockfish/releases/latest/download/stockfish-linux-x86-64-universal.tar.gz' -o /tmp/sf.tar.gz
          mkdir /tmp/sf; tar -xzf /tmp/sf.tar.gz -C /tmp/sf
          SF="$(find /tmp/sf -type f -name 'stockfish*' -perm /111 | head -n1)"; cp "$SF" /tmp/sf19; chmod +x /tmp/sf19
          python - <<'PY'
          import json,chess,chess.engine,statistics
          A=[json.loads(x) for x in open('/tmp/base.jsonl')]; B=[json.loads(x) for x in open('/tmp/cand.jsonl')]
          sf=chess.engine.SimpleEngine.popen_uci('/tmp/sf19');sf.configure({'Threads':1,'Hash':64})
          def cp(s,p):
            v=s.pov(p).score(mate_score=100000);return int(v if v is not None else 0)
          dif=[];imp=bad=tie=net=0
          for a,b in zip(A,B):
            if a['move']==b['move']: continue
            bd=chess.Board(a['fen']);pov=bd.turn
            if 'Clear Hash' in sf.options:sf.configure({'Clear Hash':None})
            best=sf.analyse(bd,chess.engine.Limit(nodes=100000));bestcp=cp(best['score'],pov)
            vals=[]
            for r in (a,b):
              if 'Clear Hash' in sf.options:sf.configure({'Clear Hash':None})
              q=sf.analyse(bd,chess.engine.Limit(nodes=100000),root_moves=[chess.Move.from_uci(r['move'])]);vals.append(cp(q['score'],pov))
            la=max(0,bestcp-vals[0]);lb=max(0,bestcp-vals[1]);delta=la-lb;net+=delta
            if delta>5:imp+=1
            elif delta<-5:bad+=1
            else:tie+=1
            dif.append((a['i'],a['move'],b['move'],best['pv'][0].uci(),bestcp,la,lb,delta))
          sf.quit();print('SUMMARY changed',len(dif),'improved',imp,'worse',bad,'tie',tie,'NET_CP',net)
          for x in dif:print('DIFF',x)
          print('MEAN_SEC',statistics.mean(x['sec'] for x in A),statistics.mean(x['sec'] for x in B))
          PY
