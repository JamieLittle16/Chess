name: V16 Python clean cold-start qualification

on:
  workflow_dispatch:
  push:
    branches: [v16/python-clean-history-pruning-confirm]
    paths:
      - '.github/workflows/v16-python-clean-startup.yml'

permissions:
  actions: read
  contents: read

jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact competition runtime
        run: python -m pip install --disable-pip-version-check chess==1.11.2 numpy==2.5.2 numba==0.67.0
      - name: Download exact final V15
        uses: actions/download-artifact@v4
        with:
          name: Little-Gambit-V15-FINAL-725be3e8595d1e54b1f12e11f2b9d92f1e415ebc
          path: v15-artifact
          github-token: ${{ github.token }}
          repository: JamieLittle16/Chess
          run-id: 34298586524
      - name: Materialize exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          V15=$(find v15-artifact -type f -name Little-Gambit-V15.zip -print -quit); test -n "$V15"
          echo '81e22344bf9a6b41f16e32f29f93c0b6074afe63e4fd51002a537e6a091f2852  '"$V15" | sha256sum --check --strict
          rm -rf /tmp/control /tmp/candidate results
          mkdir -p /tmp/control /tmp/candidate results
          unzip -q "$V15" -d /tmp/control
          cp -a /tmp/control/. /tmp/candidate/
          python scripts/patch_v16_python_v15_unified_history.py /tmp/candidate/experiments/numba_search.py
          python scripts/patch_v16_python_full_pruning_oracle.py /tmp/candidate/experiments/numba_search.py
          echo '5d8bba24dad3b9ce7c320d8aa7e813b4f8782809ecfbe095fb0c542ce9251ab8  /tmp/candidate/experiments/numba_search.py' | sha256sum --check --strict
      - name: Measure cold ready latency against 90-second allowance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee results/startup.log
          import json, queue, subprocess, sys, threading, time
          from pathlib import Path

          def measure(root):
              t0=time.perf_counter()
              p=subprocess.Popen([sys.executable,'tools/v14_agent_runner.py',root], stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, bufsize=1)
              q=queue.Queue(); err=[]
              def out():
                  line=p.stdout.readline()
                  q.put(line)
              def er():
                  for line in p.stderr:
                      err.append(line.rstrip())
              threading.Thread(target=out,daemon=True).start(); threading.Thread(target=er,daemon=True).start()
              try:
                  line=q.get(timeout=90.0)
              except queue.Empty:
                  p.kill(); p.wait(timeout=5)
                  raise SystemExit(f'{root} FAILED 90-second cold-start allowance; stderr tail={err[-20:]}')
              elapsed=time.perf_counter()-t0
              try:
                  ready=json.loads(line).get('ready') is True
              except Exception:
                  ready=False
              p.kill(); p.wait(timeout=5)
              if not ready:
                  raise SystemExit(f'{root} did not emit ready: {line!r}; stderr tail={err[-20:]}')
              return elapsed

          control=measure('/tmp/control')
          candidate=measure('/tmp/candidate')
          out={'allowance_s':90.0,'v15_cold_ready_s':control,'v16_clean_cold_ready_s':candidate,'margin_s':90.0-candidate,'delta_s':candidate-control}
          Path('results/startup.json').write_text(json.dumps(out,indent=2)+'\n')
          print('STARTUP',json.dumps(out))
          if candidate >= 90.0:
              raise SystemExit('candidate misses 90-second startup allowance')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v16-python-clean-startup-${{ github.sha }}
          path: results/
          retention-days: 30
