name: M4 picker integration helper

on:
  push:
    branches:
      - m4/staged-move-picker-v2

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m4/staged-move-picker-v2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Integrate MovePicker mechanically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('crates/chess-search/src/lib.rs')
          text = lib.read_text()
          old = text
          text = text.replace('mod quiescence;\n', 'mod move_picker;\nmod quiescence;\n', 1)
          text = text.replace(
              'use chess_core::{ChessMove, MoveList, Position, generate_legal_moves_mut};\n',
              'use chess_core::{ChessMove, Position, generate_legal_moves_mut};\nuse move_picker::MovePicker;\n',
              1,
          )
          needle = '        for mv in OrderedMoves::new(&moves, hint) {\n'
          replacement = (
              '        let mut moves = moves;\n'
              '        let mut picker = MovePicker::new(&mut moves, hint);\n'
              '        while let Some(mv) = picker.next(position) {\n'
          )
          if text.count(needle) != 2:
              raise SystemExit(f'expected two OrderedMoves search loops, found {text.count(needle)}')
          text = text.replace(needle, replacement)
          start = text.index("struct OrderedMoves<'a> {")
          end = text.index('#[cfg(test)]', start)
          text = text[:start] + text[end:]
          if text == old:
              raise SystemExit('lib.rs integration made no changes')
          lib.write_text(text)

          qsearch = Path('crates/chess-search/src/quiescence.rs')
          text = qsearch.read_text()
          needle = '        for mv in OrderedMoves::new(&moves, None) {\n'
          if text.count(needle) != 1:
              raise SystemExit(f'expected one qsearch OrderedMoves loop, found {text.count(needle)}')
          text = text.replace(
              needle,
              '        let mut moves = moves;\n'
              '        let mut picker = MovePicker::new(&mut moves, None);\n'
              '        while let Some(mv) = picker.next(position) {\n',
          )
          qsearch.write_text(text)
          PY
          cargo fmt --all
      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/chess-search/src/lib.rs crates/chess-search/src/quiescence.rs
          git commit -m 'search: integrate staged move picker into alpha-beta and qsearch'
          git push origin HEAD:m4/staged-move-picker-v2
