name: Derive M3 opening suite

on:
  pull_request:
    paths:
      - scripts/build_opening_suite.py
      - .github/workflows/derive-opening-suite.yml

permissions:
  contents: read

jobs:
  derive:
    name: Derive pinned opening suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned CC0 Stockfish book
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/UHO_Lichess_4852_v1.epd.zip \
            https://raw.githubusercontent.com/official-stockfish/books/65815ccdbc7727cd4f6aee252ba8f67fb740e92f/UHO_Lichess_4852_v1.epd.zip
      - name: Derive deterministic 100-position suite
        run: |
          python3 scripts/build_opening_suite.py \
            --archive /tmp/UHO_Lichess_4852_v1.epd.zip \
            --output-dir /tmp/m3-openings
      - name: Upload derived corpus and provenance
        uses: actions/upload-artifact@v4
        with:
          name: m3-uho-lichess-100-v1
          path: /tmp/m3-openings/
          if-no-files-found: error
          retention-days: 7
