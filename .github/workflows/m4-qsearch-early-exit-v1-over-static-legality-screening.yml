name: M4 qsearch early-exit v1 over static legality

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  qsearch-early-exit-marginal:
    if: github.head_ref == 'm4/qsearch-early-exit-v1-over-static-legality-screening'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Materialize exact retained qsearch candidate
        run: |
          set -euo pipefail
          python3 tools/apply_qsearch_early_exit_probe_v1.py
          cargo fmt --all
          echo '1c7331d8240ff743ab053ce22a8ae49ac07f9c6d0b4592fc12614c3b7708c17b  crates/chess-search/src/quiescence.rs' | sha256sum --check --strict
          git diff --check
      - name: Verify correctness and deterministic identity
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          cargo test -p chess-search --test draw_strategy
          OUTPUT=$(cargo run --release --quiet -p chess-bench)
          printf '%s\n' "$OUTPUT"
          grep -q 'suite reference-search-v8' <<< "$OUTPUT"
          grep -q 'signature 0x4c3bbe8701fbbb68' <<< "$OUTPUT"
      - name: Build candidate
        run: |
          set -euo pipefail
          CANDIDATE_TARGET="$PWD/.qualification/candidate-target"
          CARGO_TARGET_DIR="$CANDIDATE_TARGET" cargo build --release -p chess-uci
          echo "CANDIDATE_BIN=$CANDIDATE_TARGET/release/chess-uci" >> "$GITHUB_ENV"
      - name: Build current production reference
        run: |
          set -euo pipefail
          REFERENCE_SHA=afbe9c8d9050664dbc1780b0aa1e11cae6c364b1
          git fetch --depth=1 origin "$REFERENCE_SHA"
          git worktree add --detach .qualification/reference "$REFERENCE_SHA"
          REFERENCE_TARGET="$PWD/.qualification/reference-target"
          (cd .qualification/reference && CARGO_TARGET_DIR="$REFERENCE_TARGET" cargo build --release -p chess-uci)
          echo "REFERENCE_BIN=$REFERENCE_TARGET/release/chess-uci" >> "$GITHUB_ENV"
      - name: Fetch pinned Fastchess
        run: |
          set -euo pipefail
          mkdir -p .qualification/fastchess
          curl --fail --location --retry 3 --output .qualification/fastchess.tar https://github.com/Disservin/fastchess/releases/download/v1.8.2-alpha/fastchess-linux-x86-64.tar
          echo '1003f920bebe841acdab5e6d7871e93171a4586857b3ec91c21ef5777f26ff96  .qualification/fastchess.tar' | sha256sum --check --strict
          tar -xf .qualification/fastchess.tar -C .qualification/fastchess
          FASTCHESS_BIN=$(find "$PWD/.qualification/fastchess" -type f -name fastchess -perm -111 -print -quit)
          test -n "$FASTCHESS_BIN"
          echo "FASTCHESS_BIN=$FASTCHESS_BIN" >> "$GITHUB_ENV"
      - name: Record identities
        run: |
          set -euo pipefail
          "$FASTCHESS_BIN" -version
          sha256sum \
            "$CANDIDATE_BIN" \
            "$REFERENCE_BIN" \
            "$FASTCHESS_BIN" \
            match/openings/m3-uho-lichess-100-v1.epd \
            crates/chess-search/src/quiescence.rs \
            crates/chess-core/src/movegen.rs
      - name: Run fresh marginal paired screen
        run: |
          set -euo pipefail
          SHORT_SHA=${GITHUB_SHA:0:12}
          python3 scripts/match_harness.py \
            --protocol match/protocols/m4-qsearch-early-exit-v1-over-static-legality-screening.json \
            --candidate "$CANDIDATE_BIN" \
            --candidate-name "Chess-qsearch-early-exit-over-static-legality@$SHORT_SHA" \
            --candidate-option Hash=32 \
            --reference "$REFERENCE_BIN" \
            --reference-name 'Chess-static-legality-prod@afbe9c8d9050' \
            --reference-option Hash=32 \
            --fastchess "$FASTCHESS_BIN" \
            --openings match/openings/m3-uho-lichess-100-v1.epd \
            --output-dir screening-results
      - name: Retain exact source
        if: always()
        run: |
          mkdir -p screening-results/exact-source/crates/chess-search/src
          cp crates/chess-search/src/quiescence.rs screening-results/exact-source/crates/chess-search/src/quiescence.rs
          sha256sum crates/chess-search/src/quiescence.rs > screening-results/exact-source/source-hash.sha256
      - name: Upload retained evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-qsearch-early-exit-v1-over-static-legality-${{ github.sha }}
          path: screening-results/
          retention-days: 30
